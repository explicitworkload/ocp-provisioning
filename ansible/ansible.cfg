[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_paths = collections
host_key_checking = false
stdout_callback = default
result_format = yaml
# Per-task durations, a running clock, and a slowest-20 table at the end of
# every run. 56 of this playbook's tasks are until: loops whose retries x
# delay budgets total over 20 hours of worst case, which says nothing about
# where the time actually goes - this measures it instead of guessing.
callbacks_enabled = ansible.posix.profile_tasks

[privilege_escalation]
become = false

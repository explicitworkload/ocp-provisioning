---
- name: Configure OpenShift cluster with operators, GPU worker, and model serving
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Set OAuth access token max age to 90 days
      kubernetes.core.k8s:
        context: "{{ ocp_context }}"
        state: present
        definition:
          apiVersion: config.openshift.io/v1
          kind: OAuth
          metadata:
            name: cluster
          spec:
            tokenConfig:
              accessTokenMaxAgeSeconds: 7776000
      tags: [always]

  roles:
    - role: operators
      tags: [operators]

    - role: gpu_worker
      tags: [gpu]

    - role: nfd
      tags: [nfd, gpu]

    - role: nvidia_gpu
      tags: [nvidia, gpu]

    - role: openshift_ai
      tags: [openshift-ai]

    - role: quay
      tags: [quay]

    - role: console_plugins
      tags: [console]

    - role: model_serving
      tags: [model-serving]

    - role: litellm
      tags: [litellm]

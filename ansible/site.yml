---
- name: Configure OpenShift cluster with operators, GPU worker, and model serving
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Set OAuth access token max age to 90 days
      kubernetes.core.k8s:
        context: "{{ ocp_context }}"
        state: present
        definition:
          apiVersion: config.openshift.io/v1
          kind: OAuth
          metadata:
            name: cluster
          spec:
            tokenConfig:
              accessTokenMaxAgeSeconds: 7776000
      tags: [always]

    - name: Get cluster ingress domain
      kubernetes.core.k8s_info:
        context: "{{ ocp_context }}"
        api_version: config.openshift.io/v1
        kind: Ingress
        name: cluster
      register: cluster_ingress
      tags: [always]

    - name: Set cluster apps domain
      ansible.builtin.set_fact:
        ocp_apps_domain: "{{ cluster_ingress.resources[0].spec.domain }}"
      tags: [always]

    - name: Get cluster infrastructure
      kubernetes.core.k8s_info:
        context: "{{ ocp_context }}"
        api_version: config.openshift.io/v1
        kind: Infrastructure
        name: cluster
      register: cluster_infra
      tags: [always]

    - name: Set cluster name fact
      ansible.builtin.set_fact:
        ocp_cluster_name: "{{ cluster_infra.resources[0].status.infrastructureName }}"
      tags: [always]

    # Two digits appended to the public hostnames. Derived from the cluster's
    # infrastructure name rather than drawn at random, so it is stable across
    # re-runs (no DNS churn, the URL does not move under you) while still
    # differing between clusters that share the zone.
    - name: Derive two-digit suffix for public hostnames
      ansible.builtin.set_fact:
        ocp_host_suffix: >-
          {{ 10 + ((ocp_cluster_name | hash('md5'))[:8] | int(base=16) % 90) }}
      tags: [always]

    - name: Enable user workload monitoring
      kubernetes.core.k8s:
        context: "{{ ocp_context }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cluster-monitoring-config
            namespace: openshift-monitoring
          data:
            config.yaml: |
              enableUserWorkload: true
      tags: [always]

  roles:
    - role: operators
      tags: [operators]

    - role: service_mesh
      tags: [service-mesh]

    - role: network_observability
      tags: [network-observability]

    - role: gpu_worker
      tags: [gpu]

    - role: nfd
      tags: [nfd, gpu]

    - role: odf
      tags: [odf]

    - role: quay
      tags: [quay]

    - role: openshift_ai
      tags: [openshift-ai]

    - role: console_plugins
      tags: [console]

    - role: bookinfo_demo
      tags: [bookinfo, service-mesh-demo]

    - role: gatus
      tags: [gatus]

    - role: nvidia_gpu
      tags: [nvidia, gpu]

    - role: model_serving
      tags: [model-serving]

    - role: litellm
      tags: [litellm]

    # After litellm too: workspaces get the LiteLLM key for the Continue
    # extension, so running this earlier leaves that unconfigured.
    - role: devspaces
      tags: [devspaces]

    # After litellm: the dashboard copies LiteLLM's master key into its own
    # Secret, so running it earlier leaves the AI page unauthenticated.
    - role: dashboard
      tags: [dashboard]

    # Last: publishes live DNS records to Cloudflare. Opt-in only, and runs
    # after every Route it might need to publish already exists.
    - role: external_dns
      tags: [external-dns, dns]
      when: deploy_external_dns | bool

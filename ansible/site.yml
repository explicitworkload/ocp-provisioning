---
- name: Configure OpenShift cluster with operators, GPU worker, and model serving
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    # First, before anything reads a variable. group_vars/all.yml is
    # untracked so it can hold credentials, and a fresh clone does not have
    # one. Without this the run dies on "'ocp_context' is undefined" twelve
    # lines later, which says nothing about the actual cause. run.sh checks
    # for the file itself; this covers ansible-playbook called directly.
    # Stamped before anything else so the summary can report how long the
    # whole run took. gather_facts is false, so there is no ansible_date_time
    # to read; date +%s on the control host is the portable equivalent.
    # Deliberately NOT tagged always. A full run has no tags and so stamps
    # the clock; ./run.sh --tags summary skips this task, run_started_epoch
    # stays undefined, and the summary says so instead of reporting the
    # twelve seconds the reprint itself took.
    - name: Stamp the start of the run
      ansible.builtin.set_fact:
        run_started_epoch: "{{ lookup('pipe', 'date +%s') }}"

    - name: Check that group_vars/all.yml exists
      ansible.builtin.assert:
        that: ocp_context is defined
        fail_msg: >-
          group_vars/all.yml is missing. It is deliberately untracked so that
          a pull secret, API key or endpoint credential can live in it
          without being committed. Copy the sample and edit it:
          cp group_vars/all.yml.sample group_vars/all.yml
        quiet: true
      tags: [always]

    # Everything down to the banner is read-only, and runs before the first
    # task that changes the cluster. ocp_context defaults to empty, meaning
    # follow the current kubeconfig context, so what this play is pointed at
    # can change without anyone editing the repo - say the sandbox was
    # rebuilt, or `oc login` was last run somewhere else. Name the target out
    # loud before touching it rather than finding out from the wreckage.
    - name: Resolve the kubeconfig context when none is pinned
      ansible.builtin.command:
        cmd: oc config current-context
      register: current_context
      changed_when: false
      when: ocp_context | length == 0
      tags: [always]

    - name: Record the context this run will use
      ansible.builtin.set_fact:
        ocp_context_resolved: >-
          {{ ocp_context if ocp_context | length > 0
             else current_context.stdout | trim }}
      tags: [always]

    - name: Get cluster infrastructure
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: config.openshift.io/v1
        kind: Infrastructure
        name: cluster
      register: cluster_infra
      tags: [always]

    - name: Set cluster name fact
      ansible.builtin.set_fact:
        ocp_cluster_name: "{{ cluster_infra.resources[0].status.infrastructureName }}"
        ocp_api_url: "{{ cluster_infra.resources[0].status.apiServerURL }}"
      tags: [always]

    - name: Count cluster nodes
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: v1
        kind: Node
      register: cluster_nodes
      tags: [always]

    - name: Refuse to run against an unexpected cluster
      ansible.builtin.fail:
        msg: >-
          ocp_expected_api is "{{ ocp_expected_api }}", but this run targets
          {{ ocp_api_url }} via context {{ ocp_context_resolved }}. Refusing
          before anything is changed. Switch context, correct the expectation,
          or clear ocp_expected_api if this really is the intended cluster.
      when:
        - ocp_expected_api | default('') | length > 0
        - ocp_expected_api not in ocp_api_url
      tags: [always]

    - name: Show the cluster about to be modified
      ansible.builtin.debug:
        msg:
          - "context : {{ ocp_context_resolved }}"
          - "pinned  : {{ 'yes, by ocp_context' if ocp_context | length > 0
                          else 'no - following the current kubeconfig context' }}"
          - "api     : {{ ocp_api_url }}"
          - "infra   : {{ ocp_cluster_name }}"
          - "nodes   : {{ cluster_nodes.resources | length }}"
          - "guard   : {{ ocp_expected_api if ocp_expected_api | default('') | length > 0
                          else 'none - set ocp_expected_api to hard-fail on the wrong cluster' }}"
      tags: [always]

    # Reported, never enforced. The model and the instance are chosen
    # independently on purpose, so this says whether the pair works rather
    # than refusing the combination - a 27B on a 16 GB card is allowed to
    # proceed and fail at model load, which is the choice that was made.
    #
    # Adds up what the model actually wants - weights, KV cache for one full
    # max_model_len sequence, and any per-sequence hybrid state - and compares
    # it against gpu_count x the instance's per-GPU memory. A flat percentage
    # for KV used to do, but no longer: context is now sized per preset and a
    # 262144 sequence is 16 GiB on its own, so the cache has to be counted.
    #
    # Instance memory is quoted in vendor GB and converted, then scaled by the
    # 0.9 vLLM reserves by default. An instance missing from
    # gpu_instance_specs is reported as unknown rather than assumed to fit.
    - name: Check the model fits the GPU instances being created
      ansible.builtin.debug:
        msg: >-
          {{ 'model   : ' ~ sel.display ~ '  (' ~ sel.weights_gb ~ ' GB weights, '
             ~ sel.gpu_count ~ ' GPU' ~ ('s' if sel.gpu_count | int > 1 else '')
             ~ ', ' ~ sel.max_model_len ~ ' context'
             ~ (', ' ~ sel.max_num_seqs ~ ' concurrent'
                if sel.max_num_seqs | default(0) | int > 0 else '') ~ ')' }}
      vars:
        sel: "{{ model_presets[model_preset] }}"
      when: model_preset is defined
      tags: [always]

    - name: Report the fit against each GPU instance
      ansible.builtin.debug:
        msg: >-
          gpu     : {{ item.instance_type }} x{{ item.replicas }} -
          {{ 'unknown instance type - cannot check fit' if spec is none
             else (spec.gpus | string ~ ' GPU(s) per node but the model needs '
                   ~ sel.gpu_count ~ ' - it will not schedule')
               if spec.gpus | int < sel.gpu_count | int
             else ((('fits' if have | float >= need | float
                     else 'DOES NOT FIT')
                   ~ ': ' ~ have ~ ' GiB usable across ' ~ sel.gpu_count ~ ' x ' ~ spec.gpu
                   ~ ', model needs about ' ~ need ~ ' GiB ('
                   ~ w_gib ~ ' weights + ' ~ kv_gib ~ ' KV at ' ~ sel.max_model_len ~ ' context'
                   ~ (' + ' ~ st_gib ~ ' state for ' ~ sel.max_num_seqs ~ ' sequences'
                      if st_gib | float > 0 else '') ~ ')'
                   ~ ('' if have | float >= need | float
                      else ' - vLLM will refuse to start'))) }}
      vars:
        sel: "{{ model_presets[model_preset] }}"
        spec: "{{ gpu_instance_specs[item.instance_type] | default(none) }}"
        # Vendor GB to GiB, then the 0.9 of the card vLLM takes by default.
        have: "{{ ((sel.gpu_count | int) * (spec.gpu_memory_gb | default(0) | int)
                   * 0.9313 * 0.9) | round(1) }}"
        w_gib: "{{ ((sel.weights_gb | int) * 0.9313) | round(1) }}"
        kv_gib: "{{ ((sel.max_model_len | int) * (sel.kv_kb_per_token | default(0) | int)
                     / 1048576) | round(1) }}"
        st_gib: "{{ ((sel.max_num_seqs | default(0) | int)
                     * (sel.state_mb_per_seq | default(0) | int) / 1024) | round(1) }}"
        # The 1 GiB is CUDA graphs and activations, which a small model
        # overshoots and a large one undershoots; the margin absorbs it.
        need: "{{ (w_gib | float + kv_gib | float + st_gib | float + 1) | round(1) }}"
      loop: "{{ gpu_machinesets | default([]) | selectattr('replicas', 'gt', 0) | list }}"
      loop_control:
        label: "{{ item.instance_type }}"
      when: model_preset is defined
      tags: [always]

    # First task that writes to the cluster. Nothing above it mutates.
    - name: Set OAuth access token max age to 90 days
      kubernetes.core.k8s:
        context: "{{ ocp_context or omit }}"
        state: present
        definition:
          apiVersion: config.openshift.io/v1
          kind: OAuth
          metadata:
            name: cluster
          spec:
            tokenConfig:
              accessTokenMaxAgeSeconds: 7776000
      tags: [always]

    - name: Get cluster ingress domain
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: config.openshift.io/v1
        kind: Ingress
        name: cluster
      register: cluster_ingress
      tags: [always]

    - name: Set cluster apps domain
      ansible.builtin.set_fact:
        ocp_apps_domain: "{{ cluster_ingress.resources[0].spec.domain }}"
      tags: [always]

    # Two digits appended to the public hostnames. Derived from the cluster's
    # infrastructure name rather than drawn at random, so it is stable across
    # re-runs (no DNS churn, the URL does not move under you) while still
    # differing between clusters that share the zone.
    - name: Derive two-digit suffix for public hostnames
      ansible.builtin.set_fact:
        ocp_host_suffix: >-
          {{ 10 + ((ocp_cluster_name | hash('md5'))[:8] | int(base=16) % 90) }}
      tags: [always]

    - name: Enable user workload monitoring
      kubernetes.core.k8s:
        context: "{{ ocp_context or omit }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cluster-monitoring-config
            namespace: openshift-monitoring
          data:
            config.yaml: |
              enableUserWorkload: true
      tags: [always]

  roles:
    - role: operators
      tags: [operators]

    # Right after the operators. ODF publishes ocs-storagecluster-ceph-rbd
    # and -cephfs and backs NooBaa, which quay, openrag, opensearch and
    # netobserv's Loki all consume - so everything that needs storage can
    # simply assume it exists rather than each role ordering around it.
    #
    # Before gpu_worker is fine: the odf role excludes GPU nodes by the
    # node-role.kubernetes.io/gpu label, and the GPU MachineSet stamps that
    # at birth. Either the GPU node does not exist yet or it is already
    # labelled, so the device-set count comes out the same either way.
    - role: odf
      tags: [odf]

    - role: service_mesh
      tags: [service-mesh]

    - role: gpu_worker
      tags: [gpu]

    - role: nfd
      tags: [nfd, gpu]

    # After odf, not before. Its Loki stores flow records in a NooBaa bucket
    # claimed through an ObjectBucketClaim, and that CRD arrives with ODF.
    # Run earlier and the claim fails with "Failed to find exact match for
    # objectbucket.io/v1alpha1.ObjectBucketClaim" - 35 tasks into a run, long
    # after the operator and the FlowCollector have been created.
    - role: network_observability
      tags: [network-observability]

    - role: quay
      tags: [quay]

    - role: openshift_ai
      tags: [openshift-ai]

    - role: ztwim
      tags: [ztwim, spire, zero-trust]
      when: deploy_ztwim | bool

    - role: console_plugins
      tags: [console]

    - role: bookinfo_demo
      tags: [bookinfo, service-mesh-demo]

    - role: gatus
      tags: [gatus]

    - role: nvidia_gpu
      tags: [nvidia, gpu]

    - role: model_serving
      tags: [model-serving]

    - role: litellm
      tags: [litellm]

    # After litellm too: workspaces get the LiteLLM key for the Continue
    # extension, so running this earlier leaves that unconfigured.
    - role: devspaces
      tags: [devspaces]

    # After litellm: OpenRAG reads the LiteLLM key for both chat and
    # embeddings, and registers its embedding model there.
    - role: openrag
      tags: [openrag, rag]
      when: deploy_openrag | bool

    # Late, and after openrag. It needs LiteLLM's master key for its AI page,
    # and its Access page lists the Routes of everything else - so the later
    # it runs, the fewer of them are missing when someone opens it on a
    # freshly built cluster. It is a view over the rest of the platform, so
    # it goes after the platform.
    #
    # Still ahead of external_dns, which only publishes DNS for Routes that
    # already exist, and ahead of summary, which publishes the Access page's
    # own data.
    - role: dashboard
      tags: [dashboard]

    # Last: publishes live DNS records to Cloudflare. Opt-in only, and runs
    # after every Route it might need to publish already exists.
    - role: external_dns
      tags: [external-dns, dns]
      when: deploy_external_dns | bool

    # Prints the URLs and generated credentials. Reads them back from the
    # cluster rather than from facts, so --tags summary reprints against an
    # existing cluster and anything not deployed is simply left out.
    # Tagged verify as well, so --tags verify prints the links and passwords
    # before asserting anything. Running verify alone used to skip it, which
    # is backwards: a failing verification is exactly when the URLs are
    # wanted, and that is the run most likely to be invoked on its own.
    # Checks first, so its findings are printed; summary last, so the links
    # and credentials are the final thing on screen. The play is failed after
    # both, in post_tasks.
    #
    # 56 of this playbook's tasks are until: loops, seven of which swallow
    # their expiry and seven more are one-shot probes feeding a when:, so a
    # green PLAY RECAP has never meant the cluster works. This asserts it.
    - role: verify
      tags: [verify]

    - role: summary
      tags: [summary, verify]

  post_tasks:
    # Last of all, so everything above has had its say. A verification
    # failure that hid the summary would be withholding the URLs at the one
    # moment they are wanted.
    - name: Fail when verification found problems
      ansible.builtin.fail:
        msg: >-
          {{ verify_failures | length }} component(s) did not reach a working
          state. See the list above the summary. Set
          verify_fail_on_error=false to report without failing.
      when:
        - verify_failures | default([]) | length > 0
        - verify_fail_on_error | default(true) | bool
      tags: [verify]

---
- name: Configure OpenShift cluster with operators, GPU worker, and model serving
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Set OAuth access token max age to 90 days
      kubernetes.core.k8s:
        context: "{{ ocp_context }}"
        state: present
        definition:
          apiVersion: config.openshift.io/v1
          kind: OAuth
          metadata:
            name: cluster
          spec:
            tokenConfig:
              accessTokenMaxAgeSeconds: 7776000
      tags: [always]

    - name: Get cluster ingress domain
      kubernetes.core.k8s_info:
        context: "{{ ocp_context }}"
        api_version: config.openshift.io/v1
        kind: Ingress
        name: cluster
      register: cluster_ingress
      tags: [always]

    - name: Set cluster apps domain
      ansible.builtin.set_fact:
        ocp_apps_domain: "{{ cluster_ingress.resources[0].spec.domain }}"
      tags: [always]

    - name: Enable user workload monitoring
      kubernetes.core.k8s:
        context: "{{ ocp_context }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cluster-monitoring-config
            namespace: openshift-monitoring
          data:
            config.yaml: |
              enableUserWorkload: true
      tags: [always]

  roles:
    - role: operators
      tags: [operators]

    - role: service_mesh
      tags: [service-mesh]

    - role: network_observability
      tags: [network-observability]

    - role: gpu_worker
      tags: [gpu]

    - role: nfd
      tags: [nfd, gpu]

    - role: odf
      tags: [odf]

    - role: quay
      tags: [quay]

    - role: openshift_ai
      tags: [openshift-ai]

    - role: console_plugins
      tags: [console]

    - role: bookinfo_demo
      tags: [bookinfo, service-mesh-demo]

    - role: dashboard
      tags: [dashboard]

    - role: gatus
      tags: [gatus]

    - role: nvidia_gpu
      tags: [nvidia, gpu]

    - role: model_serving
      tags: [model-serving]

    - role: litellm
      tags: [litellm]

---
- name: Create Dev Spaces Subscription
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: devspaces
        namespace: openshift-operators
      spec:
        channel: "{{ devspaces_channel }}"
        installPlanApproval: Automatic
        name: devspaces
        source: redhat-operators
        sourceNamespace: openshift-marketplace

- name: Wait for CheCluster CRD to be established
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: checlusters.org.eclipse.che
  register: che_crd
  until: che_crd.resources | length > 0
  retries: 30
  delay: 10

- name: Create Dev Spaces namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ devspaces_namespace }}"

# The CheCluster CRD registers before the operator pod is serving. Its
# mutating webhook rejects the CheCluster until the Service has endpoints.
- name: Wait for Dev Spaces operator to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apps/v1
    kind: Deployment
    namespace: openshift-operators
    name: devspaces-operator
  register: devspaces_operator
  until: >-
    devspaces_operator.resources | length > 0 and
    devspaces_operator.resources[0].status.readyReplicas | default(0) >= 1
  retries: 30
  delay: 10

- name: Create CheCluster instance
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: org.eclipse.che/v2
      kind: CheCluster
      metadata:
        name: devspaces
        namespace: "{{ devspaces_namespace }}"
      spec:
        components:
          cheServer:
            debug: false
            logLevel: INFO
          metrics:
            enable: true
        devEnvironments:
          startTimeoutSeconds: 600
          secondsOfInactivityBeforeIdling: 1800
          maxNumberOfWorkspacesPerUser: 3
          storage:
            pvcStrategy: per-user
        networking: {}

- name: Wait for Dev Spaces to become available
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: org.eclipse.che/v2
    kind: CheCluster
    namespace: "{{ devspaces_namespace }}"
    name: devspaces
  register: che_status
  until: >-
    che_status.resources | length > 0 and
    che_status.resources[0].status is defined and
    che_status.resources[0].status.chePhase | default('') == 'Active'
  retries: 60
  delay: 20
  failed_when: false

# Adds a tile to the Dev Spaces "Create Workspace" page so this repo is one
# click away instead of having to paste a Git URL. The dashboard watches for
# ConfigMaps carrying the getting-started-samples component label.
- name: Register this repo as a Dev Spaces sample
  register: devspaces_sample
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ocp-provisioning-sample
        namespace: "{{ devspaces_namespace }}"
        labels:
          app.kubernetes.io/part-of: che.eclipse.org
          app.kubernetes.io/component: getting-started-samples
      data:
        samples.json: |
          [
            {
              "displayName": "OCP Provisioning",
              "description": "Ansible day-2 automation and Operations Dashboard for OpenShift. Claude CLI and the Kubernetes extension are installed on start.",
              "tags": ["Python", "Ansible", "OpenShift"],
              "url": "{{ devspaces_sample_repo }}",
              "icon": {
                "mediatype": "image/svg+xml",
                "base64data": "{{ devspaces_sample_icon }}"
              }
            }
          ]

# A second Route onto the same che-gateway service. Note that Dev Spaces ties
# its OAuth redirects to status.cheURL, so signing in via this hostname
# redirects back to the apps-domain URL — it serves, but is not a full
# replacement. Setting spec.networking.hostname would move the canonical URL.
# The dashboard reads sample ConfigMaps at startup, and this role usually
# creates ours *after* the operator has already started it — so without a
# restart the tile silently never appears.
#
# Delete the pod rather than touching the Deployment: the Che operator owns
# that Deployment and reconciles away any pod-template change, which discards
# the new ReplicaSet and leaves the original pod running. The ReplicaSet
# recreates the pod and the operator is indifferent to that.
#
# Guarded on the ConfigMap actually changing, so repeat runs do not bounce
# the dashboard.
- name: Restart the Dev Spaces dashboard to pick up the sample
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ devspaces_namespace }}"
    label_selectors:
      - app.kubernetes.io/component=devspaces-dashboard
  when: devspaces_sample.changed

- name: Wait for the Dev Spaces dashboard to come back
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Pod
    namespace: "{{ devspaces_namespace }}"
    label_selectors:
      - app.kubernetes.io/component=devspaces-dashboard
    # status.phase is a field, not a label. Listing it under label_selectors
    # asks the API for a label literally named "status.phase", which no pod
    # carries, so this returned nothing and retried until it gave up even
    # though the dashboard was already back.
    field_selectors:
      - status.phase=Running
  register: devspaces_dash_pod
  # Running only means scheduled and started; the dashboard is not serving the
  # sample list until the container passes its readiness probe.
  until: >-
    devspaces_dash_pod.resources | default([])
    | selectattr('status.conditions', 'defined')
    | map(attribute='status.conditions') | flatten
    | selectattr('type', 'equalto', 'Ready')
    | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 30
  delay: 10
  when: devspaces_sample.changed

# Give every workspace the LiteLLM endpoint and key so the Continue extension
# can talk to the OpenShift AI models.
#
# Two label sets are doing separate jobs here:
#   * the che.eclipse.org / workspaces-config pair makes Che copy this Secret
#     into each user namespace (verified: propagation takes ~20s)
#   * the controller.devfile.io pair makes the DevWorkspace Operator mount it
#     into the workspace, as environment variables
# Workspaces reach LiteLLM on its cluster-internal Service, so no Route or
# external credential is involved.
- name: Fetch the LiteLLM key for workspace AI tooling
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: litellm
    name: litellm-proxy-credentials
  register: devspaces_litellm_creds
  failed_when: false
  no_log: true

- name: Publish LiteLLM credentials to Dev Spaces workspaces
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-workspace-credentials
        namespace: "{{ devspaces_namespace }}"
        labels:
          app.kubernetes.io/part-of: che.eclipse.org
          app.kubernetes.io/component: workspaces-config
          controller.devfile.io/mount-to-devworkspace: "true"
          controller.devfile.io/watch-secret: "true"
        annotations:
          controller.devfile.io/mount-as: env
      type: Opaque
      stringData:
        LITELLM_API_KEY: "{{ devspaces_litellm_creds.resources[0].data.LITELLM_MASTER_KEY | b64decode }}"
        LITELLM_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000/v1"
  no_log: true
  when: devspaces_litellm_creds.resources | default([]) | length > 0

- name: Note when workspace AI credentials are unavailable
  ansible.builtin.debug:
    msg: >-
      LiteLLM credentials not found, so workspaces will not get
      LITELLM_API_KEY and the Continue extension will be unconfigured.
      Re-run this role after the litellm role has completed.
  when: devspaces_litellm_creds.resources | default([]) | length == 0

- name: Create Dev Spaces Route on the custom domain
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: devspaces-ext
        namespace: "{{ devspaces_namespace }}"
      spec:
        host: "{{ devspaces_custom_host }}"
        to:
          kind: Service
          name: che-gateway
        port:
          targetPort: 8080
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
  when:
    - deploy_external_dns | bool
    - devspaces_custom_host | length > 0

- name: Display Dev Spaces URL
  ansible.builtin.debug:
    msg: >-
      Dev Spaces: {{ che_status.resources[0].status.cheURL
      | default('https://devspaces.' ~ ocp_apps_domain) }} — open this repo as a
      workspace to pick up devfile.yaml (Claude CLI + Kubernetes extension).

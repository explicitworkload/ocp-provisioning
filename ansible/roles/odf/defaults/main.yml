---
odf_namespace: openshift-storage
odf_channel: stable-4.22
odf_storage_class: gp3-csi
# Size of the gp3 EBS volume backing each OSD. One OSD is created per
# eligible (non-GPU) worker, so total provisioned capacity is this multiplied
# by the number of those workers.
odf_storage_size: 512Gi
odf_device_set_replica: 1

# Work around the MCG CNPG migration bug (ODF 4.22.5-rhodf): NooBaa bootstraps
# into the noobaa-db-pg StatefulSet, is then repointed at a freshly created and
# empty CNPG cluster, and loops on "account not found" forever. The task only
# fires when that exact state is detected, so it is inert on fixed builds.
odf_fix_noobaa_cnpg: true

# Tables copied during that repair — the set present in the CNPG schema. The
# StatefulSet DB additionally carries stats/log tables that CNPG does not
# create, so a whole-database restore would fail.
odf_noobaa_tables:
  - accounts
  - agent_configs
  - buckets
  - chunk_configs
  - clusters
  - datablocks
  - datachunks
  - master_keys
  - namespace_resources
  - nodes
  - objectmds
  - objectmultiparts
  - objectparts
  - pools
  - replicationconfigs
  - roles
  - systems
  - tieringpolicies
  - tiers
  - vector_buckets
  - vector_indices

# NooBaa PV-pool backing store. Object redundancy comes from replication
# across the pool's agent nodes, so a single volume means a single copy and
# the console reports Object Resiliency as Pending forever. Three volumes
# matches NooBaa's default replica count.
#
# Raw consumption is volumes x size (3 x 50Gi = 150Gi of gp3), for roughly
# one volume's worth of usable object capacity once replicated.
#
# Scaling this UP is supported; NooBaa does not support scaling it back down.
odf_noobaa_pv_pool_volumes: 3
odf_noobaa_pv_pool_size: 50Gi


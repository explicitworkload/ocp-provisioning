---
- name: Create openshift-storage namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ odf_namespace }}"
        labels:
          openshift.io/cluster-monitoring: "true"

- name: Create ODF OperatorGroup
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: openshift-storage-operatorgroup
        namespace: "{{ odf_namespace }}"
      spec:
        targetNamespaces:
          - "{{ odf_namespace }}"

- name: Create ODF Operator Subscription
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: odf-operator
        namespace: "{{ odf_namespace }}"
      spec:
        channel: "{{ odf_channel }}"
        installPlanApproval: Automatic
        name: odf-operator
        source: redhat-operators
        sourceNamespace: openshift-marketplace

- name: Wait for ODF Operator CSV to succeed
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ odf_namespace }}"
    label_selectors:
      - "operators.coreos.com/odf-operator.openshift-storage="
  register: odf_csvs
  until: >-
    odf_csvs.resources | length > 0 and
    odf_csvs.resources | selectattr('status.phase', 'defined') |
    selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
  retries: 60
  delay: 30

# Exclusions are done server-side with label selectors.
#
# GPU: node-role.kubernetes.io/gpu comes from the MachineSet template, so it
# exists as soon as the node registers. Do not filter on nvidia.com/gpu.present
# — that is applied by the GPU operator, which runs after this role, and its
# dots cannot be addressed through a Jinja attribute path anyway.
#
# Control plane: on these sandbox clusters the master also carries the worker
# role, so filtering on worker alone places an OSD on the control plane.
- name: Get eligible worker nodes for ODF
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Node
    label_selectors:
      - "node-role.kubernetes.io/worker="
      - "!node-role.kubernetes.io/gpu"
      - "!node-role.kubernetes.io/master"
      - "!node-role.kubernetes.io/control-plane"
  register: worker_nodes

- name: Select non-GPU worker nodes
  ansible.builtin.set_fact:
    odf_nodes: >-
      {{ worker_nodes.resources
         | map(attribute='metadata.name')
         | sort
         | list }}

- name: Fail when no eligible ODF nodes were found
  ansible.builtin.fail:
    msg: >-
      No dedicated worker nodes available for ODF — every worker is also a GPU
      or control-plane node. Refusing to continue rather than placing storage
      on them. On a compact cluster, relax the selectors above deliberately.
  when: odf_nodes | length == 0

- name: Label worker nodes for ODF storage
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ item }}"
        labels:
          cluster.ocs.openshift.io/openshift-storage: ""
  loop: "{{ odf_nodes }}"
  loop_control:
    label: "{{ item }}"

- name: Wait for StorageCluster CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: storageclusters.ocs.openshift.io
  register: sc_crd
  until: sc_crd.resources | length > 0
  retries: 60
  delay: 30

- name: Create OCS StorageCluster
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: ocs.openshift.io/v1
      kind: StorageCluster
      metadata:
        name: ocs-storagecluster
        namespace: "{{ odf_namespace }}"
      spec: >-
        {{ {'storageDeviceSets': [{
               'name': 'ocs-deviceset',
               'count': odf_nodes | length,
               'replica': odf_device_set_replica,
               'portable': true,
               'placement': {},
               'dataPVCTemplate': {'spec': {
                   'accessModes': ['ReadWriteOnce'],
                   'resources': {'requests': {'storage': odf_storage_size}},
                   'storageClassName': odf_storage_class,
                   'volumeMode': 'Block'}},
               'resources': odf_osd_resources}]}
           | combine({'resources': odf_component_resources}
                     if odf_component_resources else {})
           | combine({'multiCloudGateway': {'endpoints': odf_endpoint_spec}}
                     if odf_endpoint_spec else {}) }}

- name: Wait for NooBaa CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: noobaas.noobaa.io
  register: noobaa_crd
  until: noobaa_crd.resources | length > 0
  # 15 minutes. The CRD arrives with the ODF CSV, which has its own 30-minute
  # wait ahead of this, so it is normally there already - but this is the
  # cheapest possible place to lose a run to a slow operator install.
  retries: 60
  delay: 15

# Nothing above touches NooBaa. It is left to bootstrap, choose its own
# default backing store and settle, and this only watches.
#
# Earlier revisions patched manualDefaultBackingStore onto the NooBaa CR the
# moment its CRD appeared, then created a sized pv-pool BackingStore and
# repointed the default BucketClass at it - three writes to a system that was
# still bootstrapping. On sandbox830 the same ODF 4.22.5 left entirely alone
# produced an equivalent pv-pool of its own, called
# noobaa-default-backing-store, and reached Ready without the CNPG migration
# stranding at all. Whether the interference caused the race is unproven, but
# it bought nothing that NooBaa does not do by itself.
#
# What was lost with it: odf_noobaa_pv_pool_volumes and _size no longer
# apply, so the pool is whatever NooBaa picks. Size it by hand afterwards if
# that matters.
- name: Wait for NooBaa to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: noobaa.io/v1alpha1
    kind: NooBaa
    namespace: "{{ odf_namespace }}"
    name: noobaa
  register: noobaa_ready
  until: >-
    noobaa_ready.resources | length > 0 and
    (noobaa_ready.resources[0].status.phase | default('')) == 'Ready'
  # 22.5 minutes, against 8 measured. This covers everything the hand-made
  # backing store used to share the budget with: ocs-operator reconciling,
  # noobaa-core starting, the CNPG cluster coming up, NooBaa asking for AWS
  # credentials and giving up on them, and only then building and binding its
  # own pool.
  #
  # Measured on sandbox5164, a fresh 8-node cluster with the full operator set
  # installing alongside: openshift-storage created 17:22:44, StorageCluster
  # 17:25:13, NooBaa CR 17:30:50, NooBaa Ready ~17:45 - about 8 minutes inside
  # this wait. A smaller cluster has fewer nodes to place OSDs and the PV pool
  # on, so it is slower, not faster; the margin is for that.
  retries: 90
  delay: 15

# Any Ready BackingStore, not one by name. A cluster built by an earlier
# revision of this role carries a hand-made noobaa-pv-backing-store and no
# noobaa-default-backing-store at all, so waiting on the new name would hang
# forever on exactly the clusters that already work.
- name: Wait for a backing store to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: noobaa.io/v1alpha1
    kind: BackingStore
    namespace: "{{ odf_namespace }}"
  register: noobaa_bs
  until: >-
    noobaa_bs.resources | default([])
    | selectattr('status.phase', 'defined')
    | selectattr('status.phase', 'equalto', 'Ready') | list | length > 0
  # 15 minutes against 3 measured. The pool has to bind PVs and register its
  # agents, which is storage work on a cluster that is still installing
  # everything else.
  retries: 60
  delay: 15

- name: Note which backing store NooBaa settled on
  ansible.builtin.debug:
    msg: >-
      NooBaa backing store(s) ready:
      {{ noobaa_bs.resources | selectattr('status.phase', 'defined')
         | selectattr('status.phase', 'equalto', 'Ready')
         | map(attribute='metadata.name') | join(', ') }}

- name: Wait for the default BucketClass to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: noobaa.io/v1alpha1
    kind: BucketClass
    namespace: "{{ odf_namespace }}"
    name: noobaa-default-bucket-class
  register: default_bc
  until: >-
    default_bc.resources | length > 0 and
    (default_bc.resources[0].status.phase | default('')) == 'Ready'
  retries: 40
  delay: 15

- name: Wait for StorageCluster to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: ocs.openshift.io/v1
    kind: StorageCluster
    namespace: "{{ odf_namespace }}"
    name: ocs-storagecluster
  register: storage_cluster
  until: >-
    storage_cluster.resources | length > 0 and
    storage_cluster.resources[0].status is defined and
    storage_cluster.resources[0].status.phase is defined and
    storage_cluster.resources[0].status.phase == 'Ready'
  retries: 60
  delay: 30

- name: Display ODF status
  ansible.builtin.debug:
    msg: "ODF StorageCluster is ready in {{ odf_namespace }}"

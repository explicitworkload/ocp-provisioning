---
# Workaround for the MCG CNPG migration bug, split out of the odf role so the
# MCG-only experiment can reuse it through
#   include_role: {name: odf, tasks_from: noobaa_cnpg_repair}
# rather than carrying a second copy that would drift. Both callers gate on
# odf_fix_noobaa_cnpg, and every variable here comes from roles/odf/defaults.
# ---------------------------------------------------------------------------
# Workaround for an MCG bug observed on ODF 4.22.5-rhodf.
#
# noobaa-operator creates the noobaa-db-pg StatefulSet, lets NooBaa bootstrap
# into it, then creates a CNPG cluster roughly four minutes later and repoints
# noobaa-core at it WITHOUT migrating any data. When bootstrap wins that race
# the system, admin account and first.bucket are stranded in the StatefulSet
# database and NooBaa loops forever on "account not found", leaving
# StorageCluster at Progressing/NoobaaInitializing. Ceph itself is unaffected.
#
# This copies the stranded rows into the CNPG primary, which preserves the
# original system ID so the PV-pool agent's persisted identity stays valid.
# Re-bootstrapping instead would mint a new ID and strand the agent.
#
# VERSION SCOPE — this targets ODF 4.22.5-rhodf (mcg-operator 4.22.5-rhodf),
# where the bug was observed and the fix verified. It is reported upstream
# against the NooBaa/MCG operator, not odf-operator.
#
# Deliberately NOT gated on the version string, for two reasons:
#   * It is a race, so it does not fire on every 4.22.5 install. A version
#     match would be neither necessary nor sufficient.
#   * If the fix slips past 4.22.5, a version pin would silently stop
#     protecting the very releases that still need it.
# The trigger is the observed failure signature instead, so this is inert on
# any release where the bug is absent — including a fixed 4.22.5 rebuild.
#
# 4.21.13 ships CNPG too, so downgrading the channel is not an escape.
#
# WHEN THE UPSTREAM FIX SHIPS: delete this whole block and the
# odf_fix_noobaa_cnpg / odf_noobaa_tables defaults rather than leaving dead
# code in a storage role. Set odf_fix_noobaa_cnpg=false to skip it meanwhile.
# ---------------------------------------------------------------------------
# Detection reads the databases, not the NooBaa CR's conditions. Two earlier
# attempts both failed on timing, in opposite directions:
#
#   * reading the Available message once could land before the operator had
#     repointed core at CNPG, so "account not found" had not appeared yet and
#     the repair was skipped;
#   * polling until Ready-or-stranded exited on the *transient* Ready NooBaa
#     reports against the StatefulSet DB, before the migration has even been
#     attempted - same skip, different cause.
#
# Row counts do not flap: either the live database holds the system or it does
# not. But counts alone are ambiguous while the migration is legitimately in
# flight (CNPG is empty then too), so STRANDED requires both that the
# databases disagree AND that NooBaa has actually given up with
# "account not found". HEALTHY is the single unambiguous signal - CNPG holding
# the system - and exits immediately.
#
# Running out of retries is not an error: it means no verdict, the repair
# stays unrun, and the StorageCluster wait further down reports the problem.
- name: Decide whether NooBaa is stranded
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      OC="oc {{ ocp_context_arg }} -n {{ odf_namespace }}"

      nb_phase=$($OC get noobaa noobaa -o jsonpath='{.status.phase}' 2>/dev/null)

      # Does this build migrate to CNPG at all? The Cluster CR is created well
      # before any of its pods - measured at 03:52:34 against a first pod at
      # 03:54:11 - so its presence is the earliest reliable signal that a
      # primary is on its way and that NooBaa is going to be repointed.
      cnpg_cr=$($OC get clusters.postgresql.cnpg.noobaa.io noobaa-db-pg-cluster \
                  -o name 2>/dev/null)

      # "Not present" is not the same as "never will be". On a fresh install the
      # CNPG cluster does not exist for the first few minutes, and the old
      # StatefulSet DB is removed only once the migration completes. Returning a
      # terminal verdict for either case ends the until-loop and skips the
      # repair.
      #
      # Ready alone is not enough to conclude that, because NooBaa is Ready
      # BEFORE the migration as well as after it. Measured on a cluster that
      # then stranded:
      #   03:52:34  CNPG Cluster CR created
      #   03:54:11  first CNPG pod, not yet labelled role=primary
      #   ~03:55:00 poll 6: no primary -> Ready -> HEALTHY, loop exits
      #   03:55:42  "account not found" appears, nobody watching
      # The repair was skipped and the play ran on for another 50 minutes
      # before failing at the StorageCluster wait.
      #
      # So the CR is the discriminator: while it exists but has produced no
      # primary yet, a Ready is the pre-migration one and the only safe answer
      # is to keep waiting. With no CR at all - a build that does not do this,
      # or one where it is fixed - Ready still means genuinely nothing to do,
      # which keeps the whole block inert where it should be.
      absent_verdict() {
        if [ -n "$cnpg_cr" ]; then
          echo WAIT
        elif [ "$nb_phase" = "Ready" ]; then
          echo HEALTHY
        else
          echo WAIT
        fi
      }
      primary=$($OC get pod -l cnpg.io/cluster=noobaa-db-pg-cluster,role=primary \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
      [ -z "$primary" ] && { absent_verdict; exit 0; }
      $OC get pod noobaa-db-pg-0 >/dev/null 2>&1 || { absent_verdict; exit 0; }

      systems() {
        $OC exec "$1" ${2:+-c "$2"} -- psql -U postgres -d nbcore -t -A \
          -c "select count(*) from systems" </dev/null 2>/dev/null | tr -cd '0-9'
      }
      old=$(systems noobaa-db-pg-0)
      new=$(systems "$primary" postgres)

      msg=$($OC get noobaa noobaa \
            -o jsonpath='{range .status.conditions[?(@.type=="Available")]}{.message}{end}' 2>/dev/null)
      gaveup=0
      case "$msg" in *"account not found"*) gaveup=1 ;; esac

      # The three signals above are all true during a perfectly normal
      # migration as well. NooBaa repoints core at CNPG before it has finished
      # copying, so the operator reports "account not found" for a while, and
      # CNPG legitimately has no system row yet. sandbox127 was declared
      # stranded in exactly that window, with CNPG healthy, 2/2 instances, and
      # the schema half built.
      #
      # So require the schema to be finished as well. A target still missing
      # tables the source has is a migration in progress, whatever the
      # operator is complaining about meanwhile. If it never finishes, the
      # poll runs out of retries and reaches no verdict, which leaves the
      # repair unrun and the StorageCluster wait to report it - the same
      # fallback as every other inconclusive case here.
      Q="select tablename from pg_tables where schemaname='public' and tablename = any(string_to_array('{{ odf_noobaa_tables | join(',') }}', ',')) order by tablename"
      tables() {
        $OC exec "$1" ${2:+-c "$2"} -- psql -U postgres -d nbcore -t -A -c "$Q" </dev/null 2>/dev/null
      }
      src=$(tables noobaa-db-pg-0)
      tgt=$(tables "$primary" postgres)
      missing=$(comm -23 <(echo "$src") <(echo "$tgt") | tr '\n' ' ')
      # An unreadable source reads as an empty list, and an empty list is
      # indistinguishable from "nothing missing" - which would declare
      # STRANDED on a psql failure. Force a wait instead.
      [ -z "$src" ] && missing='(source unreadable)'

      echo "old=${old:-?} new=${new:-?} gaveup=$gaveup missing=${missing:-none}" >&2
      if [ "${new:-0}" -ge 1 ] 2>/dev/null; then
        echo HEALTHY
      elif [ "$old" = "1" ] && [ "$new" = "0" ] && [ "$gaveup" = "1" ] \
           && [ -z "$missing" ]; then
        echo STRANDED
      else
        echo WAIT
      fi
  register: nb_verdict
  # 20 minutes, not 10. The verdict cannot be reached until three things have
  # happened, and the last of them is slow. Measured on a fresh cluster:
  #   18:15:54  StorageCluster created, this poll starts
  #   18:22:16  CNPG primary elected          (T+6m)
  #   ~18:30+   operator gives up with "account not found"  -> gaveup=1
  # At 40x15s the window shut at T+10m, with the primary barely three minutes
  # old and the operator still retrying, so every poll returned WAIT, the
  # repair was skipped, and the play walked into the backing-store wait with a
  # stranded NooBaa. Seen on two clusters.
  #
  # Nearly free to widen: a healthy cluster exits on the first poll that sees
  # new >= 1, so the extra budget is only ever spent when NooBaa really is
  # taking a long time to resolve - which is precisely when waiting is right.
  until: nb_verdict.stdout | default('') | trim != 'WAIT'
  retries: 80
  delay: 15
  changed_when: false
  failed_when: false
  when: odf_fix_noobaa_cnpg | bool

- name: Record whether NooBaa is stranded
  ansible.builtin.set_fact:
    noobaa_stranded: "{{ (nb_verdict.stdout | default('') | trim) == 'STRANDED' }}"

- name: Repair the stranded NooBaa system
  when: noobaa_stranded | bool
  block:
    - name: Find the CNPG primary pod
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: v1
        kind: Pod
        namespace: "{{ odf_namespace }}"
        label_selectors:
          - "cnpg.io/cluster=noobaa-db-pg-cluster"
          - "role=primary"
      register: cnpg_primary

    - name: Fail if no CNPG primary was found
      ansible.builtin.fail:
        msg: "NooBaa is stranded but no CNPG primary pod was found — repair manually."
      when: cnpg_primary.resources | length == 0

    # Literal block (|) with one command per line. A folded scalar (>-) keeps
    # newlines on more-indented continuation lines, which silently split
    # "oc exec ... --" from its command and ran psql on the control node.
    - name: Confirm the data really is stranded before touching anything
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          OC="oc {{ ocp_context_arg }} -n {{ odf_namespace }}"
          old=$($OC exec noobaa-db-pg-0 -- psql -U postgres -d nbcore -t -A -c "select count(*) from systems" </dev/null)
          new=$($OC exec {{ cnpg_primary.resources[0].metadata.name }} -c postgres -- psql -U postgres -d nbcore -t -A -c "select count(*) from systems" </dev/null)
          echo "$old $new"
      register: nb_counts
      changed_when: false

    - name: Abort repair unless the old DB has a system and CNPG has none
      ansible.builtin.fail:
        msg: >-
          Unexpected database state ({{ nb_counts.stdout | trim }} = old/new
          system count). Expected the old StatefulSet DB to hold the system and
          CNPG to be empty. Repair manually.
      when: nb_counts.stdout.split() | map('int') | list != [1, 0]

    # NooBaa creates the CNPG schema progressively, so the target is a moving
    # target for the first few minutes. A repair that started ~3 minutes after
    # the CNPG pods appeared hit
    #   ERROR: relation "datablocks" does not exist
    # because that table had not been created yet; five minutes later the
    # schema was complete and identical to the source.
    #
    # TRUNCATE is a single statement over every name, so one absent table
    # aborts the whole repair. Wait for the target schema to catch up with the
    # source instead of racing it. Comparing against the source rather than a
    # hardcoded count means this stays correct if a build changes the schema.
    #
    # BEFORE the writers are scaled down, not after. noobaa-core is what
    # creates these tables, so waiting for them with core stopped waits for
    # work nobody can do: on sandbox127 this sat at 16 of 29 tables and burned
    # its whole budget before aborting. Waiting here also means a schema that
    # never completes costs nothing - the repair gives up with NooBaa still
    # running and still free to finish on its own.
    - name: Wait for the CNPG schema to match the StatefulSet database
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          OC="oc {{ ocp_context_arg }} -n {{ odf_namespace }}"
          Q="select tablename from pg_tables where schemaname='public' and tablename = any(string_to_array('{{ odf_noobaa_tables | join(',') }}', ',')) order by tablename"
          old=$($OC exec noobaa-db-pg-0 -- psql -U postgres -d nbcore -t -A -c "$Q" </dev/null)
          new=$($OC exec {{ cnpg_primary.resources[0].metadata.name }} -c postgres -- psql -U postgres -d nbcore -t -A -c "$Q" </dev/null)
          # Tables in the source that the target still lacks.
          missing=$(comm -23 <(echo "$old") <(echo "$new") | tr '\n' ' ')
          echo "MISSING:${missing}"
          echo "COMMON:$(comm -12 <(echo "$old") <(echo "$new") | tr '\n' ',' | sed 's/,$//')"
      register: nb_schema
      until: nb_schema.stdout_lines[0] | trim == 'MISSING:'
      retries: 30
      delay: 20
      changed_when: false
      failed_when: false

    # Still short after ten minutes means a genuine schema difference rather
    # than the creation race, and a partial restore would look like success -
    # "Verify the system landed in CNPG" only counts the systems table.
    - name: Abort if the CNPG schema never caught up
      ansible.builtin.fail:
        msg: >-
          CNPG is still missing tables the StatefulSet database has
          ({{ nb_schema.stdout_lines[0] | default('') | replace('MISSING:', '') | trim }}).
          Restoring now would silently drop them. Repair manually.
      when: nb_schema.stdout_lines[0] | default('') | trim != 'MISSING:'

    - name: Record the tables to transfer
      ansible.builtin.set_fact:
        nb_tables: >-
          {{ nb_schema.stdout_lines[1] | replace('COMMON:', '') | trim }}

    - name: Abort if the essential NooBaa tables are missing
      ansible.builtin.fail:
        msg: >-
          Expected 'systems' and 'accounts' in both databases, found only:
          {{ nb_tables | default('(none)', true) }}. Repair manually.
      when: >-
        'systems' not in (nb_tables | split(','))
        or 'accounts' not in (nb_tables | split(','))

    - name: Scale down the NooBaa writers
      kubernetes.core.k8s:
        context: "{{ ocp_context or omit }}"
        state: patched
        kind: "{{ item.kind }}"
        api_version: apps/v1
        name: "{{ item.name }}"
        namespace: "{{ odf_namespace }}"
        definition:
          spec:
            replicas: 0
      loop:
        - {kind: Deployment, name: noobaa-operator}
        - {kind: StatefulSet, name: noobaa-core}
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for noobaa-core to stop
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: v1
        kind: Pod
        namespace: "{{ odf_namespace }}"
        name: noobaa-core-0
      register: nb_core_pod
      until: nb_core_pod.resources | length == 0
      retries: 20
      delay: 10

    - name: Create a temporary file for the dump
      ansible.builtin.tempfile:
        state: file
        suffix: .sql
      register: nb_dump

    - name: Dump the stranded system from the StatefulSet database
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          oc {{ ocp_context_arg }} -n {{ odf_namespace }} exec noobaa-db-pg-0 -- pg_dump -U postgres -d nbcore --data-only --disable-triggers {{ nb_tables | split(',') | map('regex_replace', '^', '-t public.') | join(' ') }} </dev/null > {{ nb_dump.path | quote }}
      changed_when: true

    - name: Load it into the CNPG primary
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -eo pipefail
          OC="oc {{ ocp_context_arg }} -n {{ odf_namespace }}"
          PRIMARY={{ cnpg_primary.resources[0].metadata.name }}
          $OC exec $PRIMARY -c postgres -- psql -U postgres -d nbcore -c "TRUNCATE {{ nb_tables }} CASCADE" </dev/null
          $OC exec -i $PRIMARY -c postgres -- psql -U postgres -d nbcore -v ON_ERROR_STOP=1 < {{ nb_dump.path | quote }}
      changed_when: true

    - name: Verify the system landed in CNPG
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          oc {{ ocp_context_arg }} -n {{ odf_namespace }} exec {{ cnpg_primary.resources[0].metadata.name }} -c postgres -- psql -U postgres -d nbcore -t -A -c "select count(*) from systems" </dev/null
      register: nb_verify
      changed_when: false
      failed_when: nb_verify.stdout | trim != '1'

  always:
    - name: Remove the temporary dump
      ansible.builtin.file:
        path: "{{ nb_dump.path }}"
        state: absent
      when: nb_dump.path is defined

    - name: Scale the NooBaa writers back up
      kubernetes.core.k8s:
        context: "{{ ocp_context or omit }}"
        state: patched
        kind: "{{ item.kind }}"
        api_version: apps/v1
        name: "{{ item.name }}"
        namespace: "{{ odf_namespace }}"
        definition:
          spec:
            replicas: 1
      loop:
        - {kind: StatefulSet, name: noobaa-core}
        - {kind: Deployment, name: noobaa-operator}
      loop_control:
        label: "{{ item.name }}"

- name: Wait for NooBaa to become ready after repair
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: noobaa.io/v1alpha1
    kind: NooBaa
    namespace: "{{ odf_namespace }}"
    name: noobaa
  register: nb_after
  until: >-
    nb_after.resources | length > 0 and
    nb_after.resources[0].status.phase | default('') == 'Ready'
  retries: 40
  delay: 15
  when: noobaa_stranded | bool

---
- name: Create bookinfo namespace with sidecar injection
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ bookinfo_namespace }}"
        labels:
          istio-injection: enabled

- name: Create bookinfo service accounts
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "bookinfo-{{ item }}"
        namespace: "{{ bookinfo_namespace }}"
  loop:
    - details
    - ratings
    - reviews
    - productpage

- name: Create bookinfo services
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ item }}"
        namespace: "{{ bookinfo_namespace }}"
        labels:
          app: "{{ item }}"
      spec:
        ports:
          - port: 9080
            name: http
        selector:
          app: "{{ item }}"
  loop:
    - details
    - ratings
    - reviews
    - productpage

- name: Deploy details-v1
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: details-v1
        namespace: "{{ bookinfo_namespace }}"
        labels:
          app: details
          version: v1
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: details
            version: v1
        template:
          metadata:
            labels:
              app: details
              version: v1
          spec:
            serviceAccountName: bookinfo-details
            containers:
              - name: details
                image: "registry.istio.io/release/examples-bookinfo-details-v1:{{ bookinfo_image_tag }}"
                ports:
                  - containerPort: 9080

- name: Deploy ratings-v1
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ratings-v1
        namespace: "{{ bookinfo_namespace }}"
        labels:
          app: ratings
          version: v1
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: ratings
            version: v1
        template:
          metadata:
            labels:
              app: ratings
              version: v1
          spec:
            serviceAccountName: bookinfo-ratings
            containers:
              - name: ratings
                image: "registry.istio.io/release/examples-bookinfo-ratings-v1:{{ bookinfo_image_tag }}"
                ports:
                  - containerPort: 9080

- name: Deploy reviews (v1, v2, v3)
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "reviews-{{ item }}"
        namespace: "{{ bookinfo_namespace }}"
        labels:
          app: reviews
          version: "{{ item }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: reviews
            version: "{{ item }}"
        template:
          metadata:
            labels:
              app: reviews
              version: "{{ item }}"
          spec:
            serviceAccountName: bookinfo-reviews
            containers:
              - name: reviews
                image: "registry.istio.io/release/examples-bookinfo-reviews-{{ item }}:{{ bookinfo_image_tag }}"
                ports:
                  - containerPort: 9080
  loop:
    - v1
    - v2
    - v3

- name: Deploy productpage-v1
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: productpage-v1
        namespace: "{{ bookinfo_namespace }}"
        labels:
          app: productpage
          version: v1
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: productpage
            version: v1
        template:
          metadata:
            labels:
              app: productpage
              version: v1
          spec:
            serviceAccountName: bookinfo-productpage
            containers:
              - name: productpage
                image: "registry.istio.io/release/examples-bookinfo-productpage-v1:{{ bookinfo_image_tag }}"
                ports:
                  - containerPort: 9080

- name: Create Istio Gateway
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: networking.istio.io/v1
      kind: Gateway
      metadata:
        name: bookinfo-gateway
        namespace: "{{ bookinfo_namespace }}"
      spec:
        selector:
          istio: ingressgateway
        servers:
          - port:
              number: 80
              name: http
              protocol: HTTP
            hosts:
              - "*"

- name: Create Istio VirtualService
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: networking.istio.io/v1
      kind: VirtualService
      metadata:
        name: bookinfo
        namespace: "{{ bookinfo_namespace }}"
      spec:
        hosts:
          - "*"
        gateways:
          - bookinfo-gateway
        http:
          - match:
              - uri:
                  exact: /productpage
              - uri:
                  prefix: /static
              - uri:
                  exact: /login
              - uri:
                  exact: /logout
              - uri:
                  prefix: /api/v1/products
            route:
              - destination:
                  host: productpage
                  port:
                    number: 9080

- name: Expose productpage via OpenShift Route
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: bookinfo
        namespace: "{{ bookinfo_namespace }}"
      spec:
        host: "bookinfo.{{ ocp_apps_domain }}"
        to:
          kind: Service
          name: productpage
        port:
          targetPort: http
        tls:
          termination: edge

- name: Wait for productpage to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ bookinfo_namespace }}"
    name: productpage-v1
  register: productpage
  until: >-
    productpage.resources | length > 0 and
    productpage.resources[0].status.readyReplicas is defined and
    productpage.resources[0].status.readyReplicas >= 1
  retries: 20
  delay: 10

- name: Get bookinfo route URL
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ bookinfo_namespace }}"
    name: bookinfo
  register: bookinfo_route

- name: Create PodMonitor for Istio sidecars in bookinfo
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: istio-proxies
        namespace: "{{ bookinfo_namespace }}"
      spec:
        namespaceSelector:
          any: true
        selector:
          matchExpressions:
            - key: security.istio.io/tlsMode
              operator: Exists
        podMetricsEndpoints:
          - path: /stats/prometheus
            port: http-envoy-prom
            interval: 15s

- name: Display bookinfo URL
  ansible.builtin.debug:
    msg: "Bookinfo productpage: https://{{ bookinfo_route.resources[0].spec.host }}/productpage"

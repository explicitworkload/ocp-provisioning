---
# Off by default, and declared here rather than only in group_vars so that
# site.yml's `when: deploy_openrag` has something to read. milvus already
# does this; openrag did not, so a control host whose untracked
# group_vars/all.yml predates this role died on "'deploy_openrag' is
# undefined" - and died at the role, roughly task 250, not at the top.
deploy_openrag: false

openrag_namespace: openrag
openrag_opensearch_namespace: opensearch

# OpenRAG ships its chart in-repo rather than a Helm repository, so the role
# checks the source out to build from.
openrag_git_repo: https://github.com/langflow-ai/openrag.git
openrag_git_version: main
openrag_checkout_dir: /tmp/openrag-chart

# --- OpenSearch -------------------------------------------------------------
# The OpenRAG chart deliberately does NOT deploy OpenSearch, so this role does.
opensearch_chart_repo: https://opensearch-project.github.io/helm-charts/
opensearch_chart_version: "3.9.0"
# OpenRAG's OpenSearch build, not the stock one - it carries the jvector k-NN
# engine that OpenRAG's index mapping requires. Keep the tag in step with the
# OpenRAG release; mismatched pairs are not something upstream tests.
opensearch_image_repository: docker.io/langflowai/openrag-opensearch
opensearch_image_tag: "0.8.0"
opensearch_replicas: 3
opensearch_storage_class: ocs-storagecluster-ceph-rbd
opensearch_storage_size: 20Gi
opensearch_java_opts: "-Xmx2g -Xms2g"

# --- Embeddings -------------------------------------------------------------
# bge-small is 384-dim and runs on CPU, which it has to: the cluster's only
# GPU is taken by the chat model. Fronted by LiteLLM so OpenRAG sees a single
# OpenAI-compatible endpoint for both chat and embeddings.
openrag_embedding_image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
openrag_embedding_model_id: BAAI/bge-small-en-v1.5
openrag_embedding_model_name: bge-small-en-v1.5

# --- Docling ----------------------------------------------------------------
openrag_docling_image: quay.io/docling-project/docling-serve:latest

# --- OpenRAG ----------------------------------------------------------------
# Follows whatever model_preset deploys, rather than naming one. Hardcoding
# qwen3-4b meant selecting any other preset pointed OpenRAG's agent at a
# model that does not exist on the cluster - LiteLLM would 400 and the chat
# would fail while everything else looked healthy.
#
# Override to use something else LiteLLM serves, a MaaS model say, if the
# cluster-hosted one is not what OpenRAG should chat with.
openrag_chat_model: "{{ model_name }}"
openrag_chunk_size: 1000
openrag_chunk_overlap: 200
# RWO volumes (backend data, langflow, postgres).
openrag_storage_class: ocs-storagecluster-ceph-rbd
# The backend's "shared" volume is ReadWriteMany, which RBD cannot do - it
# needs CephFS or the PVC never binds.
openrag_shared_storage_class: ocs-storagecluster-cephfs

# Hostnames; left to the apps domain unless overridden.
openrag_frontend_host: ""
openrag_backend_host: ""
openrag_langflow_host: ""

# Whether Langflow gets a Route of its own. The "Edit in Langflow" buttons in
# OpenRAG's settings open the flow editor in a new tab, so Langflow has to be
# reachable from the browser - it is a ClusterIP service otherwise, and the
# chart's ingress block templates only the frontend and backend hosts, so the
# langflow host handed to it above is silently dropped.
#
# Langflow has its own login, seeded with the superuser password this role
# generates, so exposing it does not expose the flows themselves. Set false to
# keep it in-cluster; the buttons then lead nowhere, which is the state this
# deployment was in.
openrag_expose_langflow: true

# Resolved once so the Route and LANGFLOW_PUBLIC_URL cannot drift apart.
openrag_langflow_fqdn: "{{ openrag_langflow_host | default('openrag-langflow.' ~ ocp_apps_domain, true) }}"

# One gateway in front of chat and embeddings. Used both for the backend's
# OPENAI_BASE_URL and for the rhoai provider's api_base at onboarding, which
# have to agree - the first decides where queries go, the second is what the
# stored provider credential says, and a mismatch validates against one
# endpoint while serving from another.
openrag_litellm_base_url: "http://litellm.{{ litellm_namespace | default('litellm') }}.svc.cluster.local:4000/v1"

# Which providers OpenRAG publishes on GET /models/providers, which is what
# the UI's provider grid and its "is anything configured?" loop both read.
# Applied on top of src/config/model_providers.yaml from the running image,
# so upstream's own changes to that file survive and only these are asserted.
#
# rhoai ships disabled in every run mode (oss, on_prem, saas), so Red Hat
# OpenShift AI never appeared and a workspace configured against it looked
# unconfigured - the wizard covered the whole app on a backend that
# /provider/health called "properly configured and validated".
# Only rhoai. Upstream already ships every other provider enabled in oss
# mode, so listing them here would assert a default rather than change one -
# and each entry is a line that silently stops matching if upstream reshapes
# the file. Add "ollama: false" or similar to hide one.
openrag_provider_visibility:
  rhoai: true

# The wizard's step count. onboarded: true does not put it away on its own -
# the UI also wants the counter past the end, and null reads as "not started"
# rather than "finished". Established by diffing a hand-completed workspace
# against an API-onboarded one: current_step was the only field that differed.
# Bump this if a future OpenRAG adds a step.
openrag_onboarding_final_step: 4

# --- Documentation ---------------------------------------------------------
# OpenRAG's own Docusaurus site, built from the upstream repo in-cluster and
# served beside the app. Upstream ships the site but no container recipe, so
# the Dockerfile is inlined into the BuildConfig.
openrag_deploy_docs: true

# OpenSearch Dashboards, for looking at what OpenRAG has chunked into
# OpenSearch. The Knowledge page in OpenRAG lists documents; this goes a
# level down to the chunks they were split into, with Discover and Dev Tools.
#
# Off by default - it is a second UI and 2 GB of limits for something most
# runs never open. Unlike Attu it needs no proxy in front: OpenSearch here
# runs the security plugin, so Dashboards serves its own login and takes the
# admin credential the summary prints.
#
# The tag must track the OpenSearch server's major line. Dashboards refuses
# to start against a version it does not match.
openrag_deploy_dashboards: false
opensearch_dashboards_image: "opensearchproject/opensearch-dashboards:3.8.0"
openrag_docs_git_version: "{{ openrag_git_version }}"
# baseUrl is baked into every generated link at build time, so it has to match
# where the site is actually served. Its own Route serves at the root.
openrag_docs_base_url: "/"
openrag_docs_build_image: docker.io/library/node:22-alpine
# A UBI nginx, not a stock one: it serves /opt/app-root/src on 8080 and
# tolerates the arbitrary high UID restricted-v2 assigns.
openrag_docs_runtime_image: registry.access.redhat.com/ubi9/nginx-124
# A build takes a couple of minutes and refetches the npm tree, so it only
# runs when there is no image yet. Set true to rebuild against a newer commit.
openrag_docs_force_build: false

---
- name: Create the openshift-storage namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ odf_mcg_namespace }}"
        labels:
          openshift.io/cluster-monitoring: "true"

- name: Create the ODF OperatorGroup
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: openshift-storage-operatorgroup
        namespace: "{{ odf_mcg_namespace }}"
      spec:
        targetNamespaces:
          - "{{ odf_mcg_namespace }}"

# startingCSV pins the install to 4.22.5-rhodf. Automatic approval still lets
# OLM move forward later; it is the FIRST version that is being fixed here, so
# the experiment starts from a known build rather than whatever the channel
# happens to resolve to on the day.
- name: Create the ODF Operator Subscription
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: odf-operator
        namespace: "{{ odf_mcg_namespace }}"
      spec:
        channel: "{{ odf_mcg_channel }}"
        name: odf-operator
        source: "{{ odf_mcg_catalog_source }}"
        sourceNamespace: openshift-marketplace
        installPlanApproval: Automatic
        startingCSV: "{{ odf_mcg_starting_csv }}"

- name: Wait for the ODF Operator CSV to succeed
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ odf_mcg_namespace }}"
    name: "{{ odf_mcg_starting_csv }}"
  register: odf_mcg_csv
  until: >-
    odf_mcg_csv.resources | length > 0 and
    odf_mcg_csv.resources[0].status.phase | default('') == 'Succeeded'
  retries: 60
  delay: 20

- name: Wait for the StorageCluster CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: storageclusters.ocs.openshift.io
  register: odf_mcg_sc_crd
  until: odf_mcg_sc_crd.resources | length > 0
  retries: 60
  delay: 15

# No storageDeviceSets at all. Their absence is what keeps Ceph out - adding
# even an empty list here would start provisioning OSDs. reconcileStrategy
# standalone is the supported way to ask ocs-operator for MCG on its own.
- name: Create the MCG-only StorageCluster
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: ocs.openshift.io/v1
      kind: StorageCluster
      metadata:
        name: ocs-storagecluster
        namespace: "{{ odf_mcg_namespace }}"
      spec:
        multiCloudGateway:
          dbStorageClassName: "{{ odf_mcg_db_storage_class }}"
          reconcileStrategy: standalone

- name: Wait for the NooBaa CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: noobaas.noobaa.io
  register: odf_mcg_nb_crd
  until: odf_mcg_nb_crd.resources | length > 0
  retries: 30
  delay: 15

# Without this NooBaa builds its own default backing store from whatever cloud
# credentials it can find - on AWS that is a real S3 bucket, which is not what
# this experiment is measuring.
- name: Configure NooBaa to use a manual default backing store
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    definition:
      apiVersion: noobaa.io/v1alpha1
      kind: NooBaa
      metadata:
        name: noobaa
        namespace: "{{ odf_mcg_namespace }}"
      spec:
        manualDefaultBackingStore: true
  register: odf_mcg_nb_patch
  until: odf_mcg_nb_patch is succeeded
  retries: 10
  delay: 15

- name: Wait for the BackingStore CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: backingstores.noobaa.io
  register: odf_mcg_bs_crd
  until: odf_mcg_bs_crd.resources | length > 0
  retries: 30
  delay: 15

- name: Create the 1 TB PV pool backing store
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: noobaa.io/v1alpha1
      kind: BackingStore
      metadata:
        name: noobaa-pv-backing-store
        namespace: "{{ odf_mcg_namespace }}"
      spec:
        type: pv-pool
        pvPool:
          numVolumes: "{{ odf_mcg_pv_pool_volumes | int }}"
          storageClass: "{{ odf_mcg_storage_class }}"
          resources:
            requests:
              storage: "{{ odf_mcg_pv_pool_size }}"

# Same MCG bug as the full deployment: NooBaa bootstraps into the
# noobaa-db-pg StatefulSet, is repointed at an empty CNPG cluster and loops on
# "account not found". Shared with the odf role rather than copied, so there
# is one implementation to keep correct.
- name: Repair NooBaa if the CNPG migration stranded it
  ansible.builtin.include_role:
    name: odf
    tasks_from: noobaa_cnpg_repair
  when: odf_fix_noobaa_cnpg | bool

- name: Wait for the PV pool backing store to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: noobaa.io/v1alpha1
    kind: BackingStore
    namespace: "{{ odf_mcg_namespace }}"
    name: noobaa-pv-backing-store
  register: odf_mcg_bs
  until: >-
    odf_mcg_bs.resources | length > 0 and
    odf_mcg_bs.resources[0].status.phase | default('') == 'Ready'
  retries: 60
  delay: 15

- name: Wait for the default BucketClass
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: noobaa.io/v1alpha1
    kind: BucketClass
    namespace: "{{ odf_mcg_namespace }}"
    name: noobaa-default-bucket-class
  register: odf_mcg_bc
  until: odf_mcg_bc.resources | length > 0
  retries: 20
  delay: 15

- name: Point the default BucketClass at the PV pool
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    definition:
      apiVersion: noobaa.io/v1alpha1
      kind: BucketClass
      metadata:
        name: noobaa-default-bucket-class
        namespace: "{{ odf_mcg_namespace }}"
      spec:
        placementPolicy:
          tiers:
            - backingStores:
                - noobaa-pv-backing-store

- name: Wait for NooBaa to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: noobaa.io/v1alpha1
    kind: NooBaa
    namespace: "{{ odf_mcg_namespace }}"
    name: noobaa
  register: odf_mcg_nb
  until: >-
    odf_mcg_nb.resources | length > 0 and
    odf_mcg_nb.resources[0].status.phase | default('') == 'Ready'
  retries: 60
  delay: 15

- name: Wait for the StorageCluster to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: ocs.openshift.io/v1
    kind: StorageCluster
    namespace: "{{ odf_mcg_namespace }}"
    name: ocs-storagecluster
  register: odf_mcg_sc
  until: >-
    odf_mcg_sc.resources | length > 0 and
    odf_mcg_sc.resources[0].status.phase | default('') == 'Ready'
  retries: 60
  delay: 30

# ---------------------------------------------------------------------------
# The experiment's actual assertion
# ---------------------------------------------------------------------------
- name: Look for Ceph that should not exist
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: ceph.rook.io/v1
    kind: CephCluster
    namespace: "{{ odf_mcg_namespace }}"
  register: odf_mcg_ceph
  failed_when: false

- name: Look for OSD device-set PVCs that should not exist
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ odf_mcg_namespace }}"
  register: odf_mcg_pvcs

- name: Fail if Ceph was deployed after all
  ansible.builtin.fail:
    msg: >-
      MCG-only was requested but Ceph is present:
      {{ odf_mcg_ceph.resources | default([]) | length }} CephCluster(s) and
      {{ osd_pvcs | length }} OSD device-set PVC(s) ({{ osd_pvcs | join(', ') }}).
      That is a full ODF deployment, not a standalone gateway, and it is
      provisioning OSD capacity nobody asked for.
  vars:
    osd_pvcs: >-
      {{ odf_mcg_pvcs.resources | default([]) | map(attribute='metadata.name')
         | select('match', '^ocs-deviceset') | list }}
  when:
    - odf_mcg_assert_no_ceph | bool
    - (odf_mcg_ceph.resources | default([]) | length > 0) or (osd_pvcs | length > 0)

- name: Report what was built
  ansible.builtin.debug:
    msg:
      - "MCG-only ODF is ready in {{ odf_mcg_namespace }}"
      - "ODF version     : {{ odf_mcg_sc.resources[0].status.version | default('?') }}"
      - "Ceph clusters   : {{ odf_mcg_ceph.resources | default([]) | length }}  (expected 0)"
      - "OSD device sets : {{ odf_mcg_pvcs.resources | default([]) | map(attribute='metadata.name') | select('match', '^ocs-deviceset') | list | length }}  (expected 0)"
      - "Object capacity : {{ odf_mcg_pv_pool_volumes }} x {{ odf_mcg_pv_pool_size }} raw gp3 via the EBS CSI driver"
      - "pv-pool PVCs    : {{ odf_mcg_pvcs.resources | default([]) | map(attribute='metadata.name') | select('search', 'backing-store') | list | length }} bound"
      - "S3 endpoint     : https://{{ 's3-' ~ odf_mcg_namespace ~ '.' ~ ocp_apps_domain }}"

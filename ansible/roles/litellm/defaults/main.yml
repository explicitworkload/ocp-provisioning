---
litellm_namespace: litellm
litellm_image: "ghcr.io/berriai/litellm:main-latest"
litellm_db_image: "registry.redhat.io/rhel9/postgresql-16:latest"
litellm_db_storage: 5Gi
litellm_db_user: litellm
# Empty = generated on first run and then reused from the
# litellm-db-credentials Secret. Never commit a value here: this repo is
# public, and the password is also baked into the database's data directory.
litellm_db_password: ""

# Databases still using this literal - which was committed to this repo until
# it was rotated out - are re-passworded in place on the next run. Removing
# this line stops that migration ever running, so leave it until every cluster
# built from an older commit has been re-run.
litellm_db_legacy_password: "litellm-db-pass"
litellm_db_name: litellm

litellm_master_key: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=10') }}"
litellm_ui_username: admin
# LiteLLM enforces a policy on database user passwords: at least 12
# characters, with a lowercase letter, an uppercase letter, a digit and a
# special character. Drawn one class at a time rather than as a single random
# string, because a single draw can come out with no digit and then
# /user/update answers 400 - which, with disable_env_credential_login on,
# leaves the UI with no working login at all.
litellm_ui_password: >-
  {{ lookup('password', '/dev/null chars=ascii_lowercase length=6')
     ~ lookup('password', '/dev/null chars=ascii_uppercase length=5')
     ~ lookup('password', '/dev/null chars=digits length=4') ~ '-' }}

litellm_admin_email: admin@example.com

# LiteLLM benches a deployment for 60 seconds after a couple of failures, so
# the router can send traffic to another deployment of the same model. Nothing
# here has another deployment: every model group in this proxy is a single
# upstream, so a cooldown has nowhere to fail over to and can only turn a
# momentary failure into an outage of something that is healthy.
#
# Seen on sandbox307. The OpenRAG backend called bge-small-en-v1.5 on
# /chat/completions - it builds its model picker from /v1/models, which is a
# flat list carrying no mode, so the embedding model is offered as a language
# model. text-embeddings has no chat route and answered 404. Two of those
# benched bge-small, and OpenRAG's real embedding traffic then got 429 "All
# deployments for selected model are in cooldown" until it expired - surfacing
# in Langflow as the failure of a model that was serving fine throughout.
litellm_disable_cooldowns: true

litellm_azure_endpoint: "https://llm-gpt4-lightspeed.cognitiveservices.azure.com"
litellm_azure_api_version: "2024-06-01"
litellm_azure_model_name: "Mistral-Small-4-119B-2603"
litellm_azure_credential_name: gpt4

# Embedding model registered with LiteLLM for OpenRAG. The deployment itself
# lives in the openrag role; these just tell LiteLLM where to find it.
# bge-small is 384-dim and runs acceptably on CPU, which matters because the
# cluster's only GPU is taken by the chat model.
litellm_embedding_model_name: bge-small-en-v1.5
litellm_embedding_model_id: BAAI/bge-small-en-v1.5
litellm_embedding_api_base: http://text-embeddings.openrag.svc.cluster.local:8080/v1

# Extra OpenAI-compatible endpoints. Each is registered as a model in
# LiteLLM - which is what makes it appear in OpenRAG, Dev Spaces/Continue
# and the Ops Dashboard, since all three ask LiteLLM what it serves - and
# published to RHOAI's Gen AI playground as an AI asset endpoint pointing
# back at LiteLLM. See group_vars/all.yml for the per-entry keys.
#
# Keys go into the litellm-secrets Secret and are referenced from config.yaml
# as os.environ/EXTRA_KEY_<NAME>, so they are never written into a ConfigMap.
litellm_extra_models: []

# The former name for the list above, from when the playground endpoints
# were published separately by the openshift_ai role and never reached
# LiteLLM. Merged with it by name so a run-time vars file written against
# the old name still works; deliberately not documented in all.yml, where
# a second list asking for the same base_url, key and models would only be
# something to keep in step.
rhoai_extra_ai_endpoints: []

# Turns off the UI login path that accepts UI_USERNAME/UI_PASSWORD - or the
# master key, when UI_PASSWORD is unset - as a shared static secret. LiteLLM
# warns about it in a banner across the top of its own UI, and the warning is
# fair: it is a shared static secret.
#
# Off all the same, because on LiteLLM v1.106.0 turning it on from here
# leaves no way in at all. A password cannot be set at /user/new ("users set
# their own password through an invitation link"), and one set through
# /user/update comes back with password_reset_required: true, which /login
# rejects - with no API on this build to clear the flag and no /invitation
# endpoints published. So the playbook cannot hand you a working password,
# and this setting removes the only one that works.
#
# It was briefly defaulted to true, and did exactly that: on sandbox307 the
# password in litellm-proxy-credentials - the one the deployment summary
# prints - was rejected by /login with "Invalid credentials used to access
# UI", because this flag tells LiteLLM to ignore UI_USERNAME/UI_PASSWORD and
# nothing had replaced them. Setting it back to false and restarting took the
# same password from 401 to a 303 into the UI.
#
# LiteLLM's own banner says to create a regular admin account with its own
# password first. That is a person at the UI, not a run. Once you have done
# it, set this true and re-run:
#
#     ./run.sh --tags litellm -e litellm_disable_env_credential_login=true
litellm_disable_env_credential_login: false

# --- Publishing to RHOAI --------------------------------------------------
# Whether LiteLLM is published to RHOAI as an AI asset endpoint, which is
# what puts its models in the Gen AI playground's picker.
litellm_publish_ai_assets: true

# The ConfigMap RHOAI reads AI asset endpoints from. NOT a free-form name and
# not a gen-ai-aa-* prefix convention: the dashboard's BFF binary contains
# exactly three hardcoded names - gen-ai-aa-custom-model-endpoints,
# gen-ai-aa-mcp-servers and gen-ai-aa-vector-stores - and ignores anything
# else. A ConfigMap published under any other name is simply never read, with
# no error anywhere to say so.
litellm_ai_asset_configmap: gen-ai-aa-custom-model-endpoints

# The provider id shown against each model, and the Secret the endpoint reads
# its key from (endpoint-api-key-<n>). endpoint-1 is the shape RHOAI's own
# documentation uses.
litellm_ai_asset_name: endpoint-1
litellm_ai_asset_key_secret: endpoint-api-key-1

# Modes RHOAI genuinely cannot use. Listed as what to reject rather than
# what to accept, so a model LiteLLM reports no mode for, or a null mode, is
# still published.
#
# embedding is NOT rejected: the models are published with
# model_type: embedding so RHOAI's vector stores and AutoRAG can use them,
# and llama-stack keeps them out of the chat picker itself.
litellm_ai_asset_reject_modes:
- rerank
- image_generation
- audio_transcription
- audio_speech
- moderation

# Model names to keep out of the endpoint whatever LiteLLM says. Models with
# an InferenceService on this cluster are excluded already, by lookup - RHOAI
# lists those itself - so this is for the rest.
litellm_ai_asset_exclude: []

# Where the endpoint is published. RHOAI finds AI assets by the gen-ai-aa-*
# ConfigMap name, so this only has to be a namespace the dashboard can read.
rhoai_ai_endpoint_namespace: "{{ model_namespace | default('qwen3-4b') }}"

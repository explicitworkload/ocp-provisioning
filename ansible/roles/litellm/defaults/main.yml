---
litellm_namespace: litellm
litellm_image: "ghcr.io/berriai/litellm:main-latest"
litellm_db_image: "registry.redhat.io/rhel9/postgresql-16:latest"
litellm_db_storage: 5Gi
litellm_db_user: litellm
# Empty = generated on first run and then reused from the
# litellm-db-credentials Secret. Never commit a value here: this repo is
# public, and the password is also baked into the database's data directory.
litellm_db_password: ""

# Databases still using this literal - which was committed to this repo until
# it was rotated out - are re-passworded in place on the next run. Removing
# this line stops that migration ever running, so leave it until every cluster
# built from an older commit has been re-run.
litellm_db_legacy_password: "litellm-db-pass"
litellm_db_name: litellm

litellm_master_key: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=10') }}"
litellm_ui_username: admin
litellm_ui_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=10') }}"

litellm_admin_email: admin@example.com

litellm_azure_endpoint: "https://llm-gpt4-lightspeed.cognitiveservices.azure.com"
litellm_azure_api_version: "2024-06-01"
litellm_azure_model_name: "Mistral-Small-4-119B-2603"
litellm_azure_credential_name: gpt4

# Embedding model registered with LiteLLM for OpenRAG. The deployment itself
# lives in the openrag role; these just tell LiteLLM where to find it.
# bge-small is 384-dim and runs acceptably on CPU, which matters because the
# cluster's only GPU is taken by the chat model.
litellm_embedding_model_name: bge-small-en-v1.5
litellm_embedding_model_id: BAAI/bge-small-en-v1.5
litellm_embedding_api_base: http://text-embeddings.openrag.svc.cluster.local:8080/v1

# Extra OpenAI-compatible endpoints. Each is registered as a model in
# LiteLLM - which is what makes it appear in OpenRAG, Dev Spaces/Continue
# and the Ops Dashboard, since all three ask LiteLLM what it serves - and
# published to RHOAI's Gen AI playground as an AI asset endpoint pointing
# back at LiteLLM. See group_vars/all.yml for the per-entry keys.
#
# Keys go into the litellm-secrets Secret and are referenced from config.yaml
# as os.environ/EXTRA_KEY_<NAME>, so they are never written into a ConfigMap.
litellm_extra_models: []

# The former name for the list above, from when the playground endpoints
# were published separately by the openshift_ai role and never reached
# LiteLLM. Merged with it by name so a run-time vars file written against
# the old name still works; deliberately not documented in all.yml, where
# a second list asking for the same base_url, key and models would only be
# something to keep in step.
rhoai_extra_ai_endpoints: []

# Where an endpoint is published when it does not name a namespace itself.
# RHOAI finds AI assets by the gen-ai-aa-* ConfigMap name, so this only has
# to be a namespace the dashboard can read.
rhoai_ai_endpoint_namespace: "{{ model_namespace | default('qwen3-4b') }}"

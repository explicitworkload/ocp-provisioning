---
# Publishes what LiteLLM serves as an AI asset endpoint in RHOAI, so the Gen
# AI playground offers the same models the Ops Dashboard and OpenRAG do.
#
# One endpoint, not one per upstream. Everything is reached through LiteLLM
# on one base_url with one key, so splitting by where a model happens to run
# would be a distinction RHOAI cannot act on - and it is exactly the
# distinction LiteLLM exists to remove. The model list comes from LiteLLM
# itself rather than from litellm_extra_models, which means models the role
# registers from elsewhere - the Azure credential out of openshift-lightspeed,
# say - are published too, without having to be declared a second time.
#
# Lives in the litellm role, not openshift_ai, because of the key: the
# ConfigMap carries LiteLLM's virtual key, which does not exist until this
# role has run. Published from openshift_ai it would reference a Secret that
# is not there yet and RHOAI would show the endpoint as broken.
#
# RHOAI discovers these by NAME: a ConfigMap called gen-ai-aa-* holding a
# config.yaml. There is no label selector, which is why the name is built
# rather than free-form.

# --- running on our own ---------------------------------------------------
# This file used to be reachable only as the tail of main.yml, which is why
# it had no tag: it needs litellm_url, litellm_master_key, litellm_all_extras,
# existing_vkey_secret and litellm_vkey_stale, and every one of those is a
# fact set above it.
#
# It now has to run a second time, from the end of the openrag role, because
# openrag is what deploys the text-embeddings service behind
# bge-small-en-v1.5 - so at the point main.yml published, that model could
# not answer /v1/embeddings and was dropped rather than published with a
# guessed dimension. Everything it needs exists on the cluster by then; it
# just was not in this process's facts.
#
# So: when the facts are absent, read them. Keyed off litellm_vkey_stale,
# which only main.yml sets. Nothing here runs in the normal in-role path.
- name: Find LiteLLM, running standalone
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ litellm_namespace }}"
    name: litellm
  register: litellm_standalone_route
  when: litellm_vkey_stale is not defined

- name: Read LiteLLM's credentials, running standalone
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ litellm_namespace }}"
    name: litellm-proxy-credentials
  register: litellm_standalone_cred
  no_log: true
  when: litellm_vkey_stale is not defined

# The virtual key the ConfigMap points RHOAI at. Never regenerated here -
# a republish that rotated the key would break every endpoint already
# using it - so this reads the Secret main.yml wrote and nothing else.
- name: Read the published virtual key, running standalone
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ model_namespace }}"
    name: "{{ litellm_ai_asset_key_secret }}"
  register: litellm_standalone_vkey
  no_log: true
  when: litellm_vkey_stale is not defined

- name: Stand in for the facts main.yml would have set
  ansible.builtin.set_fact:
    litellm_url: >-
      https://{{ (litellm_standalone_route.resources | first).spec.host }}
    litellm_master_key: >-
      {{ (litellm_standalone_cred.resources | first).data.LITELLM_MASTER_KEY | b64decode }}
    existing_vkey_secret: "{{ litellm_standalone_vkey }}"
    litellm_all_extras: >-
      {{ (litellm_extra_models + rhoai_extra_ai_endpoints)
         | unique(attribute='name') | list }}
    # Only used below to work out which endpoints opted OUT of publishing,
    # and an endpoint opts out whether or not its key happens to be usable -
    # so the full list is the right stand-in for main.yml's filtered one.
    # Note the consequence of running this from a host whose all.yml does
    # not carry the endpoints: the list is empty, nothing is treated as
    # opted out, and an endpoint marked publish_as_ai_asset false would be
    # published anyway. Supply the same vars file you deploy with.
    litellm_usable_extras: >-
      {{ (litellm_extra_models + rhoai_extra_ai_endpoints)
         | unique(attribute='name') | list }}
    # false means "use the key already on the cluster", which is the only
    # correct answer when this file is not the one that minted it.
    litellm_vkey_stale: false
  no_log: true
  when:
    - litellm_vkey_stale is not defined
    - litellm_standalone_route.resources | default([]) | length > 0
    - litellm_standalone_cred.resources | default([]) | length > 0
    - litellm_standalone_vkey.resources | default([]) | length > 0

# No fallback branch here on purpose. end_play would have aborted milvus,
# demos, verify and summary along with the republish, and a guard variable
# threaded through fifteen tasks is worse than the bug. The caller checks
# that all three objects exist before including this file, so the bootstrap
# above cannot half-complete.

# Either the key this run generated or the one already on the cluster - the
# virtual key aliased openshift-ai. Both branches are set up by the
# virtual-key tasks in main.yml immediately above.
- name: Note the LiteLLM virtual key the endpoint will use
  ansible.builtin.set_fact:
    litellm_vkey_value: >-
      {{ litellm_vkey.json.key
         if (litellm_vkey_stale | bool)
         else (existing_vkey_secret.resources[0].data.api_key | b64decode) }}
  no_log: true

# Asked rather than computed from the role's own variables. /v1/model/info
# is what the proxy will actually answer /chat/completions for, and it
# carries each model's mode, which is what decides whether the playground
# has any use for it.
- name: Ask LiteLLM what it serves
  ansible.builtin.uri:
    url: "{{ litellm_url }}/v1/model/info"
    method: GET
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    validate_certs: false
    status_code: [200]
  register: litellm_model_info
  retries: 10
  delay: 6
  until: litellm_model_info.status == 200
  no_log: true

# Models already served on this cluster are left out. RHOAI builds a row for
# each InferenceService by itself, with a description and a real status;
# naming one here as well produced a second, statusless row beside it - the
# duplicate qwen3-4b that c9df4cc introduced.
- name: Read the models RHOAI already lists for itself
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: serving.kserve.io/v1beta1
    kind: InferenceService
  register: litellm_isvcs
  failed_when: false

# Accumulated one model at a time rather than built inline, because each
# entry needs both a name and a type and Jinja has no list comprehension to
# pair them with.
#
# model_type matters: llama-stack distinguishes llm from embedding, and an
# embedding model published as llm is offered in the chat picker and fails
# when something tries to talk to it. Embeddings are published - RHOAI's
# vector stores and AutoRAG want them - but as what they are.
- name: Decide which models to publish
  ansible.builtin.set_fact:
    litellm_asset_models: >-
      {{ litellm_asset_models | default([])
         + [{'name': item.model_name,
             'model_type': 'embedding'
               if (item.model_info.mode | default('')) == 'embedding' else 'llm'}] }}
  loop: "{{ litellm_model_info.json.data | default([]) }}"
  loop_control:
    label: "{{ item.model_name }}"
  when:
    - item.model_name not in excluded
    # Declaring the same model twice in litellm_extra_models is a typo, not
    # an instruction to list it twice - and RHOAI renders each entry as its
    # own row. Seen on sandbox5164, where maas-rhdp named qwen38-27b twice.
    - item.model_name not in (litellm_asset_models | default([]) | map(attribute='name') | list)
  vars:
    # Modes the playground genuinely cannot use. Inverted deliberately: mode
    # comes back three ways - absent, present-and-null, present-and-set - and
    # only the third can be matched reliably, so anything not positively
    # identified as unusable is published. An OpenAI-compatible endpoint is a
    # chat endpoint unless it says otherwise.
    not_for_chat: >-
      {{ litellm_model_info.json.data | default([])
         | selectattr('model_info.mode', 'defined')
         | rejectattr('model_info.mode', 'none')
         | selectattr('model_info.mode', 'in', litellm_ai_asset_reject_modes)
         | map(attribute='model_name') | list }}
    on_cluster: >-
      {{ litellm_isvcs.resources | default([])
         | map(attribute='metadata.name') | list
         + (litellm_isvcs.resources | default([])
            | map(attribute='metadata.annotations') | map('default', {}, true)
            | map('dict2items') | sum(start=[])
            | selectattr('key', 'equalto', 'openshift.io/display-name')
            | map(attribute='value') | list) }}
    # Models belonging to an extra endpoint that opted out.
    opted_out: >-
      {{ litellm_usable_extras
         | selectattr('publish_as_ai_asset', 'defined')
         | rejectattr('publish_as_ai_asset')
         | map(attribute='models') | sum(start=[]) | list }}
    excluded: "{{ (not_for_chat + on_cluster + opted_out + litellm_ai_asset_exclude) | unique | list }}"

# An embedding model published without its dimension is a landmine. The
# playground's llama-stack does not ask the model how wide its vectors are;
# it reads embedding_dimension out of this metadata, and where the key is
# absent it assumes 128. Everything then looks fine - the model is listed,
# /v1/embeddings answers - until something creates a vector store with it,
# at which point the first write fails with
#
#   BadRequestError: Embedding at index 0 has dimension 384, expected 128
#
# four steps into an AutoRAG run, naming neither the model nor this file.
#
# Measured rather than tabulated. A lookup keyed by model name is wrong the
# first time someone fronts a model that is not in it, and silently wrong -
# which is the failure mode being fixed here. Asking the endpoint costs one
# request per embedding model and is correct by construction.
#
# CAVEAT: where OGXServer.spec.overrideConfig is set, the playground reads
# that ConfigMap and nothing published here is consulted at all - the
# dimension has to be right in the override too. See "Where that setting
# actually lives on this cluster" in demos/autorag/README.md.
- name: Measure what each embedding model actually returns
  ansible.builtin.uri:
    url: "{{ litellm_url }}/v1/embeddings"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    body_format: json
    body:
      model: "{{ item.name }}"
      input: "dimension probe"
    validate_certs: false
    status_code: [200]
  register: litellm_embed_probe
  loop: "{{ litellm_asset_models | selectattr('model_type', 'equalto', 'embedding') | list }}"
  loop_control:
    label: "{{ item.name }}"
  retries: 5
  delay: 6
  until: litellm_embed_probe.status | default(0) == 200
  # Not fatal: one unreachable MaaS embedding endpoint should not stop a
  # provisioning run. The model is dropped below instead.
  failed_when: false
  no_log: true

- name: Note the embedding dimensions that came back
  ansible.builtin.set_fact:
    litellm_embedding_dims: >-
      {{ litellm_embedding_dims | default({})
         | combine({item.item.name: (item.json.data[0].embedding | length)}) }}
  loop: "{{ litellm_embed_probe.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - (item.status | default(0)) == 200
    - (item.json.data | default([])) | length > 0

# Recorded before the next task edits the list, and derived from the list
# rather than from everything LiteLLM serves. Models kept out for other
# reasons - already on an InferenceService, opted out, explicitly excluded -
# were never probed, and reporting them here would blame the endpoint for a
# decision made above.
- name: Note which embedding models could not be measured
  ansible.builtin.set_fact:
    litellm_unmeasured_embeddings: >-
      {{ litellm_asset_models
         | selectattr('model_type', 'equalto', 'embedding')
         | map(attribute='name')
         | reject('in', (litellm_embedding_dims | default({}) | list))
         | list }}

# Unpublished beats published-and-wrong. A model missing from the vector
# store list is visibly absent; one carrying a made-up dimension fails much
# later, somewhere else.
- name: Leave out embedding models whose dimension could not be measured
  ansible.builtin.set_fact:
    litellm_asset_models: >-
      {{ litellm_asset_models
         | rejectattr('name', 'in', litellm_unmeasured_embeddings) | list }}
  when: litellm_unmeasured_embeddings | length > 0

- name: Report the embedding models that were left out
  ansible.builtin.debug:
    msg: >-
      Not published as vector store embedding models, because
      {{ litellm_url }}/v1/embeddings did not answer for them:
      {{ litellm_unmeasured_embeddings | join(', ') }}. Publishing one
      without a measured embedding_dimension makes llama-stack assume 128,
      which fails on the first write to a vector store rather than here.
  when: litellm_unmeasured_embeddings | length > 0

- name: Report that there is nothing to publish
  ansible.builtin.debug:
    msg: >-
      No AI asset endpoint published: every model LiteLLM serves is either an
      embedding, already listed by RHOAI from its own InferenceService, or
      excluded.
  when: litellm_asset_models | length == 0

- name: Create the namespace the endpoint is published to
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ rhoai_ai_endpoint_namespace }}"
        # What the namespace has to be for the dashboard to show anything in
        # it. apply merges, so this costs nothing where model_serving has
        # already labelled it.
        labels:
          opendatahub.io/dashboard: "true"
  when: litellm_asset_models | length > 0

# Not any upstream's own key - those stay with LiteLLM and never leave its
# namespace. What RHOAI needs is a key for the proxy in front of them, which
# is the openshift-ai virtual key. Written under the name the endpoint's
# secretRef uses; where rhoai_ai_endpoint_namespace is the default this is
# the same object main.yml already created, with the same value.
- name: Give the endpoint the virtual key for LiteLLM
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ litellm_ai_asset_key_secret }}"
        namespace: "{{ rhoai_ai_endpoint_namespace }}"
      type: Opaque
      stringData:
        api_key: "{{ litellm_vkey_value }}"
  when: litellm_asset_models | length > 0
  no_log: true

- name: Publish LiteLLM as an AI asset endpoint
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ litellm_ai_asset_configmap }}"
        namespace: "{{ rhoai_ai_endpoint_namespace }}"
      data:
        config.yaml: "{{ lookup('template', 'gen-ai-aa.yaml.j2') }}"
  when: litellm_asset_models | length > 0

# Earlier revisions published one ConfigMap per declared endpoint, and then
# one under a name of this role's choosing. Neither was ever read - the
# dashboard only looks at the three names it has compiled in - so they sat
# there looking published.
#
# ConfigMaps only. The matching gen-ai-key-<name> Secrets are left where they
# are: on a cluster provisioned by the openshift_ai revision of this code
# they hold the endpoint's own upstream key, which may be the only copy, and
# an orphaned Secret costs nothing. Deleting one cost a real key once
# already.
- name: Remove the endpoints published under names RHOAI never reads
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: absent
    api_version: v1
    kind: ConfigMap
    namespace: "{{ rhoai_ai_endpoint_namespace }}"
    name: "gen-ai-aa-{{ item }}"
  loop: >-
    {{ (litellm_all_extras | map(attribute='name') | list + ['litellm'])
       | unique | reject('equalto', litellm_ai_asset_configmap | replace('gen-ai-aa-', ''))
       | list }}
  loop_control:
    label: "gen-ai-aa-{{ item }}"

- name: Remove the endpoint when there is nothing left to publish
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: absent
    api_version: v1
    kind: ConfigMap
    namespace: "{{ rhoai_ai_endpoint_namespace }}"
    name: "{{ litellm_ai_asset_configmap }}"
  when: litellm_asset_models | length == 0

- name: Report the published endpoint
  ansible.builtin.debug:
    msg: >-
      {{ litellm_ai_asset_configmap }} published to
      {{ rhoai_ai_endpoint_namespace }} with
      {{ litellm_asset_models | length }} model(s):
      {{ litellm_asset_models | map(attribute='name') | join(', ') }}
  when: litellm_asset_models | length > 0

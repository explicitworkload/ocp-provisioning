---
- name: Get cluster ingress domain
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: cluster_ingress

- name: Set cluster apps domain
  ansible.builtin.set_fact:
    ocp_apps_domain: "{{ cluster_ingress.resources[0].spec.domain }}"

# --- Namespace ---

- name: Create LiteLLM namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ litellm_namespace }}"

# --- Generate credentials (idempotent) ---

- name: Check for existing LiteLLM proxy secret
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: v1
    kind: Secret
    namespace: "{{ litellm_namespace }}"
    name: litellm-proxy-credentials
  register: existing_proxy_secret

- name: Generate random credentials
  ansible.builtin.set_fact:
    litellm_master_key: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=10') }}"
    litellm_ui_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=10') }}"
  when: existing_proxy_secret.resources | length == 0

- name: Reuse existing credentials
  ansible.builtin.set_fact:
    litellm_master_key: "{{ existing_proxy_secret.resources[0].data.LITELLM_MASTER_KEY | b64decode }}"
    litellm_ui_password: "{{ existing_proxy_secret.resources[0].data.UI_PASSWORD | b64decode }}"
  when: existing_proxy_secret.resources | length > 0

- name: Store LiteLLM proxy credentials
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-proxy-credentials
        namespace: "{{ litellm_namespace }}"
      type: Opaque
      stringData:
        LITELLM_MASTER_KEY: "{{ litellm_master_key }}"
        UI_PASSWORD: "{{ litellm_ui_password }}"

# --- PostgreSQL ---

- name: Create LiteLLM database PVC
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: litellm-db
        namespace: "{{ litellm_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ litellm_db_storage }}"

# --- Database password resolution and in-place rotation --------------------
# litellm_db_password used to be a literal committed to this public repo. The
# database cannot simply be recreated with a new one: LiteLLM_VerificationToken
# holds the virtual keys the dashboard and Dev Spaces workspaces authenticate
# with, and LiteLLM_CredentialsTable holds the reusable Azure credential.
# Dropping the volume would invalidate all of it. So re-password the running
# database instead and keep its contents.

- name: Look for the existing LiteLLM database credentials
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    kind: Secret
    namespace: "{{ litellm_namespace }}"
    name: litellm-db-credentials
  register: litellm_db_secret
  no_log: true

- name: Read the password currently in the Secret
  ansible.builtin.set_fact:
    litellm_db_current: >-
      {{ (litellm_db_secret.resources | first).data.POSTGRES_PASSWORD | b64decode
         if litellm_db_secret.resources | default([]) | length > 0 else '' }}
  no_log: true

# Precedence: an explicit value, else whatever is already deployed, else a
# fresh one. The legacy literal is deliberately NOT reused - matching it is
# what triggers rotation. Alphanumeric because the value goes straight into a
# postgresql:// DSN, where characters needing percent-encoding become a silent
# connection failure.
- name: Resolve the LiteLLM database password
  ansible.builtin.set_fact:
    litellm_db_password_effective: >-
      {{ litellm_db_password if litellm_db_password | default('') | length > 0
         else (litellm_db_current
               if (litellm_db_current | length > 0
                   and litellm_db_current != litellm_db_legacy_password)
               else lookup('password', '/dev/null length=24 chars=ascii_letters,digits')) }}
    litellm_db_rotate: "{{ litellm_db_current == litellm_db_legacy_password }}"
  no_log: true

- name: Report the credential rotation
  ansible.builtin.debug:
    msg: >-
      The LiteLLM database is still using the password that was committed to
      this repo. Re-passwording it in place and keeping its contents; LiteLLM
      will be restarted to pick up the new DSN.
  when: litellm_db_rotate | bool

- name: Find the running LiteLLM database pod
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: v1
    kind: Pod
    namespace: "{{ litellm_namespace }}"
    label_selectors:
      - app=litellm-db
    field_selectors:
      - status.phase=Running
  register: litellm_db_pod
  when: litellm_db_rotate | bool

# ALTER USER before the Secret is rewritten, not after. The postgres image
# takes its password from the Secret at pod start, so if the Secret changed
# first and the pod restarted in the gap, the container would come up
# expecting a password the database does not have and fail its readiness
# probe. Doing it this way the two only ever disagree while this task runs.
- name: Re-password the LiteLLM database in place
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -eo pipefail
      oc --context {{ ocp_context | quote }} -n {{ litellm_namespace }} \
        exec {{ litellm_db_pod.resources[0].metadata.name | quote }} -- \
        psql -U postgres -d {{ litellm_db_name | quote }} \
        -c "ALTER USER {{ litellm_db_user }} WITH PASSWORD '{{ litellm_db_password_effective }}'" </dev/null
  when:
    - litellm_db_rotate | bool
    - litellm_db_pod.resources | default([]) | length > 0
  no_log: true
  changed_when: true

- name: Create LiteLLM database credentials secret
  register: litellm_db_cred
  no_log: true
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-db-credentials
        namespace: "{{ litellm_namespace }}"
      type: Opaque
      stringData:
        POSTGRES_USER: "{{ litellm_db_user }}"
        POSTGRES_PASSWORD: "{{ litellm_db_password_effective }}"
        POSTGRES_DB: "{{ litellm_db_name }}"
        DATABASE_URL: "postgresql://{{ litellm_db_user }}:{{ litellm_db_password_effective }}@litellm-db:5432/{{ litellm_db_name }}"

- name: Deploy LiteLLM PostgreSQL
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: litellm-db
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm-db
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: litellm-db
        strategy:
          type: Recreate
        template:
          metadata:
            labels:
              app: litellm-db
          spec:
            containers:
              - name: postgres
                image: "{{ litellm_db_image }}"
                ports:
                  - containerPort: 5432
                env:
                  - name: POSTGRESQL_USER
                    valueFrom:
                      secretKeyRef:
                        name: litellm-db-credentials
                        key: POSTGRES_USER
                  - name: POSTGRESQL_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: litellm-db-credentials
                        key: POSTGRES_PASSWORD
                  - name: POSTGRESQL_DATABASE
                    valueFrom:
                      secretKeyRef:
                        name: litellm-db-credentials
                        key: POSTGRES_DB
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/pgsql/data
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: litellm-db

- name: Create LiteLLM database Service
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: litellm-db
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm-db
      spec:
        selector:
          app: litellm-db
        ports:
          - port: 5432
            targetPort: 5432

- name: Wait for LiteLLM database to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ litellm_namespace }}"
    name: litellm-db
  register: litellm_db_deploy
  until: >-
    litellm_db_deploy.resources | length > 0 and
    (litellm_db_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 20
  delay: 15

# --- Secrets ---

- name: Fetch Qwen3 SA token
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: v1
    kind: Secret
    namespace: "{{ model_namespace }}"
    name: "{{ model_name }}-sa-token"
  register: qwen_token_secret

- name: Create LiteLLM API key secret
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-secrets
        namespace: "{{ litellm_namespace }}"
      type: Opaque
      stringData:
        QWEN_API_KEY: "{{ qwen_token_secret.resources[0].data.token | b64decode }}"

- name: Fetch Azure credentials from openshift-lightspeed
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: v1
    kind: Secret
    namespace: openshift-lightspeed
    name: azure-api-keys
  register: azure_secret

# --- LiteLLM Proxy ---

- name: Create LiteLLM config
  register: litellm_config
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: litellm-config
        namespace: "{{ litellm_namespace }}"
      data:
        config.yaml: |
          model_list:
            - model_name: qwen3-4b
              litellm_params:
                model: openai/qwen3-4b
                api_base: https://{{ model_name }}-{{ model_namespace }}.{{ ocp_apps_domain }}/v1
                api_key: os.environ/QWEN_API_KEY
                tls_verify: false
              # Chat is LiteLLM's default, so this model worked without it -
              # but it reported mode=None, leaving health checks guessing
              # rather than targeting /v1/chat/completions deliberately.
              model_info:
                mode: chat
            - model_name: {{ litellm_azure_model_name }}
              litellm_params:
                model: azure/gpt-4
                litellm_credential_name: {{ litellm_azure_credential_name }}
            # CPU-served embeddings for OpenRAG, fronted here so RAG and chat
            # share one OpenAI-compatible endpoint. Deployed by the openrag
            # role; LiteLLM resolves the host per request, so this entry is
            # harmless (just unusable) when that role has not run.
            - model_name: {{ litellm_embedding_model_name }}
              litellm_params:
                model: openai/{{ litellm_embedding_model_id }}
                api_base: {{ litellm_embedding_api_base }}
                api_key: none
              # Without mode: embedding LiteLLM assumes chat and sends the
              # health check - and the UI "Test connection" - to
              # /v1/chat/completions. text-embeddings-inference serves only
              # /v1/embeddings and answers 404 on the others, so a perfectly
              # working model reports
              #   NotFoundError: OpenAIException - Error code: 404
              model_info:
                mode: embedding
          litellm_settings:
            drop_params: true
          general_settings:
            master_key: os.environ/LITELLM_MASTER_KEY
            database_url: os.environ/DATABASE_URL
            store_model_in_db: true

- name: Deploy LiteLLM proxy
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: litellm
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: litellm
        template:
          metadata:
            labels:
              app: litellm
          spec:
            containers:
              - name: litellm
                image: "{{ litellm_image }}"
                args:
                  - --config
                  - /etc/litellm/config.yaml
                  - --port
                  - "4000"
                ports:
                  - containerPort: 4000
                    name: http
                env:
                  - name: QWEN_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-secrets
                        key: QWEN_API_KEY
                  - name: LITELLM_MASTER_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-proxy-credentials
                        key: LITELLM_MASTER_KEY
                  - name: UI_USERNAME
                    value: "{{ litellm_ui_username }}"
                  - name: UI_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: litellm-proxy-credentials
                        key: UI_PASSWORD
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: litellm-db-credentials
                        key: DATABASE_URL
                volumeMounts:
                  - name: config
                    mountPath: /etc/litellm
                    readOnly: true
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi
            volumes:
              - name: config
                configMap:
                  name: litellm-config

- name: Create LiteLLM Service
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: litellm
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm
      spec:
        selector:
          app: litellm
        ports:
          - port: 4000
            targetPort: 4000
            name: http

- name: Expose LiteLLM via Route
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: litellm
        namespace: "{{ litellm_namespace }}"
      spec:
        to:
          kind: Service
          name: litellm
        port:
          targetPort: http
        tls:
          termination: edge

# config.yaml is a mounted ConfigMap read once at startup, and the Deployment
# spec does not change when it does - so adding or editing a model silently
# had no effect until the pod was bounced by hand. Guarded on the ConfigMap
# actually changing so repeat runs do not restart the proxy.
- name: Restart LiteLLM to pick up config changes
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ litellm_namespace }}"
    label_selectors:
      - app=litellm
  # Also on a credential change: DATABASE_URL reaches the proxy as an env var
  # from litellm-db-credentials, and Kubernetes does not refresh env in a
  # running container - after a rotation the old pod keeps using the password
  # the database no longer has.
  when: litellm_config.changed or litellm_db_cred.changed | default(false)

- name: Wait for LiteLLM proxy to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ litellm_namespace }}"
    name: litellm
  register: litellm_deploy
  until: >-
    litellm_deploy.resources | length > 0 and
    (litellm_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 20
  delay: 15

# --- Reusable Credential ---

- name: Get LiteLLM route host
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ litellm_namespace }}"
    name: litellm
  register: litellm_route

- name: Set LiteLLM URL
  ansible.builtin.set_fact:
    litellm_url: "https://{{ litellm_route.resources[0].spec.host }}"

- name: Wait for LiteLLM API to be responsive
  ansible.builtin.uri:
    url: "{{ litellm_url }}/health/liveliness"
    method: GET
    validate_certs: false
    status_code: 200
  register: litellm_health
  until: litellm_health.status == 200
  retries: 20
  delay: 15

- name: Check if Azure reusable credential exists
  ansible.builtin.uri:
    url: "{{ litellm_url }}/credentials"
    method: GET
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    validate_certs: false
    status_code: 200
  register: litellm_creds

- name: Create Azure reusable credential
  ansible.builtin.uri:
    url: "{{ litellm_url }}/credentials"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
      Content-Type: application/json
    body_format: json
    body:
      credential_name: "{{ litellm_azure_credential_name }}"
      credential_values:
        api_base: "{{ litellm_azure_endpoint }}"
        client_id: "{{ azure_secret.resources[0].data.client_id | b64decode }}"
        tenant_id: "{{ azure_secret.resources[0].data.tenant_id | b64decode }}"
        client_secret: "{{ azure_secret.resources[0].data.client_secret | b64decode }}"
        base_model: azure/gpt-4
        api_version: "{{ litellm_azure_api_version }}"
      credential_info:
        custom_llm_provider: Azure
    validate_certs: false
    status_code: [200, 201]
  when: >-
    litellm_creds.json.credentials |
    selectattr('credential_name', 'equalto', litellm_azure_credential_name) |
    list | length == 0

# --- Admin User ---

- name: Check if LiteLLM admin user exists
  ansible.builtin.uri:
    url: "{{ litellm_url }}/user/info?user_email={{ litellm_admin_email }}"
    method: GET
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    validate_certs: false
    status_code: [200, 404]
  register: litellm_admin_check

- name: Create LiteLLM admin user
  ansible.builtin.uri:
    url: "{{ litellm_url }}/user/new"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
      Content-Type: application/json
    body_format: json
    body:
      user_email: "{{ litellm_admin_email }}"
      user_role: proxy_admin
      auto_create_key: true
    validate_certs: false
    status_code: [200, 201]
  when: litellm_admin_check.status == 404

# --- Virtual Key & AI Asset Endpoint ---

- name: Check for existing LiteLLM virtual key secret
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: v1
    kind: Secret
    namespace: "{{ model_namespace }}"
    name: endpoint-api-key-1
  register: existing_vkey_secret

- name: Generate LiteLLM virtual key
  ansible.builtin.uri:
    url: "{{ litellm_url }}/key/generate"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
      Content-Type: application/json
    body_format: json
    body:
      key_alias: openshift-ai
      models: []
    validate_certs: false
    status_code: [200, 201]
  register: litellm_vkey
  when: existing_vkey_secret.resources | length == 0

- name: Store LiteLLM virtual key in model namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: endpoint-api-key-1
        namespace: "{{ model_namespace }}"
      type: Opaque
      stringData:
        api_key: "{{ litellm_vkey.json.key }}"
  when: existing_vkey_secret.resources | length == 0

- name: Create AI Asset Endpoint for LiteLLM models
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gen-ai-aa-custom-model-endpoints
        namespace: "{{ model_namespace }}"
      data:
        config.yaml: |
          providers:
            inference:
            - provider_id: endpoint-1
              provider_type: remote::openai
              config:
                base_url: http://litellm.{{ litellm_namespace }}.svc.cluster.local:4000/v1
                allowed_models:
                - {{ litellm_azure_model_name }}
                custom_gen_ai:
                  api_key:
                    secretRef:
                      name: endpoint-api-key-1
                      key: api_key
          registered_resources:
            models:
            - provider_id: endpoint-1
              model_id: {{ litellm_azure_model_name }}
              model_type: llm
              metadata:
                display_name: {{ litellm_azure_model_name }}

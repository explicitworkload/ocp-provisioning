---
- name: Get cluster ingress domain
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: cluster_ingress

- name: Set cluster apps domain
  ansible.builtin.set_fact:
    ocp_apps_domain: "{{ cluster_ingress.resources[0].spec.domain }}"

# --- Namespace ---

- name: Create LiteLLM namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ litellm_namespace }}"

# --- Generate credentials (idempotent) ---

- name: Check for existing LiteLLM proxy secret
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ litellm_namespace }}"
    name: litellm-proxy-credentials
  register: existing_proxy_secret

- name: Generate random credentials
  ansible.builtin.set_fact:
    litellm_master_key: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=10') }}"
    litellm_ui_password: "{{ litellm_ui_password }}"
  when: existing_proxy_secret.resources | length == 0

- name: Reuse existing credentials
  ansible.builtin.set_fact:
    litellm_master_key: "{{ existing_proxy_secret.resources[0].data.LITELLM_MASTER_KEY | b64decode }}"
    litellm_ui_password: "{{ existing_proxy_secret.resources[0].data.UI_PASSWORD | b64decode }}"
  when: existing_proxy_secret.resources | length > 0

# Clusters built before the password policy was accounted for hold a
# ten-character alphanumeric here. LiteLLM rejects it, so the database user
# never gets a password - and with disable_env_credential_login on, that is
# an unreachable UI. Replaced rather than worked around; the new one is
# printed by the summary role like every other generated credential.
- name: Replace a stored UI password that LiteLLM would reject
  ansible.builtin.set_fact:
    litellm_ui_password: >-
      {{ lookup('password', '/dev/null chars=ascii_lowercase length=6')
         ~ lookup('password', '/dev/null chars=ascii_uppercase length=5')
         ~ lookup('password', '/dev/null chars=digits length=4') ~ '-' }}
  when:
    - existing_proxy_secret.resources | length > 0
    - >-
      litellm_ui_password | length < 12
      or not (litellm_ui_password is search('[a-z]'))
      or not (litellm_ui_password is search('[A-Z]'))
      or not (litellm_ui_password is search('[0-9]'))
      or not (litellm_ui_password is search('[^A-Za-z0-9]'))

- name: Store LiteLLM proxy credentials
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-proxy-credentials
        namespace: "{{ litellm_namespace }}"
      type: Opaque
      stringData:
        LITELLM_MASTER_KEY: "{{ litellm_master_key }}"
        UI_PASSWORD: "{{ litellm_ui_password }}"

# --- PostgreSQL ---

- name: Create LiteLLM database PVC
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: litellm-db
        namespace: "{{ litellm_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ litellm_db_storage }}"

# --- Database password resolution and in-place rotation --------------------
# litellm_db_password used to be a literal committed to this public repo. The
# database cannot simply be recreated with a new one: LiteLLM_VerificationToken
# holds the virtual keys the dashboard and Dev Spaces workspaces authenticate
# with, and LiteLLM_CredentialsTable holds the reusable Azure credential.
# Dropping the volume would invalidate all of it. So re-password the running
# database instead and keep its contents.

- name: Look for the existing LiteLLM database credentials
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    kind: Secret
    namespace: "{{ litellm_namespace }}"
    name: litellm-db-credentials
  register: litellm_db_secret
  no_log: true

- name: Read the password currently in the Secret
  ansible.builtin.set_fact:
    litellm_db_current: >-
      {{ (litellm_db_secret.resources | first).data.POSTGRES_PASSWORD | b64decode
         if litellm_db_secret.resources | default([]) | length > 0 else '' }}
  no_log: true

# Precedence: an explicit value, else whatever is already deployed, else a
# fresh one. The legacy literal is deliberately NOT reused - matching it is
# what triggers rotation. Alphanumeric because the value goes straight into a
# postgresql:// DSN, where characters needing percent-encoding become a silent
# connection failure.
- name: Resolve the LiteLLM database password
  ansible.builtin.set_fact:
    litellm_db_password_effective: >-
      {{ litellm_db_password if litellm_db_password | default('') | length > 0
         else (litellm_db_current
               if (litellm_db_current | length > 0
                   and litellm_db_current != litellm_db_legacy_password)
               else lookup('password', '/dev/null length=24 chars=ascii_letters,digits')) }}
    litellm_db_rotate: "{{ litellm_db_current == litellm_db_legacy_password }}"
  no_log: true

- name: Report the credential rotation
  ansible.builtin.debug:
    msg: >-
      The LiteLLM database is still using the password that was committed to
      this repo. Re-passwording it in place and keeping its contents; LiteLLM
      will be restarted to pick up the new DSN.
  when: litellm_db_rotate | bool

- name: Find the running LiteLLM database pod
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Pod
    namespace: "{{ litellm_namespace }}"
    label_selectors:
      - app=litellm-db
    field_selectors:
      - status.phase=Running
  register: litellm_db_pod
  when: litellm_db_rotate | bool

# ALTER USER before the Secret is rewritten, not after. The postgres image
# takes its password from the Secret at pod start, so if the Secret changed
# first and the pod restarted in the gap, the container would come up
# expecting a password the database does not have and fail its readiness
# probe. Doing it this way the two only ever disagree while this task runs.
- name: Re-password the LiteLLM database in place
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -eo pipefail
      oc {{ ocp_context_arg }} -n {{ litellm_namespace }} \
        exec {{ litellm_db_pod.resources[0].metadata.name | quote }} -- \
        psql -U postgres -d {{ litellm_db_name | quote }} \
        -c "ALTER USER {{ litellm_db_user }} WITH PASSWORD '{{ litellm_db_password_effective }}'" </dev/null
  when:
    - litellm_db_rotate | bool
    - litellm_db_pod.resources | default([]) | length > 0
  no_log: true
  changed_when: true

- name: Create LiteLLM database credentials secret
  register: litellm_db_cred
  no_log: true
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-db-credentials
        namespace: "{{ litellm_namespace }}"
      type: Opaque
      stringData:
        POSTGRES_USER: "{{ litellm_db_user }}"
        POSTGRES_PASSWORD: "{{ litellm_db_password_effective }}"
        POSTGRES_DB: "{{ litellm_db_name }}"
        DATABASE_URL: "postgresql://{{ litellm_db_user }}:{{ litellm_db_password_effective }}@litellm-db:5432/{{ litellm_db_name }}"

- name: Deploy LiteLLM PostgreSQL
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: litellm-db
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm-db
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: litellm-db
        strategy:
          type: Recreate
        template:
          metadata:
            labels:
              app: litellm-db
          spec:
            containers:
              - name: postgres
                image: "{{ litellm_db_image }}"
                ports:
                  - containerPort: 5432
                env:
                  - name: POSTGRESQL_USER
                    valueFrom:
                      secretKeyRef:
                        name: litellm-db-credentials
                        key: POSTGRES_USER
                  - name: POSTGRESQL_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: litellm-db-credentials
                        key: POSTGRES_PASSWORD
                  - name: POSTGRESQL_DATABASE
                    valueFrom:
                      secretKeyRef:
                        name: litellm-db-credentials
                        key: POSTGRES_DB
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/pgsql/data
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: litellm-db

- name: Create LiteLLM database Service
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: litellm-db
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm-db
      spec:
        selector:
          app: litellm-db
        ports:
          - port: 5432
            targetPort: 5432

- name: Wait for LiteLLM database to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ litellm_namespace }}"
    name: litellm-db
  register: litellm_db_deploy
  until: >-
    litellm_db_deploy.resources | length > 0 and
    (litellm_db_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 20
  delay: 15

# --- Secrets ---

- name: Fetch Qwen3 SA token
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ model_namespace }}"
    name: "{{ model_name }}-sa-token"
  register: qwen_token_secret

# One declaration per endpoint. litellm_extra_models is the list; everything
# in it is registered as a model here, and published to RHOAI's Gen AI
# playground as an AI asset endpoint unless the entry opts out. There is no
# second list to keep in step - an endpoint has one base_url, one key and one
# set of models wherever it is being consumed from.
#
# rhoai_extra_ai_endpoints is the old name for the same thing, accepted so a
# run-time vars file written against it keeps working. Undocumented, and
# merged by name, so declaring an endpoint in both is harmless.
- name: Gather the declared extra endpoints
  ansible.builtin.set_fact:
    litellm_all_extras: >-
      {{ (litellm_extra_models + rhoai_extra_ai_endpoints)
         | unique(attribute='name') | list }}

# Checked before anything uses them. These are hand-written in a vars file
# outside the repo, and a missing field surfaced a long way from the cause:
# an entry with no models list reached subelements() in models.yml and failed
# with "could not find 'models' key in iterated item", by which point the
# namespace, the Secret and half the role had already been applied.
#
# Asserted over names rather than looped over the entries themselves. A
# failing loop prints its item, and the item holds the endpoint's api_key -
# so the helpful version of this check was the one that printed a credential
# to the console and into whatever captured the run's output.
- name: Check that every extra endpoint has a name
  ansible.builtin.assert:
    that: litellm_all_extras | selectattr('name', 'defined') | list | length
          == litellm_all_extras | length
    fail_msg: >-
      An entry in litellm_extra_models has no name. name is what identifies
      the endpoint, names its LiteLLM credential and labels it in the run;
      see group_vars/all.yml.
    quiet: true

- name: Check that every extra endpoint is fully declared
  ansible.builtin.assert:
    that: incomplete | length == 0
    fail_msg: >-
      Incomplete entries in litellm_extra_models: {{ incomplete | join(', ') }}.
      Each needs base_url and a non-empty models list alongside its name;
      see group_vars/all.yml.
    quiet: true
  vars:
    complete: >-
      {{ litellm_all_extras
         | selectattr('base_url', 'defined')
         | rejectattr('base_url', 'equalto', '')
         | selectattr('models', 'defined')
         | rejectattr('models', 'equalto', [])
         | map(attribute='name') | list }}
    incomplete: >-
      {{ litellm_all_extras | map(attribute='name') | difference(complete) }}

# Endpoints with no key are dropped rather than registered with an empty
# one: LiteLLM would accept the model and every call to it would 401.
- name: Select the usable extra endpoints
  ansible.builtin.set_fact:
    litellm_usable_extras: >-
      {{ litellm_all_extras | selectattr('api_key', 'defined')
         | rejectattr('api_key', 'equalto', '') | list }}

- name: Report extra endpoints skipped for want of a key
  ansible.builtin.debug:
    msg: >-
      Extra endpoint "{{ item.name }}" has no api_key and is being skipped;
      its models will not be served, nor published to the playground.
      Supply one at run time.
  loop: >-
    {{ litellm_all_extras
       | rejectattr('name', 'in', litellm_usable_extras | map(attribute='name') | list)
       | list }}
  loop_control:
    label: "{{ item.name }}"

- name: Create LiteLLM API key secret
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-secrets
        namespace: "{{ litellm_namespace }}"
      type: Opaque
      # Only the in-cluster model's token. An extra endpoint's key is not
      # here: it is held by LiteLLM itself, as a reusable credential in its
      # database, so it can be rotated from the LiteLLM UI without an
      # Ansible run - and so a run does not quietly put it back.
      stringData:
        QWEN_API_KEY: "{{ qwen_token_secret.resources[0].data.token | b64decode }}"

# Dropping EXTRA_KEY_* from the task above does not remove it from the
# cluster: apply records what was sent, which is stringData, while the live
# object stores data, so the three-way merge has nothing to prune against and
# the old key sits there indefinitely. It is dead weight at best and a stale
# credential at worst - the whole point of moving these into LiteLLM was that
# they stop living in an OpenShift Secret. A JSON merge patch with null
# removes a key outright.
- name: Read back the LiteLLM secret to find stale endpoint keys
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ litellm_namespace }}"
    name: litellm-secrets
  register: litellm_secret_now
  no_log: true

- name: Remove endpoint keys left in the LiteLLM secret
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: patched
    api_version: v1
    kind: Secret
    namespace: "{{ litellm_namespace }}"
    name: litellm-secrets
    definition:
      data: "{{ dict(stale | zip_longest([], fillvalue=none)) }}"
  vars:
    stale: >-
      {{ (litellm_secret_now.resources[0].data | default({}) | list)
         | select('match', '^EXTRA_KEY_') | list }}
  when: >-
    (litellm_secret_now.resources[0].data | default({}) | list)
    | select('match', '^EXTRA_KEY_') | list | length > 0

- name: Fetch Azure credentials from openshift-lightspeed
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: openshift-lightspeed
    name: azure-api-keys
  register: azure_secret

# azure-api-keys comes from the Lightspeed Operator, via the OLSConfig that
# configures its Azure OpenAI provider - so on a cluster running Lightspeed it
# is simply there, which is why this has worked every time so far.
#
# This playbook does not install that operator though: roles/operators
# subscribes fourteen operators and lightspeed-operator is not among them, so
# a cluster built from this repo alone has no openshift-lightspeed namespace
# at all. There k8s_info returns an empty resources list rather than failing,
# and the Azure tasks below walked straight into resources[0] and aborted the
# role with "list object has no element 0" - taking the Dev Spaces, dashboard
# and OpenRAG roles that run after it down too, none of which need Azure.
#
# So this gates Azure on Lightspeed being present, instead of assuming it.
# Checking the keys and not just the Secret, because a half-populated Secret
# fails later and further away, inside the credential POST.
- name: Record whether Azure credentials are available
  ansible.builtin.set_fact:
    litellm_azure_available: >-
      {{ (azure_secret.resources | default([]) | length > 0)
         and (['client_id', 'tenant_id', 'client_secret']
              | difference(azure_secret.resources[0].data | default({}) | list)
              | length == 0) }}

- name: Report the Azure model as disabled
  ansible.builtin.debug:
    msg: >-
      Secret azure-api-keys not found (or incomplete) in openshift-lightspeed,
      so {{ litellm_azure_model_name }} is being left out of the LiteLLM model
      list and its reusable credential is not created. {{ model_name }} is
      unaffected and still reaches the Gen AI playground. This usually means
      the Lightspeed Operator is not installed or its OLSConfig has not
      reconciled yet - install it and re-run to pick the Azure model up.
  when: not (litellm_azure_available | bool)

# --- LiteLLM Proxy ---

- name: Create LiteLLM config
  register: litellm_config
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: litellm-config
        namespace: "{{ litellm_namespace }}"
      data:
        config.yaml: "{{ lookup('template', 'litellm-config.yaml.j2') }}"

- name: Deploy LiteLLM proxy
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: litellm
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: litellm
        template:
          metadata:
            labels:
              app: litellm
          spec:
            containers:
              - name: litellm
                image: "{{ litellm_image }}"
                args:
                  - --config
                  - /etc/litellm/config.yaml
                  - --port
                  - "4000"
                ports:
                  - containerPort: 4000
                    name: http
                # envFrom as well as the explicit entries below: extra
                # endpoints add keys to this Secret at run time, and naming
                # each one here would mean editing the Deployment to add a
                # model.
                envFrom:
                  - secretRef:
                      name: litellm-secrets
                env:
                  - name: QWEN_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-secrets
                        key: QWEN_API_KEY
                  - name: LITELLM_MASTER_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-proxy-credentials
                        key: LITELLM_MASTER_KEY
                  - name: UI_USERNAME
                    value: "{{ litellm_ui_username }}"
                  - name: UI_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: litellm-proxy-credentials
                        key: UI_PASSWORD
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: litellm-db-credentials
                        key: DATABASE_URL
                volumeMounts:
                  - name: config
                    mountPath: /etc/litellm
                    readOnly: true
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi
            volumes:
              - name: config
                configMap:
                  name: litellm-config

- name: Create LiteLLM Service
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: litellm
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm
      spec:
        selector:
          app: litellm
        ports:
          - port: 4000
            targetPort: 4000
            name: http

- name: Expose LiteLLM via Route
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: litellm
        namespace: "{{ litellm_namespace }}"
      spec:
        to:
          kind: Service
          name: litellm
        port:
          targetPort: http
        tls:
          termination: edge

# config.yaml is a mounted ConfigMap read once at startup, and the Deployment
# spec does not change when it does - so adding or editing a model silently
# had no effect until the pod was bounced by hand. Guarded on the ConfigMap
# actually changing so repeat runs do not restart the proxy.
- name: Restart LiteLLM to pick up config changes
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ litellm_namespace }}"
    label_selectors:
      - app=litellm
  # Also on a credential change: DATABASE_URL reaches the proxy as an env var
  # from litellm-db-credentials, and Kubernetes does not refresh env in a
  # running container - after a rotation the old pod keeps using the password
  # the database no longer has.
  when: litellm_config.changed or litellm_db_cred.changed | default(false)

- name: Wait for LiteLLM proxy to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ litellm_namespace }}"
    name: litellm
  register: litellm_deploy
  until: >-
    litellm_deploy.resources | length > 0 and
    (litellm_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 20
  delay: 15

# --- Reusable Credential ---

- name: Get LiteLLM route host
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ litellm_namespace }}"
    name: litellm
  register: litellm_route

- name: Set LiteLLM URL
  ansible.builtin.set_fact:
    litellm_url: "https://{{ litellm_route.resources[0].spec.host }}"

- name: Wait for LiteLLM API to be responsive
  ansible.builtin.uri:
    url: "{{ litellm_url }}/health/liveliness"
    method: GET
    validate_certs: false
    status_code: 200
  register: litellm_health
  until: litellm_health.status == 200
  retries: 20
  delay: 15

- name: Check if Azure reusable credential exists
  ansible.builtin.uri:
    url: "{{ litellm_url }}/credentials"
    method: GET
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    validate_certs: false
    status_code: 200
  register: litellm_creds

- name: Create Azure reusable credential
  ansible.builtin.uri:
    url: "{{ litellm_url }}/credentials"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
      Content-Type: application/json
    body_format: json
    body:
      credential_name: "{{ litellm_azure_credential_name }}"
      credential_values:
        api_base: "{{ litellm_azure_endpoint }}"
        client_id: "{{ azure_secret.resources[0].data.client_id | b64decode }}"
        tenant_id: "{{ azure_secret.resources[0].data.tenant_id | b64decode }}"
        client_secret: "{{ azure_secret.resources[0].data.client_secret | b64decode }}"
        base_model: azure/gpt-4
        api_version: "{{ litellm_azure_api_version }}"
      credential_info:
        custom_llm_provider: Azure
    validate_certs: false
    status_code: [200, 201]
  when: >-
    litellm_azure_available | bool and
    litellm_creds.json.credentials |
    selectattr('credential_name', 'equalto', litellm_azure_credential_name) |
    list | length == 0

# Stored by LiteLLM, in its database, encrypted with the master key - not in
# an OpenShift Secret. That is what makes the key editable from the LiteLLM
# UI: a credential defined in config.yaml is read-only there, shown as
# "Defined in config", because the ConfigMap it comes from is mounted
# read-only and a run would overwrite an edit anyway.
#
# Created only when absent, so a key rotated through the UI survives every
# later run. api_key in litellm_extra_models is therefore a seed, used on the
# first run and ignored after; to rotate from Ansible instead, delete the
# credential first.
- name: Create a reusable credential for each extra endpoint
  ansible.builtin.uri:
    url: "{{ litellm_url }}/credentials"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
      Content-Type: application/json
    body_format: json
    body:
      credential_name: "{{ item.credential_name | default(item.name) }}"
      credential_values:
        api_base: "{{ item.base_url }}"
        api_key: "{{ item.api_key }}"
      credential_info:
        custom_llm_provider: "{{ item.provider | default('openai') }}"
        description: "{{ item.models | length }} model(s) served by {{ item.name }}"
    validate_certs: false
    status_code: [200, 201]
  loop: "{{ litellm_usable_extras }}"
  loop_control:
    label: "{{ item.credential_name | default(item.name) }}"
  when: >-
    litellm_creds.json.credentials
    | selectattr('credential_name', 'equalto', item.credential_name | default(item.name))
    | list | length == 0
  register: litellm_extra_creds
  # uri does not set changed by itself, so litellm_extra_creds.changed was
  # always false and the restart below - the thing that actually binds the
  # credentials to the config-loaded models - never ran. The task only
  # executes when the credential was missing, so a success here is a change.
  changed_when: true
  no_log: true

# No restart here. An earlier revision needed one: the models were declared
# in config.yaml and bound their credential when the proxy loaded the file,
# so a credential created afterwards was invisible to them. Models are
# registered through the API now, after the credentials exist, and bind at
# registration.

# --- Admin User ---

# A database-backed proxy_admin, so there is an account to attach a password
# to from the UI. The password is NOT set from here: LiteLLM answers
#   password cannot be set via /user/new
# and a password set through /user/update comes back with
# password_reset_required: true, which /login then rejects - there is no API
# on this build to clear that flag. See litellm_disable_env_credential_login.
#
# Identified by user_id, which is what the UI login form takes. The old check
# asked /user/info?user_email=..., which answers 200 with the built-in
# default_user_id whatever email you pass, so it always concluded the admin
# existed and never created one.
- name: Check if the LiteLLM admin user exists
  ansible.builtin.uri:
    url: "{{ litellm_url }}/user/info?user_id={{ litellm_ui_username }}"
    method: GET
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    validate_certs: false
    status_code: [200, 400, 404]
  register: litellm_admin_check

- name: Create the LiteLLM admin user
  ansible.builtin.uri:
    url: "{{ litellm_url }}/user/new"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
      Content-Type: application/json
    body_format: json
    body:
      user_id: "{{ litellm_ui_username }}"
      user_email: "{{ litellm_admin_email }}"
      user_role: proxy_admin
      auto_create_key: true
    validate_certs: false
    status_code: [200, 201]
  when: litellm_admin_check.status != 200

# --- Virtual Key & AI Asset Endpoint ---

- name: Check for existing LiteLLM virtual key secret
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ model_namespace }}"
    name: endpoint-api-key-1
  register: existing_vkey_secret

# Presence of the Secret is not proof the key still works. Revoke it in the
# LiteLLM UI, or lose the database PVC, and the stored string becomes a dead
# token that every later run faithfully republishes - the Gen AI playground
# then 401s on every request, with no run ever reporting a problem.
- name: Check that the stored virtual key is still valid
  ansible.builtin.uri:
    url: "{{ litellm_url }}/key/info"
    method: GET
    headers:
      Authorization: "Bearer {{ existing_vkey_secret.resources[0].data.api_key | b64decode }}"
    validate_certs: false
    status_code: [200, 401, 400]
  register: litellm_vkey_probe
  failed_when: false
  when: existing_vkey_secret.resources | length > 0
  no_log: true

- name: Note that the stored virtual key has to be replaced
  ansible.builtin.set_fact:
    litellm_vkey_stale: >-
      {{ (existing_vkey_secret.resources | length == 0)
         or (litellm_vkey_probe.status | default(401)) != 200 }}

- name: Report that the virtual key was revoked
  ansible.builtin.debug:
    msg: >-
      The virtual key in endpoint-api-key-1 is no longer valid - revoked, or
      lost with the LiteLLM database. Generating a new one; RHOAI's AI asset
      endpoint is republished against it.
  when:
    - existing_vkey_secret.resources | length > 0
    - litellm_vkey_stale | bool

- name: Generate LiteLLM virtual key
  ansible.builtin.uri:
    url: "{{ litellm_url }}/key/generate"
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
      Content-Type: application/json
    body_format: json
    body:
      key_alias: openshift-ai
      models: []
    validate_certs: false
    status_code: [200, 201]
  register: litellm_vkey
  when: litellm_vkey_stale | bool

- name: Store LiteLLM virtual key in model namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: endpoint-api-key-1
        namespace: "{{ model_namespace }}"
      type: Opaque
      stringData:
        api_key: "{{ litellm_vkey.json.key }}"
  when: litellm_vkey_stale | bool

# No ai-endpoints tag. These tasks need litellm_url, litellm_master_key,
# litellm_all_extras, existing_vkey_secret and litellm_vkey_stale, every one
# of which is set by an untagged task earlier in this role - so --tags
# ai-endpoints reached them with nothing defined and died on the first
# reference. Publishing is part of deploying LiteLLM; --tags litellm runs it.
# Before the AI asset endpoint is published, which asks LiteLLM what it
# serves - and before anything else reads the model list.
- name: Register LiteLLM's models in its database
  ansible.builtin.include_tasks:
    file: models.yml

- name: Publish LiteLLM's models as an AI asset endpoint
  ansible.builtin.include_tasks:
    file: ai_endpoints.yml
  when: litellm_publish_ai_assets | bool

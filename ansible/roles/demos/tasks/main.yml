---
# Shared scaffolding first - namespace, identity, credentials - then each
# demo behind its own flag.

- name: Create the demos namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ demos_namespace }}"
        labels:
          # Makes RHOAI treat this as a Data Science Project: without it the
          # namespace appears in the Projects list as a plain namespace with
          # no Workbenches, Pipelines or Deployments tabs offered at all.
          opendatahub.io/dashboard: "true"
        annotations:
          openshift.io/display-name: "{{ demos_display_name }}"
          openshift.io/description: "{{ demos_description }}"

- name: Create the demos service account
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: demos
        namespace: "{{ demos_namespace }}"

# admin within this namespace only. RHOAI's MLflow authorises against the
# namespace the token belongs to, and a workspace is a namespace 1:1, so
# this is what lets the jobs log runs at all.
- name: Grant the demos service account admin in its own namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: demos-admin
        namespace: "{{ demos_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: demos
          namespace: "{{ demos_namespace }}"

# --- credentials the jobs need, read from where they already live --------
- name: Read the OpenSearch admin credential
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    kind: Secret
    namespace: "{{ openrag_opensearch_namespace | default('opensearch') }}"
    name: opensearch-admin
  register: demos_os_secret
  no_log: true

- name: Read the LiteLLM master key
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    kind: Secret
    namespace: "{{ litellm_namespace | default('litellm') }}"
    name: litellm-proxy-credentials
  register: demos_litellm_secret
  no_log: true

# MLflow is the one every demo depends on - all seven log runs, traces or
# a registered model to it. Checked explicitly rather than left to fail at
# the tracking URI, where it surfaces as a connection error inside a Job
# nobody is tailing.
- name: Check that MLflow is deployed and available
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: mlflow.opendatahub.io/v1
    kind: MLflow
    name: mlflow
  register: demos_mlflow
  failed_when: false

- name: Name every missing dependency at once
  ansible.builtin.fail:
    msg: >-
      The demos cannot run without: {{ demos_missing | join(', ') }}.
      MLflow comes from the openshift_ai role (deploy_mlflow_server=true);
      OpenSearch from openrag (deploy_openrag=true); LiteLLM is always
      deployed. Set deploy_demos=false to skip the demos instead.
  vars:
    demos_missing: >-
      {{ (['MLflow'] if (demos_mlflow.resources | default([]) | length == 0
             or (demos_mlflow.resources[0].status.conditions | default([])
                 | selectattr('type', 'equalto', 'Available')
                 | selectattr('status', 'equalto', 'True') | list | length == 0))
          else [])
         + (['OpenSearch'] if demos_os_secret.resources | length == 0 else [])
         + (['LiteLLM'] if demos_litellm_secret.resources | length == 0 else []) }}
  when: demos_missing | length > 0

- name: Store the credentials the demo jobs read
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: demos-creds
        namespace: "{{ demos_namespace }}"
      type: Opaque
      stringData:
        OPENSEARCH_PASSWORD: "{{ demos_os_secret.resources[0].data.password | b64decode }}"
        LITELLM_KEY: "{{ demos_litellm_secret.resources[0].data.LITELLM_MASTER_KEY | b64decode }}"
  no_log: true

# --- the demos themselves -------------------------------------------------
- name: Deploy the retrieval A/B demo
  ansible.builtin.include_tasks: rag_eval.yml
  when: demos_rag_eval | bool

- name: Deploy the answer-quality demo
  ansible.builtin.include_tasks: rag_judge.yml
  when: demos_rag_judge | bool

- name: Deploy the prompt-versions demo
  ansible.builtin.include_tasks: prompt_versions.yml
  when: demos_prompt_versions | bool

- name: Deploy the tabular MLOps demo
  ansible.builtin.include_tasks: tabular.yml
  when: demos_tabular | bool

- name: Deploy the model-serving demo
  ansible.builtin.include_tasks: model_serving.yml
  when: demos_model_serving | bool

- name: Deploy the workbenches
  ansible.builtin.include_tasks: workbench.yml
  when: demos_workbenches | bool

- name: Deploy the AutoRAG prerequisites
  ansible.builtin.include_tasks: autorag.yml
  when: demos_autorag | bool

# Every switch is cast with | bool, exactly as the when: above cast it.
# Testing the raw value instead reports the opposite of what ran: -e
# demos_autorag=false arrives as the STRING "false", which Jinja considers
# truthy, so the task was skipped and then listed as deployed.
- name: Report what was deployed
  ansible.builtin.debug:
    msg: >-
      Demos deployed to {{ demos_namespace }}:
      {{ ['retrieval A/B' if demos_rag_eval | bool else '',
          'answer quality' if demos_rag_judge | bool else '',
          'prompt versions' if demos_prompt_versions | bool else '',
          'tabular' if demos_tabular | bool else '',
          'model serving' if demos_model_serving | bool else '',
          'workbenches' if demos_workbenches | bool else '',
          'autorag' if demos_autorag | bool else '']
         | reject('equalto', '') | join(', ') }}.
      {{ 'Jobs were run.' if demos_run_jobs | bool else
         'Manifests only - set demos_run_jobs=true to execute them.' }}

---
# Retrieval A/B over the corpus OpenRAG has already ingested - OpenSearch
# BM25, OpenSearch kNN, Milvus kNN - swept across four top_k values and
# logged to RHOAI's MLflow as twelve child runs under one parent.
#
# It runs in-cluster rather than from a laptop so that every endpoint is
# reached by cluster DNS and MLflow gets a real ServiceAccount token.

# Before the Job, not after. The pod reads the script from this mount when
# it starts, so an edited script only reaches a run created after the
# ConfigMap has been updated.
- name: Ship the retrieval A/B script
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rag-eval-script
        namespace: "{{ demos_namespace }}"
      data:
        rag_eval.py: "{{ lookup('file', demos_src + '/rag-eval/rag_eval.py') }}"

- name: Run the retrieval A/B
  when: demos_run_jobs | bool
  block:
    # A Job of the same name cannot be created twice and a completed one is
    # immutable, so the previous run goes first. wait: true because the
    # create otherwise races the deletion and fails as already-exists.
    # Foreground propagation takes the old pod with it rather than leaving
    # it orphaned in the namespace.
    - name: Remove the previous retrieval A/B job
      kubernetes.core.k8s:
        context: "{{ ocp_context or omit }}"
        state: absent
        api_version: batch/v1
        kind: Job
        namespace: "{{ demos_namespace }}"
        name: rag-eval
        wait: true
        delete_options:
          propagationPolicy: Foreground

    - name: Create the retrieval A/B job
      kubernetes.core.k8s:
        context: "{{ ocp_context or omit }}"
        state: present
        apply: true
        definition:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: rag-eval
            namespace: "{{ demos_namespace }}"
          spec:
            # No retry. The documented failure modes are all deterministic
            # configuration ones - an empty corpus, a model that cannot be
            # reached - so a second attempt reproduces them, and any attempt
            # that got as far as MLflow leaves another retriever-sweep run
            # beside the first.
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                serviceAccountName: demos
                containers:
                  - name: eval
                    image: "{{ demos_job_image }}"
                    command: ["/bin/bash", "-lc"]
                    args:
                      - |
                        set -euo pipefail
                        # --target rather than a venv or --user: restricted-v2
                        # gives this pod an arbitrary UID whose HOME is not
                        # writable, so --user has nowhere to install to.
                        pip install --quiet --no-cache-dir --target=/tmp/pylibs \
                          mlflow-skinny pymilvus requests numpy
                        export PYTHONPATH=/tmp/pylibs
                        # MLflow authenticates with a Kubernetes bearer token:
                        # the server runs with --app-name=kubernetes-auth, and
                        # authorisation is then checked against the namespace
                        # the token belongs to.
                        export MLFLOW_TRACKING_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                        python /app/rag_eval.py
                    env:
                      - name: OPENSEARCH_URL
                        value: "{{ demos_opensearch_url }}"
                      - name: OPENSEARCH_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: demos-creds
                            key: OPENSEARCH_PASSWORD
                      - name: LITELLM_URL
                        value: "{{ demos_litellm_url }}"
                      - name: LITELLM_KEY
                        valueFrom:
                          secretKeyRef:
                            name: demos-creds
                            key: LITELLM_KEY
                      - name: MILVUS_URI
                        value: "{{ demos_milvus_uri }}"
                      # Named rather than left to the script's own default,
                      # which is the cluster's GPU model. The question set is
                      # generated by this model, so when the GPU node goes
                      # away the whole run dies at step one - it went away
                      # twice while these demos were being written.
                      - name: CHAT_MODEL
                        value: "{{ demos_gen_model }}"
                      # Must stay the model that produced the vectors already
                      # in OpenSearch. Embed the questions with anything else
                      # and the kNN comparison is measuring two embedding
                      # spaces rather than two engines.
                      - name: EMBED_MODEL
                        value: "{{ demos_embed_model }}"
                      - name: MLFLOW_TRACKING_URI
                        value: "{{ demos_mlflow_uri }}"
                      # The server presents a service-serving certificate and
                      # the pod's trust bundle does not carry that CA.
                      - name: MLFLOW_TRACKING_INSECURE_TLS
                        value: "true"
                      # A workspace is a namespace, 1:1. Omit it and every
                      # call returns 400 INVALID_PARAMETER_VALUE "Workspace
                      # context is required"; name a different one and the
                      # runs land where the walkthrough's ?workspace= URL
                      # does not look.
                      - name: MLFLOW_WORKSPACE
                        value: "{{ demos_namespace }}"
                      - name: MLFLOW_EXPERIMENT
                        value: openrag-retrieval-ab
                      - name: N_QUESTIONS
                        value: "40"
                      - name: TOP_KS
                        value: "1,3,5,10"
                      # Which chunks the question set is drawn from. Change it
                      # and re-run to find out whether a result is stable or
                      # an artefact of this particular sample, which is what
                      # the walkthrough's live re-run demonstrates.
                      - name: SEED
                        value: "1337"
                    volumeMounts:
                      - name: script
                        mountPath: /app
                    resources:
                      requests:
                        cpu: 200m
                        memory: 512Mi
                      limits:
                        cpu: "2"
                        memory: 2Gi
                volumes:
                  - name: script
                    configMap:
                      name: rag-eval-script

    # status.failed as well as status.succeeded: backoffLimit is 0, so a
    # failure is final and waiting out the rest of the budget for a success
    # that cannot arrive only delays the message below.
    - name: Wait for the retrieval A/B to finish
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: batch/v1
        kind: Job
        namespace: "{{ demos_namespace }}"
        name: rag-eval
      register: demos_rag_eval_job
      until: >-
        demos_rag_eval_job.resources[0].status.succeeded is defined
        or demos_rag_eval_job.resources[0].status.failed is defined
      # Measured at roughly 100 seconds: 40s installing dependencies, 37s
      # generating the question set, 15s for the sweep. The rest of the
      # budget is the image pull on a node that has not run this before,
      # and generation latency when the MaaS endpoint is busy.
      retries: 40
      delay: 10

    - name: Report a failed retrieval A/B
      ansible.builtin.fail:
        msg: >-
          The rag-eval job did not succeed.
          Logs: "oc -n {{ demos_namespace }} logs job/rag-eval".
          Two causes account for most of them, and neither looks like an
          error at first glance: an empty corpus, where the script exits
          "no chunks with vectors" because OpenRAG has ingested nothing;
          and a chat model returning empty content, where the question set
          logs as "0 usable" and the run stops at "no questions generated".
      when: demos_rag_eval_job.resources[0].status.succeeded is not defined

    - name: Report where the retrieval A/B results landed
      ansible.builtin.debug:
        msg: >-
          Retrieval A/B logged to the openrag-retrieval-ab experiment in
          MLflow workspace {{ demos_namespace }}: one retriever-sweep parent
          run and twelve children. Open the UI with
          "?workspace={{ demos_namespace }}" on the URL - the bare path lands
          in whichever workspace the UI defaults to, where the experiment
          list is empty and it looks as though nothing ran.

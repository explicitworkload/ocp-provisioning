---
# The interactive half of the demos: two Jupyter workbenches, and the
# hardware profiles that make their sizing visible in the dashboard.
#
# Everything else under demos/ is a Job - reproducible, in git, one
# command. These are the opposite, and that is the point: the surface
# RHOAI is built around, under "Develop & train". There is no Job here,
# so demos_run_jobs does not apply. A Notebook starts as soon as it is
# created; stopping one is a dashboard action, not a role one.

# --- which GPU this cluster actually has ----------------------------------
# Derived from gpu_machinesets rather than hardcoded, and the difference is
# not cosmetic. These used to pin node.kubernetes.io/instance-type to
# g6e.4xlarge, so of the ten GPU instances run.sh offers, NINE left the GPU
# workbench Pending for ever - including every g7e, whose RTX PRO 6000
# Blackwell is a strictly better card for this than the L40S the selector
# insisted on. It went unnoticed because g6e.4xlarge is the sample default.
#
# The pin itself was right to exist: the stock gpu-profile selects only
# nvidia.com/gpu.present, so the scheduler could drop a fine-tune on a 15
# GiB Turing T4. The mistake was encoding "a card I am happy with" as one
# model number instead of as the property that matters. This pins whatever
# the run actually provisions, and says so when that card is a poor one
# rather than refusing to schedule on it.
#
# gpu_instance_specs comes from roles/gpu_worker/defaults; role defaults are
# visible to later roles in the same play - verified, not assumed. Defaulted
# anyway so --tags demos on its own cannot fail here.
# Two corrections to the first version of this, both of which only show
# up on a cluster with more than one GPU type:
#
#   gpu_machinesets is what was ASKED for. After a capacity fallback the
#   cluster has a different type, and pinning to the requested one leaves
#   the workbench Pending against a node that was never created.
#   gpu_types_effective is what was built.
#
#   "first non-zero entry" is a position in a list, and position is not
#   something the user meant to say. gpu_workbench_instance_type ranks by
#   capacity and hands the workbench the SMALLEST card, leaving the
#   biggest for the served model, which is the one that can need four of
#   them. With a single GPU type the two are the same type and this is
#   exactly the previous behaviour.
- name: Work out which GPU instance the workbench runs on
  ansible.builtin.set_fact:
    demos_gpu_type: "{{ gpu_workbench_instance_type | default('') }}"

- name: Look up what that instance carries
  ansible.builtin.set_fact:
    demos_gpu_spec: "{{ (gpu_instance_specs | default({})).get(demos_gpu_type | trim, {}) }}"
    demos_gpu_present: "{{ (demos_gpu_type | trim | length) > 0 }}"

# Turing has no bf16 and no Flash Attention 2, and most fine-tuning recipes
# assume both. Said rather than enforced: a T4 is still a GPU, and refusing
# to schedule on one is the behaviour this change exists to undo.
- name: Warn when the chosen card cannot do bf16
  ansible.builtin.debug:
    msg: >-
      {{ demos_gpu_type | trim }} carries a
      {{ demos_gpu_spec.gpu | default('?') }}, which is Turing: fp16 only,
      no Flash Attention 2. The GPU workbench runs on it, but the LoRA
      fine-tune notebook assumes bf16 and will need editing. The g5, g6,
      g6e and g7e types all avoid this.
  when:
    - demos_gpu_present | bool
    - (demos_gpu_spec.gpu | default('')) == 'T4'

- name: Say why the GPU workbench is being skipped
  ansible.builtin.debug:
    msg: >-
      No gpu_machinesets entry has replicas above 0, so this run provisions
      no GPU node. The GPU hardware profile and the GPU workbench are
      skipped - creating them would leave a Pod Pending for ever against a
      node that does not exist. The CPU workbench is unaffected.
  when: not (demos_gpu_present | bool)

# --- hardware profiles ----------------------------------------------------
# What the dashboard offers in the "Hardware profile" dropdown when
# someone creates a workbench or a deployment in this namespace. Without
# one the column reads "No hardware profile", and the user types CPU and
# memory by hand with nothing stopping them asking for a card the cluster
# does not have.
#
# infrastructure.opendatahub.io/v1, not the v1alpha1 that most examples
# still show: that version is deprecated, and the profiles the
# openshift_ai and model_serving roles create are already on v1.

- name: Offer a CPU-only hardware profile
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: infrastructure.opendatahub.io/v1
      kind: HardwareProfile
      metadata:
        name: cpu-only
        namespace: "{{ demos_namespace }}"
        annotations:
          opendatahub.io/display-name: "CPU only"
          opendatahub.io/description: >-
            No accelerator. For exploring results, querying the corpus,
            and the tabular demo.
          opendatahub.io/disabled: "false"
          opendatahub.io/dashboard-feature-visibility: "[]"
      spec:
        identifiers:
          - identifier: cpu
            displayName: CPU
            resourceType: CPU
            minCount: 1
            maxCount: "8"
            defaultCount: "1"
          - identifier: memory
            displayName: Memory
            resourceType: Memory
            minCount: "1Gi"
            maxCount: "16Gi"
            defaultCount: "4Gi"

# The two GPU profiles pin the INSTANCE TYPE, which the stock gpu-profile
# in redhat-ods-applications does not: it selects only
# nvidia.com/gpu.present: "true", so it places you on a 15 GiB T4 or a
# 46 GiB L40S depending on what the scheduler feels like. That difference
# decides whether a fine-tune runs in bf16 or not at all, so it should not
# be left to chance.
#
# The tolerations below are inert here - the gpu_worker role creates GPU
# MachineSets with no taints at all. They are kept because they cost
# nothing and matter on any cluster where the nodes ARE tainted, which is
# the more usual arrangement.
# One GPU profile, named for the card the cluster actually has. Two fixed
# profiles (nvidia-t4, nvidia-l40s) used to be offered here, which on a g7e
# cluster meant two entries in the dropdown both pointing at nodes nobody
# had provisioned. The resource name stays nvidia-gpu so the workbench
# below can reference it without knowing which card it got.
- name: Offer a GPU hardware profile pinned to the provisioned instance
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: infrastructure.opendatahub.io/v1
      kind: HardwareProfile
      metadata:
        name: nvidia-gpu
        namespace: "{{ demos_namespace }}"
        annotations:
          opendatahub.io/display-name: >-
            NVIDIA {{ demos_gpu_spec.gpu | default('GPU') }}
            ({{ demos_gpu_spec.gpu_memory_gb | default('?') }} GB)
          opendatahub.io/description: >-
            {{ demos_gpu_spec.gpus | default(1) }}x
            {{ demos_gpu_spec.gpu | default('GPU') }} on
            {{ demos_gpu_type | trim }}.
          opendatahub.io/disabled: "false"
          opendatahub.io/dashboard-feature-visibility: "[]"
      spec:
        identifiers:
          - identifier: cpu
            displayName: CPU
            resourceType: CPU
            minCount: 1
            maxCount: "16"
            defaultCount: "4"
          - identifier: memory
            displayName: Memory
            resourceType: Memory
            minCount: "1Gi"
            maxCount: "120Gi"
            defaultCount: "16Gi"
          - identifier: nvidia.com/gpu
            displayName: GPU
            resourceType: Accelerator
            minCount: 1
            maxCount: "{{ demos_gpu_spec.gpus | default(1) }}"
            defaultCount: 1
        scheduling:
          type: Node
          node:
            nodeSelector:
              node.kubernetes.io/instance-type: "{{ demos_gpu_type | trim }}"
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
  when: demos_gpu_present | bool

# --- the volumes the workbenches keep their work on -----------------------
# One each, mounted at /opt/app-root/src. They survive Actions -> Stop,
# which is the point of stopping rather than deleting: the hardware goes
# back and the files stay. Their contents are nobody's source of truth.
#
# Re-applying a bound PVC is a no-op while nothing here changes; the
# storage class and access modes are immutable once bound, so altering
# either means deleting the volume and losing what is on it.
- name: Create the workbench volumes
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ item }}"
        namespace: "{{ demos_namespace }}"
        labels:
          # The dashboard lists only volumes carrying this label under the
          # project's Storage tab.
          opendatahub.io/dashboard: "true"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
        storageClassName: gp3-csi
  loop:
    - rag-eval-cpu-workbench
    - rag-eval-workbench

# --- the workbenches ------------------------------------------------------
# Two rather than one. Browsing MLflow runs, querying the corpus and
# poking at the registered model need no accelerator, and taking a card
# out of the pool to read a dataframe is a waste.
#
# Note on re-running. These two never settle: a mutating webhook rewrites
# the container env on the way in (see MLFLOW_TRACKING_URI below), so the
# object that lands is not the one applied, every run patches it again,
# and the StatefulSet behind it rolls. Measured on sandbox3508 - a second
# run reports changed on both Notebooks and nothing else. The volume and
# its contents survive, but it does restart a workbench someone may be
# sitting in - about two minutes back to Running - so use
# demos_workbenches=false on a run where that matters.

- name: Create the CPU workbench
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: kubeflow.org/v1
      kind: Notebook
      metadata:
        name: rag-eval-cpu-workbench
        namespace: "{{ demos_namespace }}"
        labels:
          # Both are needed for the dashboard to list and manage it.
          opendatahub.io/dashboard: "true"
          opendatahub.io/odh-managed: "true"
        annotations:
          openshift.io/display-name: "RAG Eval Workbench (CPU)"
          openshift.io/description: >-
            Data Science workbench for exploring the MLflow demos
            interactively
          # Names the image in the dashboard's workbench list; without
          # these the UI shows the bare image reference.
          opendatahub.io/image-display-name: "Jupyter | Data Science | CPU | Python 3.12"
          notebooks.opendatahub.io/last-image-selection: "s2i-generic-data-science-notebook:3.5"
          # Legacy, and a no-op here: no oauth-proxy sidecar is injected.
          # Authentication happens at the data-science-gateway. See the
          # note on the GPU workbench below.
          notebooks.opendatahub.io/inject-oauth: "true"
          # Without these the dashboard's Hardware profile column reads
          # "No hardware profile" and the sizing below is invisible in
          # the UI.
          opendatahub.io/hardware-profile-name: cpu-only
          opendatahub.io/hardware-profile-namespace: "{{ demos_namespace }}"
      spec:
        template:
          spec:
            # Explicitly keep this off the GPU nodes. The obvious
            # assumption - that the nvidia.com/gpu taint repels it - is
            # false on this cluster: the gpu_worker role creates the
            # MachineSets without any taint, so GPU nodes accept ordinary
            # workloads and this pod landed on a T4 box the first time. A
            # pod that requests no GPU does not consume one, but it does
            # compete for CPU and memory on the most expensive nodes here.
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/gpu
                          operator: DoesNotExist
            containers:
              - name: rag-eval-cpu-workbench
                image: registry.redhat.io/rhoai/odh-workbench-jupyter-datascience-cpu-py312-rhel9@sha256:206018cabeb3389fcfb554cb1850c82e509483a2f98bf963d82031303adaaee5
                imagePullPolicy: Always
                workingDir: /opt/app-root/src
                env:
                  # base_url has to match the path the data-science-gateway
                  # fronts the workbench on, /notebook/<ns>/<name>, or the
                  # dashboard's Open button reaches a 404.
                  - name: NOTEBOOK_ARGS
                    value: |-
                      --ServerApp.port=8888
                      --ServerApp.token=''
                      --ServerApp.password=''
                      --ServerApp.base_url=/notebook/{{ demos_namespace }}/rag-eval-cpu-workbench
                  # Pre-wired so the first cell can talk to MLflow without
                  # copying URLs out of a README. A workspace is a
                  # namespace, 1:1. Insecure TLS because MLflow serves on a
                  # service-serving certificate the image does not trust.
                  #
                  # MLFLOW_TRACKING_URI does not survive admission here,
                  # which the WALKTHROUGH does not know: the webhook that
                  # injects the six certificate-bundle variables strips
                  # this one, so it reaches neither the Notebook nor the
                  # pod and mlflow falls back to a local ./mlruns. Shown
                  # by "oc apply --dry-run=server -f
                  # demos/workbench/cpu-workbench.yaml", which returns the
                  # object without it. Kept because it records the intent
                  # and costs nothing; until the webhook stops removing
                  # it, a notebook has to call mlflow.set_tracking_uri()
                  # for itself.
                  - name: MLFLOW_TRACKING_URI
                    value: "{{ demos_mlflow_uri }}"
                  - name: MLFLOW_TRACKING_INSECURE_TLS
                    value: "true"
                  - name: MLFLOW_WORKSPACE
                    value: "{{ demos_namespace }}"
                  # The demos' other two endpoints, for the same reason.
                  - name: OPENSEARCH_URL
                    value: "{{ demos_opensearch_url }}"
                  - name: LITELLM_URL
                    value: "{{ demos_litellm_url }}"
                ports:
                  - name: notebook-port
                    containerPort: 8888
                    protocol: TCP
                resources:
                  requests:
                    cpu: "500m"
                    memory: 2Gi
                  limits:
                    cpu: "2"
                    memory: 8Gi
                volumeMounts:
                  - name: rag-eval-cpu-workbench
                    mountPath: /opt/app-root/src
                livenessProbe:
                  httpGet:
                    path: "/notebook/{{ demos_namespace }}/rag-eval-cpu-workbench/api"
                    port: notebook-port
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 10
                readinessProbe:
                  httpGet:
                    path: "/notebook/{{ demos_namespace }}/rag-eval-cpu-workbench/api"
                    port: notebook-port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  failureThreshold: 10
            volumes:
              - name: rag-eval-cpu-workbench
                persistentVolumeClaim:
                  claimName: rag-eval-cpu-workbench

# The GPU one, pinned to whichever instance type this run provisions.
# Skipped entirely when none does, rather than created and left Pending.
- name: Create the GPU workbench
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: kubeflow.org/v1
      kind: Notebook
      metadata:
        name: rag-eval-workbench
        namespace: "{{ demos_namespace }}"
        labels:
          opendatahub.io/dashboard: "true"
          opendatahub.io/odh-managed: "true"
        annotations:
          openshift.io/display-name: >-
            RAG Eval GPU Workbench ({{ demos_gpu_spec.gpu | default('GPU') }})
          openshift.io/description: >-
            PyTorch + CUDA workbench on the
            {{ demos_gpu_spec.gpu | default('GPU') }}, for the LoRA fine-tune
          opendatahub.io/image-display-name: "Jupyter | PyTorch | CUDA | Python 3.12"
          notebooks.opendatahub.io/last-image-selection: "pytorch:3.5"
          # Legacy, and a no-op on this cluster: no oauth-proxy sidecar is
          # injected (the pod runs a single container). Authentication is
          # done at the data-science-gateway, which fronts the workbench
          # on /notebook/<ns>/<name> and answers 302 to anyone
          # unauthenticated. Kept because removing it is not worth a pod
          # restart; do not rely on it for protection.
          notebooks.opendatahub.io/inject-oauth: "true"
          opendatahub.io/hardware-profile-name: nvidia-gpu
          opendatahub.io/hardware-profile-namespace: "{{ demos_namespace }}"
      spec:
        template:
          spec:
            # The instance this run provisions, not a fixed model number.
            # With no selector the scheduler may pick the worst card on a
            # mixed cluster; with a hardcoded one the Pod lands on nothing
            # at all unless that exact type is what was built.
            nodeSelector:
              node.kubernetes.io/instance-type: "{{ demos_gpu_type | trim }}"
            # Kept for portability, but inert here for the same reason as
            # on the hardware profiles above: the GPU MachineSets carry no
            # taints, so there is nothing to tolerate.
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
            containers:
              - name: rag-eval-workbench
                image: registry.redhat.io/rhoai/odh-workbench-jupyter-pytorch-cuda-py312-rhel9@sha256:f476e56ad00faaad5f2e26010f633233db2d4b299d7c5281e2f4ac46949b531b
                imagePullPolicy: Always
                workingDir: /opt/app-root/src
                env:
                  - name: NOTEBOOK_ARGS
                    value: |-
                      --ServerApp.port=8888
                      --ServerApp.token=''
                      --ServerApp.password=''
                      --ServerApp.base_url=/notebook/{{ demos_namespace }}/rag-eval-workbench
                  # Stripped by the same webhook as on the CPU workbench
                  # above, and kept for the same reason.
                  - name: MLFLOW_TRACKING_URI
                    value: "{{ demos_mlflow_uri }}"
                  - name: MLFLOW_TRACKING_INSECURE_TLS
                    value: "true"
                  - name: MLFLOW_WORKSPACE
                    value: "{{ demos_namespace }}"
                ports:
                  - name: notebook-port
                    containerPort: 8888
                    protocol: TCP
                resources:
                  requests:
                    cpu: "1"
                    memory: 8Gi
                    nvidia.com/gpu: "1"
                  limits:
                    # The card cannot be shared, so request and limit are
                    # both 1.
                    cpu: "4"
                    memory: 16Gi
                    nvidia.com/gpu: "1"
                volumeMounts:
                  - name: rag-eval-workbench
                    mountPath: /opt/app-root/src
                  # Jupyter writes to /dev/shm for dataloader workers; the
                  # default 64Mi is not enough once torch is involved.
                  - name: shm
                    mountPath: /dev/shm
                livenessProbe:
                  httpGet:
                    path: "/notebook/{{ demos_namespace }}/rag-eval-workbench/api"
                    port: notebook-port
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 10
                readinessProbe:
                  httpGet:
                    path: "/notebook/{{ demos_namespace }}/rag-eval-workbench/api"
                    port: notebook-port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  failureThreshold: 10
            volumes:
              - name: rag-eval-workbench
                persistentVolumeClaim:
                  claimName: rag-eval-workbench
              - name: shm
                emptyDir:
                  medium: Memory
                  sizeLimit: 2Gi

# Said out loud because it is the one thing this file leaves running that
# costs something, and an idle workbench looks free from the dashboard.
  when: demos_gpu_present | bool

- name: Report that the GPU workbench now holds a card
  ansible.builtin.debug:
    msg: >-
      rag-eval-workbench holds the {{ demos_gpu_spec.gpu | default('GPU') }}
      for as long as it runs, idle or not. Stop it from Projects ->
      {{ demos_namespace }} -> Workbenches -> Actions -> Stop when the
      accelerator is needed elsewhere; the volume and its contents survive.
      Set demos_workbenches=false to leave both workbenches out of the run
      entirely.
  when: demos_gpu_present | bool

# --- retiring what this role used to create -------------------------------
# 7bd8d97 replaced the fixed nvidia-t4 / nvidia-l40s pair with the single
# nvidia-gpu profile above, but only for clusters built after it. A cluster
# carried through that change keeps the old pair, so the dashboard offers
# THREE GPU profiles where this role means to offer one - and on sandbox544
# the stale nvidia-t4 pointed at a g4dn.4xlarge that cluster does not have,
# which is the unschedulable dropdown entry the rename existed to remove.
#
# Deleted rather than left, because these are this role's own objects and a
# fresh cluster never has them. It is ordered last deliberately: the
# workbench above is moved onto nvidia-gpu first, so nothing still
# references a profile by the time it goes. A profile someone created by
# hand under a different name is untouched - only the two names this role
# itself used to write.
- name: Retire the fixed GPU hardware profiles this role used to create
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: absent
    api_version: infrastructure.opendatahub.io/v1
    kind: HardwareProfile
    namespace: "{{ demos_namespace }}"
    name: "{{ item }}"
  loop: "{{ demos_retired_gpu_profiles }}"

---
- name: Create dashboard namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ dashboard_namespace }}"

- name: Create dashboard ImageStream
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: image.openshift.io/v1
      kind: ImageStream
      metadata:
        name: ops-dashboard
        namespace: "{{ dashboard_namespace }}"

- name: Create dashboard BuildConfig
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: build.openshift.io/v1
      kind: BuildConfig
      metadata:
        name: ops-dashboard
        namespace: "{{ dashboard_namespace }}"
      spec:
        source:
          type: Git
          git:
            uri: "https://github.com/explicitworkload/ocp-provisioning.git"
            ref: main
          contextDir: dashboard
        strategy:
          type: Docker
          dockerStrategy: {}
        output:
          to:
            kind: ImageStreamTag
            name: "ops-dashboard:{{ dashboard_image_tag }}"
        triggers:
          - type: ConfigChange

- name: Wait for dashboard build to complete
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: build.openshift.io/v1
    kind: Build
    namespace: "{{ dashboard_namespace }}"
    label_selectors:
      - "openshift.io/build-config.name=ops-dashboard"
  register: dashboard_builds
  until: >-
    dashboard_builds.resources | length > 0 and
    dashboard_builds.resources | selectattr('status.phase', 'defined') |
    selectattr('status.phase', 'equalto', 'Complete') | list | length > 0
  retries: 30
  delay: 30

- name: Create RBAC for dashboard to manage Istio resources
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: ops-dashboard-mesh
      rules:
        - apiGroups: ["networking.istio.io"]
          resources: ["virtualservices", "destinationrules"]
          verbs: ["get", "list", "create", "update", "patch", "delete"]

- name: Create RBAC for dashboard to manage platform resources
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: ops-dashboard-platform
      rules:
        - apiGroups: ["machine.openshift.io"]
          resources: ["machinesets"]
          verbs: ["get", "list", "patch", "update"]
        - apiGroups: ["machine.openshift.io"]
          resources: ["machines"]
          verbs: ["get", "list", "delete"]
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list"]
        # pods_top / nodes_top in the MCP metrics toolset read the metrics
        # API, which cluster-monitoring-view does not cover — that grants
        # prometheuses/api only.
        - apiGroups: ["metrics.k8s.io"]
          resources: ["pods", "nodes"]
          verbs: ["get", "list"]

- name: Create RBAC for dashboard to discover MCP servers
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: ops-dashboard-mcp
      rules:
        - apiGroups: ["mcp.x-k8s.io"]
          resources: ["mcpservers"]
          verbs: ["get", "list"]

# A namespaced Role, not a ClusterRole, and named to a single object. The
# Access page needs the summary the summary role publishes and nothing else;
# resourceNames keeps this from becoming "the dashboard can read secrets".
- name: Allow the dashboard to read its own summary secret
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: ops-dashboard-summary
        namespace: "{{ dashboard_namespace }}"
      rules:
        - apiGroups: [""]
          resources: ["secrets"]
          resourceNames: ["ops-dashboard-summary"]
          verbs: ["get"]

- name: Bind the dashboard SA to the summary Role
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: ops-dashboard-summary
        namespace: "{{ dashboard_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: ops-dashboard-summary
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ dashboard_namespace }}"

- name: Bind dashboard SA to mesh ClusterRole
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: ops-dashboard-mesh
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: ops-dashboard-mesh
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ dashboard_namespace }}"

- name: Bind dashboard SA to platform ClusterRole
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: ops-dashboard-platform
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: ops-dashboard-platform
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ dashboard_namespace }}"

# The MCP server's metrics toolset forwards the caller's bearer token to
# Prometheus, so the dashboard's own identity needs to be allowed to query it.
# cluster-monitoring-view grants read-only access to prometheuses/api.
- name: Bind dashboard SA to cluster-monitoring-view
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: ops-dashboard-monitoring
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-monitoring-view
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ dashboard_namespace }}"

- name: Bind dashboard SA to MCP ClusterRole
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: ops-dashboard-mcp
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: ops-dashboard-mcp
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ dashboard_namespace }}"

# The MCP server acts as whoever called it whenever a bearer token is present,
# and the dashboard always sends one (the metrics toolset needs it). So every
# tool the AI assistant invokes runs as this ServiceAccount, not as the
# server's mcp-viewer identity — without these the assistant could not even
# list pods, while unauthenticated callers could.
#
# Same ClusterRole definition as the openshift_ai role, from the same
# group_vars list; applying it here too keeps --tags dashboard self-contained.
- name: Create the MCP workload-write ClusterRole
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: mcp-workload-write
      rules: "{{ mcp_write_rules }}"

- name: Bind dashboard SA to read and workload-write
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "ops-dashboard-{{ item.suffix }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ item.role }}"
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ dashboard_namespace }}"
  loop:
    - {suffix: reader, role: cluster-reader}
    - {suffix: mcp-write, role: mcp-workload-write}
  loop_control:
    label: "ops-dashboard-{{ item.suffix }} -> {{ item.role }}"

- name: Fetch LiteLLM API key from litellm namespace
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: litellm
    name: litellm-proxy-credentials
  register: litellm_creds
  failed_when: false

- name: Create dashboard AI Secret with LiteLLM key
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ops-dashboard-ai
        namespace: "{{ dashboard_namespace }}"
      type: Opaque
      stringData:
        litellm-api-key: "{{ litellm_creds.resources[0].data.LITELLM_MASTER_KEY | b64decode }}"
  when: litellm_creds.resources | length > 0

- name: Set AWS region fact for EC2 resiliency actions
  ansible.builtin.set_fact:
    dashboard_aws_region: >-
      {{ cluster_infra.resources[0].status.platformStatus.aws.region
         | default('', true) }}

- name: Create dashboard AWS Secret for EC2 stop/start
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ops-dashboard-aws
        namespace: "{{ dashboard_namespace }}"
      type: Opaque
      stringData:
        aws_access_key_id: "{{ dashboard_aws_access_key_id }}"
        aws_secret_access_key: "{{ dashboard_aws_secret_access_key }}"
  no_log: true
  when: dashboard_aws_access_key_id | length > 0

# A Secret created out of band with `oc` is left alone, so report on what is
# actually in the cluster rather than only on the variable.
- name: Check for an existing dashboard AWS Secret
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ dashboard_namespace }}"
    name: ops-dashboard-aws
  register: dashboard_aws_secret
  no_log: true

- name: Note when EC2 stop/start is unconfigured
  ansible.builtin.debug:
    msg: >-
      No AWS credentials for the dashboard — node Stop/Start will report a
      missing-credentials error. Destroy & Rebuild still works (Machine API only).
      Supply a key with ec2:DescribeInstances, ec2:StopInstances and
      ec2:StartInstances via dashboard_aws_access_key_id, or create the
      ops-dashboard-aws Secret directly.
  when:
    - dashboard_aws_access_key_id | length == 0
    - (dashboard_aws_secret.resources | default([]) | length) == 0

- name: Look for an existing dashboard auth Secret
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ dashboard_namespace }}"
    name: ops-dashboard-auth
  register: dashboard_auth_secret
  no_log: true

# Precedence: an explicitly supplied value, else whatever is already in the
# cluster, else a fresh one. Keeping the existing value is what stops the
# password rotating out from under a logged-in user on every run.
- name: Resolve the dashboard password and secret key
  ansible.builtin.set_fact:
    # Empty in oauth-proxy mode, and that is the whole integration: the app
    # reads DASHBOARD_PASSWORD and its login_required decorator passes
    # straight through when the value is blank. So the proxy becomes the only
    # login instead of stacking a second one behind it, and no shared
    # password exists to leak. Switching back to password mode generates a
    # fresh one, because the stored value is then empty.
    dashboard_password_effective: >-
      {{ '' if dashboard_auth_mode == 'oauth-proxy'
         else (dashboard_password if dashboard_password | length > 0
         else ((dashboard_auth_secret.resources | first).data.password | b64decode
               if dashboard_auth_secret.resources | default([]) | length > 0
               else lookup('password', '/dev/null length=16 chars=ascii_letters,digits'))) }}
    dashboard_secret_key_effective: >-
      {{ dashboard_secret_key if dashboard_secret_key | length > 0
         else ((dashboard_auth_secret.resources | first).data['secret-key'] | b64decode
               if dashboard_auth_secret.resources | default([]) | length > 0
               else lookup('password', '/dev/null length=32 chars=ascii_letters,digits')) }}
  no_log: true

# --- oauth-proxy prerequisites -------------------------------------------
# Before the Deployment, so the sidecar's Secret and the SA's OAuth client
# registration already exist when the pod first schedules.

- name: Find the cluster's oauth-proxy image
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: image.openshift.io/v1
    kind: ImageStream
    namespace: openshift
    name: oauth-proxy
  register: dashboard_oauth_is
  when:
    - dashboard_auth_mode == 'oauth-proxy'
    - dashboard_oauth_image | length == 0

- name: Settle on the oauth-proxy image
  ansible.builtin.set_fact:
    dashboard_oauth_image_resolved: >-
      {{ dashboard_oauth_image
         if dashboard_oauth_image | length > 0
         else (dashboard_oauth_is.resources[0].spec.tags[0].from.name
               | default('registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest')) }}
  when: dashboard_auth_mode == 'oauth-proxy'

- name: Look for an existing proxy session secret
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ dashboard_namespace }}"
    name: ops-dashboard-oauth-session
  register: dashboard_oauth_session
  when: dashboard_auth_mode == 'oauth-proxy'
  no_log: true

# Generated once and read back on later runs: regenerating it would
# invalidate every session the proxy has issued.
- name: Generate the proxy session secret on first run
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ops-dashboard-oauth-session
        namespace: "{{ dashboard_namespace }}"
      type: Opaque
      stringData:
        session_secret: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=43') }}"
  when:
    - dashboard_auth_mode == 'oauth-proxy'
    - dashboard_oauth_session.resources | default([]) | length == 0
  no_log: true

# The redirect reference is what lets the proxy use the ServiceAccount as an
# OAuth client. Without it the OAuth server rejects the callback as an
# unregistered redirect URI, and the only symptom is a login that never
# completes. One annotation per Route, so the custom-domain Route needs its
# own.
#
# This annotates the DEFAULT account rather than a dedicated one, because the
# role already binds all four of the dashboard's ClusterRoles to default.
# Introducing a separate account would mean moving those bindings and risking
# the dashboard's cluster access for a cosmetic gain.
- name: Register the dashboard routes as OAuth redirect targets
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: default
        namespace: "{{ dashboard_namespace }}"
        annotations: >-
          {{ {'serviceaccounts.openshift.io/oauth-redirectreference.dashboard':
               '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"ops-dashboard"}}'}
             | combine({'serviceaccounts.openshift.io/oauth-redirectreference.dashboard-ext':
                 '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"ops-dashboard-ext"}}'}
               if ((deploy_external_dns | default(false) | bool) and (dashboard_custom_host | default('') | length > 0)) else {}) }}
  when: dashboard_auth_mode == 'oauth-proxy'

- name: Create dashboard password Secret
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ops-dashboard-auth
        namespace: "{{ dashboard_namespace }}"
      type: Opaque
      stringData:
        password: "{{ dashboard_password_effective }}"
        secret-key: "{{ dashboard_secret_key_effective }}"

- name: Create dashboard Deployment
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ops-dashboard
        namespace: "{{ dashboard_namespace }}"
        # Roll the Deployment whenever the ImageStream tag moves. Without
        # this a rebuilt image sits in the registry and the running pod
        # keeps serving the old one: the Deployment references :latest by
        # tag, nothing re-resolves it, and "rollout status" reports success
        # because the existing ReplicaSet is indeed fully rolled out. The
        # Access page was built, pushed, built on-cluster from the right
        # commit, and still 404ed for exactly this reason.
        #
        # OpenShift's image trigger controller rewrites the container image
        # to the tag's current digest, which is also what makes :latest
        # meaningful here at all.
        annotations:
          image.openshift.io/triggers: >-
            [{"from": {"kind": "ImageStreamTag", "name": "ops-dashboard:{{ dashboard_image_tag }}",
              "namespace": "{{ dashboard_namespace }}"},
              "fieldPath": "spec.template.spec.containers[?(@.name==\"dashboard\")].image"}]
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: ops-dashboard
        template:
          metadata:
            labels:
              app: ops-dashboard
            annotations:
              # Rolls the pod whenever the credentials change. The Secret is
              # consumed as env vars, which Kubernetes does NOT refresh in a
              # running container, and the Deployment spec is otherwise
              # identical run to run - so without this a changed password
              # silently never reaches the pod.
              checksum/auth: "{{ (dashboard_password_effective ~ dashboard_secret_key_effective) | hash('sha256') }}"
          spec:
            # The proxy is appended rather than written inline, so the
            # password mode keeps byte-for-byte the pod it had before.
            volumes: "{{ dashboard_oauth_volumes if dashboard_auth_mode == 'oauth-proxy' else [] }}"
            containers: >-
              {{ [dashboard_container]
                 + ([dashboard_oauth_container] if dashboard_auth_mode == 'oauth-proxy' else []) }}
  vars:
    dashboard_container:
      name: dashboard
      image: "image-registry.openshift-image-registry.svc:5000/{{ dashboard_namespace }}/ops-dashboard:{{ dashboard_image_tag }}"
      ports:
        - containerPort: 8080
      env:
        # Tells the app it is fronted by oauth-proxy, so /logout bounces to
        # the proxy's /oauth/sign_out instead of its own inert login page.
        - name: DASHBOARD_AUTH_MODE
          value: "{{ dashboard_auth_mode }}"
        - name: BOOKINFO_URL
          value: "http://productpage.bookinfo.svc.cluster.local:9080/productpage"
        - name: GATUS_URL
          value: ""
        - name: GATUS_HOST
          value: "gatus.{{ ocp_apps_domain }}"
        - name: DASHBOARD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ops-dashboard-auth
              key: password
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ops-dashboard-auth
              key: secret-key
        - name: LITELLM_URL
          value: "http://litellm.litellm.svc.cluster.local:4000"
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: ops-dashboard-ai
              key: litellm-api-key
              optional: true
        - name: AWS_REGION
          value: "{{ dashboard_aws_region }}"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: ops-dashboard-aws
              key: aws_access_key_id
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ops-dashboard-aws
              key: aws_secret_access_key
              optional: true
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 30
    dashboard_oauth_volumes:
      - name: ops-dashboard-tls
        secret:
          secretName: ops-dashboard-tls
      - name: ops-dashboard-oauth-session
        secret:
          secretName: ops-dashboard-oauth-session
    dashboard_oauth_container:
      name: oauth-proxy
      image: "{{ dashboard_oauth_image_resolved | default('') }}"
      ports:
        - containerPort: 8443
          name: https
      args:
        - -provider=openshift
        - -https-address=:8443
        # Empty, so the proxy serves no plaintext listener at all.
        - -http-address=
        - -email-domain=*
        - -upstream=http://localhost:8080/
        - -tls-cert=/etc/tls/private/tls.crt
        - -tls-key=/etc/tls/private/tls.key
        - -cookie-secret-file=/etc/proxy/secrets/session_secret
        - -openshift-service-account=default
        - -openshift-sar={{ dashboard_oauth_sar | trim }}
        - -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      volumeMounts:
        - name: ops-dashboard-tls
          mountPath: /etc/tls/private
        - name: ops-dashboard-oauth-session
          mountPath: /etc/proxy/secrets
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 200m, memory: 256Mi}

- name: Create dashboard Service
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: ops-dashboard
        namespace: "{{ dashboard_namespace }}"
        # service-ca mints the certificate the proxy serves, which is also
        # what lets the Routes reencrypt rather than passthrough.
        annotations: >-
          {{ {'service.beta.openshift.io/serving-cert-secret-name': 'ops-dashboard-tls'}
             if dashboard_auth_mode == 'oauth-proxy' else {} }}
      spec:
        selector:
          app: ops-dashboard
        # Only the proxy's port is published in oauth-proxy mode, so neither
        # Route has any way to reach the app directly.
        ports: >-
          {{ [{'port': 8443, 'targetPort': 8443, 'name': 'https'}]
             if dashboard_auth_mode == 'oauth-proxy'
             else [{'port': 8080, 'targetPort': 8080, 'name': 'http'}] }}

- name: Create dashboard Route
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: ops-dashboard
        namespace: "{{ dashboard_namespace }}"
      spec:
        host: "dashboard.{{ ocp_apps_domain }}"
        to:
          kind: Service
          name: ops-dashboard
        port:
          targetPort: "{{ 'https' if dashboard_auth_mode == 'oauth-proxy' else 'http' }}"
        tls: >-
          {{ {'termination': 'reencrypt', 'insecureEdgeTerminationPolicy': 'Redirect'}
             if dashboard_auth_mode == 'oauth-proxy'
             else {'termination': 'edge'} }}

- name: Create dashboard Route on the custom domain
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: ops-dashboard-ext
        namespace: "{{ dashboard_namespace }}"
      spec:
        host: "{{ dashboard_custom_host }}"
        to:
          kind: Service
          name: ops-dashboard
        port:
          targetPort: "{{ 'https' if dashboard_auth_mode == 'oauth-proxy' else 'http' }}"
        tls: >-
          {{ {'termination': 'reencrypt', 'insecureEdgeTerminationPolicy': 'Redirect'}
             if dashboard_auth_mode == 'oauth-proxy'
             else {'termination': 'edge', 'insecureEdgeTerminationPolicy': 'Redirect'} }}
  when:
    - deploy_external_dns | bool
    - dashboard_custom_host | length > 0

- name: Wait for dashboard to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ dashboard_namespace }}"
    name: ops-dashboard
  register: dashboard_deploy
  until: >-
    dashboard_deploy.resources | length > 0 and
    dashboard_deploy.resources[0].status.readyReplicas is defined and
    dashboard_deploy.resources[0].status.readyReplicas >= 1
  retries: 20
  delay: 15

- name: Display dashboard URL
  ansible.builtin.debug:
    msg: >-

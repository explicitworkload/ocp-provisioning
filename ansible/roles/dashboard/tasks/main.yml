---
- name: Create dashboard namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ dashboard_namespace }}"

- name: Create dashboard ImageStream
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: image.openshift.io/v1
      kind: ImageStream
      metadata:
        name: ops-dashboard
        namespace: "{{ dashboard_namespace }}"

- name: Create dashboard BuildConfig
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: build.openshift.io/v1
      kind: BuildConfig
      metadata:
        name: ops-dashboard
        namespace: "{{ dashboard_namespace }}"
      spec:
        source:
          type: Git
          git:
            uri: "https://github.com/explicitworkload/ocp-provisioning.git"
            ref: main
          contextDir: dashboard
        strategy:
          type: Docker
          dockerStrategy: {}
        output:
          to:
            kind: ImageStreamTag
            name: "ops-dashboard:{{ dashboard_image_tag }}"
        triggers:
          - type: ConfigChange

- name: Wait for dashboard build to complete
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: build.openshift.io/v1
    kind: Build
    namespace: "{{ dashboard_namespace }}"
    label_selectors:
      - "openshift.io/build-config.name=ops-dashboard"
  register: dashboard_builds
  until: >-
    dashboard_builds.resources | length > 0 and
    dashboard_builds.resources | selectattr('status.phase', 'defined') |
    selectattr('status.phase', 'equalto', 'Complete') | list | length > 0
  retries: 30
  delay: 30

- name: Create RBAC for dashboard to manage Istio resources
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: ops-dashboard-mesh
      rules:
        - apiGroups: ["networking.istio.io"]
          resources: ["virtualservices", "destinationrules"]
          verbs: ["get", "list", "create", "update", "patch", "delete"]

- name: Create RBAC for dashboard to manage platform resources
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: ops-dashboard-platform
      rules:
        - apiGroups: ["machine.openshift.io"]
          resources: ["machinesets"]
          verbs: ["get", "list", "patch", "update"]
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list"]

- name: Create RBAC for dashboard to discover MCP servers
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: ops-dashboard-mcp
      rules:
        - apiGroups: ["mcp.x-k8s.io"]
          resources: ["mcpservers"]
          verbs: ["get", "list"]

- name: Bind dashboard SA to mesh ClusterRole
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: ops-dashboard-mesh
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: ops-dashboard-mesh
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ dashboard_namespace }}"

- name: Bind dashboard SA to platform ClusterRole
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: ops-dashboard-platform
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: ops-dashboard-platform
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ dashboard_namespace }}"

- name: Bind dashboard SA to MCP ClusterRole
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: ops-dashboard-mcp
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: ops-dashboard-mcp
      subjects:
        - kind: ServiceAccount
          name: default
          namespace: "{{ dashboard_namespace }}"

- name: Fetch LiteLLM API key from litellm namespace
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: v1
    kind: Secret
    namespace: litellm
    name: litellm-proxy-credentials
  register: litellm_creds
  failed_when: false

- name: Create dashboard AI Secret with LiteLLM key
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ops-dashboard-ai
        namespace: "{{ dashboard_namespace }}"
      type: Opaque
      stringData:
        litellm-api-key: "{{ litellm_creds.resources[0].data.LITELLM_MASTER_KEY | b64decode }}"
  when: litellm_creds.resources | length > 0

- name: Create dashboard password Secret
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ops-dashboard-auth
        namespace: "{{ dashboard_namespace }}"
      type: Opaque
      stringData:
        password: "{{ dashboard_password }}"
        secret-key: "{{ dashboard_secret_key }}"

- name: Create dashboard Deployment
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ops-dashboard
        namespace: "{{ dashboard_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: ops-dashboard
        template:
          metadata:
            labels:
              app: ops-dashboard
          spec:
            containers:
              - name: dashboard
                image: "image-registry.openshift-image-registry.svc:5000/{{ dashboard_namespace }}/ops-dashboard:{{ dashboard_image_tag }}"
                ports:
                  - containerPort: 8080
                env:
                  - name: BOOKINFO_URL
                    value: "http://productpage.bookinfo.svc.cluster.local:9080/productpage"
                  - name: GATUS_URL
                    value: ""
                  - name: GATUS_HOST
                    value: "gatus.{{ ocp_apps_domain }}"
                  - name: DASHBOARD_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: ops-dashboard-auth
                        key: password
                  - name: SECRET_KEY
                    valueFrom:
                      secretKeyRef:
                        name: ops-dashboard-auth
                        key: secret-key
                  - name: LITELLM_URL
                    value: "http://litellm.litellm.svc.cluster.local:4000"
                  - name: LITELLM_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: ops-dashboard-ai
                        key: litellm-api-key
                        optional: true
                readinessProbe:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30

- name: Create dashboard Service
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: ops-dashboard
        namespace: "{{ dashboard_namespace }}"
      spec:
        selector:
          app: ops-dashboard
        ports:
          - port: 8080
            targetPort: 8080
            name: http

- name: Create dashboard Route
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: ops-dashboard
        namespace: "{{ dashboard_namespace }}"
      spec:
        host: "dashboard.{{ ocp_apps_domain }}"
        to:
          kind: Service
          name: ops-dashboard
        port:
          targetPort: http
        tls:
          termination: edge

- name: Wait for dashboard to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ dashboard_namespace }}"
    name: ops-dashboard
  register: dashboard_deploy
  until: >-
    dashboard_deploy.resources | length > 0 and
    dashboard_deploy.resources[0].status.readyReplicas is defined and
    dashboard_deploy.resources[0].status.readyReplicas >= 1
  retries: 20
  delay: 15

- name: Display dashboard URL
  ansible.builtin.debug:
    msg: "Operations Dashboard: https://dashboard.{{ ocp_apps_domain }}"

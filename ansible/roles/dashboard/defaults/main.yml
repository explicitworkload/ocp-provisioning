---
dashboard_namespace: dashboard
dashboard_image_tag: latest
# Empty means "generate once, then reuse". Previously these were a bare
# lookup(), which Ansible re-evaluates on every run: each pass wrote a new
# password into the Secret while the Deployment spec stayed byte-identical,
# so no rollout happened and the running pod kept serving the OLD password.
# The only way in was to delete the pod by hand.
#
# Set either explicitly to pin a value:
#   ansible-playbook site.yml -e dashboard_password=...
dashboard_password: ""

# How the dashboard is protected.
#
#   oauth-proxy  OpenShift's oauth-proxy as a sidecar. You log in with your
#                cluster identity, and the app's own password login is turned
#                off - DASHBOARD_PASSWORD is set empty, which makes Flask's
#                login_required decorator pass straight through, so there is
#                one login rather than two stacked on each other.
#   password     The app's own login page, with the generated password the
#                deployment summary prints. No proxy.
#
# oauth-proxy by default. This dashboard can scale MachineSets, delete
# Machines, shift mesh traffic and shut the cluster down; a single shared
# password in a summary is thin cover for that.
#
# Note the Service then publishes only the proxy's HTTPS port, so neither
# Route can reach the app directly. The app still listens on 8080 inside the
# pod and is reachable by pod IP from within the cluster - a NetworkPolicy is
# the next step if that matters.
dashboard_auth_mode: oauth-proxy

# Empty = resolve from the cluster's own oauth-proxy imagestream, so the proxy
# tracks the OpenShift version instead of a tag pinned here.
dashboard_oauth_image: ""

# Who gets in. A SubjectAccessReview the user must pass. This one asks "can
# you patch MachineSets", which is deliberately close to what the dashboard
# itself can do - the proxy should not hand someone authority they do not
# already hold. Loosen it to the usual services/get check if you want a wider
# audience for the read-only pages.
dashboard_oauth_sar: >-
  {"namespace":"openshift-machine-api","resource":"machinesets","group":"machine.openshift.io","verb":"patch"}
dashboard_secret_key: ""

# Extra Route on a domain managed by ExternalDNS. Set empty to skip.
# The cluster's default wildcard cert does not cover this name, so browsers
# will warn until a matching certificate is attached.
dashboard_custom_host: "dashboard{{ ocp_host_suffix }}.{{ external_dns_domain }}"

# AWS key used only for node Stop/Start resiliency tests. Needs
# ec2:DescribeInstances, ec2:StopInstances, ec2:StartInstances.
# Pass at runtime — never commit. Destroy & Rebuild does not need these.
dashboard_aws_access_key_id: ""
dashboard_aws_secret_access_key: ""

---
dashboard_namespace: dashboard
dashboard_image_tag: latest
# Empty means "generate once, then reuse". Previously these were a bare
# lookup(), which Ansible re-evaluates on every run: each pass wrote a new
# password into the Secret while the Deployment spec stayed byte-identical,
# so no rollout happened and the running pod kept serving the OLD password.
# The only way in was to delete the pod by hand.
#
# Set either explicitly to pin a value:
#   ansible-playbook site.yml -e dashboard_password=...
dashboard_password: ""
dashboard_secret_key: ""

# Extra Route on a domain managed by ExternalDNS. Set empty to skip.
# The cluster's default wildcard cert does not cover this name, so browsers
# will warn until a matching certificate is attached.
dashboard_custom_host: "dashboard{{ ocp_host_suffix }}.{{ external_dns_domain }}"

# AWS key used only for node Stop/Start resiliency tests. Needs
# ec2:DescribeInstances, ec2:StopInstances, ec2:StartInstances.
# Pass at runtime — never commit. Destroy & Rebuild does not need these.
dashboard_aws_access_key_id: ""
dashboard_aws_secret_access_key: ""

---
# Which model to serve. One name here sets the image, the GPU count, the
# context length and the resource limits together, because getting those four
# consistent by hand is how a model ends up either refusing to start or
# quietly serialising every request.
#
# The GPU instance type is chosen separately, in gpu_machinesets. That is
# deliberate - you pick the hardware - but see the fit check the run prints
# before it changes anything: not every model fits every instance.
model_preset: qwen3-4b

# weights_gb is the on-disk size of the artifact, which is close enough to the
# VRAM the weights occupy to decide whether a model fits a card.
#
# max_model_len is sized per model, not shared, and is set to what the model
# and the card will actually carry rather than to a round number. Two separate
# ceilings decide it:
#
#  1. max_position_embeddings, from the model's own config.json. Asking for
#     more than this needs rope scaling - see model_rope_override below - and
#     vLLM refuses to start without it. The dense Qwen3 models stop at 40960;
#     qwen3.8-27b is natively 262144.
#
#  2. KV cache. vLLM will not start unless the cache can hold one whole
#     max_model_len sequence, so context trades directly against VRAM.
#
# kv_kb_per_token is that cost, 2 x full_attention_layers x kv_heads x
# head_dim x 2 bytes, read from each config.json rather than estimated. Note
# FULL-attention layers: qwen3.8-27b is a hybrid, and only 16 of its 64 layers
# are attention at all (full_attention_interval: 4). The other 48 are gated
# DeltaNet, whose state is a fixed size per sequence however long the sequence
# gets - that is state_mb_per_seq, and it is why those presets pin
# max_num_seqs. At 256 sequences the state alone would be 37 GiB.
#
# This is the correction that let the context lengths go up. Counting all 64
# layers as attention gave 256 KB per token, four times the real figure, and
# a 27B that looked like it could not exceed 32k on four cards.
model_presets:
  # The only preset held below its model's native length, and the card is why:
  # the default instance is g4dn.4xlarge, whose T4 has 16 GB. Weights take 7.5
  # GiB of it and 32768 tokens take another 4.5, which is the lot. 40960 fits
  # comfortably on a 48 GB card - raise model_max_model_len by hand if that is
  # what this is running on.
  qwen3-4b:
    display: "Qwen3 4B (bf16, modelcar)"
    name: qwen3-4b
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen3-4b"
    gpu_count: 1
    max_model_len: 32768
    tool_call_parser: hermes
    reasoning_parser: qwen3
    kv_kb_per_token: 144
    state_mb_per_seq: 0
    max_num_seqs: 0
    weights_gb: 8
    cpu_limit: "4"
    memory_limit: 16Gi
    cpu_request: "2"
    memory_request: 8Gi

  qwen3-8b:
    display: "Qwen3 8B (bf16, modelcar)"
    name: qwen3-8b
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen3-8b"
    gpu_count: 1
    # 40960 is this model's whole native length. 5.6 GiB of KV, against the
    # 24 GiB a 48 GB card has left once the weights are in.
    max_model_len: 40960
    tool_call_parser: hermes
    reasoning_parser: qwen3
    kv_kb_per_token: 144
    state_mb_per_seq: 0
    max_num_seqs: 0
    weights_gb: 16
    cpu_limit: "8"
    memory_limit: 24Gi
    cpu_request: "2"
    memory_request: 12Gi

  qwen3-14b:
    display: "Qwen3 14B (bf16, modelcar)"
    name: qwen3-14b
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen3-14b"
    gpu_count: 1
    # Also the full native 40960, which was being left on the table: 6.3 GiB
    # of KV against roughly 11 GiB free after 27 GiB of weights.
    max_model_len: 40960
    tool_call_parser: hermes
    reasoning_parser: qwen3
    kv_kb_per_token: 160
    state_mb_per_seq: 0
    max_num_seqs: 0
    weights_gb: 29
    cpu_limit: "8"
    memory_limit: 48Gi
    cpu_request: "4"
    memory_request: 24Gi

  # bf16, 55 GB of weights: this does not fit one 48 GB L40S at any context
  # length. Four GPUs on a single node, sharded with tensor parallelism.
  # g6e.12xlarge is the smallest instance that provides them.
  qwen3.8-27b:
    display: "Qwen3.8 27B (bf16, modelcar, 4 GPUs)"
    # qwen38-27b-selfhosted, not qwen38-27b. The MaaS endpoint in
    # litellm_extra_models already serves a model called qwen38-27b, and an
    # InferenceService of the same name would make the AI asset endpoint drop
    # the remote one as a duplicate - they would also be indistinguishable in
    # the picker. The -selfhosted suffix keeps both listed and says which is
    # which.
    #
    # It cannot be qwen38-27b(selfhosted): object names are DNS-1123 labels,
    # [a-z0-9]([-a-z0-9]*[a-z0-9])?, so brackets and spaces are rejected by
    # the API server. display_name carries the readable form instead.
    name: qwen38-27b-selfhosted
    display_name: "qwen38-27b (self-hosted)"
    uri: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen3.8-27b"
    gpu_count: 4
    # The model's entire native 262144. Four cards hold 160 GiB usable, the
    # weights take 52 and a full 256k sequence only 16, because the hybrid
    # costs 64 KB per token rather than the 256 KB this table used to claim.
    max_model_len: 262144
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    kv_kb_per_token: 64
    state_mb_per_seq: 148
    # 18 GiB of DeltaNet state. vLLM's default of 256 would ask for 37 GiB,
    # which fits here but leaves far less room for KV blocks than concurrency
    # at this context length is worth.
    max_num_seqs: 128
    weights_gb: 56
    cpu_limit: "16"
    memory_limit: 96Gi
    cpu_request: "8"
    memory_request: 48Gi

  # The same model at FP8, on one GPU. Not from the modelcar catalog - it has
  # no FP8 Qwen - so this pulls from Hugging Face through KServe's hf://
  # storage initializer, which the default ClusterStorageContainer supports.
  #
  # The trade-off against the modelcar: ~31 GB is downloaded at pod start
  # rather than pulled as a layer-cached image, so first start is slow and a
  # restart pays it again. The repository is public, so hf_token only buys
  # headroom against anonymous rate limits.
  #
  # One card is what caps the context here, not the model: 262144 would need
  # 16 GiB of KV and there are about 10 free once 29 GiB of weights are in.
  # 65536 uses 4 of those and leaves the rest as spare blocks for concurrent
  # requests. 98304 also starts, if max_num_seqs comes down with it.
  qwen3.8-27b-fp8:
    display: "Qwen3.8 27B (FP8, Hugging Face, 1 GPU)"
    name: qwen38-27b-fp8-selfhosted
    display_name: "qwen38-27b FP8 (self-hosted)"
    uri: "hf://Qwen/Qwen3.8-27B-FP8"
    gpu_count: 1
    max_model_len: 65536
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    kv_kb_per_token: 64
    state_mb_per_seq: 148
    # 2.3 GiB of DeltaNet state. The default 256 would want 37 GiB on a card
    # that has about 10 to give, so this one has to be set.
    max_num_seqs: 16
    weights_gb: 31
    cpu_limit: "8"
    memory_limit: 48Gi
    cpu_request: "4"
    memory_request: 24Gi

# Everything below is derived from the preset. Override any of it explicitly
# if you need to; the preset only supplies the default.
model_selected: "{{ model_presets[model_preset] }}"
model_name: "{{ model_selected.name }}"
model_display_name: "{{ model_selected.display_name | default(model_selected.name) }}"
model_namespace: "{{ model_selected.name }}"
model_storage_uri: "{{ model_selected.uri }}"
model_gpu_count: "{{ model_selected.gpu_count }}"
model_max_model_len: "{{ model_selected.max_model_len }}"
# How vLLM reads the model's tool calls and its thinking. Both are per-model:
# a parser that does not match the format the model emits fails silently, and
# the failure looks like a hang rather than an error - vLLM returns
# finish_reason "stop" with the unparsed markup sitting in content, so the
# caller waits for a tool call that was made but never recognised.
model_tool_call_parser: "{{ model_selected.tool_call_parser | default('hermes') }}"
model_reasoning_parser: "{{ model_selected.reasoning_parser | default('') }}"
# 0 = do not pass --max-num-seqs and let vLLM pick. Only the hybrid presets
# set it, because only they pay per-sequence state.
model_max_num_seqs: "{{ model_selected.max_num_seqs | default(0) }}"
model_cpu_limit: "{{ model_selected.cpu_limit }}"
model_memory_limit: "{{ model_selected.memory_limit }}"
model_cpu_request: "{{ model_selected.cpu_request }}"
model_memory_request: "{{ model_selected.memory_request }}"
model_max_output_tokens: 4096

# Goes past the model's native max_position_embeddings with rope scaling.
# Empty everywhere by default, because every max_model_len above is already
# inside what its model was trained for, and static YaRN is applied at every
# length - it costs accuracy on short prompts too, which is why Qwen suggest
# turning it on only when long inputs are genuinely expected.
#
# The dense Qwen3 models stop at 40960. Qwen document 131072 via YaRN:
#
#     ./run.sh -e model_max_model_len=131072 \
#       -e '{"model_rope_override": {"rope_scaling": {"rope_type": "yarn",
#            "factor": 4.0, "original_max_position_embeddings": 32768}}}'
#
# Check it against the fit the run prints first - at 144 KB per token, 131072
# is 18 GiB of KV. Neither 27B preset needs this: that model is natively
# 262144 and the bf16 one already asks for all of it.
model_rope_override: {}

# Hugging Face token, needed only by presets whose uri is hf:// - today just
# qwen3.8-27b-fp8. Never put a real one here; set it in the untracked
# group_vars/all.yml, or export it and let the fallback below find it.
#
# Reaches the storage initializer as HF_TOKEN, via a Secret in the model
# namespace and an optional env reference on KServe's default
# ClusterStorageContainer. Optional, so every other InferenceService on the
# cluster keeps starting whether or not that Secret exists.
hf_token: ""

# What the tasks actually use: all.yml if it carries a token, otherwise
# whatever HF_TOKEN is exported in the shell.
#
# The fallback exists because the obvious invocation is a trap. -e is the
# highest-precedence source there is, so
#
#     ./run.sh -e hf_token="$HF_TOKEN"
#
# with HF_TOKEN unset in the shell passes an empty string that overrides a
# perfectly good value in all.yml, and the run then fails saying the token is
# empty - which this role's own error message used to recommend doing. With
# the fallback there is no need for -e at all: export HF_TOKEN, or put it in
# all.yml, and either is picked up.
model_hf_token: >-
  {{ hf_token if (hf_token | default('') | length > 0)
     else (lookup('env', 'HF_TOKEN') | default('', true)) }}

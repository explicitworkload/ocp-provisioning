---
- name: Create model serving namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ model_namespace }}"
        labels:
          opendatahub.io/dashboard: "true"
        annotations:
          openshift.io/description: "Model serving namespace for {{ model_name }}"

- name: Create hardware profile in model namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: infrastructure.opendatahub.io/v1
      kind: HardwareProfile
      metadata:
        name: default-profile
        namespace: "{{ model_namespace }}"
      spec:
        identifiers:
          - displayName: CPU
            identifier: cpu
            resourceType: CPU
            defaultCount: 2
            minCount: 1
            maxCount: 4
          - displayName: Memory
            identifier: memory
            resourceType: Memory
            defaultCount: 4Gi
            minCount: 2Gi
            maxCount: 8Gi
          - displayName: GPU
            identifier: nvidia.com/gpu
            resourceType: Accelerator
            defaultCount: 1
            minCount: 1
            maxCount: 2
  ignore_errors: true

- name: Wait for GPU node to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: v1
    kind: Node
    label_selectors:
      - "node-role.kubernetes.io/gpu="
  register: gpu_nodes
  until: >-
    gpu_nodes.resources | length > 0 and
    gpu_nodes.resources | map(attribute='status') |
    map(attribute='conditions') | flatten |
    selectattr('type', 'equalto', 'Ready') |
    selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 60
  delay: 30

- name: Display GPU node status
  ansible.builtin.debug:
    msg: "GPU node(s) ready: {{ gpu_nodes.resources | map(attribute='metadata') | map(attribute='name') | list }}"

- name: Create RBAC for model inference access
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: kserve-inference-access
      rules:
        - apiGroups: ["serving.kserve.io"]
          resources: ["inferenceservices"]
          verbs: ["get"]

- name: Create ServiceAccount for model access
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ model_name }}-sa"
        namespace: "{{ model_namespace }}"
        labels:
          opendatahub.io/dashboard: "true"

- name: Bind inference access to ServiceAccount
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "{{ model_name }}-inference-access"
        namespace: "{{ model_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: kserve-inference-access
      subjects:
        - kind: ServiceAccount
          name: "{{ model_name }}-sa"
          namespace: "{{ model_namespace }}"

- name: Create token secret for ServiceAccount
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ model_name }}-sa-token"
        namespace: "{{ model_namespace }}"
        annotations:
          kubernetes.io/service-account.name: "{{ model_name }}-sa"
        labels:
          opendatahub.io/dashboard: "true"
      type: kubernetes.io/service-account-token

# --- pgvector for GenAI Studio ---

- name: Create pgvector credentials secret
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: genai-pgvector-credentials
        namespace: "{{ model_namespace }}"
        labels:
          opendatahub.io/dashboard: "true"
      type: Opaque
      stringData:
        password: vectorpass123

- name: Create pgvector PVC
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: genai-pgvector-storage
        namespace: "{{ model_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

- name: Create pgvector Service
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: genai-pgvector
        namespace: "{{ model_namespace }}"
      spec:
        selector:
          app: genai-pgvector
        ports:
          - port: 5432
            targetPort: 5432

- name: Deploy pgvector PostgreSQL
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: genai-pgvector
        namespace: "{{ model_namespace }}"
        labels:
          gen-ai.opendatahub.io/pgvector: "true"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: genai-pgvector
        template:
          metadata:
            labels:
              app: genai-pgvector
              gen-ai.opendatahub.io/pgvector: "true"
          spec:
            containers:
              - name: postgresql
                image: registry.redhat.io/rhel9/postgresql-16
                ports:
                  - containerPort: 5432
                env:
                  - name: POSTGRESQL_DATABASE
                    value: vectordb
                  - name: POSTGRESQL_USER
                    value: vectoruser
                  - name: POSTGRESQL_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        key: password
                        name: genai-pgvector-credentials
                resources:
                  limits:
                    cpu: "1"
                    memory: 2Gi
                  requests:
                    cpu: 250m
                    memory: 512Mi
                livenessProbe:
                  exec:
                    command: ["pg_isready", "-U", "vectoruser", "-d", "vectordb"]
                  periodSeconds: 20
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", "vectoruser", "-d", "vectordb"]
                  periodSeconds: 10
                volumeMounts:
                  - name: pgdata
                    mountPath: /var/lib/pgsql/data
            volumes:
              - name: pgdata
                persistentVolumeClaim:
                  claimName: genai-pgvector-storage

- name: Wait for pgvector to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ model_namespace }}"
    name: genai-pgvector
  register: pgvector_deploy
  until: >-
    pgvector_deploy.resources | length > 0 and
    pgvector_deploy.resources[0].status.readyReplicas is defined and
    pgvector_deploy.resources[0].status.readyReplicas >= 1
  retries: 20
  delay: 15

- name: Install pgvector extension
  ansible.builtin.command:
    cmd: >-
      oc --context {{ ocp_context }}
      exec deployment/genai-pgvector -n {{ model_namespace }}
      -- psql -U postgres -d vectordb -c "CREATE EXTENSION IF NOT EXISTS vector;"
  changed_when: false

# --- GenAI Studio Playground (OGX) ---

- name: Wait for OGX operator to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apps/v1
    kind: Deployment
    namespace: redhat-ods-applications
    name: ogx-k8s-operator-controller-manager
  register: ogx_operator
  until: >-
    ogx_operator.resources | length > 0 and
    ogx_operator.resources[0].status.readyReplicas is defined and
    ogx_operator.resources[0].status.readyReplicas >= 1
  retries: 30
  delay: 15

- name: Create OGX Llama Stack config
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: llama-stack-config
        namespace: "{{ model_namespace }}"
        labels:
          ogx.io/server: genai-playground
          ogx.io/watch: "true"
          opendatahub.io/dashboard: "true"
      data:
        config.yaml: |
          version: "2"
          distro_name: rh
          apis:
          - responses
          - inference
          - tool_runtime
          - vector_io
          - files
          - file_processors
          providers:
            inference:
            - provider_id: sentence-transformers
              provider_type: inline::sentence-transformers
              config:
                trust_remote_code: false
            - provider_id: vllm-inference-1
              provider_type: remote::vllm
              config:
                api_token: ${env.VLLM_API_TOKEN_1:=fake}
                base_url: https://{{ model_name }}-predictor.{{ model_namespace }}.svc.cluster.local:8443/v1
                max_tokens: ${env.VLLM_MAX_TOKENS_1:={{ model_max_model_len }}}
                tls_verify: ${env.VLLM_TLS_VERIFY:=false}
            vector_io:
            - provider_id: pgvector
              provider_type: remote::pgvector
              config:
                db: ${env.PGVECTOR_DB:=vectordb}
                distance_metric: COSINE
                host: ${env.PGVECTOR_HOST}
                password: ${env.PGVECTOR_PASSWORD:=}
                persistence:
                  backend: kv_default
                  namespace: vector_io::pgvector
                port: ${env.PGVECTOR_PORT:=5432}
                user: ${env.PGVECTOR_USER:=vectoruser}
            responses:
            - provider_id: builtin
              provider_type: inline::builtin
              config:
                persistence:
                  responses:
                    backend: sql_default
                    max_write_queue_size: 10000
                    num_writers: 4
                    table_name: responses
            file_processors:
            - provider_id: pypdf
              provider_type: inline::pypdf
              config: {}
            files:
            - provider_id: localfs-files
              provider_type: inline::localfs
              config:
                metadata_store:
                  backend: sql_default
                  table_name: files_metadata
                storage_dir: /opt/app-root/src/.llama/distributions/rh/files
            tool_runtime:
            - provider_id: file-search
              provider_type: inline::file-search
              config: {}
            - provider_id: model-context-protocol
              provider_type: remote::model-context-protocol
              config: {}
          metadata_store:
            type: sqlite
            db_path: /opt/app-root/src/.llama/distributions/rh/inference_store.db
          storage:
            backends:
              kv_default:
                db_path: /opt/app-root/src/.llama/distributions/rh/kvstore.db
                type: kv_sqlite
              sql_default:
                db_path: /opt/app-root/src/.llama/distributions/rh/sql_store.db
                type: sql_sqlite
            stores:
              connectors:
                backend: sql_default
                table_name: connectors
              conversations:
                backend: sql_default
                table_name: openai_conversations
              inference:
                backend: sql_default
                max_write_queue_size: 10000
                num_writers: 4
                table_name: inference_store
              metadata:
                backend: kv_default
                namespace: registry
              prompts:
                backend: sql_default
                table_name: prompts
          vector_stores:
            default_provider_id: pgvector
            default_embedding_model:
              provider_id: sentence-transformers
              model_id: ibm-granite/granite-embedding-125m-english
            annotation_prompt_params:
              enable_annotations: true
            file_ingestion_params:
              default_chunk_overlap_tokens: 128
              default_chunk_size_tokens: 512
            chunk_retrieval_params:
              chunk_multiplier: 5
              default_reranker_strategy: rrf
              default_search_mode: vector
              max_tokens_in_context: 4000
              rrf_impact_factor: 60
              weighted_search_alpha: 0.5
            file_batch_params:
              cleanup_interval_seconds: 86400
              file_batch_chunk_size: 10
              max_concurrent_files_per_batch: 3
          registered_resources:
            models:
            - provider_id: sentence-transformers
              model_id: sentence-transformers/ibm-granite/granite-embedding-125m-english
              provider_model_id: ibm-granite/granite-embedding-125m-english
              model_type: embedding
              metadata:
                embedding_dimension: 768
            - provider_id: vllm-inference-1
              model_id: {{ model_name }}
              model_type: llm
              metadata:
                description: {{ model_name }} language model served via vLLM on GPU
                display_name: {{ model_name }}
            vector_stores: []
          external_providers_dir: /opt/app-root/.llama/providers.d
          server:
            port: 8321

- name: Create OGXServer for GenAI Studio playground
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: ogx.io/v1beta1
      kind: OGXServer
      metadata:
        name: genai-playground
        namespace: "{{ model_namespace }}"
        annotations:
          openshift.io/display-name: genai-playground
        labels:
          opendatahub.io/dashboard: "true"
      spec:
        distribution:
          name: rh
        network:
          port: 8321
        overrideConfig:
          key: config.yaml
          name: llama-stack-config
        workload:
          overrides:
            command:
              - /bin/sh
              - -c
              - ogx run /etc/ogx/config.yaml --insecure
            env:
              - name: VLLM_TLS_VERIFY
                value: "false"
              - name: VLLM_MAX_TOKENS_1
                value: "{{ model_max_model_len | string }}"
              - name: VLLM_API_TOKEN_1
                valueFrom:
                  secretKeyRef:
                    key: token
                    name: "{{ model_name }}-sa-token"
              - name: PGVECTOR_HOST
                value: "genai-pgvector.{{ model_namespace }}.svc.cluster.local"
              - name: PGVECTOR_PORT
                value: "5432"
              - name: PGVECTOR_DB
                value: vectordb
              - name: PGVECTOR_USER
                value: vectoruser
              - name: PGVECTOR_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: genai-pgvector-credentials
              - name: OGX_CONFIG_DIR
                value: /opt/app-root/src/.ogx/distributions/rh/
              - name: SENTENCE_TRANSFORMERS_HOME
                value: /opt/app-root/.cache/huggingface/hub
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: TRANSFORMERS_OFFLINE
                value: "1"
              - name: HF_DATASETS_OFFLINE
                value: "1"
              - name: FAISS_STORE_DIR
                value: ~/.llama/faiss
            replicas: 1
            resources:
              limits:
                cpu: "2"
                memory: 12Gi
              requests:
                cpu: 250m
                memory: 500Mi

- name: Wait for OGXServer to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: ogx.io/v1beta1
    kind: OGXServer
    namespace: "{{ model_namespace }}"
    name: genai-playground
  register: ogx_server
  until: >-
    ogx_server.resources | length > 0 and
    ogx_server.resources[0].status is defined and
    ogx_server.resources[0].status.phase is defined and
    ogx_server.resources[0].status.phase == 'Ready'
  retries: 30
  delay: 15
  ignore_errors: true

# --- Model Serving ---

- name: Wait for vLLM CUDA ServingRuntime template
  ansible.builtin.command:
    cmd: >-
      oc --context {{ ocp_context }}
      get template vllm-cuda-runtime-template
      -n redhat-ods-applications
  register: vllm_template_check
  until: vllm_template_check.rc == 0
  retries: 30
  delay: 15
  changed_when: false

- name: Instantiate vLLM CUDA ServingRuntime from RHOAI template
  ansible.builtin.command:
    cmd: >-
      oc --context {{ ocp_context }}
      process vllm-cuda-runtime-template
      -n redhat-ods-applications
      -o yaml
  register: vllm_runtime_yaml
  changed_when: false

- name: Create vLLM CUDA ServingRuntime in model namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    namespace: "{{ model_namespace }}"
    definition: "{{ vllm_runtime_yaml.stdout | from_yaml_all | list }}"

- name: Label ServingRuntime with template name
  ansible.builtin.command:
    cmd: >-
      oc --context {{ ocp_context }}
      label servingruntime vllm-cuda-runtime
      -n {{ model_namespace }}
      opendatahub.io/template-name=vllm-cuda-runtime-template
      --overwrite
  changed_when: false

- name: Annotate ServingRuntime for dashboard recognition
  ansible.builtin.command:
    cmd: >-
      oc --context {{ ocp_context }}
      annotate servingruntime vllm-cuda-runtime
      -n {{ model_namespace }}
      opendatahub.io/apiProtocol=REST
      opendatahub.io/template-name=vllm-cuda-runtime-template
      opendatahub.io/template-display-name="vLLM NVIDIA GPU ServingRuntime for KServe"
      --overwrite
  changed_when: false

- name: Create InferenceService for {{ model_name }}
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: serving.kserve.io/v1beta1
      kind: InferenceService
      metadata:
        name: "{{ model_name }}"
        namespace: "{{ model_namespace }}"
        annotations:
          serving.kserve.io/deploymentMode: Standard
          opendatahub.io/hardware-profile-name: default-profile
          opendatahub.io/template-name: vllm-cuda-runtime-template
          opendatahub.io/template-display-name: "vLLM NVIDIA GPU ServingRuntime for KServe"
          opendatahub.io/model-type: generative
          opendatahub.io/genai-use-case: genai
          openshift.io/display-name: "{{ model_name }}"
          openshift.io/description: "{{ model_name }} language model served via vLLM on GPU"
          security.opendatahub.io/enable-auth: "true"
        labels:
          opendatahub.io/dashboard: "true"
          opendatahub.io/genai-asset: "true"
          networking.kserve.io/visibility: exposed
      spec:
        predictor:
          deploymentStrategy:
            type: Recreate
          model:
            modelFormat:
              name: vLLM
            runtime: vllm-cuda-runtime
            storageUri: "oci://{{ model_image }}"
            args:
              - "--max-model-len={{ model_max_model_len }}"
            resources:
              limits:
                cpu: "{{ model_cpu_limit }}"
                memory: "{{ model_memory_limit }}"
                nvidia.com/gpu: "{{ model_gpu_count }}"
              requests:
                cpu: "{{ model_cpu_request }}"
                memory: "{{ model_memory_request }}"
                nvidia.com/gpu: "{{ model_gpu_count }}"
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          nodeSelector:
            node-role.kubernetes.io/gpu: ""

- name: Wait for InferenceService to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: serving.kserve.io/v1beta1
    kind: InferenceService
    namespace: "{{ model_namespace }}"
    name: "{{ model_name }}"
  register: isvc
  until: >-
    isvc.resources | length > 0 and
    isvc.resources[0].status is defined and
    isvc.resources[0].status.conditions is defined and
    isvc.resources[0].status.conditions | selectattr('type', 'equalto', 'Ready') |
    selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 60
  delay: 30
  ignore_errors: true

- name: Display model serving status
  ansible.builtin.debug:
    msg: >-
      InferenceService '{{ model_name }}' deployed in namespace '{{ model_namespace }}'.
      {% if isvc.resources[0].status.url is defined %}
      URL: {{ isvc.resources[0].status.url }}
      {% else %}
      Status: Waiting for model to become ready (GPU drivers and model download may take time).
      Check with: oc get inferenceservice {{ model_name }} -n {{ model_namespace }}
      {% endif %}
  when: isvc.resources | length > 0

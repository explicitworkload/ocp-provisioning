---
- name: Create model serving namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ model_namespace }}"
        labels:
          opendatahub.io/dashboard: "true"
        annotations:
          openshift.io/description: "Model serving namespace for {{ model_name }}"

- name: Create hardware profile in model namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: infrastructure.opendatahub.io/v1
      kind: HardwareProfile
      metadata:
        name: default-profile
        namespace: "{{ model_namespace }}"
      spec:
        identifiers:
          - displayName: CPU
            identifier: cpu
            resourceType: CPU
            defaultCount: 2
            minCount: 1
            maxCount: 4
          - displayName: Memory
            identifier: memory
            resourceType: Memory
            defaultCount: 4Gi
            minCount: 2Gi
            maxCount: 8Gi
          - displayName: GPU
            identifier: nvidia.com/gpu
            resourceType: Accelerator
            defaultCount: 1
            minCount: 1
            maxCount: 2
  ignore_errors: true

# Asked before the wait, because the wait below is thirty minutes long and
# there is one state it can never escape: no GPU node exists and no
# MachineSet has been told to build one. That is not slowness, it is a
# configuration that will never converge, and it should not cost half an hour
# to find out. Seen on sandbox3270, where every gpu_machinesets entry sat at
# 0 replicas and the run spent its retries waiting for a machine nobody had
# asked AWS for.
- name: Look for a GPU node that already exists
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Node
    label_selectors:
      - "node-role.kubernetes.io/gpu="
  register: gpu_nodes_present

- name: Fail early when nothing will ever produce a GPU node
  ansible.builtin.fail:
    msg: >-
      No GPU node exists and no entry in gpu_machinesets asks for one - every
      one of them is at 0 replicas, so no Machine was ever requested and
      waiting cannot help. Set replicas on the instance type you want in
      group_vars/all.yml and re-run with --tags gpu,model-serving.
      Configured: {{ gpu_machinesets | default([])
                     | map(attribute='instance_type') | join(', ') | default('none', true) }}.
  when:
    - gpu_nodes_present.resources | length == 0
    - (gpu_machinesets | default([]) | selectattr('replicas', 'gt', 0) | list | length) == 0

- name: Wait for GPU node to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Node
    label_selectors:
      - "node-role.kubernetes.io/gpu="
  register: gpu_nodes
  until: >-
    gpu_nodes.resources | length > 0 and
    gpu_nodes.resources | map(attribute='status') |
    map(attribute='conditions') | flatten |
    selectattr('type', 'equalto', 'Ready') |
    selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 60
  delay: 30

- name: Display GPU node status
  ansible.builtin.debug:
    msg: "GPU node(s) ready: {{ gpu_nodes.resources | map(attribute='metadata') | map(attribute='name') | list }}"

- name: Create RBAC for model inference access
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: kserve-inference-access
      rules:
        - apiGroups: ["serving.kserve.io"]
          resources: ["inferenceservices"]
          verbs: ["get"]

- name: Create ServiceAccount for model access
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ model_name }}-sa"
        namespace: "{{ model_namespace }}"
        labels:
          opendatahub.io/dashboard: "true"

- name: Bind inference access to ServiceAccount
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "{{ model_name }}-inference-access"
        namespace: "{{ model_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: kserve-inference-access
      subjects:
        - kind: ServiceAccount
          name: "{{ model_name }}-sa"
          namespace: "{{ model_namespace }}"

- name: Create token secret for ServiceAccount
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ model_name }}-sa-token"
        namespace: "{{ model_namespace }}"
        annotations:
          kubernetes.io/service-account.name: "{{ model_name }}-sa"
        labels:
          opendatahub.io/dashboard: "true"
      type: kubernetes.io/service-account-token

# --- pgvector for GenAI Studio ---

- name: Create pgvector credentials secret
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: genai-pgvector-credentials
        namespace: "{{ model_namespace }}"
        labels:
          opendatahub.io/dashboard: "true"
          gen-ai.opendatahub.io/pgvector: "true"
      type: Opaque
      stringData:
        password: vectorpass123

- name: Create pgvector init ConfigMap
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: genai-pgvector-init
        namespace: "{{ model_namespace }}"
        labels:
          gen-ai.opendatahub.io/pgvector: "true"
      data:
        enable-pgvector.sh: |
          #!/bin/bash
          psql -U postgres -d "${POSTGRESQL_DATABASE}" -c "CREATE EXTENSION IF NOT EXISTS vector;"

- name: Create pgvector PVC
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: genai-pgvector-storage
        namespace: "{{ model_namespace }}"
        labels:
          gen-ai.opendatahub.io/pgvector: "true"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

- name: Create pgvector Service
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: genai-pgvector
        namespace: "{{ model_namespace }}"
        labels:
          gen-ai.opendatahub.io/pgvector: "true"
      spec:
        selector:
          app: genai-pgvector
        ports:
          - port: 5432
            targetPort: 5432

- name: Create pgvector NetworkPolicy
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: genai-pgvector
        namespace: "{{ model_namespace }}"
        labels:
          gen-ai.opendatahub.io/pgvector: "true"
      spec:
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app: ogx
            ports:
              - port: 5432
                protocol: TCP
        podSelector:
          matchLabels:
            app: genai-pgvector
            gen-ai.opendatahub.io/pgvector: "true"
        policyTypes:
          - Ingress

- name: Deploy pgvector PostgreSQL
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: genai-pgvector
        namespace: "{{ model_namespace }}"
        labels:
          gen-ai.opendatahub.io/pgvector: "true"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: genai-pgvector
        template:
          metadata:
            labels:
              app: genai-pgvector
              gen-ai.opendatahub.io/pgvector: "true"
          spec:
            containers:
              - name: postgresql
                image: registry.redhat.io/rhel9/postgresql-16
                ports:
                  - containerPort: 5432
                env:
                  - name: POSTGRESQL_DATABASE
                    value: vectordb
                  - name: POSTGRESQL_USER
                    value: vectoruser
                  - name: POSTGRESQL_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        key: password
                        name: genai-pgvector-credentials
                resources:
                  limits:
                    cpu: "1"
                    memory: 2Gi
                  requests:
                    cpu: 250m
                    memory: 512Mi
                livenessProbe:
                  exec:
                    command: ["pg_isready", "-U", "vectoruser", "-d", "vectordb"]
                  periodSeconds: 20
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", "vectoruser", "-d", "vectordb"]
                  periodSeconds: 10
                volumeMounts:
                  - name: pgdata
                    mountPath: /var/lib/pgsql/data
            volumes:
              - name: pgdata
                persistentVolumeClaim:
                  claimName: genai-pgvector-storage

- name: Wait for pgvector to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ model_namespace }}"
    name: genai-pgvector
  register: pgvector_deploy
  until: >-
    pgvector_deploy.resources | length > 0 and
    pgvector_deploy.resources[0].status.readyReplicas is defined and
    pgvector_deploy.resources[0].status.readyReplicas >= 1
  retries: 20
  delay: 15

- name: Install pgvector extension
  ansible.builtin.command:
    cmd: >-
      oc {{ ocp_context_arg }}
      exec deployment/genai-pgvector -n {{ model_namespace }}
      -- psql -U postgres -d vectordb -c "CREATE EXTENSION IF NOT EXISTS vector;"
  changed_when: false

# --- Model Serving ---

- name: Wait for vLLM CUDA ServingRuntime template
  ansible.builtin.command:
    cmd: >-
      oc {{ ocp_context_arg }}
      get template vllm-cuda-runtime-template
      -n redhat-ods-applications
  register: vllm_template_check
  until: vllm_template_check.rc == 0
  retries: 30
  delay: 15
  changed_when: false

- name: Instantiate vLLM CUDA ServingRuntime from RHOAI template
  ansible.builtin.command:
    cmd: >-
      oc {{ ocp_context_arg }}
      process vllm-cuda-runtime-template
      -n redhat-ods-applications
      -o yaml
  register: vllm_runtime_yaml
  changed_when: false

- name: Create vLLM CUDA ServingRuntime in model namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    namespace: "{{ model_namespace }}"
    definition: "{{ vllm_runtime_yaml.stdout | from_yaml_all | list }}"

- name: Label ServingRuntime with template name
  ansible.builtin.command:
    cmd: >-
      oc {{ ocp_context_arg }}
      label servingruntime vllm-cuda-runtime
      -n {{ model_namespace }}
      opendatahub.io/template-name=vllm-cuda-runtime-template
      --overwrite
  changed_when: false

- name: Annotate ServingRuntime for dashboard recognition
  ansible.builtin.command:
    cmd: >-
      oc {{ ocp_context_arg }}
      annotate servingruntime vllm-cuda-runtime
      -n {{ model_namespace }}
      opendatahub.io/apiProtocol=REST
      opendatahub.io/template-name=vllm-cuda-runtime-template
      opendatahub.io/template-display-name="vLLM NVIDIA GPU ServingRuntime for KServe"
      --overwrite
  changed_when: false

# Only the hf:// presets need any of this; the modelcar presets pull an OCI
# image and never touch Hugging Face.
- name: Fail early when an hf:// model has no token
  ansible.builtin.fail:
    msg: >-
      Preset {{ model_preset }} pulls from Hugging Face ({{ model_storage_uri }})
      and no token was found, in hf_token or in the HF_TOKEN environment
      variable. Set hf_token in group_vars/all.yml, or export HF_TOKEN before
      the run. Failing now rather than letting the storage initializer
      download tens of gigabytes and then stop on a 401.
      If you did pass -e hf_token="$HF_TOKEN" and are seeing this anyway,
      HF_TOKEN was unset in the shell: -e outranks everything, so it
      overrode all.yml with an empty string. Drop the -e.
  when:
    - model_storage_uri is match('^hf://')
    - model_hf_token | default('') | length == 0

- name: Store the Hugging Face token
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hf-token
        namespace: "{{ model_namespace }}"
      type: Opaque
      stringData:
        HF_TOKEN: "{{ model_hf_token }}"
  when: model_storage_uri is match('^hf://')
  no_log: true

# Cluster-scoped, so this is deliberately additive and optional: every other
# InferenceService on the cluster uses the same storage initializer, and a
# required secretKeyRef would stop any of them whose namespace has no
# hf-token Secret.
- name: Let the storage initializer read the Hugging Face token
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: patched
    api_version: serving.kserve.io/v1alpha1
    kind: ClusterStorageContainer
    name: default
    definition:
      spec:
        container:
          name: storage-initializer
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
  when: model_storage_uri is match('^hf://')

- name: Create InferenceService for {{ model_name }}
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: serving.kserve.io/v1beta1
      kind: InferenceService
      metadata:
        name: "{{ model_name }}"
        namespace: "{{ model_namespace }}"
        annotations:
          serving.kserve.io/deploymentMode: Standard
          opendatahub.io/hardware-profile-name: default-profile
          opendatahub.io/template-name: vllm-cuda-runtime-template
          opendatahub.io/template-display-name: "vLLM NVIDIA GPU ServingRuntime for KServe"
          opendatahub.io/model-type: generative
          opendatahub.io/genai-use-case: genai
          # The readable form, which for the 27B presets differs from the
          # object name: a DNS-1123 label cannot carry brackets or spaces.
          # It must also not be exactly a model name LiteLLM serves from
          # elsewhere - the AI asset endpoint excludes a remote model when an
          # InferenceService claims the same name or display name, so
          # "qwen38-27b (self-hosted)" keeps the MaaS qwen38-27b listed too.
          openshift.io/display-name: "{{ model_display_name }}"
          openshift.io/description: "{{ model_display_name }} language model served via vLLM on GPU"
          security.opendatahub.io/enable-auth: "true"
        labels:
          opendatahub.io/dashboard: "true"
          opendatahub.io/genai-asset: "true"
          networking.kserve.io/visibility: exposed
      spec:
        predictor:
          timeout: 300
          deploymentStrategy:
            type: Recreate
          model:
            modelFormat:
              name: vLLM
            runtime: vllm-cuda-runtime
            # Full URI from the preset rather than an oci:// prefix bolted on
            # here: the FP8 preset is hf://, which KServe's default storage
            # container supports alongside oci://.
            storageUri: "{{ model_storage_uri }}"
            # Without --tensor-parallel-size vLLM defaults to 1 and puts the
            # whole model on one card, so a four-GPU preset would reserve
            # four GPUs and then fail to fit on the first. 1 is the default,
            # so it is inert for the single-GPU presets.
            #
            # Built as a list rather than written out, because the last two
            # entries are conditional. --max-num-seqs is only passed by the
            # hybrid presets, which carry a fixed DeltaNet state per sequence
            # and would ask for 37 GiB of it at vLLM's default of 256;
            # --hf-overrides only when rope scaling is being used to go past
            # the model's native length.
            args: >-
              {{ ['--max-model-len=' ~ model_max_model_len,
                  '--tensor-parallel-size=' ~ model_gpu_count,
                  '--enable-auto-tool-choice',
                  '--tool-call-parser=' ~ model_tool_call_parser]
                 + (['--reasoning-parser=' ~ model_reasoning_parser]
                    if model_reasoning_parser | length > 0 else [])
                 + (['--max-num-seqs=' ~ model_max_num_seqs]
                    if model_max_num_seqs | int > 0 else [])
                 + (['--hf-overrides=' ~ (model_rope_override | to_json)]
                    if model_rope_override | length > 0 else []) }}
            resources:
              limits:
                cpu: "{{ model_cpu_limit }}"
                memory: "{{ model_memory_limit }}"
                nvidia.com/gpu: "{{ model_gpu_count }}"
              requests:
                cpu: "{{ model_cpu_request }}"
                memory: "{{ model_memory_request }}"
                nvidia.com/gpu: "{{ model_gpu_count }}"
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          nodeSelector:
            node-role.kubernetes.io/gpu: ""

- name: Wait for InferenceService to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: serving.kserve.io/v1beta1
    kind: InferenceService
    namespace: "{{ model_namespace }}"
    name: "{{ model_name }}"
  register: isvc
  until: >-
    isvc.resources | length > 0 and
    isvc.resources[0].status is defined and
    isvc.resources[0].status.conditions is defined and
    isvc.resources[0].status.conditions | selectattr('type', 'equalto', 'Ready') |
    selectattr('status', 'equalto', 'True') | list | length > 0
  # 60 minutes. Sized for the image pull, which dominates - with a modelcar
  # the image is the model. qwen3-4b is 8 GB and reached Running in about
  # eight minutes on sandbox5164; qwen3.8-27b is 55 GB, so the previous
  # 30-minute budget would have expired on a perfectly healthy pull.
  #
  # A small model still exits the moment it is Ready, so the extra budget
  # costs nothing except on the runs that need it.
  retries: 120
  delay: 30
  ignore_errors: true

- name: Display model serving status
  ansible.builtin.debug:
    msg: >-
      InferenceService '{{ model_name }}' deployed in namespace '{{ model_namespace }}'.
      {% if isvc.resources[0].status.url is defined %}
      URL: {{ isvc.resources[0].status.url }}
      {% else %}
      Status: Waiting for model to become ready (GPU drivers and model download may take time).
      Check with: oc get inferenceservice {{ model_name }} -n {{ model_namespace }}
      {% endif %}
  when: isvc.resources | length > 0

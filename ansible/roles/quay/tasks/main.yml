---
- name: Wait for Quay Operator CSV to succeed
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: quay-enterprise
    label_selectors:
      - "operators.coreos.com/quay-operator.quay-enterprise="
  register: quay_csvs
  until: >-
    quay_csvs.resources | length > 0 and
    quay_csvs.resources | selectattr('status.phase', 'defined') |
    selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
  retries: 30
  delay: 30

- name: Wait for QuayRegistry CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: quayregistries.quay.redhat.com
  register: quay_crd
  until: quay_crd.resources | length > 0
  retries: 20
  delay: 15

- name: Check if ODF StorageCluster is ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: ocs.openshift.io/v1
    kind: StorageCluster
    namespace: openshift-storage
    name: ocs-storagecluster
  register: odf_cluster
  when: deploy_quay_registry | bool

- name: Set ODF availability
  ansible.builtin.set_fact:
    odf_available: >-
      {{ odf_cluster.resources | default([]) | length > 0 and
         odf_cluster.resources[0].status is defined and
         odf_cluster.resources[0].status.phase is defined and
         odf_cluster.resources[0].status.phase == 'Ready' }}
  when: deploy_quay_registry | bool

- name: Create Quay config bundle secret with S3 storage
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: quay-config-bundle
        namespace: quay-enterprise
      type: Opaque
      stringData:
        config.yaml: |
          DISTRIBUTED_STORAGE_CONFIG:
            s3Storage:
              - S3Storage
              - host: s3.{{ quay_s3_region }}.amazonaws.com
                s3_access_key: {{ quay_s3_access_key }}
                s3_secret_key: {{ quay_s3_secret_key }}
                s3_bucket: {{ quay_s3_bucket }}
                storage_path: /datastorage/registry
          DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS:
            - s3Storage
          DISTRIBUTED_STORAGE_PREFERENCE:
            - s3Storage
  when:
    - deploy_quay_registry | bool
    - not (odf_available | bool)
    - quay_s3_bucket is defined
    - quay_s3_access_key is defined
    - quay_s3_secret_key is defined

- name: Create Quay Registry with ODF managed storage
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: quay.redhat.com/v1
      kind: QuayRegistry
      metadata:
        name: registry
        namespace: quay-enterprise
      spec:
        components:
          - kind: clair
            managed: true
            overrides:
              replicas: 1
          - kind: postgres
            managed: true
          - kind: objectstorage
            managed: true
          - kind: redis
            managed: true
          - kind: horizontalpodautoscaler
            managed: false
          - kind: route
            managed: true
          - kind: mirror
            managed: false
          - kind: monitoring
            managed: true
          - kind: tls
            managed: true
          - kind: quay
            managed: true
            overrides:
              replicas: 1
              resources:
                limits:
                  cpu: "4"
                  memory: 8Gi
                requests:
                  cpu: "2"
                  memory: 8Gi
          - kind: clairpostgres
            managed: true
  when:
    - deploy_quay_registry | bool
    - odf_available | bool

- name: Create Quay Registry with S3 storage
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: quay.redhat.com/v1
      kind: QuayRegistry
      metadata:
        name: registry
        namespace: quay-enterprise
      spec:
        configBundleSecret: quay-config-bundle
        components:
          - kind: clair
            managed: true
            overrides:
              replicas: 1
          - kind: postgres
            managed: true
          - kind: objectstorage
            managed: false
          - kind: redis
            managed: true
          - kind: horizontalpodautoscaler
            managed: false
          - kind: route
            managed: true
          - kind: mirror
            managed: false
          - kind: monitoring
            managed: true
          - kind: tls
            managed: true
          - kind: quay
            managed: true
            overrides:
              replicas: 1
              resources:
                limits:
                  cpu: "4"
                  memory: 8Gi
                requests:
                  cpu: "2"
                  memory: 8Gi
          - kind: clairpostgres
            managed: true
  when:
    - deploy_quay_registry | bool
    - not (odf_available | bool)

- name: Note about Quay Registry
  ansible.builtin.debug:
    msg: >-
      Quay operator is installed but QuayRegistry was not created.
      Set deploy_quay_registry=true to deploy. With ODF, object storage
      is managed automatically. Without ODF, provide S3 variables.
  when: not (deploy_quay_registry | bool)

---
# Omnigent server, its database, and - when omnigent_sandboxes is on - the
# second namespace its agent runner Pods live in.
#
# Built as Ansible rather than by applying upstream's Kustomize overlays.
# The overlays are good and this role follows their shape closely, but two
# things have to be woven into the Deployment itself: the oauth-proxy
# sidecar, and the LiteLLM gateway block inside the sandbox config. Running
# kustomize and then patching its output would need the kustomize CLI as a
# new control-host dependency and leave the result harder to read than the
# objects themselves.

# Caught before anything is created, because the failure it prevents is
# slow and misleading: the deploy succeeds, the session opens, the sandbox
# provisions, the host reports online - and only then does the harness die
# with "Native OpenCode terminal failed to start", from a 401 on the
# runner's first REST callback. See omnigent_auth in defaults/main.yml.
- name: Refuse header auth together with managed sandboxes
  ansible.builtin.assert:
    that:
      - not (omnigent_auth | bool and omnigent_sandboxes | bool)
    fail_msg: >-
      omnigent_auth is true (oauth-proxy, header mode) and
      omnigent_sandboxes is true, and those two cannot work together.
      Header mode cannot mint the bearer a managed-sandbox runner needs for
      its HTTP callbacks - server/auth.py mint_runner_token returns None
      for header/proxy identity - so every sandbox session reaches
      host_online and then fails its first REST call with HTTP 401.
      Pick one: set omnigent_auth=false to use Omnigent's built-in accounts
      (the admin credential is minted on the artifacts volume at
      OMNIGENT_ADMIN_CREDENTIALS_PATH), or set omnigent_sandboxes=false to
      keep OpenShift-identity login and run agents in the server pod.
    quiet: true

- name: Create the Omnigent namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ omnigent_namespace }}"
        labels:
          app.kubernetes.io/name: omnigent

# --- database ----------------------------------------------------------
# Postgres rather than the SQLite tier. SQLite pins the server to one
# replica and has no backup story; Postgres is what upstream calls the
# production default, and the cluster already runs this exact image for
# LiteLLM.
- name: Look for existing Omnigent database credentials
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ omnigent_namespace }}"
    name: omnigent-db-credentials
  register: omnigent_db_existing
  no_log: true

# Generated once and then left alone. Regenerating on every run would
# rotate the password out from under a database that still has the old one.
- name: Settle on the database password
  ansible.builtin.set_fact:
    omnigent_db_password: >-
      {{ (omnigent_db_existing.resources[0].data.POSTGRESQL_PASSWORD | b64decode)
         if (omnigent_db_existing.resources | length) > 0
         else lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}
  no_log: true

- name: Store the Omnigent database credentials
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: omnigent-db-credentials
        namespace: "{{ omnigent_namespace }}"
      type: Opaque
      stringData:
        POSTGRESQL_USER: "{{ omnigent_db_user }}"
        POSTGRESQL_PASSWORD: "{{ omnigent_db_password }}"
        POSTGRESQL_DATABASE: "{{ omnigent_db_name }}"
  no_log: true

- name: Create the Omnigent database volume
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: omnigent-db
        namespace: "{{ omnigent_namespace }}"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "{{ omnigent_db_storage }}"

- name: Deploy the Omnigent database
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: omnigent-db
        namespace: "{{ omnigent_namespace }}"
        labels: {app: omnigent-db}
      spec:
        replicas: 1
        selector:
          matchLabels: {app: omnigent-db}
        strategy:
          # The PVC is ReadWriteOnce, so a rolling update deadlocks: the new
          # pod cannot mount the volume until the old one lets go, and the
          # old one is not terminated until the new one is ready.
          type: Recreate
        template:
          metadata:
            labels: {app: omnigent-db}
          spec:
            containers:
              - name: postgresql
                image: "{{ omnigent_db_image }}"
                ports:
                  - {containerPort: 5432, name: postgresql}
                envFrom:
                  - secretRef:
                      name: omnigent-db-credentials
                readinessProbe:
                  exec:
                    command: ["/usr/libexec/check-container"]
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/pgsql/data
                resources:
                  requests: {cpu: 100m, memory: 256Mi}
                  limits: {cpu: "1", memory: 1Gi}
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: omnigent-db

- name: Create the Omnigent database service
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: omnigent-db
        namespace: "{{ omnigent_namespace }}"
      spec:
        selector: {app: omnigent-db}
        ports:
          - {name: postgresql, port: 5432, targetPort: 5432}

- name: Wait for the Omnigent database
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ omnigent_namespace }}"
    name: omnigent-db
  register: omnigent_db_ready
  until: >-
    omnigent_db_ready.resources | length > 0 and
    (omnigent_db_ready.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 30
  delay: 10

# The container's initdb creates POSTGRESQL_DATABASE only on a first boot
# against an empty data directory. This PVC already has one, so switching
# omnigent_db_name - which is what changing the sandbox provider does -
# gives the server a DATABASE_URL pointing at a database that was never
# created, and it fails with "database does not exist" after the deploy
# looks successful.
#
# CREATE DATABASE is not transactional and has no IF NOT EXISTS, hence the
# SELECT-then-create through \gexec rather than a bare statement. Idempotent
# and safe to re-run; it never touches an existing database's contents.
#
# As postgres, not as omnigent_db_user: the image creates the application
# role without CREATEDB, so the obvious spelling fails with "permission
# denied to create database". The superuser is reachable over the local
# socket inside the container without a password, which is why this is an
# exec rather than anything that needs a credential. OWNER hands the new
# database straight to the application role.
- name: Make sure this provider's database exists
  ansible.builtin.command:
    cmd: >-
      oc {{ ocp_context_arg }} exec -i -n {{ omnigent_namespace }}
      deployment/omnigent-db --
      psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tA
    stdin: |
      SELECT 'CREATE DATABASE {{ omnigent_db_name | trim }} OWNER {{ omnigent_db_user }}'
      WHERE NOT EXISTS (
        SELECT FROM pg_database WHERE datname = '{{ omnigent_db_name | trim }}'
      )\gexec
  register: omnigent_db_create
  changed_when: "'CREATE DATABASE' in (omnigent_db_create.stderr | default(''))"

# Sandboxes first, and the order matters: the credentials below are written
# into BOTH namespaces, and the runner one does not exist until this runs.
- name: Include the sandbox namespace and RBAC
  ansible.builtin.include_tasks: sandboxes.yml
  when: omnigent_sandboxes | bool

- name: Include the model-gateway wiring
  ansible.builtin.include_tasks: litellm.yml
  when: omnigent_use_litellm | bool

- name: Include the server
  ansible.builtin.include_tasks: server.yml

- name: Report where Omnigent is
  ansible.builtin.debug:
    msg: >-
      Omnigent is at https://{{ omnigent_host }} - sign in with your
      OpenShift account.
      {{ 'Agent sandboxes run as Pods in ' ~ omnigent_sandbox_namespace ~ '.'
         if omnigent_sandboxes | bool
         else 'Sandboxes are off; agents run inside the server pod.' }}
      {{ 'Models come from LiteLLM, so every model the cluster serves is available.'
         if omnigent_use_litellm | bool
         else 'No model gateway configured - add credentials to the omnigent-creds Secret.' }}

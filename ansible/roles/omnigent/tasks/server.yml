---
# The Omnigent server, its oauth-proxy, and the Route in front of both.

- name: Create the Omnigent artifact volume
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: omnigent-artifacts
        namespace: "{{ omnigent_namespace }}"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "{{ omnigent_artifacts_size }}"

- name: Get cluster ingress domain for Omnigent
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: omnigent_ingress

- name: Set the Omnigent hostname
  ansible.builtin.set_fact:
    omnigent_host: "omnigent-{{ omnigent_namespace }}.{{ omnigent_ingress.resources[0].spec.domain }}"

# Created once and reused. Rotating it on every run would invalidate every
# session the proxy has issued, logging everyone out for no reason - the
# same shape the attu and dashboard credentials use.
- name: Look for an existing proxy session secret
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ omnigent_namespace }}"
    name: omnigent-oauth-session
  register: omnigent_session
  when: omnigent_auth | bool
  no_log: true

- name: Generate the proxy session secret on first run
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: omnigent-oauth-session
        namespace: "{{ omnigent_namespace }}"
      type: Opaque
      stringData:
        session_secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  when:
    - omnigent_auth | bool
    - (omnigent_session.resources | default([])) | length == 0
  no_log: true

# Omnigent's own cookie secret, separate from the proxy's and used to sign
# its session cookies. Same create-once rule.
- name: Look for an existing Omnigent cookie secret
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ omnigent_namespace }}"
    name: omnigent-secrets
  register: omnigent_app_secret
  no_log: true

- name: Compose the Omnigent application secret
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: omnigent-secrets
        namespace: "{{ omnigent_namespace }}"
      type: Opaque
      stringData:
        # psycopg3 dialect explicitly. The entrypoint normalises a bare
        # postgres:// URL, but naming the driver means the connection
        # string says what it is.
        DATABASE_URL: >-
          postgresql+psycopg://{{ omnigent_db_user }}:{{ omnigent_db_password }}@omnigent-db.{{ omnigent_namespace }}.svc.cluster.local:5432/{{ omnigent_db_name }}
        OMNIGENT_ACCOUNTS_COOKIE_SECRET: >-
          {{ (omnigent_app_secret.resources[0].data.OMNIGENT_ACCOUNTS_COOKIE_SECRET | b64decode)
             if (omnigent_app_secret.resources | default([])) | length > 0
             else lookup('password', '/dev/null length=64 chars=hexdigits') | lower }}
  no_log: true

- name: Configure Omnigent
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: omnigent-config
        namespace: "{{ omnigent_namespace }}"
      data:
        HOST: "0.0.0.0"
        PORT: "8000"
        ARTIFACT_DIR: /data/artifacts
        OMNIGENT_FEATURES: "{{ omnigent_features }}"
        # Upstream points this at /data/admin-credentials, which is NOT on
        # the volume - the PVC mounts at /data/artifacts. There it is lost
        # on every restart, and on OpenShift the write fails outright,
        # because the container runs as an arbitrary high UID that has no
        # business writing to /data. Inside the mount it both persists and
        # succeeds: the SCC's fsGroup makes the volume group-writable.
        OMNIGENT_ADMIN_CREDENTIALS_PATH: /data/artifacts/admin-credentials
        OMNIGENT_AUTH_ENABLED: "1"
        # header, not accounts. The proxy in front has already established
        # who the user is; Omnigent reads the identity out of the header it
        # sets. accounts mode would also break sandboxes - it answers the
        # per-session runner dial-back with a 403.
        OMNIGENT_AUTH_PROVIDER: "{{ 'header' if omnigent_auth | bool else 'accounts' }}"
        OMNIGENT_AUTH_HEADER: "{{ omnigent_auth_header }}"
        OMNIGENT_ACCOUNTS_AUTO_OPEN: "0"
        OMNIGENT_ACCOUNTS_BASE_URL: "https://{{ omnigent_host }}"
        # The browser connects over the Route's hostname, so that origin
        # has to be allowed or every WebSocket is rejected and the UI
        # loads but never updates.
        OMNIGENT_WS_ALLOWED_ORIGINS: "https://{{ omnigent_host }}"

- name: Find the oauth-proxy image
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: image.openshift.io/v1
    kind: ImageStream
    namespace: openshift
    name: oauth-proxy
  register: omnigent_oauth_is
  when:
    - omnigent_auth | bool
    - omnigent_oauth_image | length == 0

- name: Settle on the oauth-proxy image
  ansible.builtin.set_fact:
    omnigent_oauth_image_resolved: >-
      {{ omnigent_oauth_image
         if omnigent_oauth_image | length > 0
         else (omnigent_oauth_is.resources[0].spec.tags[0].from.name
               | default('registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest')) }}
  when: omnigent_auth | bool

- name: Deploy Omnigent
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: omnigent
        namespace: "{{ omnigent_namespace }}"
        labels: {app: omnigent}
      spec:
        replicas: 1
        selector:
          matchLabels: {app: omnigent}
        strategy:
          # ReadWriteOnce artifact volume, same deadlock as the database.
          type: Recreate
        template:
          metadata:
            labels: {app: omnigent}
            # Rolls the pod when the sandbox config changes, and this is
            # not belt-and-braces: the server parses the sandbox: section
            # ONCE at startup - cli.py hands the parsed object to the
            # server as sandbox_config= - and holds that snapshot for its
            # whole life. A mounted ConfigMap updates the file underneath
            # it and changes nothing.
            #
            # Without this the failure is silent and easy to miss. The run
            # reports changed=1 on the ConfigMap, the new YAML is visibly
            # correct on the cluster, and every sandbox launched afterwards
            # still uses the config the pod read hours earlier. Measured
            # here: widening the model-provider families landed in the
            # ConfigMap and did nothing until the pod was rolled by hand.
            #
            # Hashing the rendered template rather than the live ConfigMap
            # keeps this independent of task order - sandboxes.yml writes
            # that object after this task has already run.
            annotations:
              omnigent.io/sandbox-config-checksum: >-
                {{ lookup('template', 'sandbox-config.yaml.j2') | hash('sha1') }}
          spec:
            serviceAccountName: "{{ 'omnigent-server' if omnigent_sandboxes | bool else 'default' }}"
            # runAsNonRoot without runAsUser, exactly as upstream's
            # openshift overlay has it. The image declares no USER, so it
            # would otherwise run as root; the SCC assigns a UID from the
            # namespace range and this asserts that one was assigned.
            securityContext:
              runAsNonRoot: true
            containers: "{{ [app_container] + ([oauth_container] if omnigent_auth | bool else []) }}"
            volumes: "{{ [artifact_volume]
                         + ([sandbox_volume] if omnigent_sandboxes | bool else [])
                         + ([openshell_gateway_volume]
                            if omnigent_sandbox_provider == 'openshell' else [])
                         + (oauth_volumes if omnigent_auth | bool else []) }}"
  vars:
    app_container:
      name: omnigent
      image: "{{ omnigent_image }}"
      ports:
        - {containerPort: 8000, name: http}
      envFrom:
        - configMapRef: {name: omnigent-config}
        - secretRef: {name: omnigent-secrets}
        - secretRef: {name: omnigent-creds, optional: true}
      # OMNIGENT_CONFIG whenever sandboxes are on, plus one more under the
      # openshell provider.
      #
      # There is deliberately no OPENSHELL_GATEWAY here. The server finds
      # its gateway through the SDK's from_active_cluster(), which reads CLI
      # state - ~/.config/openshell/active_gateway and the matching
      # gateways/<name>/metadata.json - and upstream is explicit that
      # "there is no base-URL or token knob in Omnigent". This role used to
      # guess at an OPENSHELL_GATEWAY variable as the one half a Deployment
      # can set; the POC's answer is better and is what the
      # openshell-gateway-config volume below supplies. Setting a bare
      # endpoint in the environment as well would only risk overriding a
      # registered gateway with one that has no auth_mode attached.
      #
      # OMNIGENT_RUNNER_ENV_PASSTHROUGH is listed in the sandbox config's
      # env: list, and upstream fails the launch loudly for a listed name
      # that is not set - so it has to exist here, not just be named there.
      env: "{{ ([{'name': 'OMNIGENT_CONFIG', 'value': '/etc/omnigent/config.yaml'}]
                if omnigent_sandboxes | bool else [])
               + ([{'name': 'OMNIGENT_RUNNER_ENV_PASSTHROUGH',
                    'value': omnigent_runner_env_passthrough | trim}]
                  if omnigent_sandbox_provider == 'openshell' else []) }}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts: "{{ [{'name': 'artifacts', 'mountPath': '/data/artifacts'}]
                        + ([{'name': 'sandbox-config', 'mountPath': '/etc/omnigent', 'readOnly': true}]
                           if omnigent_sandboxes | bool else [])
                        + ([{'name': 'openshell-gateway', 'mountPath': '/.config/openshell', 'readOnly': true}]
                           if omnigent_sandbox_provider == 'openshell' else []) }}"
      # Upstream's probes, plus a startupProbe they do not have. Their
      # liveness starts at 20s with a 30s period, and their own notes say
      # first-boot migrations take about a minute over the network - so on
      # a slow cluster the probe can kill the container mid-migration,
      # which is how a half-applied schema and a crash loop get made. The
      # startupProbe holds liveness off for up to five minutes and only
      # then hands over.
      startupProbe:
        httpGet: {path: /health, port: http}
        periodSeconds: 10
        failureThreshold: 30
      livenessProbe:
        httpGet: {path: /health, port: http}
        periodSeconds: 30
        timeoutSeconds: 5
      readinessProbe:
        httpGet: {path: /health, port: http}
        periodSeconds: 10
        timeoutSeconds: 5
      resources:
        requests: {cpu: "{{ omnigent_cpu_request }}", memory: "{{ omnigent_memory_request }}"}
        limits: {cpu: "{{ omnigent_cpu_limit }}", memory: "{{ omnigent_memory_limit }}"}
    oauth_container:
      name: oauth-proxy
      image: "{{ omnigent_oauth_image_resolved | default('') }}"
      ports:
        - {containerPort: 8443, name: https}
      args:
        - -provider=openshift
        - -https-address=:8443
        # Empty, so the proxy serves no plaintext listener at all.
        - -http-address=
        - -email-domain=*
        - -upstream=http://localhost:8000/
        # What makes header auth work: the proxy sets X-Forwarded-User and
        # X-Forwarded-Email upstream, and OMNIGENT_AUTH_HEADER reads the
        # second. Without it Omnigent sees no identity and rejects
        # everyone.
        - -pass-user-headers=true
        - -tls-cert=/etc/tls/private/tls.crt
        - -tls-key=/etc/tls/private/tls.key
        - -cookie-secret-file=/etc/proxy/secrets/session_secret
        - -openshift-service-account={{ 'omnigent-server' if omnigent_sandboxes | bool else 'default' }}
        - -openshift-sar={{ omnigent_oauth_sar | trim }}
        - -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - {name: omnigent-tls, mountPath: /etc/tls/private}
        - {name: omnigent-oauth-session, mountPath: /etc/proxy/secrets}
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 200m, memory: 256Mi}
    artifact_volume:
      name: artifacts
      persistentVolumeClaim: {claimName: omnigent-artifacts}
    sandbox_volume:
      name: sandbox-config
      configMap: {name: omnigent-sandbox-config}
    # OpenShell CLI state, shaped exactly as the SDK's from_active_cluster()
    # expects to find it on disk: a file naming the active gateway, and a
    # metadata.json for that gateway under gateways/<name>/. The openshell
    # role writes the Secret; this projects it to those two paths.
    #
    # optional: true on purpose. The Secret lives in this namespace but is
    # created by the openshell role, so a run with --tags omnigent that
    # skips openshell would otherwise leave the pod unschedulable on a
    # missing Secret rather than merely unable to reach a gateway.
    openshell_gateway_volume:
      name: openshell-gateway
      secret:
        secretName: openshell-gateway-config
        optional: true
        items:
          - key: active_gateway
            path: active_gateway
          - key: metadata.json
            path: "gateways/{{ openshell_gateway_name | default('openshellpoc') }}/metadata.json"
    oauth_volumes:
      - name: omnigent-tls
        secret: {secretName: omnigent-tls}
      - name: omnigent-oauth-session
        secret: {secretName: omnigent-oauth-session}

# Two ports when sandboxes are on: 443 for people, 80 for runners.
#
# 443 is the oauth-proxy. The serving-cert annotation has service-ca mint
# the certificate it presents, which is also what lets the Route reencrypt.
#
# 80 -> 8000 is the sandbox dial-back, and it is not optional. A runner
# connects back to sandbox.server_url, which is in-cluster Service DNS on
# plain port 80 - routing it out through the Route and back would depend on
# the proxy for traffic that never leaves the cluster, and the proxy would
# demand an OpenShift login the runner does not have.
#
# This port used to be published ONLY when auth was off, on the reasoning
# that "with no route to :8000, nothing can reach Omnigent without going
# through the proxy and setting X-Forwarded-Email itself". Two problems
# with that, and they point opposite ways.
#
# It broke the feature. With the proxy on - the default, and what runs here
# - the Service had no port 80 at all, so every managed sandbox sat at
# launch stage "starting" forever while the supervisor retried the
# dial-back every thirteen seconds:
#
#   Policy DNS mapped omnigent.omnigent.svc.cluster.local
#   resolved=172.30.190.204 synthetic=198.18.0.2 ports=80
#
# The policy allowed it; there was simply nothing listening. That is true
# for the kubernetes sandbox provider too, which is why it was never a
# visible bug - those sandboxes had not been exercised on this cluster.
#
# And it did not buy the security it claimed. A Service port is not a
# boundary: any pod can reach the omnigent pod's IP on :8000 directly,
# Service or no Service, and set X-Forwarded-Email to whatever it likes.
# Verified here by doing exactly that from a scratch pod. So publishing
# the port concedes nothing that was not already conceded.
#
# What WOULD close it is a NetworkPolicy on this pod admitting :8000 only
# from the sandbox namespaces and :8443 only from the router. Deliberately
# not added here: it is a pre-existing exposure rather than one this change
# creates, and a wrong ingress rule on a pod the kubelet also probes is a
# good way to take Omnigent down. Worth doing as its own change.
- name: Expose Omnigent
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: omnigent
        namespace: "{{ omnigent_namespace }}"
        labels: {app: omnigent}
        annotations: "{{ {'service.beta.openshift.io/serving-cert-secret-name': 'omnigent-tls'}
                         if omnigent_auth | bool else {} }}"
      spec:
        selector: {app: omnigent}
        ports: "{{ ([{'name': 'https', 'port': 443, 'targetPort': 8443}]
                    if omnigent_auth | bool else [])
                   + ([{'name': 'http', 'port': 80, 'targetPort': 8000}]
                      if (omnigent_sandboxes | bool) or not (omnigent_auth | bool)
                      else []) }}"

- name: Create the Omnigent route
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: omnigent
        namespace: "{{ omnigent_namespace }}"
        labels: {app: omnigent}
      spec:
        host: "{{ omnigent_host }}"
        to: {kind: Service, name: omnigent}
        port:
          targetPort: "{{ 'https' if omnigent_auth | bool else 'http' }}"
        tls:
          # reencrypt when the proxy holds a service-CA certificate, edge
          # otherwise. Either way the browser gets HTTP/2 from the router,
          # which matters here more than usual: over HTTP/1.1 browsers cap
          # about six connections per origin, and every open Omnigent
          # session holds a streaming response, so a seventh window hangs.
          termination: "{{ 'reencrypt' if omnigent_auth | bool else 'edge' }}"
          insecureEdgeTerminationPolicy: Redirect

- name: Wait for Omnigent to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ omnigent_namespace }}"
    name: omnigent
  register: omnigent_ready
  until: >-
    omnigent_ready.resources | length > 0 and
    (omnigent_ready.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 40
  delay: 15
  ignore_errors: true

- name: Report what Omnigent said when it would not start
  ansible.builtin.debug:
    msg: >-
      Omnigent is not ready. Its first boot runs database migrations and
      can take a few minutes; past that, "oc logs -n {{ omnigent_namespace }}
      deploy/omnigent -c omnigent" has the reason. A pod stuck
      CreateContainerConfigError usually means the omnigent-creds Secret is
      missing, and a CrashLoopBackOff right after a schema change is worth
      reading closely before restarting - a half-applied migration does not
      fix itself by trying again.
  when: omnigent_ready is failed

# --- the first admin account -----------------------------------------------
# Accounts mode starts with no users at all: the server logs "No admin yet.
# Open <url> to create the first admin account" and waits for a human. That
# is fine once, and wrong for a role that is supposed to hand back a working
# cluster - the summary role cannot print a credential nobody recorded, and
# the Ops Dashboard cannot show one either.
#
# So the password is minted here, kept in a Secret, and the account created
# through the server's own /auth/setup. Three properties worth having:
#
#   - generated, never written into the repo. This repo does not carry
#     credentials, so it is read back off the cluster the same way the
#     LiteLLM key is.
#   - stable across re-runs. The Secret is read first and only generated
#     when absent, so a re-run does not silently change the password
#     under someone who has already logged in.
#   - idempotent against an account that already exists. /auth/setup only
#     works while there is no admin; afterwards it refuses, which is
#     reported rather than treated as a failure.
#
# Only in accounts mode. Under the oauth-proxy there are no Omnigent
# accounts to create - identity comes from OpenShift.
- name: Look for an existing Omnigent admin credential
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ omnigent_namespace }}"
    name: omnigent-admin
  register: omnigent_admin_existing
  no_log: true
  when: not (omnigent_auth | bool)

- name: Settle on the Omnigent admin password
  ansible.builtin.set_fact:
    omnigent_admin_password: >-
      {{ (omnigent_admin_existing.resources[0].data.password | b64decode)
         if (omnigent_admin_existing.resources | default([]) | length > 0)
         else lookup('password', '/dev/null length=20 chars=ascii_letters,digits') }}
  no_log: true
  when: not (omnigent_auth | bool)

# Through the pod rather than the Route: no dependency on the router, on
# the ingress certificate, or on this host being able to resolve the public
# hostname. The image has no curl, so python does the POST.
#
# A non-200 here is almost always "an admin already exists", which is the
# expected answer on every run after the first.
- name: Create the first Omnigent admin account
  ansible.builtin.command:
    cmd: >-
      oc {{ ocp_context_arg }} exec -i -n {{ omnigent_namespace }}
      deployment/omnigent -c omnigent -- python -
    stdin: "{{ lookup('template', 'bootstrap_admin.py.j2') }}"
  register: omnigent_admin_setup
  changed_when: "'CREATED' in (omnigent_admin_setup.stdout | default(''))"
  failed_when: false
  no_log: true
  when:
    - not (omnigent_auth | bool)
    - omnigent_ready is not failed

- name: Say what the admin bootstrap did
  ansible.builtin.debug:
    msg: "{{ omnigent_admin_setup.stdout | default('(skipped)') | trim }}"
  when:
    - not (omnigent_auth | bool)
    - omnigent_ready is not failed

# Written only when the account is ours - either we just created it, or the
# Secret already held the password that works. Storing a password that does
# NOT open the account would be worse than storing none: the dashboard would
# show it and people would trust it.
- name: Record the Omnigent admin credential
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: omnigent-admin
        namespace: "{{ omnigent_namespace }}"
        annotations:
          omnigent.local/purpose: >-
            First admin account for Omnigent accounts-mode login. Generated
            on first run and read back by the summary role for the Ops
            Dashboard. Rotate with POST /auth/users/me/password, then update
            this Secret or delete it and re-run.
      type: Opaque
      stringData:
        username: "{{ omnigent_admin_user }}"
        password: "{{ omnigent_admin_password }}"
  no_log: true
  when:
    - not (omnigent_auth | bool)
    - omnigent_ready is not failed
    - "'VERIFIED' in (omnigent_admin_setup.stdout | default(''))"

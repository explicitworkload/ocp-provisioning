---
# Omnigent - an open-source "meta-harness" that orchestrates agent CLIs
# (Claude Code, Codex, Cursor, Pi) behind one server, with policies,
# sandboxing and shareable live sessions. https://omnigent.ai
#
# Apache-2.0, github.com/omnigent-ai/omnigent. Upstream ships Kustomize
# manifests under deploy/kubernetes, including openshift and
# sandbox-runners overlays; this role builds the same objects as Ansible so
# it can wire in two things the overlays do not: an oauth-proxy in front,
# and the cluster's own LiteLLM as the model gateway.
#
# PINNED, and not to latest: this is software that runs LLM-authored code
# with real credentials, and "latest" on that is not a version, it is a
# surprise.
#
# This said v0.1.1 until 2026-10-17, and NO SUCH TAG EXISTS. The pod sat in
# ImagePullBackOff on sandbox235 with
#
#   reading manifest v0.1.1 in ghcr.io/omnigent-ai/omnigent-server-kubernetes:
#   manifest unknown
#
# so the Service had no endpoints and the Route answered 503. The real
# releases are v0.0.1rc1, v0.0.1rc2, then v0.5.0 onward - the 0.1.x line
# never existed.
#
# v0.18.0 is the newest stable at time of writing, is what :latest resolves
# to (both sha256:eba3422ee55ef946bff7c895f458258fbaf4a5e4244ef38aa66caec8
# fefe9198), and is a two-platform index (amd64, arm64). Verified running on
# sandbox235.
#
# To move it, list the tags and take the newest matching vN.N.N - skip the
# rc, .dev and sha- ones:
#   TOK=$(curl -s 'https://ghcr.io/token?scope=repository:omnigent-ai/\
#     omnigent-server-kubernetes:pull' | jq -r .token)
#   curl -s -H "Authorization: Bearer $TOK" \
#     'https://ghcr.io/v2/omnigent-ai/omnigent-server-kubernetes/tags/list?n=500'
#
# Expect the config schema to move with it; see the comment in
# templates/sandbox-config.yaml.j2 about the resources block.
omnigent_version: v0.18.0

# Which sandbox runtime agent sessions get. Two supported values, and the
# image below follows this rather than being set separately.
#
#   openshell   The default. Each session runs under NVIDIA OpenShell,
#               which adds Landlock on the filesystem, seccomp on syscalls
#               and a deny-by-default egress proxy that brokers credentials
#               so the agent holds placeholders rather than keys. Needs the
#               openshell role (deploy_openshell) and a kernel with Landlock
#               ABI 2+, which RHCOS 9.8 has. Run end to end on sandbox544.
#   kubernetes  Each session is a plain Pod in omnigent_sandbox_namespace,
#               bounded only by RBAC and the namespace. Run end to end on
#               sandbox2914.
#
# This is a first-party upstream provider, not something bolted on here:
# omnigent/onboarding/sandboxes/openshell.py is 635 lines with an 849-line
# test file, and upstream ships a kustomize overlay for it.
omnigent_sandbox_provider: openshell

# The build variant has to match the provider. Both are the same server
# with a different extra compiled in - OMNIGENT_EXTRAS=kubernetes or
# =openshell - and the provider cannot import its client without the right
# one, so a mismatch fails at launch rather than at deploy.
#
# Under openshell this is the aicatalyst-team POC's fork, not upstream:
# quay.io/aicatalyst/omnigent-server-openshell:v0.0.14, from the
# scOpenshellProviders branch. It adds three sandbox-config keys upstream
# does not have - a providers list, a node_selector and a runtime_class.
#
# The providers list is not a nicety, it is what makes the sandbox usable,
# and that was established the hard way. Upstream v0.18.0 was deployed here
# first and its OpenShellSandboxLauncher takes only image, env, cluster and
# workspace - there is no way to attach a provider or a policy to a sandbox
# it creates. OpenShell is deny-by-default, providers do NOT auto-attach to
# a workspace's sandboxes, and the POC's sandbox image bakes a policy that
# allows Anthropic, npm, PyPI and the omnigent dial-back but says nothing
# about this cluster's model gateway. Measured on sandbox544:
#
#   sandbox with no providers      -> curl to the gateway returns nothing
#   sandbox with providers=[...]   -> returns the full /v1/models list
#
# So on upstream the agent starts, is correctly confined, and cannot reach
# a model. The fork is the fix.
#
# --- the database ------------------------------------------------------
# v0.0.14 is the fork's own counter on an older upstream base, so its
# alembic head is behind upstream's. Pointed at a database upstream v0.18.0
# has already migrated, it refuses to start, and is right to:
#
#   RuntimeError: Omnigent database schema is newer than this version of
#   Omnigent (found revision 'mm1a2b3c4d5e', latest supported revision
#   'll1a2b3c4d5e'). Upgrade Omnigent before using this database.
#
# A down-migration would silently drop columns, so the answer is a separate
# database rather than a destroyed one - see omnigent_db_name below.
omnigent_openshell_image: "quay.io/aicatalyst/omnigent-server-openshell:v0.0.14"
omnigent_image_repo: "ghcr.io/omnigent-ai/omnigent-server-kubernetes"
omnigent_image: >-
  {{ omnigent_openshell_image
     if omnigent_sandbox_provider == 'openshell'
     else (omnigent_image_repo ~ ':' ~ omnigent_version) }}

omnigent_namespace: omnigent
omnigent_sandbox_namespace: omnigent-sandboxes

# --- storage -----------------------------------------------------------
# /data/artifacts in the container. Session artifacts and the minted cookie
# secret live here.
omnigent_artifacts_size: 10Gi
omnigent_db_storage: 10Gi
omnigent_db_image: "registry.redhat.io/rhel9/postgresql-16:latest"
# One Postgres, one database per server build, because the two builds
# disagree about the schema and neither can read the other's.
#
# The openshell path gets its own rather than taking over the existing one.
# Upstream v0.18.0 migrated "omnigent" to revision mm1a2b3c4d5e and the
# fork's head is ll1a2b3c4d5e; the fork would have to be given an empty
# database either way. Giving it a new one instead of truncating the old
# one costs a few megabytes and means switching
# omnigent_sandbox_provider back to kubernetes finds its data intact,
# rather than finding whatever the fork left behind.
#
# tasks/main.yml creates the extra database. The container's own initdb
# only runs POSTGRESQL_DATABASE on a first boot against an empty data
# directory, which this PVC stopped being 21 hours ago.
omnigent_db_name: >-
  {{ 'omnigent_openshell' if omnigent_sandbox_provider == 'openshell'
     else 'omnigent' }}
omnigent_db_user: omnigent

# --- auth --------------------------------------------------------------
# An oauth-proxy sidecar terminates TLS, authenticates against the cluster,
# and passes the identity upstream as X-Forwarded-Email; Omnigent runs in
# "header" mode and trusts that header.
#
# true  -> header mode: an oauth-proxy sidecar authenticates against the
#          cluster and passes identity upstream as X-Forwarded-Email.
# false -> accounts mode: Omnigent's own built-in accounts, no sidecar.
#
# MUST be false when sandboxes are on. This is not a preference, it is a
# hard incompatibility, and it cost a demo's worth of debugging to find.
#
# A managed sandbox has no logged-in user, so the server has to mint a
# bearer for the runner's HTTP callbacks. From server/auth.py:
#
#   mint_runner_token - Mint a short-lived bearer a managed-sandbox runner
#   presents as user_id. [...] Header/proxy mode returns None - identity
#   there is asserted by the upstream proxy and can't be minted
#   server-side.
#
# Accounts and OIDC sign one; header mode cannot. So under header mode the
# runner's tunnel connects fine - the host token carries that, and the
# session really does reach host_online: true - and then every REST call it
# makes is refused:
#
#   GET /v1/sessions/<id>/agent/contents -> HTTP 401
#   RuntimeError: spec_resolver: ... failed with HTTP 401
#   -> "Native OpenCode terminal failed to start"
#
# which reads like a broken harness and is actually an auth mode that
# cannot serve a sandbox.
#
# This block used to claim the opposite - that "accounts mode REFUSES the
# per-session runner dial-back with a 403, so it cannot be combined with
# the kubernetes sandbox provider at all". That is backwards: accounts and
# OIDC are the only two modes that CAN serve a managed sandbox. It is also
# why the aicatalyst POC runs Keycloak OIDC; that was load-bearing, not
# incidental plumbing for their cluster.
#
# The cost of false: cluster users no longer get in with their OpenShift
# identity, and there is an Omnigent password to hand out and revoke. The
# admin credential is minted on first boot at
# OMNIGENT_ADMIN_CREDENTIALS_PATH on the artifacts volume.
#
# Choose oidc instead of accounts if this ever becomes multi-user and an
# IdP exists to point at; the role does not template that yet.
#
# Follows omnigent_sandboxes: OpenShift login whenever it can work, built-in
# accounts when it cannot.
#
# This used to be a flat true, with the reasoning that turning sandboxes on
# should never silently downgrade anyone's authentication. That only holds if
# sandboxes default to off, and they default to on - so the shipped defaults
# were exactly the combination tasks/main.yml refuses, and every fresh
# all.yml copied from the sample failed there. sandbox2914 hit it 45 minutes
# into its first run.
#
# Deriving it keeps the original intent without the trap. Turn sandboxes off
# and this goes back to true. Set omnigent_auth: true explicitly alongside
# sandboxes and the refusal still fires, which is the "decision rather than
# a surprise" the check exists for.
omnigent_auth: "{{ not (omnigent_sandboxes | bool) }}"

# The first account created in accounts mode. Its password is generated on
# first run, stored in the omnigent-admin Secret, and read back by the
# summary role for the Ops Dashboard - never written into this repo.
omnigent_admin_user: admin
omnigent_auth_header: X-Forwarded-Email

# Who may log in. The default admits anyone who can get a token for this
# cluster; tighten it to a namespace or a verb if that is too broad.
omnigent_oauth_sar: >-
  {"namespace":"{{ omnigent_namespace }}","resource":"services","verb":"get"}

# Empty means "ask the cluster", which is what the milvus role does for
# Attu - the oauth-proxy ImageStream in the openshift namespace tracks the
# payload version, so it stays right across upgrades.
omnigent_oauth_image: ""

# --- model access ------------------------------------------------------
# Omnigent treats LiteLLM as a gateway, so agents reach every model the
# cluster already serves through one base_url and one key, and nothing here
# needs its own Anthropic or OpenAI credential. The key is read off the
# cluster at run time, never written to this repo.
omnigent_use_litellm: true

# Under openshell this has to be the LiteMaaS alias, not LiteLLM's own
# Service name, even though they are the same server.
#
# The sandbox's egress is enforced by hostname. What the policy permits is
# whatever the attached provider's profile names, and the litemaas profile
# names litemaas-litellm.litemaas.svc.cluster.local - so a host_config
# pointing at litellm.litellm.svc.cluster.local is denied, silently, and
# the harness reports it as a model error rather than a policy one. The
# alias Service makes both names reach the same place; only one of them is
# allowed to.
#
# Unchanged for the kubernetes provider, which has no egress policy at all
# and should keep talking to LiteLLM directly rather than through an alias
# that only exists for OpenShell's benefit.
omnigent_litellm_url: >-
  {{ 'http://' ~ (openshell_litemaas_service | default('litemaas-litellm'))
     ~ '.' ~ (openshell_litemaas_namespace | default('litemaas'))
     ~ '.svc.cluster.local:4000/v1'
     if omnigent_sandbox_provider == 'openshell'
     else 'http://litellm.' ~ (litellm_namespace | default('litellm'))
          ~ '.svc.cluster.local:4000/v1' }}

# --- sandboxes ---------------------------------------------------------
# Agent sessions run as their own short-lived Pods in a separate namespace
# instead of inside the server. Worth understanding before enabling: the
# server gets create/delete on Pods and Secrets in that namespace, and the
# code it runs there is written by a model. The Role deliberately excludes
# pods/exec, and the runner ServiceAccount is powerless.
omnigent_sandboxes: true

# The ServiceAccount kubernetes-provider session pods run as, and the one
# granted the nonroot-v2 SCC in omnigent_sandbox_namespace.
#
# The SCC grant is not optional. Upstream's launcher hardcodes the pod's
# runAsUser, runAsGroup and fsGroup to 1000660000 - the "sandbox" user baked
# into its host image, which it must match or whoami and git commit break
# inside the session. OpenShift's restricted-v2 only admits a UID inside the
# namespace's own allocated range, and that range is assigned per cluster,
# so the pod was refused by every SCC and the Job never made a pod:
#
#   Kubernetes sandbox job 'omnigent-managed-...' did not create a child
#   pod within 90s.
#   ... unable to validate against any security context constraint:
#   restricted-v2: .spec.securityContext.fsGroup: Invalid value: [1000660000]
#
# which the UI reports only as being unable to connect to the host. Found
# on sandbox2914, where the namespace's range was 1001110000/10000 and
# 1000660000 happened to belong to openshift-catalogd.
#
# nonroot-v2 is the SCC that fits, and the only simple one that does. It
# admits any non-root UID and the runtime/default seccomp profile. anyuid was
# tried first and does NOT work: it permits no seccomp profile at all, and
# the launcher hardcodes seccompProfile: RuntimeDefault, so anyuid refused
# the pod on seccomp even with the binding in place.
#
# What it loosens is small. The pod still sets runAsNonRoot: true and drops
# all capabilities, and nonroot-v2 itself refuses root. The ServiceAccount is
# the namespace's default one, which holds no rights, and the pod spec sets
# automountServiceAccountToken: false, so no cluster credential reaches the
# session either way.
omnigent_runner_service_account: default
# The image an agent session runs in. Upstream's default is
# ghcr.io/omnigent-ai/omnigent-host:latest, and :latest is how this repo has
# already been bitten twice - so it is pinned to the server's own version,
# which is published in step with it.
#
# Under the openshell provider this image must carry a non-root "sandbox"
# user, iproute2 and nftables, or the supervisor cannot build the network
# namespace. Upstream's own check:
#   podman run --rm --entrypoint sh <image> -lc 'id sandbox && command -v ip && command -v nft'
# Empty under the kubernetes provider, which leaves upstream's own default -
# deliberately NOT pinned here, because changing what the tested path runs
# is not something an untested openshell draft should do on its way in.
#
# Pinned under openshell, where the image is not interchangeable: it must
# carry a non-root "sandbox" user, iproute2 and nftables or the supervisor
# cannot build the network namespace. Upstream's check:
#   podman run --rm --entrypoint sh <image> -lc 'id sandbox && command -v ip && command -v nft'
#
# This used to name upstream's omnigent-host, which does NOT meet that
# contract - it runs as root for the Modal/Daytona providers. The POC built
# a UBI 10 image specifically to meet it, and that is what this uses; see
# openshell_sandbox_image in roles/openshell/defaults/main.yml for what is
# in it. Kept as one value shared with that role so the gateway default and
# the per-sandbox override cannot drift apart.
omnigent_sandbox_host_image: >-
  {{ openshell_sandbox_image | default('quay.io/aicatalyst/omnigent-host-openshell:v0.1.19')
     if omnigent_sandbox_provider == 'openshell' else '' }}
omnigent_sandbox_cpu_request: "500m"
omnigent_sandbox_cpu_limit: "2"
omnigent_sandbox_memory_request: 1Gi
omnigent_sandbox_memory_limit: 4Gi

# --- server sizing -----------------------------------------------------
# Upstream's base manifest asks 512Mi/250m and caps at 1Gi/1000m.
omnigent_cpu_request: "250m"
omnigent_cpu_limit: "1"
omnigent_memory_request: 512Mi
omnigent_memory_limit: 1Gi

# Comma-separated release features, all off by default upstream. Changing
# this needs a Deployment restart - each pod reads one snapshot at startup.
omnigent_features: ""

# --- openshell provider ----------------------------------------------------
# Only read when omnigent_sandbox_provider is openshell.

# Server environment variable NAMES whose values are copied into each
# sandbox at provision time. This is the only route by which a credential
# reaches the agent, and upstream is clear that "a listed name that is not
# set fails the launch loudly" - so everything here must actually exist in
# the server's environment.
#
# LITELLM_API_KEY rather than ANTHROPIC_API_KEY and friends, because on this
# cluster every model is reached through the LiteLLM gateway and there is no
# vendor key to pass.
#
# OMNIGENT_RUNNER_ENV_PASSTHROUGH is not a credential and is not optional:
# OpenShell forces egress through a proxy, and without forwarding the proxy
# variables into the runner the agent ignores the proxy and every request
# fails closed.
# LITEMAAS_API_KEY is the name the POC's sandbox image expects: its baked
# opencode.json reads "{env:LITEMAAS_API_KEY}". The value is this cluster's
# LiteLLM key - the openshell role aliases the LiteMaaS hostname onto
# LiteLLM, and this aliases the variable name the same way, so the image
# needs no rebuild. LITELLM_API_KEY stays for the omnigent harness's own
# host_config, which reads that name.
omnigent_openshell_env:
  - LITELLM_API_KEY
  - LITEMAAS_API_KEY
  - ANTHROPIC_BASE_URL
  - ANTHROPIC_AUTH_TOKEN
  - ANTHROPIC_MODEL
  - CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT
  - OMNIGENT_RUNNER_ENV_PASSTHROUGH

# Widened to the POC's list. The proxy variables are the load-bearing ones -
# OpenShell forces egress through its policy proxy, and a runner that does
# not inherit them ignores the proxy and fails closed on every request.
#
# LITEMAAS_API_KEY has to be here as well as in the list above: the first
# gets it into the sandbox, this gets it from the sandbox's shell into the
# runner subprocess that actually runs the agent CLI.
#
# GH_TOKEN is listed by the POC and deliberately not set here - no GitHub
# credential is issued on this cluster. A name listed here but unset is
# simply not forwarded; only the sandbox config's env: list fails loudly on
# a missing name.
omnigent_runner_env_passthrough: >-
  https_proxy,http_proxy,HTTPS_PROXY,HTTP_PROXY,ALL_PROXY,all_proxy,NO_PROXY,no_proxy,LITEMAAS_API_KEY,ANTHROPIC_BASE_URL,ANTHROPIC_AUTH_TOKEN,ANTHROPIC_MODEL,CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT,SSL_CERT_FILE,NODE_EXTRA_CA_CERTS

# Claude Code against this cluster's models instead of Anthropic's API.
#
# LiteLLM serves an Anthropic-compatible /v1/messages, so ANTHROPIC_BASE_URL
# is all Claude Code needs to talk to it - no Anthropic account, no vendor
# key, and the same models every other workload here uses. Verified against
# this cluster: an anthropic-version request to /v1/messages answers 200.
#
# Under the openshell provider this points at the LiteMaaS alias rather than
# litellm's own Service name, for the same reason omnigent_litellm_url does:
# the sandbox's egress policy is enforced by hostname, and the alias is the
# name the litemaas provider profile permits.
#
# Under kubernetes it must NOT, and it used to, unconditionally. The alias
# is a Service the openshell role creates; with openshell not deployed it
# does not exist, so on sandbox2914 every Claude Code request died on DNS
# (curl exit 6 from inside the session pod) while litellm's own Service
# answered 200 a line later. It looked like a model that never replied,
# and the catalogue lookup failing the same way left the picker showing
# only the default model. Switches exactly as omnigent_litellm_url does.
#
# No /v1 suffix - Claude Code appends its own path.
omnigent_anthropic_base_url: >-
  {{ 'http://' ~ (openshell_litemaas_service | default('litemaas-litellm'))
     ~ '.' ~ (openshell_litemaas_namespace | default('litemaas'))
     ~ '.svc.cluster.local:4000'
     if omnigent_sandbox_provider == 'openshell'
     else 'http://litellm.' ~ (litellm_namespace | default('litellm'))
          ~ '.svc.cluster.local:4000' }}

# Which of this cluster's models Claude Code drives. Chosen by testing all
# of them through the Anthropic-compatible endpoint from inside a sandbox,
# because most of them do not survive the translation:
#
#   qwen36-35b-a3b             answers. This one.
#   qwen38-27b                 400 "System message must be at the
#                              beginning" - the chat template rejects the
#                              message order LiteLLM produces
#   granite-3-2-8b-instruct    400, model not accessible by that name
#   Mistral-Small-4-119B-2603  400, Claude Code asks for 32000 completion
#                              tokens and the model caps at 16384
#   gpt-oss-120b               responds but noisily
#
# So this is not a preference, it is the model that works. Re-test before
# changing it.
omnigent_anthropic_model: qwen36-35b-a3b

# Which model-family scopes the LiteLLM gateway is the default provider
# for, written into host_config.providers.litellm.default.
#
# All three, which is a deliberate widening. It used to be [pi] alone, and
# the visible symptom was a model picker with exactly one entry in it: pi
# had a gateway and nothing else did, so Claude Code had no catalog to list
# and fell back to the single ANTHROPIC_MODEL env var. Every other model
# LiteLLM serves was reachable from the cluster and invisible from the UI.
#
#   anthropic  native Claude Code
#   openai     Codex and opencode
#   pi         omnigent's own agent
#
# Narrow this if a family should keep a different default provider; an
# empty list leaves the gateway configured but default for nothing, which
# puts the one-model picker back.
#
# Listing a family here does NOT promise every catalogue entry works
# through it. The picker shows what LiteLLM advertises, and on this cluster
# that includes an embedding model and a document converter that cannot
# chat at all - see the notes on omnigent_anthropic_model for which of the
# chat models actually survive the Anthropic translation.
omnigent_gateway_default_families:
  - anthropic
  - openai
  - pi

# Claude Code refuses to size a context window for a model it has never
# heard of, and none of this cluster's models are in its catalogue. Without
# this it prints a paragraph of advice about modelPicker rows on every
# single turn. It only disables the warning, not the model.
omnigent_claude_disable_model_window_check: "1"

# Empty means "use the active gateway", which is the registered one the
# openshell role writes into the openshell-gateway-config Secret. Set this
# only to pin a different registered gateway by name.
omnigent_openshell_gateway: ""

# Sweep up sandboxes whose runner stopped checking in. Each one is a Pod
# plus a workspace PVC, so an abandoned demo session costs storage until
# something collects it. The clock starts at the last check-in, not at
# creation, so a live session is never reaped out from under anyone.
# Which gateway-side providers get attached to every sandbox. Derived from
# what the openshell role actually created, so the two cannot drift: naming
# a provider here that does not exist on the gateway fails the launch.
#
# Not optional in practice. A sandbox with no provider is denied egress to
# the model gateway, so the agent starts correctly confined and then cannot
# reach a model.
omnigent_openshell_providers: >-
  {{ openshell_providers | default([])
     | map(attribute='profile')
     | map('regex_replace', '^', (openshell_provider_prefix | default('sandbox')) ~ '-')
     | list }}

omnigent_openshell_reaper: true
omnigent_openshell_reap_after_days: 1
omnigent_openshell_reap_interval: 3600

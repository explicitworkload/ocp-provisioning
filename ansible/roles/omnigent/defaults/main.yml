---
# Omnigent - an open-source "meta-harness" that orchestrates agent CLIs
# (Claude Code, Codex, Cursor, Pi) behind one server, with policies,
# sandboxing and shareable live sessions. https://omnigent.ai
#
# Apache-2.0, github.com/omnigent-ai/omnigent. Upstream ships Kustomize
# manifests under deploy/kubernetes, including openshift and
# sandbox-runners overlays; this role builds the same objects as Ansible so
# it can wire in two things the overlays do not: an oauth-proxy in front,
# and the cluster's own LiteLLM as the model gateway.
#
# PINNED, and not to latest: this is software that runs LLM-authored code
# with real credentials, and "latest" on that is not a version, it is a
# surprise.
#
# This said v0.1.1 until 2026-10-17, and NO SUCH TAG EXISTS. The pod sat in
# ImagePullBackOff on sandbox235 with
#
#   reading manifest v0.1.1 in ghcr.io/omnigent-ai/omnigent-server-kubernetes:
#   manifest unknown
#
# so the Service had no endpoints and the Route answered 503. The real
# releases are v0.0.1rc1, v0.0.1rc2, then v0.5.0 onward - the 0.1.x line
# never existed.
#
# v0.18.0 is the newest stable at time of writing, is what :latest resolves
# to (both sha256:eba3422ee55ef946bff7c895f458258fbaf4a5e4244ef38aa66caec8
# fefe9198), and is a two-platform index (amd64, arm64). Verified running on
# sandbox235.
#
# To move it, list the tags and take the newest matching vN.N.N - skip the
# rc, .dev and sha- ones:
#   TOK=$(curl -s 'https://ghcr.io/token?scope=repository:omnigent-ai/\
#     omnigent-server-kubernetes:pull' | jq -r .token)
#   curl -s -H "Authorization: Bearer $TOK" \
#     'https://ghcr.io/v2/omnigent-ai/omnigent-server-kubernetes/tags/list?n=500'
#
# Expect the config schema to move with it; see the comment in
# templates/sandbox-config.yaml.j2 about the resources block.
omnigent_version: v0.18.0

# Which sandbox runtime agent sessions get. Two supported values, and the
# image below follows this rather than being set separately.
#
#   kubernetes  Each session is a Pod in omnigent_sandbox_namespace. The
#               boundary is Kubernetes RBAC and the namespace. This is the
#               tested path.
#   openshell   Each session runs under NVIDIA OpenShell, which adds
#               Landlock on the filesystem, seccomp on syscalls and a
#               deny-by-default egress proxy that brokers credentials so
#               the agent holds placeholders rather than keys. Needs the
#               openshell role to have run, and OpenShift 4.19+ for the
#               Landlock backport. NOT YET TESTED - see that role.
#
# This is a first-party upstream provider, not something bolted on here:
# omnigent/onboarding/sandboxes/openshell.py is 635 lines with an 849-line
# test file, and upstream ships a kustomize overlay for it.
omnigent_sandbox_provider: kubernetes

# The build variant has to match the provider. Both are the same server
# with a different extra compiled in - OMNIGENT_EXTRAS=kubernetes or
# =openshell - and the provider cannot import its client without the right
# one, so a mismatch fails at launch rather than at deploy. Both variants
# publish the same version tags; v0.18.0 was confirmed present on each.
omnigent_image_repo: >-
  ghcr.io/omnigent-ai/omnigent-server-{{
  'openshell' if omnigent_sandbox_provider == 'openshell' else 'kubernetes' }}
omnigent_image: "{{ omnigent_image_repo | trim }}:{{ omnigent_version }}"

omnigent_namespace: omnigent
omnigent_sandbox_namespace: omnigent-sandboxes

# --- storage -----------------------------------------------------------
# /data/artifacts in the container. Session artifacts and the minted cookie
# secret live here.
omnigent_artifacts_size: 10Gi
omnigent_db_storage: 10Gi
omnigent_db_image: "registry.redhat.io/rhel9/postgresql-16:latest"
omnigent_db_name: omnigent
omnigent_db_user: omnigent

# --- auth --------------------------------------------------------------
# An oauth-proxy sidecar terminates TLS, authenticates against the cluster,
# and passes the identity upstream as X-Forwarded-Email; Omnigent runs in
# "header" mode and trusts that header.
#
# header mode rather than Omnigent's built-in accounts, for two reasons.
# Cluster users get in with their OpenShift identity and there is no second
# password to hand out or revoke. And accounts mode REFUSES the per-session
# runner dial-back with a 403, so it cannot be combined with the kubernetes
# sandbox provider at all - upstream's own sandbox-runners README says so.
#
# The trust is only safe because the Service publishes the proxy's port and
# nothing else: anything that could reach :8000 directly could set that
# header and be anyone. Do not add an 8000 port to the Service.
omnigent_auth: true
omnigent_auth_header: X-Forwarded-Email

# Who may log in. The default admits anyone who can get a token for this
# cluster; tighten it to a namespace or a verb if that is too broad.
omnigent_oauth_sar: >-
  {"namespace":"{{ omnigent_namespace }}","resource":"services","verb":"get"}

# Empty means "ask the cluster", which is what the milvus role does for
# Attu - the oauth-proxy ImageStream in the openshift namespace tracks the
# payload version, so it stays right across upgrades.
omnigent_oauth_image: ""

# --- model access ------------------------------------------------------
# Omnigent treats LiteLLM as a gateway, so agents reach every model the
# cluster already serves through one base_url and one key, and nothing here
# needs its own Anthropic or OpenAI credential. The key is read off the
# cluster at run time, never written to this repo.
omnigent_use_litellm: true
omnigent_litellm_url: "http://litellm.{{ litellm_namespace | default('litellm') }}.svc.cluster.local:4000/v1"

# --- sandboxes ---------------------------------------------------------
# Agent sessions run as their own short-lived Pods in a separate namespace
# instead of inside the server. Worth understanding before enabling: the
# server gets create/delete on Pods and Secrets in that namespace, and the
# code it runs there is written by a model. The Role deliberately excludes
# pods/exec, and the runner ServiceAccount is powerless.
omnigent_sandboxes: true
# The image an agent session runs in. Upstream's default is
# ghcr.io/omnigent-ai/omnigent-host:latest, and :latest is how this repo has
# already been bitten twice - so it is pinned to the server's own version,
# which is published in step with it.
#
# Under the openshell provider this image must carry a non-root "sandbox"
# user, iproute2 and nftables, or the supervisor cannot build the network
# namespace. Upstream's own check:
#   podman run --rm --entrypoint sh <image> -lc 'id sandbox && command -v ip && command -v nft'
# Empty under the kubernetes provider, which leaves upstream's own default -
# deliberately NOT pinned here, because changing what the tested path runs
# is not something an untested openshell draft should do on its way in.
#
# Pinned under openshell, where the image is not interchangeable: it must
# carry a non-root "sandbox" user, iproute2 and nftables or the supervisor
# cannot build the network namespace. Upstream's check:
#   podman run --rm --entrypoint sh <image> -lc 'id sandbox && command -v ip && command -v nft'
omnigent_sandbox_host_image: >-
  {{ ('ghcr.io/omnigent-ai/omnigent-host:' ~ omnigent_version)
     if omnigent_sandbox_provider == 'openshell' else '' }}
omnigent_sandbox_cpu_request: "500m"
omnigent_sandbox_cpu_limit: "2"
omnigent_sandbox_memory_request: 1Gi
omnigent_sandbox_memory_limit: 4Gi

# --- server sizing -----------------------------------------------------
# Upstream's base manifest asks 512Mi/250m and caps at 1Gi/1000m.
omnigent_cpu_request: "250m"
omnigent_cpu_limit: "1"
omnigent_memory_request: 512Mi
omnigent_memory_limit: 1Gi

# Comma-separated release features, all off by default upstream. Changing
# this needs a Deployment restart - each pod reads one snapshot at startup.
omnigent_features: ""

# --- openshell provider ----------------------------------------------------
# Only read when omnigent_sandbox_provider is openshell.

# Server environment variable NAMES whose values are copied into each
# sandbox at provision time. This is the only route by which a credential
# reaches the agent, and upstream is clear that "a listed name that is not
# set fails the launch loudly" - so everything here must actually exist in
# the server's environment.
#
# LITELLM_API_KEY rather than ANTHROPIC_API_KEY and friends, because on this
# cluster every model is reached through the LiteLLM gateway and there is no
# vendor key to pass.
#
# OMNIGENT_RUNNER_ENV_PASSTHROUGH is not a credential and is not optional:
# OpenShell forces egress through a proxy, and without forwarding the proxy
# variables into the runner the agent ignores the proxy and every request
# fails closed.
omnigent_openshell_env:
  - LITELLM_API_KEY
  - OMNIGENT_RUNNER_ENV_PASSTHROUGH

omnigent_runner_env_passthrough: "https_proxy,http_proxy,HTTPS_PROXY,HTTP_PROXY,NO_PROXY,no_proxy"

# Empty resolves from the openshell role's gateway Service. Set to pin a
# named gateway the SDK's from_active_cluster() should pick.
omnigent_openshell_gateway: ""

---
- name: Wait for OpenShift AI Operator CSV to succeed
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: redhat-ods-operator
    label_selectors:
      - "operators.coreos.com/rhods-operator.redhat-ods-operator="
  register: rhoai_csvs
  until: >-
    rhoai_csvs.resources | length > 0 and
    rhoai_csvs.resources | selectattr('status.phase', 'defined') |
    selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
  retries: 30
  delay: 30

- name: Wait for DSCInitialization CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: dscinitializations.dscinitialization.opendatahub.io
  register: dsci_crd
  until: dsci_crd.resources | length > 0
  retries: 20
  delay: 15

- name: Create DSCInitialization
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: dscinitialization.opendatahub.io/v1
      kind: DSCInitialization
      metadata:
        name: default-dsci
      spec:
        applicationsNamespace: redhat-ods-applications
        monitoring:
          managementState: Managed
        serviceMesh:
          managementState: Managed
          controlPlane:
            metricsCollection: Istio
            namespace: istio-system
        trustedCABundle:
          managementState: Managed

- name: Wait for DataScienceCluster CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: datascienceclusters.datasciencecluster.opendatahub.io
  register: dsc_crd
  until: dsc_crd.resources | length > 0
  retries: 20
  delay: 15

- name: Create DataScienceCluster
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: datasciencecluster.opendatahub.io/v2
      kind: DataScienceCluster
      metadata:
        name: default-dsc
      spec:
        components:
          dashboard:
            managementState: Managed
          workbenches:
            managementState: Managed
            workbenchNamespace: rhods-notebooks
          kserve:
            managementState: Managed
            nim:
              airGapped: false
              managementState: Managed
            rawDeploymentServiceConfig: Headless
          ray:
            managementState: Managed
          trustyai:
            managementState: Managed
            mcpGuardrailsMode: false
          kueue:
            managementState: Removed
            autoCreateQueues: false
            defaultClusterQueueName: default
            defaultLocalQueueName: default
          modelregistry:
            managementState: Managed
            registriesNamespace: rhoai-model-registries
          ogx:
            managementState: Managed
          aigateway:
            managementState: Managed
          trainingoperator:
            managementState: Removed
          trainer:
            managementState: Removed
          sparkoperator:
            managementState: Removed
          feastoperator:
            managementState: Managed
          mlflowoperator:
            managementState: Managed
          llamastackoperator:
            managementState: Removed
          mcplifecycleoperator:
            managementState: Managed

- name: Wait for OdhDashboardConfig CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: odhdashboardconfigs.opendatahub.io
  register: odh_crd
  until: odh_crd.resources | length > 0
  retries: 20
  delay: 15

- name: Configure OdhDashboardConfig
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: opendatahub.io/v1alpha
      kind: OdhDashboardConfig
      metadata:
        name: odh-dashboard-config
        namespace: redhat-ods-applications
      spec:
        dashboardConfig:
          aiAssetCustomEndpoints: true
          disableKServe: false
          disableLLMd: false
          disableTracking: false
          genAiStudio: true
          modelAsService: true
          observabilityDashboard: true
          vLLMDeploymentOnMaaS: true
        genAiStudioConfig:
          aiAssetCustomEndpoints:
            clusterDomains:
              - ".{{ ocp_apps_domain }}"
            externalProviders: true
        globalMLflowNamespaces: []
        hardwareProfileOrder: []
        modelServing:
          deploymentStrategy: recreate
          isLLMdDefault: false
        notebookController:
          enabled: true
          notebookNamespace: rhods-notebooks
          pvcSize: 20Gi
        templateDisablement:
          - vllm-spyre-ppc64le-runtime
          - vllm-spyre-x86-runtime
          - autogluon-runtime
          - vllm-spyre-s390x-runtime
          - vllm-gaudi-runtime
        templateOrder: []

- name: Add GPU accelerator to default hardware profile
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: infrastructure.opendatahub.io/v1
      kind: HardwareProfile
      metadata:
        name: default-profile
        namespace: redhat-ods-applications
      spec:
        identifiers:
          - displayName: CPU
            identifier: cpu
            resourceType: CPU
            defaultCount: 2
            minCount: 1
            maxCount: 4
          - displayName: Memory
            identifier: memory
            resourceType: Memory
            defaultCount: 4Gi
            minCount: 2Gi
            maxCount: 8Gi
          - displayName: GPU
            identifier: nvidia.com/gpu
            resourceType: Accelerator
            defaultCount: 1
            minCount: 1
            maxCount: 2
  ignore_errors: true

# --- MCP Server for OpenShift ---

- name: Create MCP server namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ mcp_server_namespace }}"

- name: Create MCP server ServiceAccount
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: mcp-viewer
        namespace: "{{ mcp_server_namespace }}"

- name: Bind cluster edit role to MCP server ServiceAccount
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: mcp-viewer-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: edit
      subjects:
        - kind: ServiceAccount
          name: mcp-viewer
          namespace: "{{ mcp_server_namespace }}"

- name: Create MCP server config
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: openshift-mcp-server-config
        namespace: "{{ mcp_server_namespace }}"
      data:
        config.toml: |
          log_level = 5
          port = "8080"
          read_only = false
          toolsets = ["core", "config", "kubevirt", "tekton", "openshift", "metrics"]

- name: Wait for MCPServer CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: mcpservers.mcp.x-k8s.io
  register: mcp_crd
  until: mcp_crd.resources | length > 0
  retries: 20
  delay: 15

- name: Create OpenShift MCP Server
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: mcp.x-k8s.io/v1alpha1
      kind: MCPServer
      metadata:
        name: openshift-mcp-server
        namespace: "{{ mcp_server_namespace }}"
        labels:
          opendatahub.io/dashboard: "true"
      spec:
        source:
          type: ContainerImage
          containerImage:
            ref: "{{ mcp_server_image }}"
        config:
          port: 8080
          arguments:
            - --config
            - /etc/mcp-config/config.toml
          storage:
            - path: /etc/mcp-config
              source:
                type: ConfigMap
                configMap:
                  name: openshift-mcp-server-config
        runtime:
          security:
            serviceAccountName: mcp-viewer

- name: Wait for MCP Server to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: mcp.x-k8s.io/v1alpha1
    kind: MCPServer
    namespace: "{{ mcp_server_namespace }}"
    name: openshift-mcp-server
  register: mcp_server
  until: >-
    mcp_server.resources | length > 0 and
    mcp_server.resources[0].status is defined and
    mcp_server.resources[0].status.conditions is defined and
    mcp_server.resources[0].status.conditions |
    selectattr('type', 'equalto', 'Ready') |
    selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 20
  delay: 15
  ignore_errors: true

- name: Expose MCP Server via route
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: openshift-mcp-server
        namespace: "{{ mcp_server_namespace }}"
      spec:
        to:
          kind: Service
          name: openshift-mcp-server
        port:
          targetPort: 8080
        tls:
          termination: edge

- name: Register MCP Server for GenAI Studio playground
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gen-ai-aa-mcp-servers
        namespace: redhat-ods-applications
      data:
        OpenShift-MCP-Server: |
          {
            "url": "http://openshift-mcp-server.{{ mcp_server_namespace }}.svc.cluster.local:8080/mcp",
            "description": "MCP server for Kubernetes and OpenShift cluster operations"
          }

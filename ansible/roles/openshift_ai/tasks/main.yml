---
- name: Wait for OpenShift AI Operator CSV to succeed
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: redhat-ods-operator
    label_selectors:
      - "operators.coreos.com/rhods-operator.redhat-ods-operator="
  register: rhoai_csvs
  until: >-
    rhoai_csvs.resources | length > 0 and
    rhoai_csvs.resources | selectattr('status.phase', 'defined') |
    selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
  retries: 30
  delay: 30

- name: Wait for DSCInitialization CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: dscinitializations.dscinitialization.opendatahub.io
  register: dsci_crd
  until: dsci_crd.resources | length > 0
  retries: 20
  delay: 15

# v2, not v1. serviceMesh exists only in the v1 schema and was dropped in v2:
# KServe in RHOAI 3.x uses raw deployment (rawDeploymentServiceConfig below)
# and no longer routes through a Service Mesh control plane, so the old
# serviceMesh block is both unnecessary and unexpressible here. Service Mesh 3
# is still installed by the service_mesh role for Bookinfo and Kiali; this
# only stops RHOAI claiming ownership of it.
- name: Create DSCInitialization
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: dscinitialization.opendatahub.io/v2
      kind: DSCInitialization
      metadata:
        name: default-dsci
      spec:
        applicationsNamespace: redhat-ods-applications
        monitoring:
          managementState: Managed
          namespace: "{{ rhoai_monitoring_namespace }}"
          alerting: {}
          metrics:
            replicas: 1
            storage:
              retention: "{{ rhoai_metrics_retention }}"
              size: "{{ rhoai_metrics_size }}"
          traces:
            sampleRatio: "{{ rhoai_traces_sample_ratio }}"
            storage:
              backend: pv
              retention: "{{ rhoai_traces_retention }}"
        trustedCABundle:
          managementState: Managed
          customCABundle: ""

- name: Wait for DataScienceCluster CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: datascienceclusters.datasciencecluster.opendatahub.io
  register: dsc_crd
  until: dsc_crd.resources | length > 0
  retries: 20
  delay: 15

- name: Create DataScienceCluster
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: datasciencecluster.opendatahub.io/v2
      kind: DataScienceCluster
      metadata:
        name: default-dsc
      spec:
        components:
          dashboard:
            managementState: Managed
          workbenches:
            managementState: Managed
            workbenchNamespace: rhods-notebooks
          kserve:
            managementState: Managed
            nim:
              airGapped: false
              managementState: Managed
            rawDeploymentServiceConfig: Headless
            # Models-as-a-Service is driven from aigateway below, not here;
            # enabling both makes two controllers fight over the same routes.
            modelsAsService:
              managementState: Removed
            wva:
              managementState: Removed
          ray:
            managementState: Managed
          trustyai:
            managementState: Managed
            mcpGuardrailsMode: false
          kueue:
            managementState: Removed
            autoCreateQueues: false
            defaultClusterQueueName: default
            defaultLocalQueueName: default
          modelregistry:
            managementState: Managed
            registriesNamespace: rhoai-model-registries
          ogx:
            managementState: Managed
          aigateway:
            managementState: Managed
            # What publishes LLMInferenceService models on the MaaS gateway at
            # maas.<apps-domain> instead of a cluster-internal URL only.
            modelsAsAService:
              managementState: Managed
          aipipelines:
            managementState: Managed
          trainingoperator:
            managementState: Managed
          trainer:
            managementState: Managed
          sparkoperator:
            managementState: Removed
          feastoperator:
            managementState: Managed
          mlflowoperator:
            managementState: Managed
          llamastackoperator:
            managementState: Removed
          # Kept deliberately. The reference cluster does NOT run this, and so
          # has no MCPServer CRD at all - removing it here would delete the CRD
          # out from under the openshift-mcp-server this role installs below.
          mcplifecycleoperator:
            managementState: Managed

- name: Wait for OdhDashboardConfig CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: odhdashboardconfigs.opendatahub.io
  register: odh_crd
  until: odh_crd.resources | length > 0
  retries: 20
  delay: 15

- name: Configure OdhDashboardConfig
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: opendatahub.io/v1alpha
      kind: OdhDashboardConfig
      metadata:
        name: odh-dashboard-config
        namespace: redhat-ods-applications
      spec:
        dashboardConfig:
          # Flags below mirror a fully-configured RHOAI 3.5.1 reference
          # cluster. Note the mixed polarity: "disableX: false" turns a
          # feature ON, while the positively-named flags turn one on with
          # true. They are not interchangeable.
          agentConfigManagement: true
          agentOps: true
          agentsCatalog: true
          aiAssetCustomEndpoints: true
          automl: true
          autorag: true
          connectionTest: true
          deploymentWizardYAMLViewer: true
          disableDistributedWorkloads: false
          disableKServe: false
          disableKServeMetrics: false
          # Kueue is Removed in the DSC above, so leave its UI hidden -
          # showing it would offer queues that cannot be created.
          disableKueue: true
          disableLLMd: false
          disableLMEval: false
          disableModelCatalog: false
          disableModelRegistry: false
          disablePerformanceMetrics: false
          disableTracking: false
          disableTrustyBiasMetrics: false
          externalModels: true
          externalVectorStores: true
          featureStoreAdmin: true
          genAiStudio: true
          genAiTracing: true
          globalProjectPrompts: true
          gpuaas: true
          guardrails: true
          llmGatewayField: true
          llmdTemplates: true
          mcpCatalog: true
          mcpRegistry: true
          modelAsService: true
          observabilityDashboard: true
          projectRBAC: true
          promptManagement: true
          roleManagement: true
          toolCalling: true
          trainingJobs: true
          vLLMDeploymentOnMaaS: true
        groupsConfig:
          adminGroups: "{{ rhoai_admin_groups }}"
          allowedGroups: "{{ rhoai_allowed_groups }}"
        genAiStudioConfig:
          aiAssetCustomEndpoints:
            clusterDomains:
              - ".{{ ocp_apps_domain }}"
            externalProviders: true
        globalMLflowNamespaces: []
        hardwareProfileOrder: []
        modelServing:
          deploymentStrategy: recreate
          isLLMdDefault: false
        notebookController:
          enabled: true
          notebookNamespace: rhods-notebooks
          pvcSize: 20Gi
        templateDisablement:
          - vllm-spyre-ppc64le-runtime
          - vllm-spyre-x86-runtime
          - autogluon-runtime
          - vllm-spyre-s390x-runtime
          - vllm-gaudi-runtime
        templateOrder: []

# rhods-admins is also RHOAI's own out-of-box default, so naming it here is
# not a change of behaviour - but an empty group means nobody reaches the
# admin UI, and that is silent. Warn rather than fail: cluster-admins still
# get in, and a fresh cluster legitimately has the group empty until users
# are added.
- name: Check the RHOAI admin group has members
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: user.openshift.io/v1
    kind: Group
    name: "{{ rhoai_admin_groups }}"
  register: rhoai_admin_group
  when: rhoai_admin_groups | length > 0

- name: Warn when the RHOAI admin group is empty
  ansible.builtin.debug:
    msg: >-
      Group '{{ rhoai_admin_groups }}' has no members, so no one will have the
      OpenShift AI dashboard admin UI. Add users with:
      oc adm groups add-users {{ rhoai_admin_groups }} <user>
  when:
    - rhoai_admin_groups | length > 0
    - rhoai_admin_group.resources | default([]) | length > 0
    - rhoai_admin_group.resources[0].users | default([]) | length == 0

# Two profiles rather than one. Previously GPU was bolted onto
# default-profile, which offered an accelerator to every workbench and
# notebook and let CPU-only pods land a GPU request they never use - on a
# two-GPU cluster that is enough to block model serving entirely.
# default-profile is now CPU/memory only, and GPU work selects gpu-profile.
- name: Create the default (CPU-only) hardware profile
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: infrastructure.opendatahub.io/v1
      kind: HardwareProfile
      metadata:
        name: default-profile
        namespace: redhat-ods-applications
        annotations:
          opendatahub.io/display-name: default-profile
          opendatahub.io/description: >-
            This profile offers 2 CPUs and 4 GiB of memory. You can customize
            these resources up to 4 CPUs and 8 GiB of memory.
          opendatahub.io/disabled: "false"
          opendatahub.io/dashboard-feature-visibility: "[]"
      spec:
        identifiers:
          - displayName: CPU
            identifier: cpu
            resourceType: CPU
            defaultCount: 2
            minCount: 1
            maxCount: 4
          - displayName: Memory
            identifier: memory
            resourceType: Memory
            defaultCount: 4Gi
            minCount: 2Gi
            maxCount: 8Gi

# scheduling.node is what keeps these pods off CPU workers and lets them
# through the nvidia.com/gpu taint; without it the pod requests a GPU and
# then sits Pending on a node that has none.
- name: Create the GPU hardware profile
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: infrastructure.opendatahub.io/v1
      kind: HardwareProfile
      metadata:
        name: gpu-profile
        namespace: redhat-ods-applications
        annotations:
          opendatahub.io/display-name: gpu-profile
          opendatahub.io/disabled: "false"
          opendatahub.io/dashboard-feature-visibility: "[]"
      spec:
        identifiers:
          - displayName: CPU
            identifier: cpu
            resourceType: CPU
            defaultCount: "1"
            minCount: 1
            maxCount: "8"
          - displayName: Memory
            identifier: memory
            resourceType: Memory
            defaultCount: 12Gi
            minCount: 1Gi
            maxCount: 16Gi
          - displayName: GPU
            identifier: nvidia.com/gpu
            resourceType: Accelerator
            defaultCount: 1
            minCount: 1
            maxCount: "{{ rhoai_gpu_profile_max }}"
        scheduling:
          type: Node
          node:
            nodeSelector:
              nvidia.com/gpu.present: "true"
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule

# ---------------------------------------------------------------------------
# RHOAI 3.5 feature operands
#
# The DSC above turns components ON, which registers their CRDs and reveals
# the matching dashboard menus. It does not create any instance, so without
# these the menus open onto nothing - MLflow in particular shows an empty
# page rather than a tracking server.
#
# Each is gated on its CRD existing rather than on a component being Managed:
# the CRD is the thing these objects actually need, and gating that way keeps
# the role inert on a cluster where the component was deliberately disabled.
# ---------------------------------------------------------------------------

- name: Look for the RHOAI feature CRDs
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
  register: rhoai_feature_crds
  loop:
    - mlflows.mlflow.opendatahub.io
    - uiplugins.observability.openshift.io
    - evalhubs.trustyai.opendatahub.io
    - kuadrants.kuadrant.io
  loop_control:
    label: "{{ item }}"

- name: Record which feature CRDs are available
  ansible.builtin.set_fact:
    rhoai_crd_present: >-
      {{ dict(rhoai_feature_crds.results
              | map(attribute='item') | list
              | zip(rhoai_feature_crds.results
                    | map(attribute='resources') | map('length') | map('int') | list)) }}

# --- MLflow PostgreSQL backend ---------------------------------------------
# sqlite lives inside the MLflow pod's volume, so every experiment is lost the
# moment the pod moves. This is a small dedicated database for it, following
# the same shape as litellm-db.

- name: Look for an existing MLflow database password
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    kind: Secret
    namespace: "{{ rhoai_feature_namespace }}"
    name: mlflow-db-credentials
  register: mlflow_db_secret
  when:
    - deploy_mlflow_server | bool
    - mlflow_backend == 'postgres'
  no_log: true

# Generated once and kept, so the DSN keeps matching the password already
# baked into the database's data directory. Regenerating it every run would
# authenticate fine on first boot and fail on every one after.
- name: Resolve the MLflow database password
  ansible.builtin.set_fact:
    mlflow_db_password_effective: >-
      {{ mlflow_db_password if mlflow_db_password | default('') | length > 0
         else ((mlflow_db_secret.resources | first).data['POSTGRES_PASSWORD'] | b64decode
               if mlflow_db_secret.resources | default([]) | length > 0
               else lookup('password', '/dev/null length=24 chars=ascii_letters,digits')) }}
  when:
    - deploy_mlflow_server | bool
    - mlflow_backend == 'postgres'
  no_log: true

# database-url is the key the MLflow CR dereferences via backendStoreUriFrom.
# sslmode=disable because this never leaves the cluster network and the image
# serves no TLS.
- name: Create the MLflow database credentials
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mlflow-db-credentials
        namespace: "{{ rhoai_feature_namespace }}"
      type: Opaque
      stringData:
        POSTGRES_USER: "{{ mlflow_db_user }}"
        POSTGRES_PASSWORD: "{{ mlflow_db_password_effective }}"
        POSTGRES_DB: "{{ mlflow_db_name }}"
        database-url: >-
          postgresql://{{ mlflow_db_user }}:{{ mlflow_db_password_effective }}@mlflow-db.{{ rhoai_feature_namespace }}.svc.cluster.local:5432/{{ mlflow_db_name }}?sslmode=disable
  when:
    - deploy_mlflow_server | bool
    - mlflow_backend == 'postgres'
  no_log: true

- name: Create the MLflow database PVC
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: mlflow-db
        namespace: "{{ rhoai_feature_namespace }}"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "{{ mlflow_db_storage }}"
  when:
    - deploy_mlflow_server | bool
    - mlflow_backend == 'postgres'

# Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so a rolling update
# would deadlock with the new pod waiting for a volume the old one still holds.
- name: Deploy the MLflow database
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mlflow-db
        namespace: "{{ rhoai_feature_namespace }}"
        labels:
          app: mlflow-db
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: mlflow-db
        strategy:
          type: Recreate
        template:
          metadata:
            labels:
              app: mlflow-db
          spec:
            containers:
              - name: postgres
                image: "{{ mlflow_db_image }}"
                ports:
                  - containerPort: 5432
                env:
                  - name: POSTGRESQL_USER
                    valueFrom:
                      secretKeyRef: {name: mlflow-db-credentials, key: POSTGRES_USER}
                  - name: POSTGRESQL_PASSWORD
                    valueFrom:
                      secretKeyRef: {name: mlflow-db-credentials, key: POSTGRES_PASSWORD}
                  - name: POSTGRESQL_DATABASE
                    valueFrom:
                      secretKeyRef: {name: mlflow-db-credentials, key: POSTGRES_DB}
                readinessProbe:
                  exec:
                    command: [/usr/libexec/check-container]
                  initialDelaySeconds: 10
                  periodSeconds: 10
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/pgsql/data
                resources:
                  requests: {cpu: 100m, memory: 256Mi}
                  limits: {cpu: "1", memory: 1Gi}
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: mlflow-db
  when:
    - deploy_mlflow_server | bool
    - mlflow_backend == 'postgres'

- name: Create the MLflow database Service
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: mlflow-db
        namespace: "{{ rhoai_feature_namespace }}"
        labels:
          app: mlflow-db
      spec:
        selector:
          app: mlflow-db
        ports:
          - port: 5432
            targetPort: 5432
  when:
    - deploy_mlflow_server | bool
    - mlflow_backend == 'postgres'

# The MLflow operator runs a migration Job against this on first reconcile; if
# the database is not accepting connections the Job fails and the operator
# leaves MLflow stuck, so wait here rather than race it.
- name: Wait for the MLflow database to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ rhoai_feature_namespace }}"
    name: mlflow-db
  register: mlflow_db_deploy
  until: >-
    mlflow_db_deploy.resources | length > 0 and
    (mlflow_db_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 30
  delay: 10
  when:
    - deploy_mlflow_server | bool
    - mlflow_backend == 'postgres'

# backendStoreUriFrom reads the DSN out of the Secret rather than inlining it,
# so the password never appears in the CR. sqlite takes the literal-URI form
# instead, since there is no Secret to point at.
- name: Create the MLflow tracking server
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: mlflow.opendatahub.io/v1
      kind: MLflow
      # Cluster-scoped, despite the operand pods landing in
      # redhat-ods-applications - a namespace here is silently ignored.
      metadata:
        name: mlflow
      spec: >-
        {{
          {
            'serveArtifacts': true,
            'artifactsDestination': 'file:///mlflow/artifacts',
            'storage': {'size': mlflow_storage_size},
          } | combine(
            {'backendStoreUriFrom': {'name': 'mlflow-db-credentials', 'key': 'database-url'}}
            if mlflow_backend == 'postgres'
            else {'backendStoreUri': mlflow_sqlite_uri}
          )
        }}
  when:
    - deploy_mlflow_server | bool
    - rhoai_crd_present['mlflows.mlflow.opendatahub.io'] | default(0) | int > 0

# Cluster-scoped. Adds the Dashboards and Monitoring panels to the OpenShift
# console; the Monitoring one carries the Perses dashboards the RHOAI
# observability menu links to.
- name: Create the console observability UI plugins
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: observability.openshift.io/v1alpha1
      kind: UIPlugin
      metadata:
        name: "{{ item.name }}"
      spec: "{{ item.spec }}"
  loop:
    - name: dashboards
      spec:
        type: Dashboards
    - name: monitoring
      spec:
        type: Monitoring
        monitoring:
          perses:
            enabled: true
  loop_control:
    label: "{{ item.name }}"
  when:
    - deploy_observability_uiplugins | bool
    - rhoai_crd_present['uiplugins.observability.openshift.io'] | default(0) | int > 0

- name: Create the TrustyAI evaluation hub
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: trustyai.opendatahub.io/v1alpha1
      kind: EvalHub
      metadata:
        name: evalhub
        namespace: "{{ rhoai_feature_namespace }}"
      spec:
        replicas: 1
        database:
          type: sqlite
        providers: "{{ evalhub_providers }}"
        collections: "{{ evalhub_collections }}"
  when:
    - deploy_evalhub | bool
    - rhoai_crd_present['evalhubs.trustyai.opendatahub.io'] | default(0) | int > 0

# Kuadrant watches its own namespace, which the RHCL operator does not create.
- name: Create the Kuadrant namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ kuadrant_namespace }}"
  when:
    - deploy_kuadrant | bool
    - rhoai_crd_present['kuadrants.kuadrant.io'] | default(0) | int > 0

- name: Create the Kuadrant control plane
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: kuadrant.io/v1beta1
      kind: Kuadrant
      metadata:
        name: kuadrant
        namespace: "{{ kuadrant_namespace }}"
      spec: {}
  when:
    - deploy_kuadrant | bool
    - rhoai_crd_present['kuadrants.kuadrant.io'] | default(0) | int > 0

# --- MCP Server for OpenShift ---

- name: Create MCP server namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ mcp_server_namespace }}"

- name: Create MCP server ServiceAccount
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: mcp-viewer
        namespace: "{{ mcp_server_namespace }}"

# Shared by mcp-viewer and the dashboard SA. Defined in both this role and
# the dashboard role from the same group_vars list, so neither ordering nor a
# tag-limited run can leave a binding pointing at a ClusterRole that does not
# exist yet — which RBAC permits, and which silently grants nothing.
- name: Create the MCP workload-write ClusterRole
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: mcp-workload-write
      rules: "{{ mcp_write_rules }}"

# Previously bound to "edit", which reaches secrets in every namespace. The
# MCP service answers unauthenticated callers as this ServiceAccount, so that
# was a wider path than the dashboard's own authenticated one.
#
# roleRef is immutable, so the old binding has to be deleted rather than
# patched — apply would fail with "cannot change roleRef".
- name: Remove the old cluster-edit binding for mcp-viewer
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: mcp-viewer-binding

- name: Bind MCP server ServiceAccount to read and workload-write
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "mcp-viewer-{{ item.suffix }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ item.role }}"
      subjects:
        - kind: ServiceAccount
          name: mcp-viewer
          namespace: "{{ mcp_server_namespace }}"
  loop:
    - {suffix: read, role: cluster-reader}
    - {suffix: write, role: mcp-workload-write}
  loop_control:
    label: "mcp-viewer-{{ item.suffix }} -> {{ item.role }}"

- name: Create MCP server config
  register: mcp_config
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: openshift-mcp-server-config
        namespace: "{{ mcp_server_namespace }}"
      data:
        # prometheus_url MUST sit under [toolset_configs.metrics]. At the top
        # level the TOML parses without complaint and is silently ignored, the
        # server logs "No prometheus_url configured, using default
        # url=http://localhost:9090", and every metrics tool fails with
        # "dial tcp [::1]:9090: connect: connection refused" - nothing listens
        # on 9090 inside the server's own pod.
        #
        # Thanos querier only serves HTTPS, with a certificate from the
        # OpenShift service CA that is not in the image's trust store, so
        # ca_file points at the SA-projected copy. The metrics toolset forwards
        # the *caller's* bearer token, so the caller also needs
        # cluster-monitoring-view - the dashboard SA has it via the
        # ops-dashboard-monitoring ClusterRoleBinding.
        config.toml: |
          log_level = 5
          port = "8080"
          read_only = false
          toolsets = ["core", "config", "kubevirt", "tekton", "openshift", "metrics"]

          [toolset_configs.metrics]
          prometheus_url = "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"

- name: Wait for MCPServer CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: mcpservers.mcp.x-k8s.io
  register: mcp_crd
  until: mcp_crd.resources | length > 0
  retries: 20
  delay: 15

- name: Create OpenShift MCP Server
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: mcp.x-k8s.io/v1alpha1
      kind: MCPServer
      metadata:
        name: openshift-mcp-server
        namespace: "{{ mcp_server_namespace }}"
        labels:
          opendatahub.io/dashboard: "true"
      spec:
        source:
          type: ContainerImage
          containerImage:
            ref: "{{ mcp_server_image }}"
        config:
          port: 8080
          arguments:
            - --config
            - /etc/mcp-config/config.toml
          storage:
            - path: /etc/mcp-config
              source:
                type: ConfigMap
                configMap:
                  name: openshift-mcp-server-config
        runtime:
          security:
            serviceAccountName: mcp-viewer

# The config is a mounted ConfigMap, read once at startup, and the MCPServer
# operator does not notice a content change - so without this a re-run that
# edits config.toml leaves the old settings live until something else happens
# to restart the pod. Guarded on the ConfigMap actually changing.
- name: Restart the MCP server to pick up config changes
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ mcp_server_namespace }}"
    # Not app.kubernetes.io/name - the operator does not set it. These two are
    # what the pod actually carries; mcp-server= names this instance.
    label_selectors:
      - mcp-server=openshift-mcp-server
  when: mcp_config.changed

- name: Wait for MCP Server to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: mcp.x-k8s.io/v1alpha1
    kind: MCPServer
    namespace: "{{ mcp_server_namespace }}"
    name: openshift-mcp-server
  register: mcp_server
  until: >-
    mcp_server.resources | length > 0 and
    mcp_server.resources[0].status is defined and
    mcp_server.resources[0].status.conditions is defined and
    mcp_server.resources[0].status.conditions |
    selectattr('type', 'equalto', 'Ready') |
    selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 20
  delay: 15
  ignore_errors: true

- name: Expose MCP Server via route
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: openshift-mcp-server
        namespace: "{{ mcp_server_namespace }}"
      spec:
        to:
          kind: Service
          name: openshift-mcp-server
        port:
          targetPort: 8080
        tls:
          termination: edge

- name: Register MCP Server for GenAI Studio playground
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gen-ai-aa-mcp-servers
        namespace: redhat-ods-applications
      data:
        OpenShift-MCP-Server: |
          {
            "url": "http://openshift-mcp-server.{{ mcp_server_namespace }}.svc.cluster.local:8080/mcp",
            "description": "MCP server for Kubernetes and OpenShift cluster operations"
          }

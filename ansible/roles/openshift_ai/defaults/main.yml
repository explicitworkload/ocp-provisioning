---
# DSCInitialization monitoring. Mirrors a fully-configured RHOAI 3.5.1
# reference cluster; the metrics/traces blocks are only honoured on the v2
# DSCI schema.
rhoai_monitoring_namespace: redhat-ods-monitoring
rhoai_metrics_retention: 90d
rhoai_metrics_size: 5Gi
rhoai_traces_sample_ratio: "0.1"
rhoai_traces_retention: 2160h   # 90 days

# Dashboard access. adminGroups must be a group that exists, or nobody gets
# the admin UI; the reference cluster uses a dedicated rhods-admins group.
rhoai_admin_groups: rhods-admins
rhoai_allowed_groups: "system:authenticated"

# Ceiling on the GPU hardware profile. The reference cluster allows 4; keep
# it at or below the GPUs on a single node, since one pod cannot span nodes.
rhoai_gpu_profile_max: 2

# NOT an openshift-* name. The RHOAI dashboard filters every Project selector
# through isAvailableProject() (packages/k8s-core/src/projectUtils.ts), which
# rejects any namespace starting with "openshift-" or "kube-", plus default,
# system, openshift and the dashboard's own namespace. That is a prefix test on
# the name, so no label can override it: an MCPServer in openshift-mcp-server
# can never be listed under AI hub > MCP servers > Deployments.
mcp_server_namespace: mcp-servers
mcp_server_image: "quay.io/redhat-user-workloads/ocp-mcp-server-tenant/openshift-mcp-server-release-03:latest"

# --- RHOAI 3.5 feature CRs -------------------------------------------------
# Enabling a component in the DSC registers its CRD and lights up the
# dashboard menu, but creates no instance - so the menu opens onto nothing.
# These are the operand CRs that actually back those menus.
rhoai_feature_namespace: redhat-ods-applications

# MLflow experiment tracking.
deploy_mlflow_server: true
mlflow_storage_size: 10Gi

# postgres | sqlite. sqlite needs nothing but lives in the pod's volume and
# does not survive a pod move; postgres stands up a small dedicated database.
mlflow_backend: postgres
mlflow_sqlite_uri: "sqlite:////mlflow/mlflow.db"

mlflow_db_image: "registry.redhat.io/rhel9/postgresql-16:latest"
mlflow_db_storage: 10Gi
mlflow_db_user: mlflow
mlflow_db_name: mlflow
# Password is generated on first run and then reused from the
# mlflow-db-credentials Secret, so it does not churn and is never committed.
# Alphanumeric on purpose: it goes into a postgresql:// DSN, and anything
# needing percent-encoding there is a silent connection failure.
mlflow_db_password: ""

# Console observability plugins (needs cluster-observability-operator).
deploy_observability_uiplugins: true

# TrustyAI evaluation hub.
deploy_evalhub: true
evalhub_providers: [lm-evaluation-harness, garak, guidellm, lighteval]
evalhub_collections: [leaderboard-v2, safety-and-fairness-v1]

# Kuadrant, the policy engine behind the MaaS gateway (Red Hat Connectivity
# Link). The gateway already exists; this is what enforces rate limits and
# auth policy on it.
deploy_kuadrant: true
kuadrant_namespace: kuadrant-system

# Where extra AI asset endpoints are published. RHOAI finds them by the
# gen-ai-aa-* ConfigMap name, so the namespace only has to be one the
# dashboard can read; model_namespace matches where the LiteLLM-backed
# endpoint already lives.
rhoai_ai_endpoint_namespace: "{{ model_namespace | default('qwen3-4b') }}"

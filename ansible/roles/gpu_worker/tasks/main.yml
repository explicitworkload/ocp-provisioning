---
- name: Get cluster infrastructure details
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: config.openshift.io/v1
    kind: Infrastructure
    name: cluster
  register: infra_info

- name: Set cluster infrastructure name
  ansible.builtin.set_fact:
    cluster_infra_id: "{{ infra_info.resources[0].status.infrastructureName }}"

- name: Get existing worker MachineSets
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    namespace: openshift-machine-api
  register: machinesets

- name: Extract worker MachineSet configuration
  ansible.builtin.set_fact:
    worker_ami: "{{ machinesets.resources[0].spec.template.spec.providerSpec.value.ami.id }}"
    worker_security_groups: "{{ machinesets.resources[0].spec.template.spec.providerSpec.value.securityGroups }}"
    worker_region: "{{ machinesets.resources[0].spec.template.spec.providerSpec.value.placement.region }}"
    # Derived like the region, not hardcoded. The AZ also builds the subnet
    # filter "<infra>-subnet-private-<az>", so an AZ belonging to some other
    # cluster matches no subnet at all: every Machine sits Failed and the
    # readiness wait below burns 60x30s = 30 minutes before aborting the play
    # with no diagnosis - ahead of odf, openshift_ai, model_serving and the
    # rest. Set gpu_availability_zone explicitly to pin a zone (e.g. one with
    # GPU capacity); leave it empty to follow the cluster's own workers.
    gpu_az_effective: >-
      {{ gpu_availability_zone if gpu_availability_zone | default('') | length > 0
         else machinesets.resources[0].spec.template.spec.providerSpec.value.placement.availabilityZone }}

- name: Create GPU MachineSets
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition: "{{ lookup('template', 'gpu-machineset.yml.j2') | from_yaml }}"
  loop: "{{ gpu_machinesets }}"
  loop_control:
    label: "{{ item.instance_type }} (replicas: {{ item.replicas }})"

- name: Wait for GPU machines to be provisioned
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    namespace: openshift-machine-api
    name: "{{ cluster_infra_id }}-{{ item.instance_type }}-{{ gpu_az_effective }}"
  register: gpu_ms
  until: >-
    gpu_ms.resources | length > 0 and
    (gpu_ms.resources[0].status.readyReplicas | default(0) | int) >= (item.replicas | int)
  retries: 60
  delay: 30
  loop: "{{ gpu_machinesets | selectattr('replicas', '>', 0) | list }}"
  loop_control:
    label: "{{ item.instance_type }} (replicas: {{ item.replicas }})"

- name: Gather GPU nodes
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: v1
    kind: Node
    label_selectors:
      - "nvidia.com/gpu.present=true"
  register: _gpu_nodes

- name: Label existing GPU nodes with gpu role
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ item }}"
        labels:
          node-role.kubernetes.io/gpu: ""
  loop: >-
    {{ _gpu_nodes.resources
       | map(attribute='metadata.name')
       | list }}
  loop_control:
    label: "{{ item }}"
  when: _gpu_nodes.resources | length > 0

- name: Create GPU MachineConfigPool
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    apply: true
    definition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: MachineConfigPool
      metadata:
        name: gpu
      spec:
        machineConfigSelector:
          matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values:
                - worker
                - gpu
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/gpu: ""

- name: Display GPU MachineSet status
  ansible.builtin.debug:
    msg: >-
      GPU MachineSet {{ cluster_infra_id }}-{{ item.instance_type }}-{{ gpu_az_effective }}
      — {{ item.replicas }} replica(s)
  loop: "{{ gpu_machinesets }}"
  loop_control:
    label: "{{ item.instance_type }}"

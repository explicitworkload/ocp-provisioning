---
- name: Get cluster infrastructure details
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: config.openshift.io/v1
    kind: Infrastructure
    name: cluster
  register: infra_info

- name: Set cluster infrastructure name
  ansible.builtin.set_fact:
    cluster_infra_id: "{{ infra_info.resources[0].status.infrastructureName }}"

- name: Get existing worker MachineSets
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: machine.openshift.io/v1beta1
    kind: MachineSet
    namespace: openshift-machine-api
  register: machinesets

- name: Extract worker MachineSet configuration
  ansible.builtin.set_fact:
    worker_ami: "{{ machinesets.resources[0].spec.template.spec.providerSpec.value.ami.id }}"
    worker_security_groups: "{{ machinesets.resources[0].spec.template.spec.providerSpec.value.securityGroups }}"
    worker_region: "{{ machinesets.resources[0].spec.template.spec.providerSpec.value.placement.region }}"

# Every zone this cluster already runs workers in, and no others. The AZ
# builds the subnet filter "<infra>-subnet-private-<az>", so a zone the
# installer never created a private subnet in matches nothing: the Machines
# sit Failed, and a zone that CANNOT work is indistinguishable from one that
# is merely full. Taking the list off the cluster's own workers means every
# candidate is known to have a subnet.
- name: List the availability zones this cluster has workers in
  ansible.builtin.set_fact:
    gpu_az_available: >-
      {{ machinesets.resources
         | map(attribute='spec.template.spec.providerSpec.value.placement.availabilityZone')
         | select('string') | unique | list }}

# A GPU MachineSet that is already RUNNING A NODE decides the zone, whatever
# the shuffle says. Without that, a re-run picks a fresh zone at random and
# builds a SECOND GPU node beside the one already there, billing for both -
# the names differ only by zone, so nothing collides to stop it.
#
# readyReplicas is the whole condition, and it has to be. A GPU MachineSet
# scaled to zero - which is what the role leaves behind for every instance
# type it was not asked to build, and what a failed attempt leaves if it is
# interrupted - protects no node and must not pin anything. Treating mere
# existence as "resume here" would send a cluster whose 2a attempt failed
# straight back to 2a on every subsequent run, which is precisely the loop
# this change exists to break.
# Matched on the MachineSet's own instanceType, not on its name. The names
# embed the instance type, so a regex over them is possible - and it is how
# this was first written - but every instance type contains a dot, and a dot
# in a regex matches anything. Getting the escaping right through a YAML
# folded scalar AND a Jinja string literal is two layers of quoting to be
# wrong about, and being wrong is silent: the filter matches nothing, the
# list comes back empty, and an empty list is exactly what "no GPU
# MachineSets exist" looks like. instanceType is an exact string compare
# with no escaping at all.
# Fallback types count as "ours" here, not just the requested ones. The
# node this role ends up running is often a fallback - that is the whole
# point of having them - and matching only gpu_machinesets made the resume
# check blind to exactly the case it exists for: a re-run saw no GPU of a
# requested type, concluded nothing was running, and started the search
# from the top.
- name: Look for GPU MachineSets that already have nodes
  ansible.builtin.set_fact:
    gpu_ms_running: >-
      {{ machinesets.resources
         | selectattr('spec.template.spec.providerSpec.value.instanceType',
                      'in', (gpu_machinesets | map(attribute='instance_type') | list)
                            + (gpu_instance_fallback | default([])))
         | selectattr('status.readyReplicas', 'defined')
         | selectattr('status.readyReplicas', '>', 0) | list }}

- name: Note the zone and type already running a GPU node
  ansible.builtin.set_fact:
    gpu_az_existing: >-
      {{ gpu_ms_running
         | map(attribute='spec.template.spec.providerSpec.value.placement.availabilityZone')
         | select('string') | unique | list }}
    # Same idea one axis over. Without it a re-run re-proves that the
    # requested type still has no capacity - three zones, six minutes -
    # before falling back to the type already serving a node.
    gpu_type_existing: >-
      {{ gpu_ms_running
         | map(attribute='spec.template.spec.providerSpec.value.instanceType')
         | select('string') | unique | list }}

# Zero-replica GPU MachineSets from earlier attempts in other zones. Not
# deleted - this role is not the only thing that can create a MachineSet,
# and an empty one costs nothing - but worth naming, because they are
# confusing to find later and an oc scale against the wrong one builds a
# node in a zone nobody chose.
- name: Report GPU MachineSets left over in other zones
  ansible.builtin.debug:
    msg: >-
      Empty GPU MachineSets from earlier attempts, left in place:
      {{ gpu_ms_stale | join(', ') }}. They hold no nodes. Delete them with
      "oc delete machineset -n openshift-machine-api <name>" if they are in
      the way.
  vars:
    gpu_ms_stale: >-
      {{ machinesets.resources
         | selectattr('spec.template.spec.providerSpec.value.instanceType',
                      'in', gpu_machinesets | map(attribute='instance_type') | list)
         | rejectattr('status.readyReplicas', 'defined')
         | map(attribute='metadata.name') | list }}
  when: gpu_ms_stale | length > 0

# Order of preference:
#   1. gpu_availability_zone, when set. Pinning means pinning - no fallback,
#      because a pin exists to stop the role wandering.
#   2. a zone this role already has GPU MachineSets in, so re-runs converge.
#   3. everything else, SHUFFLED. Capacity for the big GPU instances comes
#      and goes, and a fixed order means every cluster in the sandbox fleet
#      hammers the same zone and queues behind each other. Random spreads it.
- name: Decide which zones to try, in order
  ansible.builtin.set_fact:
    gpu_az_candidates: >-
      {{ [gpu_availability_zone] if gpu_availability_zone | default('') | length > 0
         else (gpu_az_existing + (gpu_az_available | difference(gpu_az_existing) | shuffle)) }}

- name: Report the zones that will be tried
  ansible.builtin.debug:
    msg: >-
      GPU zones to try, in order: {{ gpu_az_candidates | join(', ') }}.
      {{ 'Pinned by gpu_availability_zone, so there is no fallback.'
         if gpu_availability_zone | default('') | length > 0
         else ('Resuming in ' + (gpu_az_existing | join(', ')) + ' first.'
               if gpu_az_existing | length > 0
               else 'Order is random, to spread load across zones.') }}

# Zones are not the only lever, and on sandbox2134 they were the wrong one.
# g6e.4xlarge had no capacity in any of us-east-2a/b/c, so the role gave up
# having built nothing - while g6.4xlarge, g5.4xlarge and g4dn.4xlarge were
# all available in the first zone it tried. Three zones of one type is a
# worse search than one zone of four types.
#
# So after the requested type is exhausted everywhere, fall back through
# gpu_instance_fallback. Each fallback is filtered against the selected
# model first: a type that cannot hold it is not a fallback, it is a node
# that provisions and then fails at model load, several roles later and
# much harder to read.
# Built with a loop rather than one clever expression: the filter needs a
# per-item VRAM calculation, and a when: that can be read line by line is
# worth more here than a one-liner nobody will check.
- name: Work out which fallback types still fit the model
  ansible.builtin.set_fact:
    gpu_fallback_viable: "{{ (gpu_fallback_viable | default([])) + [item] }}"
  loop: "{{ gpu_instance_fallback | default([]) }}"
  loop_control:
    label: "{{ item }}"
  vars:
    _s: "{{ gpu_instance_specs[item] | default({}) }}"
    _m: "{{ model_presets[model_preset] | default({}) if model_preset is defined else {} }}"
    # Same arithmetic as site.yml's preflight, and it has to stay the same:
    # vendor GB to GiB, then the 0.9 of the card vLLM takes by default.
    _have: >-
      {{ ((_m.gpu_count | default(1) | int) * (_s.gpu_memory_gb | default(0) | int)
          * 0.9313 * 0.9) | round(1) }}
    _need: >-
      {{ (((_m.weights_gb | default(0) | int) * 0.9313)
          + ((_m.max_model_len | default(0) | int) * (_m.kv_kb_per_token | default(0) | int) / 1048576)
          + ((_m.max_num_seqs | default(0) | int) * (_m.state_mb_per_seq | default(0) | int) / 1024)
          + 1) | round(1) }}
  when:
    # Nothing requested means nothing to fall back FROM. Without this, a
    # cluster deliberately configured with every entry at 0 replicas - a
    # supported setting that site.yml prints a notice for - would have a
    # GPU built for it by the fallback path, at one replica, because
    # gpu_attempt_replicas defaults to 1 when nothing asked for any.
    - (gpu_machinesets | selectattr('replicas', '>', 0) | list) | length > 0
    - gpu_fallback_mode != 'never'
    - model_preset is defined
    - item in gpu_instance_specs
    - item not in (gpu_machinesets | selectattr('replicas', '>', 0)
                   | map(attribute='instance_type') | list)
    - (_s.gpus | default(0) | int) >= (_m.gpu_count | default(1) | int)
    - (_have | float) >= (_need | float)

# The requested types go first, as one attempt - they are what was asked
# for, and several at once is a supported shape. Each fallback is then its
# own attempt, one type at a time, because the point of falling back is to
# ask for less, not to ask for more things at once.
- name: Note how many replicas were asked for
  ansible.builtin.set_fact:
    gpu_attempt_replicas: "{{ gpu_machinesets | selectattr('replicas', '>', 0) | map(attribute='replicas') | first | default(1) }}"

# Three sources, in priority order, each a list of {instance_type,
# replicas} entries. Built as separate facts rather than one expression:
# the first version folded a multi-line template and produced a STRING,
# which then failed on "can only concatenate str (not list) to str" in the
# append below - a confusing error a long way from its cause.
- name: Put the type already running a node first
  ansible.builtin.set_fact:
    gpu_attempt_running: "{{ [[{'instance_type': gpu_type_existing | first, 'replicas': gpu_attempt_replicas | int}]] }}"
  when: (gpu_type_existing | default([])) | length > 0

- name: Then the requested types that are not already running
  ansible.builtin.set_fact:
    gpu_attempt_requested: "{{ [gpu_machinesets | selectattr('replicas', '>', 0) | rejectattr('instance_type', 'in', gpu_type_existing | default([])) | list] }}"

# The requested attempt is repeated gpu_requested_rounds times. Each copy
# is a full sweep of every zone, and try_type.yml waits gpu_round_wait
# between repeats - so insisting on a scarce type is a matter of raising a
# number rather than babysitting the run.
- name: Combine them into the attempt list
  ansible.builtin.set_fact:
    gpu_type_attempts: "{{ (gpu_attempt_running | default([])) + (_requested * (gpu_requested_rounds | int)) }}"
  vars:
    _requested: "{{ gpu_attempt_requested | reject('equalto', []) | list }}"

- name: Append each viable fallback as an attempt of its own
  ansible.builtin.set_fact:
    gpu_type_attempts: "{{ gpu_type_attempts + [[{'instance_type': item, 'replicas': gpu_attempt_replicas | int}]] }}"
  loop: "{{ gpu_fallback_viable | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: item not in (gpu_type_existing | default([]))

- name: Report the instance types that will be tried
  ansible.builtin.debug:
    msg: >-
      GPU instance types to try, in order:
      {{ gpu_type_attempts | map('map', attribute='instance_type')
         | map('join', '+') | join(' then ') }}.
      {{ 'Fallbacks were filtered to those that still fit ' ~ model_preset ~ '.'
         if gpu_type_attempts | length > 1
         else 'No viable fallback - either none is configured, or none fits the selected model.' }}

- name: Provision the GPU MachineSets, trying each type and zone until one works
  ansible.builtin.include_tasks: try_type.yml
  loop: "{{ gpu_type_attempts }}"
  loop_control:
    loop_var: gpu_try_types
    label: "{{ gpu_try_types | map(attribute='instance_type') | join('+') }}"
  when: not (gpu_provisioned | default(false) | bool)

# The zero-replica entries are scale-up-ready placeholders, and they are
# created here rather than during the search. A failed attempt deletes
# every MachineSet it made, so building them alongside each try would mean
# creating and destroying the same empty objects once per zone per type -
# and leaving some behind in whichever zone was abandoned last.
- name: Create the scale-up-ready MachineSets alongside the one that worked
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition: "{{ lookup('template', 'gpu-machineset.yml.j2') | from_yaml }}"
  loop: "{{ gpu_machinesets | rejectattr('replicas', '>', 0) | list }}"
  loop_control:
    label: "{{ item.instance_type }} in {{ gpu_az_provisioned | default('') }} (replicas: 0)"
  vars:
    gpu_az_effective: "{{ gpu_az_provisioned | default('') }}"
  when: gpu_provisioned | default(false) | bool

# Every zone refused. Fail here with what each one said, rather than letting
# the roles after this one run against a cluster with no GPU.
# Only a failure if something was actually asked for. A run with every
# entry at 0 replicas has nothing to provision and nothing to report.
- name: Fail when no zone could provide the GPU nodes
  ansible.builtin.fail:
    msg: >-
      No availability zone could provide
      {{ gpu_machinesets | selectattr('replicas', '>', 0)
         | map(attribute='instance_type') | join(', ') }}.
      Tried {{ gpu_az_candidates | join(', ') }}.
      {{ gpu_az_failures | default([]) | join('  //  ') }}
      ---
      If this is InsufficientInstanceCapacity everywhere, the instance type
      is the lever, not the zone: a 4-GPU g6e.12xlarge is far scarcer than a
      1-GPU g6e.4xlarge, and model_preset qwen3.8-27b-fp8 serves the same
      model on one card.
  when:
    - not (gpu_provisioned | default(false) | bool)
    - (gpu_machinesets | selectattr('replicas', '>', 0) | list) | length > 0


- name: Gather GPU nodes
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Node
    label_selectors:
      - "nvidia.com/gpu.present=true"
  register: _gpu_nodes

# Control-plane nodes are excluded, and this is not a tidiness rule.
#
# The MachineConfigPool below selects node-role.kubernetes.io/gpu. A master
# is already claimed by the master pool, and a node matched by two pools is
# one the MachineConfigOperator refuses to manage - it reports the node as
# degraded and stops applying config to it, which on a single-node cluster
# means the only node.
#
# That is not hypothetical. Single-node OpenShift on AWS runs
# control-plane,master,worker on one machine, and the sandbox flavours come
# on GPU instances - sandbox258 is a g6.8xlarge whose one node already
# reports nvidia.com/gpu.present=true. Without this filter, running the role
# there labels the control plane and builds a pool that fights the master
# pool over it.
- name: Leave control-plane nodes out of the GPU pool
  ansible.builtin.set_fact:
    _gpu_worker_nodes: >-
      {{ _gpu_nodes.resources | default([])
         | rejectattr('metadata.labels', 'contains', 'node-role.kubernetes.io/master')
         | rejectattr('metadata.labels', 'contains', 'node-role.kubernetes.io/control-plane')
         | map(attribute='metadata.name') | list }}

- name: Report a GPU on the control plane
  ansible.builtin.debug:
    msg: >-
      {{ _skipped | join(', ') }} has a GPU but is a control-plane node, so
      it is being left out of the gpu MachineConfigPool - a node in two
      pools is one the MachineConfigOperator will not manage. The GPU still
      works and the NVIDIA operator still schedules on it; only the pool
      membership is withheld. On a single-node cluster this is the normal
      outcome and nothing is wrong.
  vars:
    _skipped: >-
      {{ (_gpu_nodes.resources | default([]) | map(attribute='metadata.name') | list)
         | difference(_gpu_worker_nodes) }}
  when: _skipped | length > 0

- name: Label existing GPU nodes with gpu role
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ item }}"
        labels:
          node-role.kubernetes.io/gpu: ""
  loop: "{{ _gpu_worker_nodes }}"
  loop_control:
    label: "{{ item }}"
  when: _gpu_worker_nodes | length > 0

- name: Create GPU MachineConfigPool
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: MachineConfigPool
      metadata:
        name: gpu
      spec:
        machineConfigSelector:
          matchExpressions:
            - key: machineconfiguration.openshift.io/role
              operator: In
              values:
                - worker
                - gpu
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/gpu: ""

- name: Display GPU MachineSet status
  ansible.builtin.debug:
    msg: >-
      GPU MachineSet {{ cluster_infra_id }}-{{ item.instance_type }}-{{ gpu_az_provisioned }}
      — {{ item.replicas }} replica(s)
      {{ '(zone chosen after ' + (gpu_az_failures | length | string) + ' other(s) had no capacity)'
         if (gpu_az_failures | default([])) | length > 0 else '' }}
  loop: >-
    {{ (gpu_types_provisioned | default([]))
       + (gpu_machinesets | rejectattr('replicas', '>', 0) | list) }}
  loop_control:
    label: "{{ item.instance_type }}"
  # gpu_az_provisioned only exists once a zone has worked. Without this
  # guard the summary fails on an undefined variable in exactly the case
  # where there is nothing to summarise - a run that asked for no GPU at
  # all, which is a supported setting rather than a mistake.
  when: gpu_provisioned | default(false) | bool

- name: Report that no GPU was asked for
  ansible.builtin.debug:
    msg: >-
      No GPU MachineSet was created: every gpu_machinesets entry is at 0
      replicas. Nothing was attempted and nothing failed. Set a replica
      count, or use run.sh's GPU prompt, if this cluster is meant to have
      one.
  when:
    - not (gpu_provisioned | default(false) | bool)
    - (gpu_machinesets | selectattr('replicas', '>', 0) | list) | length == 0

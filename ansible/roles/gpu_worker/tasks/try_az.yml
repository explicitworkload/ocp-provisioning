---
# One attempt at provisioning the GPU MachineSets in a single availability
# zone. main.yml includes this once per candidate AZ.
#
# The zone under test arrives as gpu_az_effective - the same variable the
# template reads - so nothing has to be threaded through explicitly.
#
# TWO THINGS ABOUT THE GUARD, both learned the hard way on sandbox1079.
#
# It belongs HERE, not only on the include. main.yml also carries
# "when: not gpu_provisioned" on its include_tasks, and that is not enough:
# with a loop, the condition on an include is not re-evaluated against facts
# set by earlier iterations, so every zone runs whatever the earlier ones
# did. us-east-2c provisioned, the loop carried on to us-east-2a anyway, and
# started a second 4-GPU node. A block-level when IS evaluated per include.
#
# And gpu_provisioned must be set by the LAST task in the block, never in
# the middle. A block's when is ANDed onto every task inside it, so the
# instant the guard variable flips true, every REMAINING task in that same
# block skips - including the ones that record which zone won and report
# it. The first version set it halfway through and silently lost both, so
# the role then failed on an undefined gpu_az_provisioned having just
# succeeded. gpu_zone_ok carries the decision within the zone;
# gpu_provisioned is the loop's business and is written once, at the end.
- name: "{{ gpu_az_effective }}: attempt this zone"
  when: not (gpu_provisioned | default(false) | bool)
  block:

    # Anchors the event filter below. Taken before anything is created, so
    # no refusal this attempt causes can predate it.
    - name: "{{ gpu_az_effective }}: note when this attempt began"
      ansible.builtin.set_fact:
        gpu_attempt_started: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

    - name: "{{ gpu_az_effective }}: create the GPU MachineSets"
      kubernetes.core.k8s:
        context: "{{ ocp_context or omit }}"
        state: present
        apply: true
        definition: "{{ lookup('template', 'gpu-machineset.yml.j2') | from_yaml }}"
      loop: "{{ gpu_try_types }}"
      loop_control:
        label: "{{ item.instance_type }} in {{ gpu_az_effective }} (replicas: {{ item.replicas }})"

    # Watch the MACHINES first, not the MachineSet, and give this poll two
    # ways to finish. Waiting only for readyReplicas means a zone with no
    # capacity costs the entire budget before anyone finds out, and the
    # eventual message says "not ready" rather than naming the cause. AWS
    # answers RunInstances with
    #
    #   InsufficientInstanceCapacity: We currently do not have sufficient
    #   g6e.12xlarge capacity in the Availability Zone you requested
    #
    # and that lands on the Machine as an errorMessage, a Failed phase, or
    # both - usually within a minute. Either is enough to stop waiting.
    - name: "{{ gpu_az_effective }}: wait for the machines, or for a reason not to"
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: machine.openshift.io/v1beta1
        kind: Machine
        namespace: openshift-machine-api
        label_selectors:
          - "machine.openshift.io/cluster-api-machineset={{ cluster_infra_id }}-{{ item.instance_type }}-{{ gpu_az_effective }}"
      register: gpu_machines
      until: >-
        (gpu_machines.resources | default([])
           | selectattr('status.phase', 'defined')
           | selectattr('status.phase', 'equalto', 'Running')
           | list | length) >= (item.replicas | int)
        or
        (gpu_machines.resources | default([])
           | selectattr('status.errorMessage', 'defined') | list | length) > 0
        or
        (gpu_machines.resources | default([])
           | selectattr('status.phase', 'defined')
           | selectattr('status.phase', 'equalto', 'Failed')
           | list | length) > 0
      retries: "{{ gpu_az_attempt_retries }}"
      delay: "{{ gpu_az_attempt_delay }}"
      # This task failing IS the signal. An unusable zone must not abort.
      failed_when: false
      loop: "{{ gpu_try_types | selectattr('replicas', '>', 0) | list }}"
      loop_control:
        label: "{{ item.instance_type }} in {{ gpu_az_effective }}"

# status.errorMessage catches only HALF of what AWS refuses, and the half
# it misses is the common one.
#
# A terminal rejection - "not supported in your requested Availability
# Zone" - sets errorReason/errorMessage and moves the Machine to Failed.
# InsufficientInstanceCapacity does NOT. The machine controller treats it
# as retryable, so it keeps calling RunInstances, the Machine sits in
# Provisioning with both error fields EMPTY, and the only record is a
# FailedCreate Event. Measured on sandbox3547: phase=Provisioning,
# errorReason empty, errorMessage empty, and sixteen FailedCreate events
# all saying InsufficientInstanceCapacity.
#
# The cost of missing it was the whole point of this file. The poll above
# ran its budget out seeing nothing, gpu_az_errors came back empty, so the
# node-join wait below did NOT skip and spent its budget too - about
# eleven minutes per zone to discover something AWS had said in thirty
# seconds, three times over.
    - name: "{{ gpu_az_effective }}: ask the machine controller what AWS said"
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: v1
        kind: Event
        namespace: openshift-machine-api
        field_selectors:
          - reason=FailedCreate
      register: gpu_create_events
      failed_when: false

    # Matched on THIS attempt's MachineSet, and only events newer than the
    # moment it started. Both halves are load-bearing.
    #
    # A zone-wide match ("<infra>-.*-<az>-") looks right and is badly
    # wrong: Events live about an hour, so the 62 FailedCreate events left
    # by g6e.4xlarge made every later type in that zone look pre-failed.
    # The node-join wait then skipped, and the role deleted g6.4xlarge and
    # g5.4xlarge instances that had reached Provisioned in 47s and were
    # busy becoming nodes. It destroyed working capacity while reporting
    # that none existed.
    #
    # The timestamp does the same job across runs: without it, a re-run
    # inherits the previous run's refusals for the same type and zone and
    # gives up without trying.
    - name: "{{ gpu_az_effective }}: start with no errors for this zone"
      ansible.builtin.set_fact:
        gpu_az_errors: >-
          {{ (gpu_machines.results | default([]))
             | map(attribute='resources') | map('default', [], true) | sum(start=[])
             | selectattr('status.errorMessage', 'defined')
             | map(attribute='status.errorMessage')
             | map('truncate', 220, true) | list }}

    - name: "{{ gpu_az_effective }}: add what AWS refused for each type tried"
      ansible.builtin.set_fact:
        gpu_az_errors: "{{ (gpu_az_errors + _matched) | unique }}"
      loop: "{{ gpu_try_types }}"
      loop_control:
        label: "{{ item.instance_type }}"
      vars:
        _prefix: "{{ cluster_infra_id }}-{{ item.instance_type }}-{{ gpu_az_effective }}-"
        _matched: >-
          {{ gpu_create_events.resources | default([])
             | selectattr('involvedObject.name', 'defined')
             | selectattr('involvedObject.name', 'match', _prefix | regex_escape)
             | selectattr('lastTimestamp', 'defined')
             | selectattr('lastTimestamp', '>', gpu_attempt_started)
             | map(attribute='message') | map('truncate', 220, true) | list }}

    # Machine phase Running comes before the node registers, so the zone has
    # only really worked once readyReplicas catches up. Skipped when the zone
    # already errored - otherwise a dead zone burns this budget as well.
    - name: "{{ gpu_az_effective }}: wait for the nodes to join"
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: machine.openshift.io/v1beta1
        kind: MachineSet
        namespace: openshift-machine-api
        name: "{{ cluster_infra_id }}-{{ item.instance_type }}-{{ gpu_az_effective }}"
      register: gpu_ms_check
      until: >-
        gpu_ms_check.resources | length > 0 and
        (gpu_ms_check.resources[0].status.readyReplicas | default(0) | int) >= (item.replicas | int)
      retries: "{{ gpu_node_join_retries }}"
      delay: "{{ gpu_node_join_delay }}"
      # ignore_errors, not failed_when: false - this keeps failed: true on
      # each item result, which is how the next task decides.
      ignore_errors: true
      loop: "{{ gpu_try_types | selectattr('replicas', '>', 0) | list }}"
      loop_control:
        label: "{{ item.instance_type }} in {{ gpu_az_effective }}"
      when: gpu_az_errors | length == 0

    # Local to this zone, deliberately. See the header: naming this
    # gpu_provisioned would make every task below it skip.
    - name: "{{ gpu_az_effective }}: decide whether the zone worked"
      ansible.builtin.set_fact:
        # Every requested MachineSet reached its replica count and nothing
        # errored. A skipped wait leaves results empty, which must NOT read
        # as success - hence the length check.
        gpu_zone_ok: >-
          {{ gpu_az_errors | length == 0
             and (gpu_ms_check.results | default([])) | length > 0
             and (gpu_ms_check.results | default([])
                  | selectattr('failed', 'defined')
                  | selectattr('failed') | list | length) == 0 }}

    - name: "{{ gpu_az_effective }}: say what the zone did"
      ansible.builtin.debug:
        msg: >-
          {{ gpu_az_effective }} -
          {{ 'provisioned' if gpu_zone_ok | bool else 'no' }}.
          {{ gpu_az_errors | join(' | ') if gpu_az_errors | length > 0
             else ('' if gpu_zone_ok | bool
                   else 'machines never became ready within the per-zone budget') }}

    # Leaving a half-provisioned MachineSet in a zone that cannot fill it
    # keeps Failed Machines around for someone else to find, and - because
    # the names differ only by zone - lets a re-run end up with GPU
    # MachineSets in two places, which is how you quietly pay for two nodes.
    - name: "{{ gpu_az_effective }}: remove the MachineSets this zone could not fill"
      kubernetes.core.k8s:
        context: "{{ ocp_context or omit }}"
        state: absent
        api_version: machine.openshift.io/v1beta1
        kind: MachineSet
        namespace: openshift-machine-api
        name: "{{ cluster_infra_id }}-{{ item.instance_type }}-{{ gpu_az_effective }}"
        wait: true
        wait_timeout: 300
      loop: "{{ gpu_try_types }}"
      loop_control:
        label: "{{ item.instance_type }} in {{ gpu_az_effective }}"
      when: not (gpu_zone_ok | bool)

    # wait: true on the MachineSet waits for the MachineSet OBJECT to go,
    # not for its Machines, and certainly not for AWS to terminate the
    # instances. A terminating EC2 instance keeps counting against the
    # account's per-bucket vCPU quota - so the next zone is attempted while
    # the last one is still billed for, and on a large type that is
    # instantly fatal:
    #
    #   You have requested more vCPU capacity than your current vCPU limit
    #   of 64 allows for the instance bucket that the specified instance
    #   type belongs to
    #
    # Seen on sandbox760 hunting a g7e.12xlarge: 48 vCPU each against a
    # limit of 64, so two overlapping attempts are 96 and every zone after
    # the first fails on QUOTA rather than capacity. The sweep was racing
    # itself, and the error reads like the account is too small when the
    # bucket was in fact empty.
    #
    # Not fatal on timeout: a Machine stuck Deleting is a cluster problem,
    # and failing here would report it as a GPU problem.
    - name: "{{ gpu_az_effective }}: wait for the instances to release their quota"
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: machine.openshift.io/v1beta1
        kind: Machine
        namespace: openshift-machine-api
        label_selectors:
          - "machine.openshift.io/cluster-api-machineset={{ cluster_infra_id }}-{{ item.instance_type }}-{{ gpu_az_effective }}"
      register: gpu_az_drain
      until: (gpu_az_drain.resources | default([]) | length) == 0
      retries: "{{ gpu_az_drain_retries }}"
      delay: "{{ gpu_az_drain_delay }}"
      failed_when: false
      loop: "{{ gpu_try_types }}"
      loop_control:
        label: "{{ item.instance_type }} in {{ gpu_az_effective }}"
      when: not (gpu_zone_ok | bool)

    - name: "{{ gpu_az_effective }}: say that the instances are still going"
      ansible.builtin.debug:
        msg: >-
          Machines from this attempt are still terminating after
          {{ (gpu_az_drain_retries | int) * (gpu_az_drain_delay | int) }}s.
          The next zone is tried anyway, but if it fails on a vCPU quota
          rather than on capacity, that is why - a terminating instance
          still counts against the limit.
      when:
        - not (gpu_zone_ok | bool)
        - (gpu_az_drain.results | default([])
           | map(attribute='resources') | map('default', [], true)
           | map('length') | select('>', 0) | list | length) > 0

    - name: "{{ gpu_az_effective }}: remember why, for the final message"
      ansible.builtin.set_fact:
        gpu_az_failures: >-
          {{ (gpu_az_failures | default([]))
             + [gpu_az_effective + ' - ' + (gpu_az_errors | first
                | default('machines never became ready within the per-zone budget', true))] }}
      when: not (gpu_zone_ok | bool)

    # LAST. Flipping the guard any earlier skips everything after it.
    - name: "{{ gpu_az_effective }}: stop the loop if this zone worked"
      ansible.builtin.set_fact:
        gpu_provisioned: true
        gpu_az_provisioned: "{{ gpu_az_effective }}"
        # What was actually built, which is not necessarily what was asked
        # for - a fallback type ends up here. The summary reads this rather
        # than gpu_machinesets, or it names a MachineSet that does not
        # exist.
        gpu_types_provisioned: "{{ gpu_try_types }}"
      when: gpu_zone_ok | bool

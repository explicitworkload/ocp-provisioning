---
# Empty = try every zone the cluster has workers in, in random order, until
# one provisions. Set a zone to PIN it: the role then uses that one only and
# does not fall back, because a pin exists to stop it wandering.
#
# Random rather than fixed because GPU capacity moves around. AWS answers
#
#   InsufficientInstanceCapacity: We currently do not have sufficient
#   g6e.12xlarge capacity in the Availability Zone you requested
#
# per zone, and a fixed order has every cluster in a sandbox fleet queue
# behind the same one. A zone that already holds this role's GPU MachineSets
# is always tried first regardless, so re-runs converge instead of scattering.
gpu_availability_zone: ""
gpu_volume_size: 120

# What to do when the requested instance type has no capacity anywhere.
#
#   auto  - fall back to the next viable type without asking. The default,
#           and the right one for an unattended run.
#   ask   - pause and offer the choice at the moment the answer is known:
#           Enter accepts the fallback, "n" stops. The prompt times out
#           after gpu_fallback_ask_timeout and proceeds as auto, so a
#           nohup or CI run never hangs on it - verified: a pause with
#           seconds: returns immediately with empty input when there is no
#           TTY.
#   never - do not fall back at all; fail on the requested type. Same
#           effect as gpu_instance_fallback: [], said more plainly.
#
# This belongs here rather than in run.sh, and not for tidiness: capacity
# is only knowable by asking AWS for the instance. run.sh executes before
# the playbook, probing would take minutes and duplicate this role, and
# ec2:DescribeInstanceTypeOfferings is denied to the cluster's scoped
# credential. The decision point is mid-play because the information is.
gpu_fallback_mode: auto
gpu_fallback_ask_timeout: 120

# How many times to sweep every zone for the REQUESTED type before any
# fallback is considered, and how long to wait between sweeps.
#
# For holding out rather than choosing. Capacity is a queue, not a fixed
# property: g7e.2xlarge was refused in every zone of two regions one
# afternoon and provisioned normally a few hours later. 1 keeps today's
# behaviour; 3 with the default wait spends about half an hour trying to
# get the card actually asked for before settling for another.
gpu_requested_rounds: 1
gpu_round_wait: 300

# Tried in order when the requested type has no capacity in ANY zone.
#
# Exhausting three zones of one type and giving up is a worse search than
# it looks: on sandbox2134 g6e.4xlarge was unavailable in all of
# us-east-2a/b/c while g6.4xlarge, g5.4xlarge and g4dn.4xlarge were all
# available in the first zone tried. The region was not out of GPUs, it was
# out of L40S.
#
# Ordered strongest first, so a fallback costs as little capability as the
# situation allows: L4 and A10G are both 24 GB, the T4 16 GB and two
# generations older.
#
# EVERY ENTRY IS FILTERED AGAINST THE SELECTED MODEL before it is tried, on
# both GPU count and usable VRAM. A type that cannot hold the model is not
# a fallback - it is a node that provisions and then fails at model load,
# two roles later, with nothing pointing back here. Set this to [] to
# disable fallback and fail on the requested type alone.
gpu_instance_fallback:
  # The 4-GPU alternatives come first, and they are the reason this list was
  # revisited. Every entry used to be a 1-GPU type, so a 4-GPU preset like
  # qwen3.8-27b had NOTHING that passed the fit check - the role swept three
  # zones for g6e.12xlarge, found InsufficientInstanceCapacity in all of
  # them, and failed outright rather than trying another 4-GPU type that was
  # sitting in a different capacity pool. Seen on sandbox760.
  #
  # Weaker cards than the L40S - L4 and A10G are 24 GB against 48 - but four
  # of either is 96 GB, which still holds qwen3.8-27b's 56 GB of weights.
  # Both are 48 vCPU, the same as g6e.12xlarge, so neither changes the quota
  # arithmetic.
  - g6.12xlarge
  - g5.12xlarge
  - g6.4xlarge
  - g5.4xlarge
  - g4dn.4xlarge

# Per-zone budgets. These multiply by the number of zones, so they are much
# smaller than the single 30-minute wait they replace - three zones at these
# settings is 24 minutes of worst case against the old 30 for one.
#
# gpu_az_attempt_retries covers EC2 accepting the instance. Two minutes,
# not five: a refusal reaches the cluster in about thirty seconds either as
# a Failed Machine or as a FailedCreate Event, and try_az.yml reads both
# the moment this poll gives up. Waiting longer only delays the question.
#
# A zone that is genuinely working but slow is not cut off by this - the
# node-join wait below is what covers RHCOS booting and registering, and it
# only runs when no refusal was found.
gpu_az_attempt_retries: 8
gpu_az_attempt_delay: 15

# The node still has to boot RHCOS, pull ignition and register. That is the
# slow part, it only runs in a zone that has already accepted the instance,
# and it gets its OWN delay rather than reusing the one above.
#
# Sharing gpu_az_attempt_delay was a real bug, not a tidiness point.
# Dropping that delay from 30s to 15s to detect refusals faster also
# halved this wait, from 6 minutes to 3 - and a node takes 4 to 6 to boot
# and register. The role then abandoned instances that were provisioning
# perfectly well, deleted them, and moved to the next zone. Measured on
# sandbox2134: g5.4xlarge reached Provisioned in 47s and was destroyed two
# minutes later for not having become a node yet, three zones running.
#
# 20 x 30s = 10 minutes, which is past the slowest join seen and costs
# nothing when the node is quick, because the wait ends as soon as
# readyReplicas catches up.
gpu_node_join_retries: 20
gpu_node_join_delay: 30
gpu_machinesets:
  - instance_type: g4dn.4xlarge
    replicas: 1

# What each instance type actually provides, for the preflight fit check.
# gpu_memory_gb is PER GPU, so a tensor-parallel model's budget is
# gpu_count x gpu_memory_gb and the maths stays honest for multi-GPU.
#
# This WAS reporting-only. It is not any more: gpu_serving_instance_type
# and gpu_workbench_instance_type at the bottom of this file rank the
# provisioned types by the gpus/gpu_memory_gb columns to decide which node
# the served model pins to and which the GPU workbench pins to. An instance
# missing from this table ranks as 1 GPU / 0 GB rather than failing, which
# is the safe way to be wrong - it sorts to the workbench end, so an
# unknown type never displaces a known one from the serving node.
#
# gpu_memory_gb is the VENDOR figure in GB, not the GiB number AWS prints.
# site.yml converts (x 0.9313) and then takes vLLM's default 0.9 of the
# card. Mixing the two units silently inflates every budget by 7%: AWS
# lists the L40S as "44 GiB", which is the same 48 GB card.
gpu_instance_specs:
  g4dn.xlarge:   {gpus: 1, gpu_memory_gb: 16,  gpu: "T4"}
  g4dn.4xlarge:  {gpus: 1, gpu_memory_gb: 16,  gpu: "T4"}
  # A10G and L4 are both 24 GB cards; AWS prints them as "22 GiB", the same
  # GB-vs-GiB difference as the L40S's "44 GiB" for a 48 GB card.
  g5.2xlarge:    {gpus: 1, gpu_memory_gb: 24,  gpu: "A10G"}
  g5.4xlarge:    {gpus: 1, gpu_memory_gb: 24,  gpu: "A10G"}
  g5.8xlarge:    {gpus: 1, gpu_memory_gb: 24,  gpu: "A10G"}
  g5.12xlarge:   {gpus: 4, gpu_memory_gb: 24,  gpu: "A10G"}
  g6.2xlarge:    {gpus: 1, gpu_memory_gb: 24,  gpu: "L4"}
  g6.4xlarge:    {gpus: 1, gpu_memory_gb: 24,  gpu: "L4"}
  g6.8xlarge:    {gpus: 1, gpu_memory_gb: 24,  gpu: "L4"}
  g6.12xlarge:   {gpus: 4, gpu_memory_gb: 24,  gpu: "L4"}
  g6e.4xlarge:   {gpus: 1, gpu_memory_gb: 48,  gpu: "L40S"}
  g6e.12xlarge:  {gpus: 4, gpu_memory_gb: 48,  gpu: "L40S"}
  g6e.48xlarge:  {gpus: 8, gpu_memory_gb: 48,  gpu: "L40S"}
  # RTX PRO 6000 Blackwell Server Edition, 96 GB each. The family does NOT
  # scale GPUs with the size name the way g6e does - 2xl through 8xl all
  # carry exactly one card and differ only in vCPU and host RAM (8/64,
  # 16/128, 32/256), so those three buy cores, not VRAM. The GPU count only
  # moves at 12xlarge and above: 2, then 4, then 8 at 48xlarge.
  g7e.2xlarge:   {gpus: 1, gpu_memory_gb: 96,  gpu: "RTX PRO 6000 Blackwell"}
  g7e.4xlarge:   {gpus: 1, gpu_memory_gb: 96,  gpu: "RTX PRO 6000 Blackwell"}
  g7e.8xlarge:   {gpus: 1, gpu_memory_gb: 96,  gpu: "RTX PRO 6000 Blackwell"}
  g7e.12xlarge:  {gpus: 2, gpu_memory_gb: 96,  gpu: "RTX PRO 6000 Blackwell"}
  g7e.24xlarge:  {gpus: 4, gpu_memory_gb: 96,  gpu: "RTX PRO 6000 Blackwell"}
  p4d.24xlarge:  {gpus: 8, gpu_memory_gb: 40,  gpu: "A100 40GB"}
  p4de.24xlarge: {gpus: 8, gpu_memory_gb: 80,  gpu: "A100 80GB"}

# How long to wait for a failed zone's instances to actually terminate
# before trying the next zone. Not politeness: a terminating EC2 instance
# still counts against the account's per-bucket vCPU quota, so on a large
# type two overlapping attempts exceed it and every zone after the first
# fails on quota instead of capacity. 20 x 15s = 5 minutes, which is past
# the slowest termination seen and costs nothing when it is quick.
gpu_az_drain_retries: 20
gpu_az_drain_delay: 15

# --- who gets which GPU node ------------------------------------------------
# Two things on this cluster want a GPU and neither can share one: the
# served model (roles/model_serving) and the GPU workbench
# (roles/demos/tasks/workbench.yml). A GPU is not divisible here - no MIG,
# no time-slicing - so a node with one card satisfies exactly one of them.
#
# That was previously left to the scheduler, and the scheduler cannot win
# it. The model asked for "any node labelled gpu" while the workbench
# pinned to an instance TYPE, so with two single-GPU nodes the outcome
# depended on which pod was scheduled first: land the model on the
# workbench's type and the workbench sits Pending for ever against a
# cluster that does, in fact, have a spare card. A coin flip that only
# shows up once someone asks for two GPU types.
#
# So both ends are pinned, and to different types. Ranked by capacity
# rather than by position in gpu_machinesets, because position is not
# information the user meant to supply - someone listing
# g6e.4xlarge before g6e.12xlarge is not asking for the 4-GPU preset to
# run on the one-card node, and sorting by capacity means they cannot
# accidentally say that.

# What was actually built, which after a fallback is NOT what was asked
# for. gpu_types_provisioned is set by try_az.yml only once a zone has
# worked; the default keeps this correct under --tags demos or --tags
# model_serving, where gpu_worker never ran and the requested list is the
# best available answer.
gpu_types_effective: >-
  {{ gpu_types_provisioned
     | default(gpu_machinesets | default([])
               | selectattr('replicas', '>', 0) | list, true) }}

_gpu_rank_names: >-
  {{ gpu_types_effective | map(attribute='instance_type') | map('trim') | list }}

# gpu_instance_specs with an entry forced in for every type this run
# actually uses, so the lookups below cannot miss.
#
# The fill is not defensive padding, it is required: map('extract') raises
# on a key the dict does not have rather than returning undefined, so a
# type absent from the table - a new AWS family, a typo in all.yml - would
# abort the whole play on an attribute error rather than degrade. Measured,
# not assumed; the first version of this did fail that way.
#
# recursive=true so a real entry overrides the placeholder key by key: a
# table entry that happened to omit gpu_memory_gb keeps its gpus count and
# borrows only the missing field.
#
# 1 card / 0 GB is the deliberate placeholder. It is the smallest thing the
# sort can rank, so an unknown type lands at the workbench end and can
# never displace a known card from the serving node.
_gpu_rank_specs: >-
  {{ dict(_gpu_rank_names | zip([{'gpus': 1, 'gpu_memory_gb': 0}] * (_gpu_rank_names | length)))
     | combine(gpu_instance_specs | default({}), recursive=true) }}

_gpu_rank_sizes: >-
  {{ _gpu_rank_names | map('extract', _gpu_rank_specs, 'gpus') | map('int', 1) | list }}
_gpu_rank_mem: >-
  {{ _gpu_rank_names | map('extract', _gpu_rank_specs, 'gpu_memory_gb') | map('int', 0) | list }}

# [[gpus, gpu_memory_gb, name], ...] ascending. A list of lists sorts
# element by element, so this is "by card count, then by card size, then
# by name" - and the name tiebreak is only there to make the result
# deterministic rather than because g7e beats g6e alphabetically.
gpu_types_ranked: >-
  {{ _gpu_rank_sizes | zip(_gpu_rank_mem, _gpu_rank_names) | map('list') | sort | list }}

# The biggest card the run provisioned. The served model goes here: it is
# the only one of the two that can need more than one GPU, and a 4-GPU
# preset has exactly one node it can run on.
gpu_serving_instance_type: >-
  {{ (gpu_types_ranked | last | last) if (gpu_types_ranked | length) > 0 else '' }}

# The smallest. The workbench goes here - interactive notebook work is
# the thing that should yield the big card, not claim it.
#
# With a single entry in gpu_machinesets these two resolve to the SAME
# type, which is the long-standing behaviour and still the default: one
# GPU node, and whichever of the two is scheduled first takes the card.
# Giving the workbench a card of its own means asking for a second type,
# or a second replica of the one type.
gpu_workbench_instance_type: >-
  {{ (gpu_types_ranked | first | last) if (gpu_types_ranked | length) > 0 else '' }}

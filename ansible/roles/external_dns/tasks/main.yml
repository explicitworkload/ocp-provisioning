---
- name: Create ExternalDNS namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ external_dns_namespace }}"

- name: Create ExternalDNS ServiceAccount
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: external-dns
        namespace: "{{ external_dns_namespace }}"

- name: Create ExternalDNS ClusterRole
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: external-dns
      rules:
        - apiGroups: [""]
          resources: ["services", "endpoints", "pods", "nodes", "namespaces"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["ingresses"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["route.openshift.io"]
          resources: ["routes"]
          verbs: ["get", "list", "watch"]

- name: Bind ExternalDNS ServiceAccount to ClusterRole
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: external-dns
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: external-dns
      subjects:
        - kind: ServiceAccount
          name: external-dns
          namespace: "{{ external_dns_namespace }}"

# The token can arrive two ways: passed as a variable, or created out of band
# with `oc create secret`. Either is enough to deploy.
- name: Check for an existing Cloudflare credentials Secret
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Secret
    namespace: "{{ external_dns_namespace }}"
    name: cloudflare-credentials
  register: cf_secret
  no_log: true

- name: Record whether Cloudflare credentials are available
  ansible.builtin.set_fact:
    cloudflare_secret_present: >-
      {{ (cf_secret.resources | default([]) | length) > 0 }}

- name: Warn when no Cloudflare credentials are available
  ansible.builtin.debug:
    msg: >-
      No Cloudflare credentials found — RBAC is in place but the ExternalDNS
      deployment is skipped. Either re-run with -e cloudflare_api_token="<token>"
      or create the cloudflare-credentials Secret in the
      {{ external_dns_namespace }} namespace and re-run.
  when:
    - not cloudflare_secret_present
    - cloudflare_api_token | length == 0

- name: Create Cloudflare credentials Secret
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-credentials
        namespace: "{{ external_dns_namespace }}"
      type: Opaque
      stringData:
        CF_API_TOKEN: "{{ cloudflare_api_token }}"
  no_log: true
  when: cloudflare_api_token | length > 0

- name: Deploy ExternalDNS against Cloudflare
  when: cloudflare_api_token | length > 0 or cloudflare_secret_present
  block:
    - name: Create ExternalDNS Deployment
      kubernetes.core.k8s:
        context: "{{ ocp_context or omit }}"
        state: present
        apply: true
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: external-dns
            namespace: "{{ external_dns_namespace }}"
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: external-dns
            template:
              metadata:
                labels:
                  app: external-dns
              spec:
                serviceAccountName: external-dns
                containers:
                  - name: external-dns
                    image: "{{ external_dns_image }}"
                    # --cloudflare-proxied is a kingpin boolean flag: it takes
                    # no value, so it is included only when enabled.
                    args: >-
                      {{
                        [
                          '--source=openshift-route',
                          '--provider=cloudflare',
                          '--domain-filter=' ~ external_dns_domain,
                          '--registry=txt',
                          '--txt-owner-id=' ~ external_dns_txt_owner_id,
                          '--txt-prefix=externaldns-',
                          '--policy=sync',
                          '--log-level=info',
                        ] + (
                          ['--cloudflare-proxied']
                          if external_dns_cloudflare_proxied | bool else []
                        )
                      }}
                    env:
                      - name: CF_API_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: cloudflare-credentials
                            key: CF_API_TOKEN
                    resources:
                      requests:
                        cpu: 20m
                        memory: 64Mi
                      limits:
                        memory: 256Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      runAsNonRoot: true
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault

    - name: Wait for ExternalDNS to be ready
      kubernetes.core.k8s_info:
        context: "{{ ocp_context or omit }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ external_dns_namespace }}"
        name: external-dns
      register: edns_deploy
      until: >-
        edns_deploy.resources | length > 0 and
        edns_deploy.resources[0].status.readyReplicas | default(0) >= 1
      retries: 20
      delay: 10

    - name: Display ExternalDNS summary
      ansible.builtin.debug:
        msg: >-
          ExternalDNS managing {{ external_dns_domain }} from OpenShift Routes
          (owner id {{ external_dns_txt_owner_id }}). Routes with a host in that zone get
          a Cloudflare record automatically.

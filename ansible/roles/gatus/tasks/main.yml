---
- name: Create gatus namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gatus_namespace }}"

# Gatus has no Kubernetes service discovery — every endpoint is declared here.
# The (public) entries only exist when ExternalDNS is publishing those names.
- name: Build Gatus endpoint list
  ansible.builtin.set_fact:
    gatus_endpoints: "{{ gatus_core_endpoints + gatus_public_endpoints }}"
  vars:
    # In-cluster service DNS: skips the load-balancer hairpin and, where the
    # service speaks plain HTTP, the TLS handshake too. The console is checked
    # both ways so an ingress failure is distinguishable from an app failure.
    gatus_core_endpoints:
      - name: Bookinfo Productpage
        url: "http://productpage.bookinfo.svc.cluster.local:9080/productpage"
        interval: 60s
        conditions: ["[STATUS] == 200"]
      - name: Kiali
        url: "https://kiali.istio-system.svc.cluster.local:20001/"
        interval: 60s
        conditions: ["[STATUS] == 200"]
        client: {insecure: true}
      - name: Operations Dashboard
        url: "http://ops-dashboard.dashboard.svc.cluster.local:8080/healthz"
        interval: 60s
        conditions: ["[STATUS] == 200"]
      - name: Dev Spaces
        url: "http://che-gateway.openshift-devspaces.svc.cluster.local:8080/"
        interval: 60s
        conditions: ["[STATUS] == any(200, 301, 302, 403)"]
      - name: OpenShift Console
        url: "https://console.openshift-console.svc.cluster.local:443/"
        interval: 60s
        conditions: ["[STATUS] == 200"]
        client: {insecure: true}
      - name: OpenShift Console (ingress)
        url: "https://console-openshift-console.{{ ocp_apps_domain }}"
        interval: 60s
        conditions: ["[STATUS] == any(200, 301, 302, 403)"]
        client: {insecure: true}
    gatus_dashboard_public:
      - name: Operations Dashboard (public)
        url: "https://{{ dashboard_custom_host }}"
        interval: 60s
        conditions: ["[STATUS] == 200"]
        client: {insecure: true}
    gatus_devspaces_public:
      - name: Dev Spaces (public)
        url: "https://{{ devspaces_custom_host }}"
        interval: 60s
        conditions: ["[STATUS] == any(200, 301, 302, 403)"]
        client: {insecure: true}
    gatus_public_endpoints: >-
      {{
        (gatus_dashboard_public
         if deploy_external_dns | bool and dashboard_custom_host | length > 0 else [])
        +
        (gatus_devspaces_public
         if deploy_external_dns | bool and devspaces_custom_host | length > 0 else [])
      }}

- name: Create Gatus ConfigMap
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gatus-config
        namespace: "{{ gatus_namespace }}"
      data:
        config.yaml: "{{ {'endpoints': gatus_endpoints} | to_nice_yaml(indent=2) }}"

- name: Create Gatus Deployment
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gatus
        namespace: "{{ gatus_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: gatus
        template:
          metadata:
            labels:
              app: gatus
          spec:
            containers:
              - name: gatus
                image: "{{ gatus_image }}"
                ports:
                  - containerPort: 8080
                volumeMounts:
                  - name: gatus-config
                    mountPath: /config/config.yaml
                    subPath: config.yaml
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
            volumes:
              - name: gatus-config
                configMap:
                  name: gatus-config

- name: Create Gatus Service
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: gatus
        namespace: "{{ gatus_namespace }}"
      spec:
        selector:
          app: gatus
        ports:
          - port: 8080
            targetPort: 8080
            name: http

- name: Create Gatus Route
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: gatus
        namespace: "{{ gatus_namespace }}"
      spec:
        host: "gatus.{{ ocp_apps_domain }}"
        to:
          kind: Service
          name: gatus
        port:
          targetPort: http
        tls:
          termination: edge

- name: Wait for Gatus to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ gatus_namespace }}"
    name: gatus
  register: gatus_deploy
  until: >-
    gatus_deploy.resources | length > 0 and
    gatus_deploy.resources[0].status.readyReplicas is defined and
    gatus_deploy.resources[0].status.readyReplicas >= 1
  retries: 20
  delay: 15

- name: Display Gatus URL
  ansible.builtin.debug:
    msg: "Gatus health dashboard: https://gatus.{{ ocp_apps_domain }}"

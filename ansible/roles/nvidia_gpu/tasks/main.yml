---
- name: Wait for NVIDIA GPU Operator CSV to succeed
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: nvidia-gpu-operator
    label_selectors:
      - "operators.coreos.com/gpu-operator-certified.nvidia-gpu-operator="
  register: nvidia_csvs
  until: >-
    nvidia_csvs.resources | length > 0 and
    nvidia_csvs.resources | selectattr('status.phase', 'defined') |
    selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
  retries: 30
  delay: 30

- name: Wait for ClusterPolicy CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusterpolicies.nvidia.com
  register: cp_crd
  until: cp_crd.resources | length > 0
  retries: 20
  delay: 15

- name: Create NVIDIA ClusterPolicy
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: nvidia.com/v1
      kind: ClusterPolicy
      metadata:
        name: gpu-cluster-policy
      spec:
        operator:
          defaultRuntime: crio
        daemonsets:
          priorityClassName: system-node-critical
          updateStrategy: RollingUpdate
          rollingUpdate:
            maxUnavailable: "1"
        driver:
          enabled: true
          upgradePolicy:
            autoUpgrade: true
            maxParallelUpgrades: 1
            maxUnavailable: "25%"
        dcgm:
          enabled: true
        dcgmExporter:
          enabled: true
        devicePlugin:
          enabled: true
        gfd:
          enabled: true
        migManager:
          enabled: true
        nodeStatusExporter:
          enabled: true
        toolkit:
          enabled: true
        validator:
          plugin:
            env:
              - name: WITH_WORKLOAD
                value: "true"
        sandboxDevicePlugin:
          enabled: false
        vfioManager:
          enabled: false
        vgpuDeviceManager:
          enabled: false
        vgpuManager:
          enabled: false

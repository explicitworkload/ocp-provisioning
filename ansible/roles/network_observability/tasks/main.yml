---
- name: Wait for Network Observability Operator CSV to succeed
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: openshift-operators
    label_selectors:
      - "operators.coreos.com/netobserv-operator.openshift-operators="
  register: netobserv_csvs
  until: >-
    netobserv_csvs.resources | length > 0 and
    netobserv_csvs.resources | selectattr('status.phase', 'defined') |
    selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
  retries: 30
  delay: 30

- name: Deploy Loki for flow records
  ansible.builtin.include_tasks:
    file: loki.yml
    apply:
      tags: [network-observability, loki]
  when: netobserv_enable_loki | bool
  tags: [network-observability, loki]

- name: Create FlowCollector
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: flows.netobserv.io/v1beta2
      kind: FlowCollector
      metadata:
        name: cluster
      spec:
        namespace: "{{ netobserv_namespace }}"
        deploymentModel: Direct
        agent:
          type: eBPF
          ebpf:
            sampling: "{{ netobserv_ebpf_sampling | int }}"
            privileged: false
        loki:
          enable: "{{ netobserv_enable_loki | bool }}"
          # LokiStack mode rather than Monolithic: it is what wires up the
          # gateway, the openshift-network tenant and the console plugin's
          # read path. Monolithic expects a plain Loki URL and leaves all of
          # that to be arranged by hand.
          mode: "{{ 'LokiStack' if netobserv_enable_loki | bool else 'Monolithic' }}"
          lokiStack:
            name: "{{ netobserv_lokistack_name }}"
            namespace: "{{ netobserv_namespace }}"
        consolePlugin:
          # `register` was removed from the FlowCollector CRD; the operator now
          # registers the plugin with the console whenever it is enabled.
          enable: true
          portNaming:
            enable: true

- name: Wait for FlowCollector to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: flows.netobserv.io/v1beta2
    kind: FlowCollector
    name: cluster
  register: flowcollector
  until: >-
    flowcollector.resources | length > 0 and
    flowcollector.resources[0].status is defined and
    flowcollector.resources[0].status.conditions is defined and
    flowcollector.resources[0].status.conditions |
    selectattr('type', 'equalto', 'Ready') |
    selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 20
  delay: 15
  ignore_errors: true

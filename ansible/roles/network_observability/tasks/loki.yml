---
# Flow records need somewhere to live. Without Loki the console still draws
# topology from Prometheus metrics, but the Traffic flows table - the
# per-connection records, which is the point of asking - is empty.
#
# Backed by NooBaa rather than a cloud bucket, so this works on a disconnected
# cluster and costs nothing extra: ODF is already here.
# Checked first, and by name. Without it the run gets 35 tasks in - operator
# subscribed, CRD waited for, webhook waited for - and then dies on
#   Failed to find exact match for objectbucket.io/v1alpha1.ObjectBucketClaim
# which says nothing about ODF being the thing that is missing.
- name: Check that ODF can provide object storage
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: objectbucketclaims.objectbucket.io
  register: netobserv_obc_crd

- name: Fail when there is no object storage for Loki
  ansible.builtin.fail:
    msg: >-
      Loki needs a bucket and ODF is not installed - the
      ObjectBucketClaim CRD does not exist. In a full run the odf role
      provides it and network_observability is ordered after it; running
      --tags loki or --tags network-observability on their own against a
      cluster without ODF cannot work. Deploy ODF first, or set
      netobserv_enable_loki=false to keep the FlowCollector without flow
      records.
  when: netobserv_obc_crd.resources | length == 0

- name: Create the openshift-operators-redhat namespace
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-operators-redhat
        labels:
          openshift.io/cluster-monitoring: "true"

- name: Create the Loki OperatorGroup
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: openshift-operators-redhat
        namespace: openshift-operators-redhat
      spec: {}

- name: Subscribe to the Loki Operator
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: loki-operator
        namespace: openshift-operators-redhat
      spec:
        channel: "{{ netobserv_loki_channel }}"
        name: loki-operator
        # The Red Hat build, not the community one - both publish a
        # loki-operator package and the community default channel is alpha.
        source: redhat-operators
        sourceNamespace: openshift-marketplace
        installPlanApproval: Automatic

- name: Wait for the LokiStack CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: lokistacks.loki.grafana.com
  register: netobserv_loki_crd
  until: netobserv_loki_crd.resources | length > 0
  retries: 40
  delay: 15

# The CRD lands before the operator is serving. LokiStack has a validating
# webhook, so creating one in that window fails with
#   Internal error occurred: failed calling webhook
#   "vlokistack.loki.grafana.com": no endpoints available for service
#   "loki-operator-controller-manager-service"
# which is a hard 500, not something the k8s module retries. Waiting on the
# CRD alone is not enough; the endpoint behind the webhook has to exist.
- name: Wait for the Loki Operator webhook to have endpoints
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: Endpoints
    namespace: openshift-operators-redhat
    name: loki-operator-controller-manager-service
  register: netobserv_loki_ep
  until: >-
    netobserv_loki_ep.resources | length > 0 and
    netobserv_loki_ep.resources[0].subsets | default([])
    | map(attribute='addresses') | map('default', [], true)
    | sum(start=[]) | length > 0
  retries: 40
  delay: 15

# ---------------------------------------------------------------------------
# Object storage
# ---------------------------------------------------------------------------
- name: Claim a NooBaa bucket for Loki
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: objectbucket.io/v1alpha1
      kind: ObjectBucketClaim
      metadata:
        name: "{{ netobserv_loki_obc }}"
        namespace: "{{ netobserv_namespace }}"
      spec:
        generateBucketName: netobserv-loki
        storageClassName: openshift-storage.noobaa.io

- name: Wait for the bucket
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: objectbucket.io/v1alpha1
    kind: ObjectBucketClaim
    namespace: "{{ netobserv_namespace }}"
    name: "{{ netobserv_loki_obc }}"
  register: netobserv_obc
  until: netobserv_obc.resources[0].status.phase | default('') == 'Bound'
  retries: 30
  delay: 10

- name: Read the bucket's endpoint and credentials
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: v1
    kind: "{{ item }}"
    namespace: "{{ netobserv_namespace }}"
    name: "{{ netobserv_loki_obc }}"
  loop: [ConfigMap, Secret]
  register: netobserv_obc_out
  no_log: true

# The OBC publishes AWS_ACCESS_KEY_ID / BUCKET_NAME / BUCKET_HOST; the Loki
# Operator wants access_key_id / bucketnames / endpoint. Translating rather
# than hardcoding keeps the bucket name - which NooBaa generates with a uuid
# suffix - out of the repo.
- name: Build the Loki object-storage Secret
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ netobserv_loki_s3_secret }}"
        namespace: "{{ netobserv_namespace }}"
      type: Opaque
      stringData:
        access_key_id: "{{ obc_secret.AWS_ACCESS_KEY_ID | b64decode }}"
        access_key_secret: "{{ obc_secret.AWS_SECRET_ACCESS_KEY | b64decode }}"
        bucketnames: "{{ obc_cm.BUCKET_NAME }}"
        endpoint: "https://{{ obc_cm.BUCKET_HOST }}:{{ obc_cm.BUCKET_PORT }}"
        # NooBaa ignores the region but the Loki S3 client insists on one.
        region: "{{ obc_cm.BUCKET_REGION | default('', true) or 'us-east-1' }}"
  vars:
    obc_cm: "{{ netobserv_obc_out.results[0].resources[0].data }}"
    obc_secret: "{{ netobserv_obc_out.results[1].resources[0].data }}"
  no_log: true

# ---------------------------------------------------------------------------
# LokiStack
# ---------------------------------------------------------------------------
- name: Create the LokiStack
  kubernetes.core.k8s:
    context: "{{ ocp_context or omit }}"
    state: present
    apply: true
    definition:
      apiVersion: loki.grafana.com/v1
      kind: LokiStack
      metadata:
        name: "{{ netobserv_lokistack_name }}"
        namespace: "{{ netobserv_namespace }}"
      spec:
        size: "{{ netobserv_lokistack_size }}"
        storage:
          schemas:
            - version: v13
              effectiveDate: "2024-01-01"
          secret:
            name: "{{ netobserv_loki_s3_secret }}"
            type: s3
          tls:
            # NooBaa's S3 endpoint presents a service-serving certificate,
            # which is signed by a CA no container trusts by default.
            # OpenShift injects that CA into this ConfigMap in every
            # namespace, so pointing at it is a reference, not a copy.
            caName: openshift-service-ca.crt
        storageClassName: "{{ netobserv_loki_storage_class }}"
        tenants:
          # network is the tenancy model netobserv expects; it is what makes
          # the console plugin's queries land on the right tenant.
          mode: openshift-network
        managementState: Managed

- name: Wait for the LokiStack to be ready
  kubernetes.core.k8s_info:
    context: "{{ ocp_context or omit }}"
    api_version: loki.grafana.com/v1
    kind: LokiStack
    namespace: "{{ netobserv_namespace }}"
    name: "{{ netobserv_lokistack_name }}"
  register: netobserv_lokistack
  until: >-
    netobserv_lokistack.resources | length > 0 and
    netobserv_lokistack.resources[0].status.conditions | default([])
    | selectattr('type', 'equalto', 'Ready')
    | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 60
  delay: 15

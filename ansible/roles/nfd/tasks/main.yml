---
- name: Wait for NFD Operator CSV to succeed
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: openshift-nfd
    label_selectors:
      - "operators.coreos.com/nfd.openshift-nfd="
  register: nfd_csvs
  until: >-
    nfd_csvs.resources | length > 0 and
    nfd_csvs.resources | selectattr('status.phase', 'defined') |
    selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
  retries: 30
  delay: 30

- name: Wait for NodeFeatureDiscovery CRD
  kubernetes.core.k8s_info:
    context: "{{ ocp_context }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: nodefeaturediscoveries.nfd.openshift.io
  register: nfd_crd
  until: nfd_crd.resources | length > 0
  retries: 20
  delay: 15

- name: Create NodeFeatureDiscovery instance
  kubernetes.core.k8s:
    context: "{{ ocp_context }}"
    state: present
    definition:
      apiVersion: nfd.openshift.io/v1
      kind: NodeFeatureDiscovery
      metadata:
        name: nfd-instance
        namespace: openshift-nfd
      spec: {}

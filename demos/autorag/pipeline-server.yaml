---
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: dspa
  namespace: rag-eval
  labels:
    opendatahub.io/dashboard: "true"
spec:
  dspVersion: v2
  apiServer:
    deploy: true
    # The dashboard and the AutoRAG UI reach the API server in-cluster; an
    # external Route is not needed and is one less thing exposed.
    enableExternalRoute: false
    # Registers the managed pipeline set, which is what AutoRAG runs on -
    # documents-rag-optimization-pipeline, plus documents-indexing and the
    # two autogluon ones. An EMPTY OBJECT is the whole configuration; it
    # enables the defaults.
    #
    # Without it the AutoRAG page says "A pipeline server was found, but
    # AutoRAG pipelines are not enabled" and offers a button. The button
    # sets exactly this, and restarts the pipeline server to apply it -
    # so declaring it here means a fresh cluster never needs the click.
    managedPipelines: {}
  # The default MariaDB, deployed here rather than pointing at an external
  # SQL database. It holds pipeline metadata only - runs, DAGs, artifact
  # references - not the artifacts themselves, which go to the bucket.
  database:
    mariaDB:
      deploy: true
      pipelineDBName: mlpipeline
      pvcSize: 10Gi
  objectStorage:
    externalStorage:
      # A placeholder, because the name is GENERATED per cluster
      # (generateBucketName) and so cannot be committed - a hardcoded one
      # applies cleanly and then fails at runtime against a bucket that
      # does not exist here. The role reads the real name off the claim's
      # ConfigMap instead of substituting into this file.
      bucket: __PIPELINE_BUCKET__
      host: s3.openshift-storage.svc
      # Port 80 and plain http, deliberately. NooBaa's TLS endpoint
      # presents a service-CA certificate, and the KFP LAUNCHER - which is
      # what moves artifacts between steps - carries no bundle that trusts
      # it: it logs "Error reading CA bundle file, open
      # /etc/ssl/certs/ca-certificates.crt: no such file or directory" and
      # then "failed to download input artifact". Setting
      # apiServer.cABundle does NOT fix this; that bundle reaches the API
      # server, not the launcher, and the run fails identically.
      #
      # This is pod-to-pod traffic inside the cluster to a NooBaa service,
      # so plaintext here is a smaller compromise than the alternatives.
      port: "80"
      scheme: http
      region: us-east-1
      s3CredentialsSecret:
        # The ObjectBucketClaim above generates this Secret and these two
        # keys. Referencing it directly keeps the credential owned by the
        # OBC, so deleting the claim cleans up everything with it.
        secretName: pipeline-artifacts
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY

---
# The Pipeline Server (Kubeflow Pipelines) for the rag-eval project.
#
# AutoRAG's Documents RAG Optimization Pipeline runs on Kubeflow Pipelines,
# and this cluster had no DataSciencePipelinesApplication at all - the one
# prerequisite it was missing. Everything else AutoRAG needs was already
# here: the autorag-ui Deployment, a llama-stack server (the Gen AI
# playground on :8321), Milvus as a vector store, chat and embedding models
# via LiteLLM, and NooBaa for object storage.
#
# Artifacts go to a NooBaa bucket from an ObjectBucketClaim. The OBC
# generates its own Secret holding AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY,
# and DSPA is pointed straight at it rather than at a hand-made copy - no
# credential is written by hand, and nothing secret lands in this file.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: pipeline-artifacts
  namespace: rag-eval
spec:
  generateBucketName: pipeline-artifacts
  storageClassName: openshift-storage.noobaa.io
---
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: dspa
  namespace: rag-eval
  labels:
    opendatahub.io/dashboard: "true"
spec:
  dspVersion: v2
  apiServer:
    deploy: true
    # The dashboard and the AutoRAG UI reach the API server in-cluster; an
    # external Route is not needed and is one less thing exposed.
    enableExternalRoute: false
  # The default MariaDB, deployed here rather than pointing at an external
  # SQL database. It holds pipeline metadata only - runs, DAGs, artifact
  # references - not the artifacts themselves, which go to the bucket.
  database:
    mariaDB:
      deploy: true
      pipelineDBName: mlpipeline
      pvcSize: 10Gi
  objectStorage:
    externalStorage:
      bucket: pipeline-artifacts-accb9dee-ebff-4db3-b932-c1e80f968e1f
      host: s3.openshift-storage.svc
      port: "443"
      scheme: https
      region: us-east-1
      s3CredentialsSecret:
        # The ObjectBucketClaim above generates this Secret and these two
        # keys. Referencing it directly keeps the credential owned by the
        # OBC, so deleting the claim cleans up everything with it.
        secretName: pipeline-artifacts
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY

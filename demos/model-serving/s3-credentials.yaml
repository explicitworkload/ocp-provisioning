---
# KServe's storage initializer takes its endpoint from ANNOTATIONS on the
# Secret, not from its data, and finds the Secret via the predictor's
# ServiceAccount. The ObjectBucketClaim generates credentials but not these
# annotations, so this copies the keys and adds them.
#
# Populate the two values from the OBC-generated secret:
#   oc get secret model-artifacts -n rag-eval -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: s3-model-store
  namespace: rag-eval
  annotations:
    serving.kserve.io/s3-endpoint: s3.openshift-storage.svc:443
    serving.kserve.io/s3-usehttps: "1"
    serving.kserve.io/s3-verifyssl: "0"
    serving.kserve.io/s3-region: us-east-1
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-store-sa
  namespace: rag-eval
secrets:
  - name: s3-model-store

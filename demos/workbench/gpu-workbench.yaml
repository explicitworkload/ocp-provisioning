---
# A GPU Jupyter workbench in the rag-eval project.
#
# Everything else under demos/ runs as a Job, which is reproducible and
# lives in git. This is the opposite and that is the point: it is the
# interactive surface RHOAI is built around, the one people expect to see
# under "Develop & train", and the natural place to do the LoRA fine-tune
# that needs a human watching the loss curve.
#
# Declared as a manifest rather than clicked through the wizard, so it is
# reproducible like the rest. Note that the *contents* of the workbench are
# not - they live on the PVC below and are nobody's source of truth.
#
# Pinned to the L40S (g6e.4xlarge), not a T4, by the nodeSelector below.
# That is the whole reason to care which node it lands on: the L40S has
# 45 GiB and Ada Lovelace, so bf16 and Flash Attention 2 both work. The T4s
# are Turing with 15 GiB - fp16 only, no FA2 - and most fine-tuning recipes
# assume otherwise.
#
# Leaving the free T4 alone is deliberate: it stays available for training
# Jobs and for serving, so a running workbench does not block them. Note a
# workbench holds its GPU whenever it is running, idle or not - stop it from
# the dashboard (Actions -> Stop) when you are done.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-eval-workbench
  namespace: rag-eval
  labels:
    opendatahub.io/dashboard: "true"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
  storageClassName: gp3-csi
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: rag-eval-workbench
  namespace: rag-eval
  labels:
    # Both are needed for the dashboard to list and manage it.
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    openshift.io/display-name: "RAG Eval GPU Workbench (L40S)"
    openshift.io/description: "PyTorch + CUDA workbench on the L40S, for the LoRA fine-tune"
    # Names the image in the dashboard's workbench list; without these the
    # UI shows the bare image reference.
    opendatahub.io/image-display-name: "Jupyter | PyTorch | CUDA | Python 3.12"
    notebooks.opendatahub.io/last-image-selection: "pytorch:3.5"
    # The notebook controller injects an oauth-proxy sidecar, so the
    # workbench is reachable only by users who can authenticate to the
    # cluster rather than by anyone who finds the Route.
    notebooks.opendatahub.io/inject-oauth: "true"
spec:
  template:
    spec:
      # Pin to the L40S. Without this the scheduler is free to place this
      # on a T4, which fits but is a much worse card for fine-tuning.
      nodeSelector:
        node.kubernetes.io/instance-type: g6e.4xlarge
      # Kept for portability, but inert on this cluster: the gpu_worker role
      # creates GPU MachineSets with no taints, so nothing needs tolerating.
      # It matters on a cluster where the nodes ARE tainted, which is the
      # more usual arrangement.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: rag-eval-workbench
          image: registry.redhat.io/rhoai/odh-workbench-jupyter-pytorch-cuda-py312-rhel9@sha256:f476e56ad00faaad5f2e26010f633233db2d4b299d7c5281e2f4ac46949b531b
          imagePullPolicy: Always
          workingDir: /opt/app-root/src
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/rag-eval/rag-eval-workbench
            # Pre-wired so MLflow works in the first cell, with no copying
            # of URLs out of a README. The workspace is the namespace.
            - name: MLFLOW_TRACKING_URI
              value: https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow
            - name: MLFLOW_TRACKING_INSECURE_TLS
              value: "true"
            - name: MLFLOW_WORKSPACE
              value: rag-eval
          ports:
            - name: notebook-port
              containerPort: 8888
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              # The T4 cannot be shared, so request and limit are both 1.
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: rag-eval-workbench
              mountPath: /opt/app-root/src
            # Jupyter writes to /dev/shm for dataloader workers; the default
            # 64Mi is not enough once torch is involved.
            - name: shm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /notebook/rag-eval/rag-eval-workbench/api
              port: notebook-port
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /notebook/rag-eval/rag-eval-workbench/api
              port: notebook-port
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: rag-eval-workbench
          persistentVolumeClaim:
            claimName: rag-eval-workbench
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi

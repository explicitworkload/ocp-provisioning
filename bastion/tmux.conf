# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'erikw/tmux-powerline'

set -g status-interval 2
# Left: session name with Powerline arrow to separator
#set -g status-left-length 60
#set -g status-left "#[fg=colour16,bg=colour34,bold] #S #[fg=colour34,bg=colour234]"
set -g status-left ''
set -g status-left-length 1

# Right: time/date with separators
set -g status-right-length 60
set -g status-right "#[fg=colour244,bg=colour234]#[fg=colour234,bg=colour244] %H:%M  %Y-%m-%d "

set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc"

bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# mouse clicking on each pane
set -g mouse on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
set -g status-justify left
